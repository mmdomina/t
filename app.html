<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1710">
<title>Trisquelia Golf Club</title>
<style>
:root{
  --bg:#0b1710; --bg2:#0f2018; --card:#132a20; --card2:#18342767;
  --line:#1f3d2e; --txt:#eaf5ee; --dim:#8fae9c; --dim2:#5f7d6c;
  --acc:#4d9de0; --acc2:#2b7cc4; --gold:#e9c46a; --red:#f87171; --blue:#60a5fa;
  --ink:#02101f; --tint:#14304e; --nav:#0a1727; --hair:#1a2f4a; --rojo:#c8202e;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07100b;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:0}

/* ---------- phone frame ---------- */
#frame{width:100%;max-width:412px;height:100vh;max-height:900px;background:var(--bg);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
@media(min-width:520px){#frame{border-radius:38px;height:844px;border:1px solid #1d3529}}

#status{height:30px;display:flex;align-items:center;justify-content:center;
  padding:0 22px;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--dim);flex:0 0 auto}
#screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 0 12px;scroll-behavior:smooth}
#screen::-webkit-scrollbar{width:0}

/* ---------- nav ---------- */
#nav{flex:0 0 auto;display:flex;background:var(--nav);border-top:1px solid var(--line);
  padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
#nav button{flex:1;background:none;border:0;color:var(--dim2);font-size:10px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer;
  font-family:inherit;letter-spacing:.02em;transition:color .15s}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--acc)}

/* ---------- generic ---------- */
.pad{padding:0 18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:17px;font-weight:700;margin:22px 0 10px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em}
p{margin:0 0 8px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.acc{color:var(--acc)}.gold{color:var(--gold)}.red{color:var(--red)}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.lbl{font-size:11px;color:var(--dim2);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;
  background:var(--tint);color:var(--acc)}
.pill.gold{background:#3a3117;color:var(--gold)}
.pill.blue{background:#16304d;color:var(--blue)}
.pill.red{background:#3d1e1e;color:var(--red)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:700;background:var(--acc2);color:var(--ink);
  transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:10px;font-size:13px;border-radius:11px}
.sep{height:1px;background:var(--line);margin:14px 0}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:14px;flex:0 0 auto}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.hdr{padding:8px 18px 4px;display:flex;align-items:flex-start;justify-content:space-between}

/* ---------- play / hole ---------- */
.holehdr{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
  background:var(--nav);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.arrow{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);font-size:18px;cursor:pointer;font-family:inherit}
.arrow:disabled{opacity:.3}
.dist{text-align:center}
.dist .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.dist .n.mid{font-size:44px;color:var(--acc)}
.scorebtn{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:.12s}
.scorebtn.on{background:var(--acc);color:var(--ink);border-color:var(--acc);transform:scale(1.05)}
.chip{padding:9px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center}
.chip.on{background:var(--tint);border-color:var(--acc2);color:var(--acc)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums}
th{color:var(--dim2);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
tr+tr td{border-top:1px solid var(--hair)}
td.name{text-align:left;font-weight:600;font-size:13px}
.sq{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
  border-radius:6px;font-weight:800}
.eagle{background:#e9c46a;color:#2a2005;border-radius:50%}
.birdie{background:#4d9de033;color:var(--acc);border-radius:50%;border:1px solid var(--acc)}
.bogey{background:#f8717122;color:#fca5a5}
.dbogey{background:#f8717144;color:var(--red)}

/* ---------- misc ---------- */
.slot{padding:11px 8px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  text-align:center;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--txt)}
.slot.full{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.slot.mine{background:var(--acc2);color:var(--ink);border-color:var(--acc2)}
.bar{height:7px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:#eaf2fb;color:var(--ink);
  padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:50;opacity:0;
  transition:opacity .25s,bottom .25s;pointer-events:none;white-space:nowrap;max-width:90%}
.toast.on{opacity:1;bottom:110px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);align-items:center}
.item:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:11px;background:var(--tint);display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;font-size:17px}
.tabs{display:flex;gap:6px;padding:0 18px 4px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;font-family:inherit}
.tab.on{background:var(--txt);color:var(--ink);border-color:var(--txt)}
.modeban{background:linear-gradient(135deg,#3a3117,#241d0d);border:1px solid #5c4a1f}
</style>
</head>
<body>
<div id="frame">
  <!-- La barra de estado del teléfono ya está arriba. Acá sólo el nombre del club. -->
  <div id="status"><span id="appname">Trisquelia</span></div>
  <div id="screen"></div>
  <div id="nav"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   DATOS
   ============================================================ */
const S = {
  tab:'home', mode:'player', hole:1, playing:false, statTab:'general', clubTab:'tee',
  socialTab:'amigos', persona:0, comoQuien:0, tipo:'socio', resultadosPublicos:true, onb:0, onboarded:false, pickedClub:null,
  mat:'', fedOk:false, indexDias:9, chequeoRonda:false,
  dni:'', nsocio:'', padronOk:false, soloSeguir:false, vA:10, vB:18,
  marco:1,              // a quién le llevo la tarjeta yo (índice en el grupo)
  meMarca:2,            // quién lleva la mía
  torneo:true,          // en torneo la tarjeta se cruza y se firma
  certifico:false, firmoLaOtra:false, entregada:false, presento:null, padronEstado:null, hallado:null, codigo:'', email:'', clave:0,
  shotOpen:false, shotClub:null, shotDist:150, shotRes:'fw',
  tee:'mixta', vuelta:18,
  user:{name:'Mauro Domina', ini:'MD', hcp:7.4, socio:'#1047', club:'Trisquelia Golf Club'},
  booked:{}, // "07:30": true
};

/* ================================================================
   ██  CONFIGURACIÓN DEL CLUB  ██
   Todo lo que cambia de un club a otro vive ACÁ y solo acá.
   Para lanzar la app en otro club: se duplica este bloque, se cambian
   los datos, y el resto de la aplicación queda igual.
   ================================================================ */
/* ---------------------------------------------------------------
   PENDIENTE DE CONFIRMAR CON EL CLUB
   (cada punto se arregla cambiando un valor de este mismo bloque)

   [ ] Negras: yardas hoyo por hoyo. Hoy la app reparte las +540 sobre
       las blancas (par 5 +40, par 4 +31, par 3 +20). Cuando llegue la
       medición: borrar "extra/desde" y poner las 18 yardas reales.
   [ ] BLANCAS/AZULES: puse 69.8 / 122 despejándolo de dos datos reales
       (7.4 juega 7 y 6.9 juega 6). Cualquier par entre slope 105-140 y
       rating 68.4-71.0 cumple esos dos; elegí el centro del rango.
       Para cerrarlo del todo alcanza con UN dato más de un handicap alto:
       ¿con cuánto juega alguien de index 20 o 25? O los números oficiales.
   [ ] ► RATING Y SLOPE oficiales de las tres salidas. Es lo ÚNICO que falta
       de la tarjeta: los números que usa la app hoy son estimados y de ahí
       sale el handicap de cancha de cada socio.
   [x] Son ~120 socios. Sin handicap vigente NO se juega: son socios
       colaboradores o gente grande que no juega. Para ellos hay una entrada
       aparte, solo para seguir torneos y novedades.
   [ ] Valor de la cuota (viene con el padrón).
   [x] Tarjeta de torneo como en papel: la anota OTRO jugador. Cada uno lleva
       la de otro, la firma como marcador, y el jugador certifica la suya.
       La app cruza los dos anotadores EN CADA HOYO y avisa al momento.
       Al entregar, las tarjetas le llegan solas a Félix.
   [x] No se escribe ningún DNI para elegir marcador: sale de la grilla de
       salidas del club. El código de 4 dígitos es solo el respaldo.
   [x] Se puede NO PRESENTAR la propia tarjeta, como en papel. La que uno
       lleva de otro se firma y se entrega igual. Al club le llega el aviso
       de quién no presentó. La no presentada igual queda en tus estadísticas.
   [x] DOS MODOS. Torneo: tarjeta oficial, marcador, firmas, va al club.
       Práctica: llevás tu propia tarjeta, cargás palos y distancias, suma
       a tus estadísticas y NO le llega nada a Félix.
   [x] Index de Mauro: 7.4.
   [x] Control cruzado con la tarjeta de Hole19: par y valuación coinciden
       los 18 hoyos. Yardas: total 6284 vs 6274 del club, casi igual. Solo
       se despegan la cancha 2 (hoyos 2 y 11), ~35 yardas. Vale la del club.
   [x] Confirmado: suman las mejores CINCO tarjetas.
   [x] Campeón del Club 2025: Juanse Gobbini.
   [ ] ► MAURO: pasar la TABLA DE ÍNDICES y su HANDICAP DE CANCHA por salida.
       Hoy la app lo calcula con la fórmula del WHS
       (index × slope/113 + (rating − par)). Hay que comparar contra la
       tabla oficial del club y ajustar si no coincide.

   [ ] Espera en el hoyo 1: hoy los números son de ejemplo. Se calculan solos
       cuando haya socios jugando con la app abierta.
   [ ] Nombres reales de socios para el padrón y el ranking.
   [x] Un DNI = una sola cuenta. Una vez registrado no se puede volver a usar.
   [x] El DNI identifica, pero NO autoriza: el código de verificación va al
       mail/teléfono que el CLUB ya tiene en el padrón, no al que escribe
       quien se está registrando. Así nadie se anota con el DNI de otro.
       (Ojo: esto lo tiene que validar el servidor, no la app del celular.)
   [ ] El padrón tiene que traer MAIL o TELÉFONO además del DNI: sin eso
       no se puede mandar el código y hay que habilitar a mano.
   [ ] Padrón de socios: Mauro lo consigue y se sube. Tiene que incluir DNI,
       que es con lo que la app verifica el alta. Si el padrón no tiene los
       DNI cargados, hay que pedirlos una vez o habilitar a mano.
   [ ] Fecha, cupo y precio del Torneo Ciudad de General Pico.

   CONFIRMADO
   [x] Logo oficial (embebido tal cual, sin retocar).
   [x] Colores tomados del logo.
   [x] Tarjeta de ida y vuelta: par 71, 5.748 yds de azules.
   [x] 9 hoyos, dos vueltas para completar 18.
   [x] OJO CON LA FOTO SATELITAL: está desactualizada. Varios arenales que
       se ven secos hoy son LAGUNAS (por ejemplo los dos de la cancha 4).
       Sirve para ubicar greens, tees y fairways, NO para los obstáculos.
   ── SOBRE LAS NEGRAS ─────────────────────────────────────────────
   ACLARADO: no hay negras nuevas. Las negras son las que ya están en
   la cancha y las que figuran en la tarjeta (6547 yds). Lo que trae la
   recategorización es la MEDICIÓN OFICIAL de esas salidas — su rating
   y su slope — para poder usarlas en competencia.

   Mauro estimó a ojo dónde está cada tee negro y coincide con la
   tarjeta: error promedio de 8 yardas, con un solo caso feo (cancha 5,
   40 yardas). Eso confirma que la tarjeta cargada está bien.

   [ ] ► PENDIENTE: las negras dan +273 sobre blancas/azules según la
       tarjeta (6547 vs 6274), no las 540 que se mencionaron. Preguntar
       de dónde sale ese número — puede ser de otra medición o de otra
       comparación. NO tocar la tarjeta hasta saberlo.
   ─────────────────────────────────────────────────────────────────

   [ ] ► MEDIR LA CANCHA. Las distancias de frente/centro/fondo que muestra
       hoy la app son INVENTADAS. Hay que cargar, por cada uno de los 9 hoyos:
       3 coordenadas del green (frente, centro, fondo), la de cada tee, y los
       obstáculos (bunkers y agua). Son unos 60-100 puntos en total.
       Se sacan trazando sobre imagen satelital, y se corrigen en cancha.
   [ ] ► MAURO: mandame una FOTO DE LA TARJETA FÍSICA de Trisquelia, de los
       dos lados. Quiero que la digital diga exactamente lo mismo: si hay
       valuación distinta para damas, cómo están impresos rating y slope,
       qué reglas locales van al dorso y qué datos pide el encabezado.
   [ ] Preguntar a la AAG si acepta importar una planilla de tarjetas, o si
       habilitan acceso para que la app las mande sola (handicap@aag.org.ar).
       Mientras tanto Félix las transcribe, pero con todo ya calculado.
   [x] Torneo de Invierno cargado del reglamento 2026: clasificación por
       mejores tarjetas, Copa del Club (7 gross + campeón, con 4 salidas de
       negras) y Copa Trisquelia (16 neto, ventaja 85%).
   [x] Félix Córdoba es además Oficial de Reglas (2302-536369).
   [x] Profesional del club: Félix Córdoba. Sigue dando y controlando la
       tarjeta física: la app no se mete en eso.
   [x] El index lo actualiza cada jugador a mano. La app avisa los jueves
       y otra vez antes de la ronda si está vencido.
   [x] La agenda de clases NO va en la app: la maneja el profesional aparte.
   [x] Resultados de torneos: los publica Félix y son PÚBLICOS (los ve
       cualquiera con la app). Lo de plata y el padrón, solo socios.
   [x] Resultados: abiertos a todos. La base arranca vacía y se llena
       con el primer torneo que se publique desde la app.
   [x] Hoyo 19: fuera de la app (está tercerizado). Solo se puede avisar
       un evento o un menú especial desde los avisos de Chelo.
   [x] Pro shop base del torneo: $35.000. Con sponsor lo carga Daniel
       cada vez que publica un torneo nuevo.
   [x] Chelo carga los montos de cuota (se definen en comisión) y avisa.
   [x] Accesos: Félix Córdoba → salidas y resultados. Chelo Caballero → avisos, estado
       de cancha y padrón. Daniel Rodríguez → torneos. Mauro → todo.
   [x] Los 18 son UNA configuración: ida por blancas (1 al 9) y vuelta por
       azules (10 al 18). Por eso dan un único handicap de cancha.
   [x] TARJETA OFICIAL CARGADA (foto del 4º Abierto, 22/03/25). Verificada:
       negras 3353+3194=6547 · blancas/azules 3178+3096=6274 · damas
       2867+2807=5674 · par 36+35=71 · valuación 1 a 18 sin repetir.
   [x] Negras: 7 de 9 hoyos repiten tee; cambian el 4/13 y el 9/18, y el
       9/18 además cambia de par (5 la ida, 4 la vuelta). Confirmado.
   ── OBSTÁCULOS CONFIRMADOS POR MAURO (la foto satelital está vieja) ──
   cancha 3 · laguna grande a la izquierda, sobre las 270 yds
   cancha 4 · par 3 con laguna a cada lado del camino al green
   cancha 5 · dos lagunas grandes cruzando, a la altura de 100-180
   cancha 6 · fuera de límites pegado atrás del green (alambrado)
   cancha 8 · SIN agua. Dos bunkers adelante y uno profundo atrás izq.
   cancha 9 · laguna adelante
   ────────────────────────────────────────────────────────────────

   [x] Estacas: 100 rojo, 150 blanco, 200 azul. Banderas: adelante rojo,
       centro blanco, atrás azul.
   [ ] ► OJO: me habías dicho que las negras suman 540 yardas, pero la
       tarjeta da 273 sobre blancas/azules (6547 vs 6274). ¿Las 540 son de
       la recategorización que viene?
   [x] Salidas: 11:30 a 13:30 cada 10 minutos (13 salidas, 52 lugares).
   [x] Pro shop del torneo: $30.000, más alto cuando hay sponsors.
   [x] Entre semana NO se reserva: se va y se sale. La grilla es solo de torneo.
   [x] La modalidad del torneo cambia semana a semana (escalonada o simultánea)
       y también por clima: se cambia desde el panel del club, no está fija.
   --------------------------------------------------------------- */
const CLUBS_DB = {

  trisquelia: {
    id:'trisquelia',
    nombre:'Trisquelia Golf Club',
    corto:'Trisquelia',
    sigla:'TGC',
    lema:'General Pico · desde 2009',
    ciudad:'General Pico, La Pampa',
    direccion:'Av. Isidoro Brunengo y calle 313 — CP 6360',
    email:'trisqueliagolfclub@gmail.com.ar',
    federacion:'Federación Sur — AAG',
    fundado:2009,
    inauguracion:'10 de abril de 2009',
    fundadores:'René Fuentes Andrada y Susana Vila',
    padrino:'Estanislao Goya',
    socios:120,                                // ← a confirmar con el club
    cuota:'$52.000',                           // ← a confirmar
    app:'Trisquelia',

    /* --- identidad visual (colores a confirmar contra el logo oficial) --- */
    /* tomados del logo: azul del trisquel, azul oscuro del wordmark, rojo del grip */
    theme:{ p:'#4d9de0', p2:'#2b7cc4', bg:'#070e18', bg2:'#0b1626', card:'#101f33',
            line:'#1e3552', dim:'#93a9c4', dim2:'#61758f', gold:'#e9c46a',
            ink:'#02101f', tint:'#14304e', nav:'#0a1727', hair:'#1a2f4a',
            azul:'#1f5fa9', azulOsc:'#173a72', rojo:'#c8202e' },
    crest:'trisquel',

    /* ===== LA CANCHA — TARJETA OFICIAL DEL CLUB =====
       Cargada de la tarjeta física (4º Abierto de General Pico, 22/03/25).
       Los tres totales verifican: negras 6547, blancas/azules 6274, damas 5674.
       La valuación va del 1 al 18 sin repetir.
       9 hoyos jugados en dos vueltas: la ida por blancas, la vuelta por azules.
       Desde negras 7 de los 9 repiten tee; cambian el 4/13 y el 9/18. */
    cancha:{
      nombre:'Trisquelia — 18 hoyos (dos vueltas)',
      par:71, hoyosFisicos:9,
      holes:[
        {n:1, par:4,hcp:16,y:335}, {n:2, par:4,hcp:10,y:366}, {n:3, par:5,hcp:6, y:525},
        {n:4, par:3,hcp:12,y:175}, {n:5, par:4,hcp:18,y:320}, {n:6, par:4,hcp:4, y:415},
        {n:7, par:4,hcp:8, y:405}, {n:8, par:3,hcp:14,y:131}, {n:9, par:5,hcp:2, y:506},
        {n:10,par:4,hcp:15,y:338}, {n:11,par:4,hcp:9, y:395}, {n:12,par:5,hcp:7, y:520},
        {n:13,par:3,hcp:13,y:156}, {n:14,par:4,hcp:11,y:330}, {n:15,par:4,hcp:5, y:395},
        {n:16,par:4,hcp:3, y:435}, {n:17,par:3,hcp:17,y:121}, {n:18,par:4,hcp:1, y:406}
      ]

function buscarEnPadron(d){
  const n = String(d).replace(/\D/g,'');
  return PADRON.find(x=>x.dni===n) || (n.length>=7 ? PADRON[0] : null);
}
function tapar(m){
  if(!m) return '';
  const [u,d] = m.split('@');
  return u.slice(0,2) + '•'.repeat(Math.max(3,u.length-2)) + '@' + d;
}

/* --- aplica los colores del club a toda la interfaz --- */
function applyTheme(){
  const t=CLUB.theme, r=document.documentElement.style;
  r.setProperty('--acc',t.p);   r.setProperty('--acc2',t.p2);
  r.setProperty('--bg',t.bg);   r.setProperty('--bg2',t.bg2);
  r.setProperty('--card',t.card); r.setProperty('--line',t.line);
  r.setProperty('--dim',t.dim); r.setProperty('--dim2',t.dim2);
  r.setProperty('--gold',t.gold);
  ['ink','tint','nav','hair','rojo'].forEach(k=>{ if(t[k]) r.setProperty('--'+k,t[k]); });
  document.title = CLUB.nombre;
}
/* --- cambiar de club (demo de replicación) --- */
function setClub(id){
  CLUB = CLUBS_DB[id]; COURSE = CLUB.cancha;
  S.user.club = CLUB.nombre;
  applyTheme(); render();
  toast(`Instalación de ${CLUB.corto} cargada`);
}
const tee = () => CLUB.tees.find(t=>t.id===S.tee) || CLUB.tees[0];
/* De qué tee sale cada hoyo. */
function teeDelHoyo(h){
  const t=tee();
  if(t.id==='mixta') return h<=9 ? 'blancas' : 'azules';
  return t.n.toLowerCase();
}

// scores del usuario en la ronda actual (null = sin jugar)
const R = { scores:{}, putts:{}, fw:{}, gir:{}, shots:{} };
/* La ronda arranca vacía: la app se abre como si estuvieras llegando
   al hoyo 1 sin haber pegado todavía. */

/* En torneo cada jugador lleva la tarjeta de OTRO, igual que en papel.
   MARCA = lo que mi marcador va anotando de mí. OTRO = la tarjeta que
   llevo yo. Arrancan vacías: la app se abre sin nada cargado. */
const MARCA = {};
const OTRO  = {};
const SC_DEMO = [[],[],[]];   // el grupo también arranca sin cargar nada
function GROUP(){
  const m=CLUB.miembros;
  const ab=n=>n.split(' ')[0]+' '+n.split(' ')[1][0]+'.';
  /* el handicap que se muestra es el DE CANCHA, calculado con el index
     de cada uno y la salida elegida. No va escrito a mano. */
  return [{n:'Mauro D.', i:'MD', index:S.user.hcp, hcp:hcpCancha(S.user.hcp),
           sc:played().map(x=>R.scores[x]), yo:true},
    ...[0,3,2].map((k,j)=>({n:ab(m[k].n), i:m[k].i, index:m[k].hcp,
           hcp:hcpCancha(m[k].hcp), sc:SC_DEMO[j]}))];
}

/* ---------- LA BOLSA: los palos del jugador y sus golpes reales ----------
   Cada palo guarda el historial de distancias que el jugador fue cargando.
   La media, la dispersión y el caddie salen de ACÁ, no de una tabla genérica. */
/* Todos los palos que se pueden llevar. El jugador elige los suyos, hasta 14,
   que es el máximo que permiten las reglas. Los que vienen marcados son una
   bolsa típica: se destildan y se cambian sin problema.
   Las distancias "base" son sólo un punto de partida; se corrigen solas con
   los golpes que el jugador va cargando en la cancha. */
const BAG = [
  {c:'Dr', g:'Maderas',  name:'Driver',       base:238, n:34, on:true},

const GRUPOS = ['Maderas','Híbridos','Hierros','Wedges','Otros'];
const bagPorGrupo = () => GRUPOS.map(g => [g, BAG.map((b,i)=>({b,i})).filter(x=>x.b.g===g)])
                                .filter(([,l]) => l.length);
// generamos el historial inicial de forma determinista (como si el jugador ya hubiera cargado golpes)
BAG.forEach((b,i)=>{
  b.shots=[];
  if(b.putter) return;
  for(let k=0;k<b.n;k++){
    const w=((k*37+i*13)%21)-10;               // −10 .. +10
    const flyer=((k*7+i)%11===0)? 6 : 0;
    b.shots.push(Math.round(b.base + w*(b.base/200) + flyer));
  }
});
const avg  = b => b.shots.length ? Math.round(b.shots.reduce((a,c)=>a+c,0)/b.shots.length) : 0;

/* La media que usa el caddie.
   Arranca en la distancia general del palo y cada golpe que el jugador carga la
   corre un poco hacia lo suyo. Sin escalones: a los 8 golpes pesa mitad y mitad,
   a los 25 el número ya es prácticamente el de él.
   Esto evita el problema de recomendar con dos golpes cargados, que puede estar
   cualquier cosa, y también el de ignorar 30 golpes propios por no llegar a un
   número redondo. */
const PESO_BASE = 8;
const media = b => {
  if(!b) return 0;

const par = h => COURSE.holes[h-1].par;
/* Peso por par para repartir las yardas extra de un tee nuevo:
   los par 5 ganan más metros que los par 3. Es una estimación —
   cuando llegue la medición hoyo por hoyo se reemplaza por los números reales. */
const PESO = {3:0.65, 4:1.05, 5:1.35};
const _dcache = {};
function deltas(t){
  if(_dcache[t.id]) return _dcache[t.id];
  const w = COURSE.holes.map(h=>PESO[h.par]||1);
  const sw = w.reduce((a,b)=>a+b,0);
  const raw = w.map(x=> t.extra*x/sw);
  const out = raw.map(x=>Math.floor(x));
  let resto = t.extra - out.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0])
     .slice(0,resto).forEach(([,i])=>out[i]++);
  return _dcache[t.id]=out;
}
function yards(h){
  const t = tee();
  if(t.y) return t.y[h-1];                       // tarjeta propia de esa salida
  return Math.round(COURSE.holes[h-1].y * t.f);  // derivada por factor
}
/* ¿este hoyo se juega del mismo tee que su par de la otra vuelta? */
function repiteTee(h){
  const t=tee(); if(!t.mismoTee) return false;
  return t.mismoTee[CLUB.fisico[h-1]-1];
}
const parTotal = () => COURSE.holes.reduce((a,h)=>a+h.par,0);
/* Handicap de cancha = Index × (Slope/113) + (Rating − Par).
   Es la fórmula del WHS. Cuando tengamos la tabla oficial del club
   se compara contra esta y se ajusta si hace falta. */
function hcpCancha(index, t, hoyos){
  t = t || tee(); hoyos = hoyos || 18;
  if(!t.r) return null;                    // sin rating no hay handicap de cancha
  const f = hoyos===9 ? 0.5 : 1;
  const par9 = COURSE.holes.slice(0,9).reduce((a,h)=>a+h.par,0);
  const par_ = hoyos===9 ? par9 : parTotal();
  return Math.round(index*f*(t.s/113) + (t.r*f - par_));
}
/* hace cuántos días se actualizó el index */
const ydsDe = t => t.y ? t.y.reduce((a,b)=>a+b,0)
  : COURSE.holes.reduce((a,h)=>a+Math.round(h.y*t.f),0);

function stableford(s,p,hcp,phcp){ // puntos stableford netos
  const extra = Math.floor(phcp/18) + (hcp <= (phcp%18) ? 1 : 0);
  const net = s - extra; const d = net - p;
  return Math.max(0, 2 - d);
}
function clubFor(d){
  const l = inBag();
  if(!l.length) return null;
  let bb=l[0],diff=1e9;
  l.forEach(c=>{const x=Math.abs(media(c)-d);if(x<diff){diff=x;bb=c;}});
  return bb;
}

/* Estado de la cancha. Lo carga quien tenga el permiso 'cancha' — hoy Chelo.
   Es un dato que siempre es cierto porque lo pone una persona, no se deduce
   de cuánta gente usa la app. */
const CANCHA_ESTADO = {abierta:true, nota:'', porQuien:null, desde:null};
const PROF_GREEN = 12;          // profundidad estimada del green, en yardas
function gps(h){
  const largo = yards(h);
  const dados = (R.shots[h]||[]).reduce((a,x)=>{
    const b = BAG.find(z=>z.c===x.c);
    return a + (b && b.putter ? 0 : x.d);
  }, 0);
  const centro = Math.max(0, largo - dados);
  const prof = par(h)===3 ? 9 : PROF_GREEN;
  return {front: Math.max(0,centro-prof), mid: centro, back: centro+prof,
          desdeTee: dados===0, dados};
}
/* qué palo tiene sentido: en la salida de un par 4 o 5, el más largo que
   tengas; en el resto, el que más se acerque a lo que falta. */
function paloSugerido(h){
  const g = gps(h);
  if(g.desdeTee && par(h)>3){
    const largos = inBag().slice().sort((a,b)=>media(b)-media(a));
    if(!largos.length) return {club:null, salida:true, dist:g.mid};
    return {club:largos[0], salida:true, dist:g.mid};
  }
  return {club:clubFor(g.mid), salida:false, dist:g.mid};
}

function holeSVG(h){
  const c   = CANCHA[CLUB.fisico[h-1]] || {dog:0,ancho:1,haz:[],gb:[]};
  const p   = par(h), W=200, H=312, base=272, gy=54;
  const largoRef = 545;
  const yd  = t => (t.y ? t.y[h-1] : Math.round(COURSE.holes[h-1].y*t.f));
  const yDe = v => base - (v/largoRef)*(base-gy);
  const tAct = tee(), largo = yd(tAct), yTee = yDe(largo);
  // el fairway va del tee al green, curvado según el dogleg
  const cx  = 100 + c.dog*32, anc = 25*c.ancho;
  const yPos = d => yTee - (d/largoRef)*(base-gy);      // yardas desde el tee
  const lado = (l,y) => 100 + c.dog*32*(1-Math.abs((y-gy)/(base-gy))*.6) + l*anc*1.15;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:214px;display:block">
    <defs>
      <linearGradient id="fw${h}" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#1c4d32"/><stop offset="1" stop-color="#2f7a4f"/></linearGradient>
      <radialGradient id="gr${h}"><stop offset="0" stop-color="#63e79a"/><stop offset="1" stop-color="#3ab96d"/></radialGradient>
      <linearGradient id="ag${h}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2f6fd0"/><stop offset="1" stop-color="#1d4a95"/></linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="#0f2318"/>

    <!-- rough -->
    <path d="M${100-anc-15} ${base+18} Q ${cx-anc-21} ${(base+gy)/2} ${100-anc-7} ${gy+16}
             L ${100+anc+7} ${gy+16} Q ${cx+anc+21} ${(base+gy)/2} ${100+anc+15} ${base+18} Z"
          fill="#173f28" opacity=".7"/>
    <!-- fairway -->
    <path d="M${100-anc} ${base+10} Q ${cx-anc} ${(base+gy)/2} ${100-anc*0.72} ${gy+20}
             L ${100+anc*0.72} ${gy+20} Q ${cx+anc} ${(base+gy)/2} ${100+anc} ${base+10} Z"
          fill="url(#fw${h})"/>

    ${c.casas?`<g opacity=".5">${[0,1,2,3,4].map(k=>{
      const y=gy+26+k*40, x=c.casas==='der'?W-13:6;
      return `<rect x="${x}" y="${y}" width="9" height="7" rx="1.4" fill="#8d8377"/>`;}).join('')}</g>`:''}
    ${c.camino?`<path d="M${W-10} ${gy} L${W-16} ${H}" stroke="#a08f76" stroke-width="4" opacity=".6"/>`:''}
    ${c.ob?`<line x1="8" y1="${gy-19}" x2="${W-8}" y2="${gy-19}" stroke="#e0e0e0"
       stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>
      <text x="${W-10}" y="${gy-23}" fill="#cfd8de" font-size="7" text-anchor="end"
       font-family="sans-serif">fuera de límites</text>`:''}

    <!-- obstáculos, ubicados por yardas desde el tee -->
    ${(c.haz||[]).filter(z=>z.d<largo).map(z=>{
      const y=yPos(z.d), x=lado(z.lado*0.72, y);
      return z.t==='a'
        ? `<ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.62}" fill="url(#ag${h})"/>
           <ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.62}" fill="none" stroke="#7fb2ef" stroke-width=".6" opacity=".7"/>`
        : `<ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.6}" fill="#e6d9bb"/>`;
    }).join('')}

    <!-- bunkers del green -->
    ${(c.gb||[]).map(g=>{
      const a=g.a*Math.PI/180, rx=(p===3?26:31)+7;
      return `<ellipse cx="${100+rx*Math.cos(a)*0.92}" cy="${gy+(p===3?18:22)*Math.sin(a)*1.15}"
        rx="${8*g.r}" ry="${5.4*g.r}" fill="#e6d9bb"/>`;}).join('')}

    <!-- green -->
    <ellipse cx="100" cy="${gy}" rx="${p===3?25:30}" ry="${p===3?18:22}" fill="url(#gr${h})"/>
    <ellipse cx="100" cy="${gy}" rx="${p===3?25:30}" ry="${p===3?18:22}" fill="none"
             stroke="#9ff5c2" stroke-width=".7" opacity=".45"/>
    <circle cx="100" cy="${gy+2}" r="2.4" fill="#0b1710"/>
    <path d="M100 ${gy+2} v-17 l10 4.5 -10 4.5" fill="#c8202e" stroke="#c8202e" stroke-width="1"/>

    <!-- las salidas, cada una a su distancia real -->
    ${CLUB.tees.map(t=>{
      const v=yd(t), y=yDe(v), act=t.id===tAct.id;
      const nom = t.id==='mixta' ? (h<=9?'Blancas':'Azules') : t.n;
      const col = t.id==='mixta' ? (h<=9?'#f5f5f5':'#3b82f6') : t.c;
      return `<g opacity="${act?1:.5}">
        <rect x="${100-(act?11:8)}" y="${y}" width="${act?22:16}" height="${act?7:5}" rx="2.5"
              fill="${col}" stroke="#0008" stroke-width=".6"/>
        <text x="${100+(act?16:13)}" y="${y+(act?6:5)}" fill="${act?'#e8eef6':'#93a9c4'}"
              font-size="${act?8:7}" font-family="sans-serif" font-weight="${act?'700':'400'}">
          ${nom} ${v}</text></g>`;}).join('')}

    <!-- la estaca de 150 -->
    ${largo>170?(()=>{const y=yPos(largo-150);
      return `<line x1="${lado(-1,y)}" y1="${y}" x2="${lado(1,y)}" y2="${y}"
        stroke="#f5f5f5" stroke-width=".8" stroke-dasharray="3 3" opacity=".5"/>
      <circle cx="${lado(1,y)}" cy="${y}" r="2.6" fill="#f5f5f5" opacity=".85"/>
      <text x="${lado(1,y)+6}" y="${y+3}" fill="#dbe7f0" font-size="7" font-family="sans-serif">150</text>`;})():''}

    <text x="8" y="${H-8}" fill="#5f7d90" font-size="7.5" font-family="sans-serif">
      cancha ${CLUB.fisico[h-1]} · distancias reales · forma aproximada</text>
  </svg>`;
}

/* ---------- REGISTRO DE GOLPES: el corazón de las estadísticas propias ---------- */
const RES = [['fw','Fairway','🟢'],['green','Green','⛳'],['rough','Rough','🌾'],
             ['bunker','Bunker','🏖️'],['agua','Agua','💧'],['ob','Fuera','🚫'],['hoyo','Emboqué','🕳️']];

function shotPanel(h){
  const list = R.shots[h] || [];
  const sel  = S.shotClub ? BAG.find(b=>b.c===S.shotClub) : null;
  return `
  <div class="card">
    <div class="between"><h3 style="margin:0">Golpes del hoyo ${h}</h3>
      <span class="pill ${list.length?'':'gold'}">${list.length} cargado${list.length===1?'':'s'}</span></div>

    ${list.length ? `<div style="margin-top:10px">${list.map((s2,i)=>{
      const r=RES.find(x=>x[0]===s2.r)||RES[0];
      return `<div class="item" style="padding:9px 0">
        <div class="ico" style="font-size:13px;font-weight:800">${i+1}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${s2.c}
          <span class="dim" style="font-weight:500"> · ${s2.d} yds</span></div>
          <div class="dim" style="font-size:12px">${r[2]} ${r[1]}</div></div>
        <button class="chip" style="padding:6px 10px" onclick="delShot(${h},${i})">✕</button>
      </div>`}).join('')}</div>`
    : `<div class="dim" style="font-size:13px;margin-top:8px">
        Todavía no cargaste ningún golpe. Cargá palo y distancia y la app va midiendo cuánto pegás de verdad con cada palo.</div>`}

    ${S.shotOpen ? `
    <div class="sep"></div>
    <div class="lbl" style="margin-bottom:8px">1 · ¿Con qué palo pegaste?</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
      ${BAG.filter(b=>b.on).map(b=>
        `<button class="chip ${S.shotClub===b.c?'on':''}" style="padding:11px 2px;font-size:12px"
          onclick="pickClub('${b.c}')">${b.c}</button>`).join('')}
    </div>

    <div class="lbl" style="margin:16px 0 4px">2 · ¿Cuánto pegaste?</div>
    <div style="text-align:center;margin-bottom:6px">
      <span id="sd" style="font-size:40px;font-weight:800;letter-spacing:-.03em">${S.shotDist}</span>
      <span class="dim" style="font-weight:700"> yds</span>
      ${sel&&!sel.putter
        ? `<div class="dim2" style="font-size:11px">${sel.shots.length
            ? `tu media con ${sel.c}: ${avg(sel)} yds · ${confianza(sel).txt}`
            : `todavía no cargaste ningún golpe con ${sel.c}`}</div>`
        : '<div style="height:15px"></div>'}
    </div>
    <input type="range" min="${TIRO_MIN}" max="${TIRO_MAX}" value="${S.shotDist}"
      oninput="S.shotDist=+this.value;document.getElementById('sd').textContent=this.value"
      style="width:100%;accent-color:var(--acc);height:28px">
    <div class="dim2" style="font-size:11px;text-align:center;margin-top:2px">
      Corré la barra, o ajustá de a poco acá abajo</div>
    <div class="grid4" style="margin-top:6px">
      ${[-10,-1,1,10].map(d=>`<button class="chip" onclick="nudge(${d})">${d>0?'+':'−'}${Math.abs(d)} yds</button>`).join('')}
    </div>

    <div class="lbl" style="margin:16px 0 8px">3 · ¿Dónde quedó?</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
      ${RES.map(([k,l,i])=>`<button class="chip ${S.shotRes===k?'on':''}" style="padding:9px 2px;font-size:11px"
        onclick="S.shotRes='${k}';render()"><div style="font-size:15px">${i}</div>${l}</button>`).join('')}
    </div>

    <div class="grid2" style="margin-top:14px">
      <button class="btn ghost sm" onclick="S.shotOpen=false;render()">Cancelar</button>
      <button class="btn sm" onclick="saveShot(${h})">Guardar golpe</button>
    </div>`
    : `<button class="btn sm" style="margin-top:12px" onclick="openShot(${h})">+ Cargar golpe</button>`}
  </div>`;
}

function vPlay(){
  const h=S.hole, p=par(h), g=gps(h), rec=clubFor(g.mid), sc=R.scores[h];
  const pts=[-2,-1,0,1,2,3].map(d=>p+d).filter(v=>v>0);
  return `<div class="fade">
  <div class="holehdr">
    <button class="arrow" onclick="mv(-1)" ${h===1?'disabled':''}>‹</button>
    <div style="text-align:center">

      <div class="lbl">${yards(h)} yds · hcp ${COURSE.holes[h-1].hcp} · ${teeDelHoyo(h)}</div>
      <div class="dim2" style="font-size:10px">cancha ${CLUB.fisico[h-1]} · ${h<=9?'1ra':'2da'} vuelta${repiteTee(h)?' · mismo tee':''}</div>

    <button class="arrow" onclick="mv(1)" ${h===S.vuelta?'disabled':''}>›</button>

  <div style="position:relative">${holeSVG(h)}
    <div style="position:absolute;top:10px;left:14px" class="pill ${GPS_REAL?'':'gold'}">
      ${GPS_REAL?'GPS activo':'Sin GPS todavía'}</div>
    ${rec?`<div style="position:absolute;top:10px;right:14px" class="pill blue">🎯 ${rec.c}</div>`:''}
  </div>

  <div class="pad" style="margin-top:12px">
    <div class="card">
      <div class="grid3">
        <div class="dist"><div class="lbl">Frente</div><div class="n">${g.front}</div></div>
        <div class="dist"><div class="lbl">Centro</div><div class="n mid">${g.mid}</div></div>
        <div class="dist"><div class="lbl">Fondo</div><div class="n">${g.back}</div></div>
      </div>
      <div class="sep"></div>
      ${rec ? `<div class="between">
        <div><div class="lbl">Palo sugerido</div>
          <div style="font-weight:800;font-size:16px">${rec.c}
            <span class="dim" style="font-weight:500;font-size:13px">· ${media(rec)} yds</span></div></div>
        <div style="text-align:right"><div class="lbl">De dónde sale</div>
          <div style="font-weight:700;font-size:13px" class="${confianza(rec).clase}">${confianza(rec).txt}</div></div>
      </div>
      <div style="font-size:12px;margin-top:8px" class="dim">${
        confianza(rec).nivel==='estimado'
          ? `💡 Todavía no cargaste ningún golpe con ${rec.c}. Por ahora uso la distancia general
             de ese palo; a medida que cargues, el número pasa a ser el tuyo.`
          : confianza(rec).nivel==='tuyo'
          ? `💡 Sale de tus ${rec.shots.length} golpes con ${rec.c}. Tu dispersión es de ±${disp(rec)} yds.`
          : `💡 Todavía es una mezcla entre la distancia general y tus ${rec.shots.length} golpes.
             Con unos cuantos más va a ser sólo tuyo.`}</div>`
      : `<div class="dim" style="font-size:13px">Todavía no armaste la bolsa.
          <a href="#" class="acc" onclick="go('bag');return false">Cargá tus palos</a>
          y te digo con cuál pegar.</div>`}
      <div class="sep"></div>
      <div class="grid2">
        <div><div class="lbl" style="margin-bottom:6px">Estacas en cancha</div>
          ${CLUB.estacas.map(([t,c])=>`<div class="row" style="gap:7px;margin-bottom:4px">
            <span style="width:11px;height:11px;border-radius:50%;background:${c};border:1px solid #ffffff44;flex:0 0 auto"></span>
            <span style="font-size:12px">${t}</span></div>`).join('')}</div>
        <div><div class="lbl" style="margin-bottom:6px">Color de bandera</div>
          ${CLUB.banderas.map(([t,c])=>`<div class="row" style="gap:7px;margin-bottom:4px">
            <span style="width:11px;height:11px;border-radius:50%;background:${c};border:1px solid #ffffff44;flex:0 0 auto"></span>
            <span style="font-size:12px">Pin ${t.toLowerCase()}</span></div>`).join('')}</div>
      </div>
      <div class="dim2" style="font-size:11px;margin-top:7px">
        Mirá el color de la bandera y sabés si el pin está adelante, al centro o atrás.</div>
      ${GPS_REAL?'':`<div style="margin-top:10px;background:#3a3117;border:1px solid #5c4a1f;border-radius:11px;padding:10px 12px">
        <div style="font-size:12px;font-weight:700" class="gold">Estas distancias son de ejemplo</div>
        <div class="dim" style="font-size:11px">Todavía no medimos la cancha. Cuando carguemos las coordenadas
        de los greens y los tees, van a salir de tu posición real.</div></div>`}
    </div>

    <div class="card" style="padding:12px">
      <div class="between" style="margin-bottom:9px">
        <div><div class="lbl">Salida</div>
          <div style="font-weight:700;font-size:13px">${tee().n} · ${totalYds()} yds · ${tee().r}/${tee().s}</div></div>
        <button class="chip" style="padding:8px 12px;font-size:11px;flex:0 0 auto"
          onclick="setVuelta(${S.vuelta===9?18:9})">${S.vuelta} hoyos ⇄</button>
      </div>
      <div class="grid3">
        ${CLUB.tees.map(t=>`<button class="chip ${S.tee===t.id?'on':''}" style="padding:9px 3px;font-size:11px;position:relative"
          onclick="setTee('${t.id}')">${bolita(t)}${t.n}
          ${t.sinMedir?'<span style="position:absolute;top:-5px;right:-3px;background:var(--gold);color:#2a2005;font-size:8px;font-weight:800;padding:1px 4px;border-radius:99px">s/medir</span>':''}
          </button>`).join('')}
      </div>
      ${tee().nota?`<div class="dim2" style="font-size:11px;margin-top:8px">${tee().nota}</div>`:''}
      ${tee().pendiente?`<div style="margin-top:10px;background:#3a3117;border:1px solid #5c4a1f;border-radius:11px;padding:9px 11px">
        <div style="font-size:12px;font-weight:700;color:var(--gold)">Salidas negras — estimadas</div>
        <div class="dim" style="font-size:11px">Sabemos que la cancha suma 540 yardas y qué hoyos repiten tee,
        pero todavía no el yardaje exacto. Se reemplaza en cuanto salga la medición.</div>
      </div>`:''}
    </div>

    ${(indexViejo() && !S.chequeoRonda)?`
    <div class="card" style="background:#3a3117;border-color:#5c4a1f">
      <div class="row" style="align-items:flex-start"><div class="ico" style="background:#5c4a1f">🏅</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:14px">¿Controlaste tu index?</div>
          <div class="dim" style="font-size:12px">Lo actualizaste hace ${diasIndex()} días y el handicap cambia los jueves.

      <div class="grid2" style="margin-top:11px">
        <button class="chip" onclick="go('handicap')">Actualizarlo</button>
        <button class="chip" onclick="S.chequeoRonda=true;render();toast('Listo, seguimos')">Está al día</button>
      </div>
    </div>`:''}

    ${shotPanel(h)}

    ${S.torneo?`
    <div class="card">
      <div class="between" style="margin-bottom:9px">
        <div><div class="lbl">TU score en el hoyo ${h}</div>
          <div class="dim" style="font-size:12px">Lo anota ${GROUP()[S.meMarca].n}, tu marcador</div></div>
        <div style="text-align:right">
          <div class="big ${MARCA[h]!==undefined&&sc!==undefined&&MARCA[h]!==sc?'red':'acc'}">${MARCA[h]??'–'}</div></div>
      </div>
      ${(MARCA[h]!==undefined && sc!==undefined && MARCA[h]!==sc)?`
      <div style="background:#3d1e1e;border:1px solid #7a3a3a;border-radius:11px;padding:10px 12px">
        <div style="font-size:12px;font-weight:700" class="red">No coincide con tus golpes</div>
        <div class="dim" style="font-size:11px">Vos cargaste ${sc} y ${GROUP()[S.meMarca].i} anotó ${MARCA[h]}.
        Hablalo ahora, en el hoyo.</div>
      </div>`:`<div class="dim2" style="font-size:11px">Coincide con los golpes que cargaste.</div>`}
    </div>

    <div class="grid2" style="margin-top:12px">
      <div class="card" style="margin:0;padding:12px">
        <div class="lbl" style="margin-bottom:7px">Tus putts</div>
        <div class="grid4">${[0,1,2,3].map(v=>
          `<button class="chip ${R.putts[h]===v?'on':''}" onclick="setPutt(${v})">${v===3?'3+':v}</button>`).join('')}</div>
      </div>
      <div class="card" style="margin:0;padding:12px">
        <div class="lbl" style="margin-bottom:7px">${p===3?'Pegaste el green':'Tu fairway y green'}</div>
        <div class="grid2">
          <button class="chip ${R.fw[h]?'on':''}" onclick="tg('fw')">${p===3?'GIR ✓':'FW ✓'}</button>
          <button class="chip ${R.gir[h]?'on':''}" onclick="tg('gir')">GIR ✓</button>
        </div>
      </div>
    </div>
    <div class="dim2" style="font-size:11px;margin-top:7px">
      Estos son tuyos y van a tus estadísticas. No entran en ninguna tarjeta.</div>

    <div style="height:18px"></div>
    <div class="card" style="border-color:var(--acc2);background:var(--tint)">
      <div class="row" style="align-items:flex-start;margin-bottom:11px">
        <div class="avatar">${GROUP()[S.marco].i}</div>
        <div style="min-width:0"><div style="font-weight:800;font-size:15px">La tarjeta de ${GROUP()[S.marco].n}</div>
          <div class="dim" style="font-size:12px">Sos su marcador: acá anotás lo que hizo <b>él</b> en el hoyo ${h}.</div></div>
      </div>
      <div class="grid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
        ${pts.map(v=>`<button class="scorebtn ${OTRO[h]===v?'on':''}" onclick="setOtro(${v})">${v}</button>`).join('')}
      </div>
      <div class="between" style="margin-top:9px">
        <span class="dim2" style="font-size:11px">Él lleva la tuya y lo ve en vivo en su celular.</span>
        <button class="chip" style="padding:5px 10px;font-size:11px" onclick="go('arranque')">Cambiar</button>
      </div>
    </div>`
    :`
    <h3>Tu score</h3>
    <div class="grid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
      ${pts.map(v=>`<button class="scorebtn ${sc===v?'on':''}" onclick="setScore(${v})">${v}</button>`).join('')}
    </div>

    <div class="grid2" style="margin-top:12px">
      <div class="card" style="margin:0;padding:12px">
        <div class="lbl" style="margin-bottom:7px">Tus putts</div>
        <div class="grid4">${[0,1,2,3].map(v=>
          `<button class="chip ${R.putts[h]===v?'on':''}" onclick="setPutt(${v})">${v===3?'3+':v}</button>`).join('')}</div>
      </div>
      <div class="card" style="margin:0;padding:12px">
        <div class="lbl" style="margin-bottom:7px">${p===3?'Pegaste el green':'Tu fairway y green'}</div>
        <div class="grid2">
          <button class="chip ${R.fw[h]?'on':''}" onclick="tg('fw')">${p===3?'GIR ✓':'FW ✓'}</button>
          <button class="chip ${R.gir[h]?'on':''}" onclick="tg('gir')">GIR ✓</button>
        </div>
      </div>
    </div>`}

    <h2>Tarjeta del grupo</h2>
    <div class="card" style="padding:12px">
      <table><thead><tr><th style="text-align:left">Jugador</th><th>Index</th><th>Cancha</th>
        <th>Golpes</th><th>Neto</th><th>Stbl</th></tr></thead><tbody>
      ${GROUP().map((pl,i)=>{
        const arr = i===0 ? played().map(x=>R.scores[x]) : pl.sc;
        const t = arr.reduce((a,b)=>a+b,0);
        const parr = arr.reduce((a,_,j)=>a+par(j+1),0);
        const stb = arr.reduce((a,s,j)=>a+stableford(s,par(j+1),COURSE.holes[j].hcp,pl.hcp||0),0);
        return `<tr><td class="name"><span class="avatar" style="width:22px;height:22px;font-size:9px;
          display:inline-flex;vertical-align:-6px;margin-right:7px">${pl.i}</span>${pl.n}</td>
          <td class="dim">${pl.index}</td><td class="dim">${pl.hcp??'—'}</td>
          <td style="font-weight:800">${t||'–'}</td>
          <td class="${t-parr<=0?'acc':''}">${arr.length?fmtPar(t-parr):'–'}</td>
          <td class="gold" style="font-weight:800">${arr.length?stb:'–'}</td></tr>`;}).join('')}
      </tbody></table>
    </div>

    <h2>Tarjeta hoyo por hoyo</h2>
    <div class="card" style="padding:12px;overflow-x:auto">
      <table style="min-width:100%"><thead><tr><th style="text-align:left">H</th>
        ${COURSE.holes.slice(0,9).map(x=>`<th>${x.n}</th>`).join('')}<th>OUT</th></tr></thead><tbody>
        <tr><td class="name dim2" style="font-size:11px">PAR</td>
          ${COURSE.holes.slice(0,9).map(x=>`<td class="dim2">${x.par}</td>`).join('')}
          <td class="dim2">36</td></tr>
        <tr><td class="name">Yo</td>
          ${COURSE.holes.slice(0,9).map(x=>{const s=R.scores[x.n];
            return `<td>${s?`<span class="sq ${scoreClass(s,x.par)}">${s}</span>`:'<span class="dim2">–</span>'}</td>`}).join('')}
          <td style="font-weight:800">${played().filter(x=>x<=9).reduce((a,x)=>a+R.scores[x],0)||'–'}</td></tr>
      </tbody></table>
    </div>

    <div style="margin:16px 0 24px">
      <button class="btn" onclick="finish()">${S.torneo?'Cerrar y firmar la tarjeta':'Guardar la tarjeta'}</button>
      <div style="height:8px"></div>
      <button class="btn ghost sm" onclick="toast('📍 Posición compartida con el grupo')">Compartir mi posición en cancha</button>
    </div>
  </div></div>`;

/* ---------- LA TARJETA COMPLETA ----------
   Si la digital reemplaza al papel, tiene que decir exactamente lo mismo:
   par y valuación de cada hoyo, yardas de las tres salidas, subtotales de
   ida y vuelta, rating y slope, y el bloque de firmas. */
function ydsTee(t,h){
  if(t.y) return t.y[h-1];
  return Math.round(COURSE.holes[h-1].y * t.f);
}
function tablaTarjeta(desde,hasta,rot){
  const hs = COURSE.holes.slice(desde-1,hasta);
  const sub = a => a.reduce((x,y)=>x+y,0);
  const jug = hs.map(x=>R.scores[x.n]);
  return `<table style="min-width:${(hasta-desde+1)*34+108}px">
    <thead><tr><th style="text-align:left;min-width:98px">Hoyo</th>
      ${hs.map(x=>`<th>${x.n}</th>`).join('')}<th style="min-width:42px">${rot}</th></tr></thead>
    <tbody>
      ${CLUB.tees.map(t=>`<tr><td class="name" style="font-size:11px">${bolita(t)}${t.n}</td>
        ${hs.map(x=>`<td class="dim">${ydsTee(t,x.n)}</td>`).join('')}
        <td style="font-weight:700">${sub(hs.map(x=>ydsTee(t,x.n)))}</td></tr>`).join('')}
      <tr><td class="name" style="font-weight:800">Par</td>
        ${hs.map(x=>`<td style="font-weight:800">${x.par}</td>`).join('')}
        <td style="font-weight:800">${sub(hs.map(x=>x.par))}</td></tr>
      <tr><td class="name dim2" style="font-size:11px">Valuación</td>
        ${hs.map(x=>`<td class="dim2">${x.hcp}</td>`).join('')}<td></td></tr>
      <tr><td class="name">Golpes</td>
        ${hs.map(x=>{const v=R.scores[x.n];
          return `<td>${v?`<span class="sq ${scoreClass(v,x.par)}">${v}</span>`:'<span class="dim2">–</span>'}</td>`}).join('')}
        <td style="font-weight:800">${jug.some(v=>v)?sub(jug.filter(Boolean)):'–'}</td></tr>
    </tbody></table>`;
}

/* ---------- FIRMA DE LA TARJETA ----------
   Regla 3.3b: la tarjeta la anota un marcador y la firman los dos.
   Sin las dos firmas no es válida. Acá se cruzan los dos anotadores
   antes de firmar, que es lo que en papel se descubre tarde. */
function difs(){
  return played().filter(h => MARCA[h]!==undefined && MARCA[h]!==R.scores[h]);
}
function vFirma(){
  const g = GROUP(), mio = g[S.meMarca], suyo = g[S.marco];
  const d = difs(), p = played();
  return `<div class="fade">
  <div class="hdr"><div class="row"><button class="arrow" onclick="go('play')">‹</button>
    <div><div class="lbl">${CLUB.corto} · ${p.length} hoyos</div><h1 style="font-size:22px">Cerrar la tarjeta</h1></div></div></div>
  <div class="pad">

    <h3>1 · Tu tarjeta, la que anotó ${mio.n}</h3>

      <table><thead><tr><th style="text-align:left">H</th>
        ${p.map(h=>`<th>${h}</th>`).join('')}<th>TOT</th></tr></thead><tbody>
        <tr><td class="name dim2" style="font-size:11px">PAR</td>
          ${p.map(h=>`<td class="dim2">${par(h)}</td>`).join('')}
          <td class="dim2">${p.reduce((a,h)=>a+par(h),0)}</td></tr>
        <tr><td class="name">${mio.i} anotó</td>
          ${p.map(h=>`<td><span class="sq ${scoreClass(MARCA[h]??R.scores[h],par(h))}">${MARCA[h]??'–'}</span></td>`).join('')}

        <tr><td class="name dim2" style="font-size:11px">tus golpes</td>
          ${p.map(h=>`<td class="${MARCA[h]!==undefined&&MARCA[h]!==R.scores[h]?'red':'dim2'}">${R.scores[h]}</td>`).join('')}
          <td class="dim2">${total()}</td></tr>
      </tbody></table>

      ${d.length?`
      <div style="background:#3d1e1e;border:1px solid #7a3a3a;border-radius:12px;padding:12px;margin-top:12px">
        <div style="font-weight:700;font-size:13px" class="red">No coincide en ${d.length} hoyo${d.length>1?'s':''}</div>
        <div class="dim" style="font-size:11px;margin-bottom:8px">
          Resolvelo con ${mio.n} antes de certificar. En papel esto termina en descalificación.</div>
        ${d.map(h=>`<div class="between" style="padding:8px 0;border-top:1px solid var(--hair)">
          <span style="font-weight:700;font-size:13px">Hoyo ${h}</span>
          <div style="display:flex;gap:7px">
            <button class="chip" style="padding:7px 11px" onclick="resolver(${h},${R.scores[h]})">Van ${R.scores[h]}</button>
            <button class="chip" style="padding:7px 11px" onclick="resolver(${h},${MARCA[h]})">Van ${MARCA[h]}</button>
          </div></div>`).join('')}
      </div>`:`
      <div class="row" style="background:var(--tint);border-radius:11px;padding:10px 12px;margin-top:12px">
        <div class="ico" style="width:30px;height:30px;font-size:14px">✅</div>
        <div class="dim" style="font-size:12px">Lo que anotó ${mio.i} coincide con tus golpes en los ${p.length} hoyos.</div>
      </div>`}

      ${S.presento===false?`
      <div class="row" style="background:#3a3117;border:1px solid #5c4a1f;border-radius:11px;padding:11px 13px;margin-top:12px">
        <div class="ico" style="background:#5c4a1f;width:32px;height:32px;font-size:15px">🚫</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:13px" class="gold">No presentás esta tarjeta</div>
        <div class="dim" style="font-size:11px">No cuenta para el Invierno ni va al club.
        Igual te queda guardada para vos, con los palos y las distancias que cargaste.</div></div>
      </div>
      <button class="btn ghost sm" style="margin-top:11px" onclick="S.presento=null;render()">Volver atrás</button>`
      : S.certifico?`
      <button class="btn ghost sm" style="margin-top:12px">✓ Certificada y lista para presentar</button>`
      :`
      <button class="btn sm" style="margin-top:12px" onclick="certificar()">Certificar y presentar</button>
      <button class="btn ghost sm" style="margin-top:8px" onclick="noPresentar()">No presentar mi tarjeta</button>
      <div class="dim2" style="font-size:11px;margin-top:9px">
        Podés no presentarla, como en papel. La que llevás vos de ${suyo.n} se entrega igual.</div>`}

    <h3>2 · La tarjeta de ${suyo.n}, que llevaste vos</h3>

        ${p.map(h=>`<th>${h}</th>`).join('')}<th>TOT</th></tr></thead><tbody>
        <tr><td class="name dim2" style="font-size:11px">PAR</td>
          ${p.map(h=>`<td class="dim2">${par(h)}</td>`).join('')}
          <td class="dim2">${p.reduce((a,h)=>a+par(h),0)}</td></tr>
        <tr><td class="name">${suyo.i}</td>
          ${p.map(h=>`<td><span class="sq ${scoreClass(OTRO[h]??par(h),par(h))}">${OTRO[h]??'–'}</span></td>`).join('')}
          <td style="font-weight:800">${p.reduce((a,h)=>a+(OTRO[h]??0),0)}</td></tr>
      </tbody></table>
      <div class="dim2" style="font-size:11px;margin-top:9px">
        Él la está certificando en su celular. Vos la firmás como marcador.</div>
      <button class="btn ${S.firmoLaOtra?'ghost':''} sm" style="margin-top:11px" onclick="firmarLaOtra()">
        ${S.firmoLaOtra?'✓ Firmada como marcador':'Firmar como marcador'}</button>

    <div class="card" style="margin-bottom:24px">
      <h3>Qué se entrega</h3>

            :(S.certifico?'Certificada por vos y firmada por '+mio.i:'Falta certificar')}</div></div>
        <span class="pill ${S.presento===false?'red':(S.certifico?'':'gold')}">
          ${S.presento===false?'No presenta':(S.certifico?'Se entrega':'Falta')}</span>
      </div>
      <div class="between" style="padding:10px 0">
        <div style="min-width:0"><div style="font-size:13px;font-weight:700">La tarjeta de ${suyo.n}</div>
          <div class="dim2" style="font-size:11px">${S.firmoLaOtra?'Firmada por vos como marcador':'Falta que la firmes'}</div></div>
        <span class="pill ${S.firmoLaOtra?'':'gold'}">${S.firmoLaOtra?'Se entrega':'Falta'}</span>
      </div>
      ${((S.certifico||S.presento===false)&&S.firmoLaOtra)?`
      <button class="btn" style="margin-top:12px" onclick="entregar()">
        ${S.presento===false?'Entregar solo la de '+suyo.n:'Entregar las dos tarjetas'}</button>
      <div class="dim2" style="font-size:11px;margin-top:9px">
        ${S.presento===false
          ? `A ${CLUB.pro.n} le llega la de ${suyo.n} y el aviso de que vos no presentaste.`
          : `Le llegan a ${CLUB.pro.n} al toque, sin caminar hasta la secretaría.`}
        Una vez entregadas no se modifican.</div>`
      :`<div class="dim" style="font-size:13px;margin-top:11px;text-align:center">
        ${!S.firmoLaOtra?'Falta que firmes la tarjeta de '+suyo.n+'. Esa se entrega sí o sí.'
          :'Decidí qué hacés con la tuya.'}</div>`}
    </div>
  </div></div>`;
}

/* ---------- RESUMEN DE RONDA ---------- */
function vSummary(){
  const p=played(), t=total(), tp=toPar();
  const b=p.filter(h=>R.scores[h]<par(h)).length;
  const pars=p.filter(h=>R.scores[h]===par(h)).length;
  const bog=p.filter(h=>R.scores[h]>par(h)).length;
  const putts=p.reduce((a,h)=>a+(R.putts[h]||0),0);
  const fw=p.filter(h=>R.fw[h]&&par(h)>3).length;
  return `<div class="fade">
  <div class="pad" style="padding-top:20px">
    <div class="card" style="background:linear-gradient(135deg,var(--tint),var(--card));border-color:var(--acc2);text-align:center;padding:24px">
      <div style="font-size:40px">⛳</div>
      <div class="lbl" style="margin-top:6px">${!S.torneo?'Ronda de práctica'
        :(S.presento===false?'No presentada · queda para vos'
        :(S.entregada?'Tarjeta entregada al club':'Tarjeta de torneo'))} · ${CLUB.corto}</div>
      <div style="font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.05">${t}</div>
      <div class="pill" style="font-size:14px;padding:6px 16px">${fmtPar(tp)} al par · ${p.length} hoyos</div>
      <div class="sep"></div>
      <div class="between"><div><div class="lbl">Handicap</div>
        <div style="font-weight:800;font-size:18px">${S.user.hcp} · cancha ${hcpCancha(S.user.hcp)}</div></div>
        <div style="text-align:right"><div class="lbl">Stableford</div>
        <div style="font-weight:800;font-size:18px">31 pts</div></div></div>
    </div>

    <div class="grid4">
      ${[['Birdies',b,'acc'],['Pares',pars,''],['Bogeys+',bog,''],['Putts',putts,'']].map(([l,v,c])=>
        `<div class="card" style="margin:0 0 10px;text-align:center;padding:12px 6px">
          <div class="big ${c}" style="font-size:24px">${v}</div>
          <div class="lbl" style="font-size:9px">${l}</div></div>`).join('')}
    </div>

    <div class="card"><h3>Lo mejor y lo peor</h3>
      <div class="item"><div class="ico">🔥</div><div><div style="font-weight:700">Hoyo 6 — birdie</div>
        <div class="dim" style="font-size:12px">Par 3 de 187 yds. Green en regulación y un putt.</div></div></div>
      <div class="item"><div class="ico">🩹</div><div><div style="font-weight:700">Hoyo 2 — doble bogey</div>
        <div class="dim" style="font-size:12px">Segundo golpe al bunker. Es tu patrón: 2 golpes perdidos por ronda ahí.</div></div></div>
      <div class="item"><div class="ico">📈</div><div><div style="font-weight:700">${fw} fairways de ${p.filter(h=>par(h)>3).length}</div>
        <div class="dim" style="font-size:12px">Por encima de tu media de la temporada.</div></div></div>
    </div>

    ${(()=>{const all=[].concat(...Object.values(R.shots));
      if(!all.length)return '';
      const by={};all.forEach(s=>{(by[s.c]=by[s.c]||[]).push(s.d)});
      return `<div class="card"><h3>Lo que cargaste esta ronda</h3>
        ${Object.entries(by).map(([c,ds])=>
          `<div class="between" style="padding:8px 0;border-bottom:1px solid var(--hair)">
            <span style="font-weight:700">${c} <span class="dim2" style="font-weight:500;font-size:12px">×${ds.length}</span></span>
            <span class="mono dim" style="font-size:13px">${ds.join(' · ')} yds</span></div>`).join('')}
        <div class="dim" style="font-size:12px;margin-top:10px">
          Estos ${all.length} golpes ya se sumaron a las medias de tu bolsa.</div>
        <button class="btn ghost sm" style="margin-top:10px" onclick="go('bag')">Ver mi bolsa</button>
      </div>`})()}

    <div class="card"><h3>El caddie dice</h3>
      <p style="font-size:13px">Jugaste ${fmtPar(tp)} con ${putts} putts. Si convertías dos de los tres
      up&amp;down que fallaste, cerrabas en ${t-2}. Tu práctica de esta semana: bunker y approach de 120 yds.</p>
      <button class="btn ghost sm" onclick="go('stats')">Ver plan de práctica</button>
    </div>

    <div style="margin-bottom:24px">
      <button class="btn" onclick="toast('📤 Tarjeta compartida con tu grupo y el club')">Compartir tarjeta</button>
      <div style="height:8px"></div>
      <button class="btn ghost sm" onclick="go('home')">Volver al inicio</button>
    </div>
  </div></div>`;
}

function paso(n,t){ return `<div class="hdr" style="padding-top:20px">
  <div><div class="lbl">Paso ${n} de ${PASOS}</div><h1>${t}</h1></div></div>`; }

function vOnboard(){
  const S_ = S;

  if(S.onb===0) return `<div class="fade" style="height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 26px;text-align:center">
    <div style="display:flex;justify-content:center">${crestWord()}</div>
    <div class="lbl" style="margin:20px 0 14px">${CLUB.lema}</div>

      ${[['📍','Cuánto te queda al green, hoyo por hoyo'],

    <div class="pad">

      `<div class="card" style="cursor:pointer;${S.tipo===k?'border-color:var(--acc)':''}"

      <div class="row" style="margin-bottom:12px"><div class="ico">📩</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:13px">Te mandamos un código</div>
        <div class="dim" style="font-size:12px">A ${p.mail?tapar(p.mail):taparTel(p.tel)}, el contacto

      <input value="${S.codigo||''}" placeholder="• • • • • •" inputmode="numeric" oninput="S.codigo=this.value"

      <div class="grid2" style="margin-top:8px">

      </div>`:''}

      ${est==='sincontacto'?`

const totalYds = () => COURSE.holes.slice(0,S.vuelta).reduce((a,h)=>a+yards(h.n),0);
function mv(d){const n=S.hole+d;if(n>=1&&n<=S.vuelta){S.hole=n;render();$('#screen').scrollTop=0;}}
function setTee(id){S.tee=id;render();
  toast(tee().sinMedir
    ? `Negras · ${totalYds()} yds (estimado, sin medición oficial)`
    : `${tee().n} · ${totalYds()} yds · rating ${tee().r} slope ${tee().s}`);}
function setVuelta(v){S.vuelta=v;if(S.hole>v)S.hole=v;render();
  toast(v===9?'Recorrido de 9 hoyos (una vuelta)':'Recorrido de 18 hoyos (dos vueltas)');}
function setScore(v){R.scores[S.hole]=v;S.playing=true;
  const d=v-par(S.hole);
  toast(d<=-2?'🦅 ¡Eagle!':d===-1?'🐦 ¡Birdie!':d===0?'✓ Par':d===1?'Bogey':'Doble bogey');
  render();}
function setPutt(v){R.putts[S.hole]=v;render();}
function setOtro(v){ OTRO[S.hole]=v; render();
  toast(`${GROUP()[S.marco].n}: ${v} en el hoyo ${S.hole}`); }
function tg(k){R[k][S.hole]=!R[k][S.hole];render();}
function yaCargada(i){ PARA_AAG[i].cargada=!PARA_AAG[i].cargada; render();
  toast(PARA_AAG[i].cargada?`${PARA_AAG[i].n} marcada como cargada`:`${PARA_AAG[i].n} vuelve a pendientes`); }
function empezarRonda(){
  if(S.torneo && S.marco===S.meMarca){toast('Elegí distinto para marcar y ser marcado');return;}
  S.hole=1; S.playing=true; go('play');
  toast(S.torneo?`Arrancó · llevás la tarjeta de ${GROUP()[S.marco].n}`:'Arrancó la ronda');
}
function finish(){
  if(!S.torneo){ S.entregada=false; go('summary');
    toast('Tarjeta guardada · sumó a tus estadísticas'); return; }
  go('firma');
}
function resolver(h,v){ R.scores[h]=v; MARCA[h]=v; render(); toast(`Hoyo ${h} corregido: ${v}`); }
function certificar(){
  if(difs().length){toast('Primero resolvé las diferencias con tu marcador');return;}
  S.certifico=true; S.presento=true; render(); toast('✍️ Certificaste tu tarjeta');
}
function noPresentar(){
  S.presento=false; S.certifico=false; render();
  toast('No vas a presentar tu tarjeta · queda guardada para vos');
}
function firmarLaOtra(){
  S.firmoLaOtra=true; render();
  toast(`✍️ Firmaste la tarjeta de ${GROUP()[S.marco].n} como su marcador`);
}
function entregar(){
  S.entregada=true; render(); go('summary');
  toast(S.presento===false
    ? `📩 Entregaste la de ${GROUP()[S.marco].n} · la tuya no se presenta`
    : `📩 Tarjetas entregadas · le llegaron a ${CLUB.pro.n}`);
}
function seguirDesdeTipo(){ S.onb = esSocio() ? 2 : 3; render(); }
function buscarPadron(){
  const d=(S.dni||'').replace(/\D/g,'');
  if(d.length<7){toast('Poné tu DNI completo');return;}
  const p = buscarEnPadron(d);
  if(!p){ S.padronEstado='nopadron'; render(); toast('Ese DNI no figura en el padrón'); return; }
  if(p.cuenta){ S.padronEstado='usado'; S.hallado=p; render(); toast('Ese DNI ya tiene una cuenta'); return; }
  S.hallado=p; S.nsocio=p.socio;
  if(!p.mail && !p.tel){ S.padronEstado='sincontacto'; render();
    toast('El club no tiene tu contacto cargado'); return; }
  // el código va al contacto que el CLUB ya tiene, no al que escribió quien se registra
  S.padronEstado='codigo'; S.codigo=''; render();
  toast(`Código enviado a ${p.mail?tapar(p.mail):taparTel(p.tel)}`);
}
function verificarCodigo(){
  if((S.codigo||'').replace(/\D/g,'').length<6){toast('Poné los 6 dígitos del código');return;}
  S.padronEstado='verificado'; S.padronOk=true;
  // Dejamos cargado el mail que el club ya tiene: es el que conviene usar de usuario.
  if(!S.email && S.hallado && S.hallado.mail) S.email = S.hallado.mail;
  render();
  toast('✅ Identidad verificada');
}
function reiniciarBusqueda(){ S.padronEstado=null; S.padronOk=false; S.hallado=null; S.codigo=''; render(); }
/* Claves: nos importa el largo, no las mayúsculas ni los símbolos.
   Las reglas de composición hacen que la gente ponga Trisquelia1! y se la olvide.
   Lo único que bloqueamos son las claves obvias. Nunca guardamos el texto de la
   clave: sólo el largo y si pasa o no. */
const CLAVES_OBVIAS = ['12345678','123456789','contraseña','password','trisquelia',
  'golf','qwertyui','11111111','abcd1234','clavegolf'];
/* IMPORTANTE: acá no se puede llamar a render(). Redibujar la pantalla en cada
   tecla destruye el campo y borra lo que la persona venía escribiendo.
   Sólo tocamos la barrita y el mensaje. */
function evalClave(v){
  const t = String(v||''), bajo = t.toLowerCase();
  S.clave = t.length;
  if(t.length === 0){ S.claveOk=false; S.claveMsg='Elegí una clave.'; }
  else if(t.length < 8){ const f = 8-t.length;
    S.claveOk=false; S.claveMsg = f===1 ? 'Le falta un carácter.' : `Le faltan ${f} caracteres.`; }
  else {
    const nombre = (S.hallado && S.hallado.n || '').toLowerCase().split(' ').filter(x=>x.length>3);
    const propio = [ (S.dni||'') ].concat(nombre).filter(Boolean);
    if(CLAVES_OBVIAS.indexOf(bajo) >= 0){
      S.claveOk=false; S.claveMsg='Esa clave es de las primeras que prueba cualquiera. Poné otra.';
    } else if(propio.some(x => x && bajo.includes(x.toLowerCase()))){
      S.claveOk=false; S.claveMsg='No uses tu DNI ni tu nombre en la clave.';
    } else {
      S.claveOk=true;
      S.claveMsg = t.length>=14 ? 'Muy buena clave.' : 'Buena clave. Si la hacés más larga, mejor.';
    }
  }
  const bar = document.getElementById('claveBar');
  const msg = document.getElementById('claveMsg');
  if(bar){ bar.style.width = Math.min(100, S.clave*8)+'%';
           bar.style.background = S.claveOk ? 'var(--acc)' : 'var(--gold)'; }
  if(msg){ msg.textContent = S.claveMsg; }
}
/* Igual que en la clave: nada de render() mientras se escribe. */
function pintarVentaja(){
  const v = ventaja(S.vA??10, S.vB??18);
  const a = document.getElementById('ventNum'), b = document.getElementById('ventHasta');
  if(a) a.textContent = v;
  if(b) b.textContent = v;
}
function crearCuenta(){
  if(!S.email||!S.email.includes('@')){toast('Poné un email válido');return;}
  if((S.clave||0)<8){toast('La clave necesita al menos 8 caracteres');return;}
  if(S.claveOk===false && (S.clave||0)>=8){toast(S.claveMsg);return;}
  // el DNI queda tomado: nadie más puede registrarse con él
  if(S.hallado) S.hallado.cuenta = S.email;
  S.onb=4; render(); toast('Cuenta creada · te mandamos un mail de confirmación');
}
function skipOnb(){S.onboarded=true;S.tab='home';render();}
function actualizarIndex(){
  S.indexDias=0; S.chequeoRonda=true; render();
  toast(`Index actualizado · salís ${hcpCancha(S.user.hcp)} de ${tee().n.toLowerCase()}`);
}
function avisar(t){ toast(`📣 "${t}" enviado a los ${CLUB.socios} socios`); }
function publicarResultados(){
  toast(S.resultadosPublicos
    ? '📊 Resultados publicados · notificación a socios e invitados'
    : `📊 Resultados publicados · notificación a los ${CLUB.socios} socios`);
}
function toggleAlcance(){ S.resultadosPublicos=!S.resultadosPublicos; render();
  toast(S.resultadosPublicos?'Los resultados los ve cualquiera con la app':'Los resultados quedan solo para socios'); }
function setTipo(t){ S.tipo=t; S.tab='home'; render();
  toast(t==='socio'?'Estás viendo la app como socio':'Estás viendo la app como invitado'); }
function setRol(k,r){ EQUIPO[k].rol=r; render(); toast(`${EQUIPO[k].n}: ${ROLES[r].n}`); }
function setModo(m){
  CLUB.torneo.modo=m;
  toast(m==='simultanea'
    ? `💥 Tiro simultáneo ${CLUB.torneo.hora} · aviso enviado a ${CLUB.socios} socios`
    : `🕐 Salidas escalonadas ${CLUB.horarios.primera}–${CLUB.horarios.ultima} · aviso enviado a ${CLUB.socios} socios`);
  render();
}
function cambioClima(motivo){
  CLUB.torneo.cambio = motivo;
  if(motivo.includes('simultáneo')) CLUB.torneo.modo='simultanea';
  toast(`📣 Aviso enviado a ${CLUB.socios} socios`);
  render();
}
function limpiarCambio(){ CLUB.torneo.cambio=null; render(); }
function traer(){
  if(!S.mat||S.mat.length<4){toast('Cargá tu número de matrícula');return;}
  S.fedOk=!S.fedOk;
  if(S.fedOk){ S.user.hcp=7.4; S.indexDias=0; toast(`Index guardado · salís ${hcpCancha(14.2)} de blancas/azules`); }
  render();
}
function togBag(i){
  const on=BAG.filter(b=>b.on).length;
  if(!BAG[i].on && on>=14){toast('Ya llevás 14. Sacá uno para poder poner otro');return;}
  BAG[i].on=!BAG[i].on;render();
}
function openShot(h){
  S.shotOpen=true;
  const g=gps(h), rec=clubFor(g.mid);
  S.shotClub = S.shotClub || (rec ? rec.c : null);
  const b=BAG.find(x=>x.c===S.shotClub);
  S.shotDist = b && !b.putter ? media(b) : 8;
  S.shotRes=S.shotRes||'fw';
  render();
}
function pickClub(c){
  S.shotClub=c;
  const b=BAG.find(x=>x.c===c);
  S.shotDist = b.putter ? 8 : (avg(b)||b.base);
  render();
}
function nudge(d){S.shotDist=Math.max(TIRO_MIN,Math.min(TIRO_MAX,S.shotDist+d));render();}
function saveShot(h){
  if(!S.shotClub){toast('Elegí un palo');return;}
  const b=BAG.find(x=>x.c===S.shotClub);
  R.shots[h]=R.shots[h]||[];
  R.shots[h].push({c:S.shotClub,d:S.shotDist,r:S.shotRes||'fw'});
  const antes=avg(b);
  b.shots.push(S.shotDist);
  const ahora=avg(b);
  // el score del hoyo se sincroniza con los golpes cargados
  R.scores[h]=R.shots[h].length; S.playing=true;
  S.shotOpen=false;
  toast(b.putter ? `Putt cargado · ${R.shots[h].length} golpes en el hoyo`
    : `${b.c}: tu media pasó de ${antes} a ${ahora} yds (${b.shots.length} golpes)`);
  render();
}
function delShot(h,i){
  const s=R.shots[h][i];
  const b=BAG.find(x=>x.c===s.c);
  const k=b.shots.lastIndexOf(s.d); if(k>-1)b.shots.splice(k,1);
  R.shots[h].splice(i,1);
  if(R.shots[h].length)R.scores[h]=R.shots[h].length; else delete R.scores[h];
  render();
}
function book(t){if(FULL().includes(t))return;
  S.booked[t]=!S.booked[t];
  toast(S.booked[t]?`⛳ Anotado al torneo · salida ${t}`:'Te bajaste de la salida');render();}

/* ============================================================
   RENDER
   ============================================================ */
const VIEWS={home:vHome,play:vPlay,stats:vStats,club:vClub,social:vSocial,me:vMe,
             notif:vNotif,summary:vSummary,bag:vBag,handicap:vHandicap,firma:vFirma,arranque:vArranque,tarjeta:vTarjeta,
             dash:vDash,tees:vTees,socios:vSocios,torneo:vTorneo,permisos:vPermisos,cargaaag:vCargaAAG};
function render(){
  if(!S.onboarded){
    $('#screen').innerHTML = vOnboard();
    $('#nav').style.display='none';
    return;
  }
  $('#nav').style.display='flex';
  if(S.mode==='club' && !puedeVer(S.tab)) S.tab='dash';
  $('#screen').innerHTML = (VIEWS[S.tab]||vHome)();
  renderNav();
}
applyTheme();
document.getElementById('appname').textContent = CLUB.app;
render();
</script>
