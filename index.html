<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070e18">
<meta name="description" content="La app del Trisquelia Golf Club: tu tarjeta, tus distancias, los torneos y los resultados.">
<title>Trisquelia Golf Club</title>

<!-- ===== INSTALACIÓN EN EL TELÉFONO =====
     Con esto la app se agrega a la pantalla de inicio y abre sin el
     navegador. En iPhone además es lo que hace que el sistema NO borre
     los datos guardados: WebKit da el permiso de almacenamiento
     permanente justamente a las apps agregadas a la pantalla de inicio. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trisquelia">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{
  --bg:#0b1710; --bg2:#0f2018; --card:#132a20; --card2:#18342767;
  --line:#1f3d2e; --txt:#eaf5ee; --dim:#8fae9c; --dim2:#5f7d6c;
  --acc:#4d9de0; --acc2:#2b7cc4; --gold:#e9c46a; --red:#f87171; --blue:#60a5fa;
  --ink:#02101f; --tint:#14304e; --nav:#0a1727; --hair:#1a2f4a; --rojo:#c8202e;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07100b;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:0}

/* ---------- phone frame ---------- */
/* La app es para el telefono: el marco llena la pantalla, la mida lo que mida.
   `100dvh` y no `100vh`: en el navegador del celular `100vh` es el alto CON la
   barra de direcciones escondida, asi que la barra de abajo quedaba tapada.
   `100vh` queda primero como respaldo para navegadores viejos. */
#frame{width:100%;height:100vh;height:100dvh;background:var(--bg);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
/* El marco con bordes redondeados es solo para mirarla en una computadora, asi
   que pide pantalla ancha Y ALTA. Antes pedia solo ancho, y un telefono
   apaisado mide mas de 520px: le clavaba 844px de alto en una ventana de 390 y
   la barra de navegacion quedaba entera fuera de pantalla. */
@media(min-width:520px) and (min-height:900px){
  #frame{max-width:412px;height:844px;border-radius:38px;border:1px solid #1d3529}}

#status{height:30px;display:flex;align-items:center;justify-content:center;
  padding:0 22px;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--dim);flex:0 0 auto}
#screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 0 12px;scroll-behavior:smooth}
#screen::-webkit-scrollbar{width:0}

/* ---------- nav ---------- */
#nav{flex:0 0 auto;display:flex;background:var(--nav);border-top:1px solid var(--line);
  padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
#nav button{flex:1;min-width:0;background:none;border:0;color:var(--dim2);font-size:9.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;
  font-family:inherit;letter-spacing:.02em;transition:color .15s}
#nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--acc)}

/* ---------- generic ---------- */
.pad{padding:0 18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:17px;font-weight:700;margin:22px 0 10px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em}
p{margin:0 0 8px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.acc{color:var(--acc)}.gold{color:var(--gold)}.red{color:var(--red)}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.lbl{font-size:11px;color:var(--dim2);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;
  background:var(--tint);color:var(--acc)}
.pill.gold{background:#3a3117;color:var(--gold)}
.pill.blue{background:#16304d;color:var(--blue)}
.pill.red{background:#3d1e1e;color:var(--red)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:700;background:var(--acc2);color:var(--ink);
  transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:11px;
  min-height:44px;display:flex;align-items:center;justify-content:center}
.sep{height:1px;background:var(--line);margin:14px 0}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:14px;flex:0 0 auto}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.hdr{padding:8px 18px 4px;display:flex;align-items:flex-start;justify-content:space-between}

/* ---------- play / hole ---------- */
.holehdr{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
  background:var(--nav);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.arrow{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);font-size:18px;cursor:pointer;font-family:inherit}
.arrow:disabled{opacity:.3}
.dist{text-align:center}
.dist .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.dist .n.mid{font-size:44px;color:var(--acc)}
/* 44px de mínimo en los dos ejes. Apple pide 44, Android 48, y esta app se
   usa caminando, con guante y con sol de frente. El `min-height` gana sobre el
   padding que cada sitio pone en su `style=`, así que alcanza con escribirlo
   acá y no hay que tocar los ochenta y pico de lugares donde se usa. */
.chip{padding:9px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;
  min-height:44px;min-width:44px}
.chip.on{background:var(--tint);border-color:var(--acc2);color:var(--acc)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums}
th{color:var(--dim2);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
tr+tr td{border-top:1px solid var(--hair)}
td.name{text-align:left;font-weight:600;font-size:13px}
.sq{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
  border-radius:6px;font-weight:800}
.eagle{background:#e9c46a;color:#2a2005;border-radius:50%}
.birdie{background:#4d9de033;color:var(--acc);border-radius:50%;border:1px solid var(--acc)}
.bogey{background:#f8717122;color:#fca5a5}
.dbogey{background:#f8717144;color:var(--red)}

/* ---------- misc ---------- */
.slot{padding:11px 8px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  text-align:center;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--txt);
  min-height:44px;display:flex;align-items:center;justify-content:center}
.slot.full{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.slot.mine{background:var(--acc2);color:var(--ink);border-color:var(--acc2)}
.bar{height:7px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:#eaf2fb;color:var(--ink);
  padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:50;opacity:0;
  transition:opacity .25s,bottom .25s;pointer-events:none;white-space:nowrap;max-width:90%}
.toast.on{opacity:1;bottom:110px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);align-items:center}
.item:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:11px;background:var(--tint);display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;font-size:17px}
.tabs{display:flex;gap:6px;padding:0 18px 4px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;font-family:inherit;
  min-height:44px}
.tab.on{background:var(--txt);color:var(--ink);border-color:var(--txt)}
.modeban{background:linear-gradient(135deg,#3a3117,#241d0d);border:1px solid #5c4a1f}
/* ---------- cerrar el hoyo ----------
   El socio no anota en el green: anota parado en el tee siguiente, para no
   frenar la cancha. O sea que esta pantalla tiene un presupuesto de veinte
   segundos, una mano y un guante puesto. Por eso los bloques van sin la
   tarjeta que los envolvía —16px de padding arriba y abajo por bloque, siete
   bloques— y el botón de guardar queda pegado abajo, siempre alcanzable. */
.bloque{margin:0 0 12px}
.bloque > .lbl{margin-bottom:6px}
.guardar{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom, transparent, var(--bg) 22%)}
/* En un teléfono viejo y corto (un SE de 568px) no hay forma de que entre
   todo sin bajar de 44px, que no se negocia. Se aprietan los aires, y lo que
   queda de scroll no toca el botón de guardar: por eso está pegado abajo. */
@media (max-height:660px){
  .bloque{margin:0 0 8px}
  .guardar{padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
}

/* ---------- LA RONDA COMPARTIDA ---------- */
.codigo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:34px;font-weight:800;
  letter-spacing:.22em;text-align:center;color:var(--txt);padding:6px 0 2px}
.codigo-in{width:100%;padding:15px;border-radius:12px;background:var(--nav);
  border:1px solid var(--line);color:var(--txt);font-family:ui-monospace,monospace;
  font-size:24px;font-weight:800;letter-spacing:.22em;text-align:center;text-transform:uppercase}
.enlinea{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim2)}
.luz{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dim2)}
.luz.si{background:var(--ok, #3ddc84);box-shadow:0 0 8px #3ddc8470}
.luz.no{background:var(--gold)}
.cruce{background:#3a3117;border:1px solid #5c4a1f;border-radius:13px;padding:12px 14px}
.cruce.ok{background:#12301f;border-color:#2b6b47}

/* ---------- MODO PRUEBA ----------
   Un punto rojo arriba mientras está grabando, para que nunca te olvides
   de que está prendido. */
.grabando{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.06em;
  margin-left:9px;animation:latir 2.2s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.grabando{animation:none}}
.medida{display:flex;align-items:baseline;gap:7px;padding:9px 0;
  border-bottom:1px solid var(--hair)}
.medida:last-child{border-bottom:0}
.medida .q{flex:1;min-width:0;font-size:13.5px;color:var(--dim)}
.medida .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;
  flex:0 0 auto;letter-spacing:-.01em}
.medida .u{font-size:11px;color:var(--dim2);flex:0 0 auto}

/* ---------- PANTALLA DE JUGAR ----------
   Referente: Hole19. Manda el mapa, las distancias son enormes, y la
   navegación del hoyo vive en una barra fija abajo. Todo lo que no se
   usa con la bola adelante —salida, tarjetas, estacas— sale del camino
   y se abre en una hoja. */

/* el mapa, con las cosas encima.
   El dibujo del hoyo es angosto y alto (es un hoyo visto desde arriba), así que
   el fondo del contenedor va del mismo verde oscuro que el dibujo: si no, quedan
   dos barras negras a los costados y parece un error. */
.mapa{position:relative;background:#0f2318;overflow:hidden}
.mapa .over{position:absolute;display:flex;gap:6px;z-index:2}
.mapa .over.tl{top:10px;left:12px}
.mapa .over.tr{top:10px;right:12px}

/* las tres distancias: el centro manda */
.dists{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:16px 6px 4px}
.dists .d{flex:1 1 0;text-align:center;min-width:0}
.dists .d .k{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:1px}
.dists .d .v{font-weight:800;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;font-size:30px;color:var(--dim)}
.dists .d.c .v{font-size:66px;color:var(--txt)}
.dists .d.c .k{color:var(--acc);font-size:11px}
.dists .u{text-align:center;font-size:11px;color:var(--dim2);padding-bottom:4px}

/* el palo sugerido, una sola línea que se puede tocar */
.palo{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--tint);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;cursor:pointer;font-family:inherit;color:var(--txt)}
.palo .cual{font-size:19px;font-weight:800;letter-spacing:-.01em;flex:0 0 auto}
.palo .det{flex:1;min-width:0;font-size:12px;line-height:1.35;color:var(--dim)}
.palo .fl{color:var(--dim2);font-size:17px;flex:0 0 auto}

/* fila de accesos a las hojas */
.accesos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.accesos button{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:11px 3px;font-family:inherit;font-size:10.5px;font-weight:700;color:var(--dim);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.accesos button .i{font-size:16px}

/* barra fija del hoyo, entre la pantalla y el menú */
#barra{flex:0 0 auto;display:none;align-items:stretch;background:var(--nav);
  border-top:1px solid var(--line)}
#barra.on{display:flex}
#barra .fl{width:54px;flex:0 0 auto;background:transparent;border:0;color:var(--txt);
  font-size:24px;font-family:inherit;cursor:pointer}
#barra .fl:disabled{opacity:.25}
#barra .mid{flex:1;min-width:0;background:transparent;border:0;color:var(--txt);
  font-family:inherit;cursor:pointer;padding:9px 4px;text-align:center}
#barra .mid .h{font-size:15px;font-weight:800;letter-spacing:-.01em}
#barra .mid .s{font-size:10.5px;color:var(--dim2);margin-top:1px}

/* las hojas que se abren desde la pantalla de jugar */
#hoja{position:absolute;inset:0;z-index:60;display:none}
#hoja.on{display:block}
#hoja .fondo{position:absolute;inset:0;background:#000a;backdrop-filter:blur(2px)}
#hoja .panel{position:absolute;left:0;right:0;bottom:0;max-height:86%;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  animation:subir .22s cubic-bezier(.2,.8,.3,1)}
@keyframes subir{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#hoja .panel{animation:none}}
#hoja .cab{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;flex:0 0 auto}
#hoja .cab h3{margin:0;flex:1;font-size:17px}
#hoja .cab button{background:transparent;border:0;color:var(--dim);font-size:22px;
  font-family:inherit;cursor:pointer;padding:0 4px;min-width:44px;min-height:44px}
#hoja .cuerpo{overflow-y:auto;padding:0 18px calc(20px + env(safe-area-inset-bottom))}
#hoja .tirador{width:38px;height:4px;border-radius:99px;background:var(--line);
  margin:9px auto 0;flex:0 0 auto}

/* ---------- instalada en el teléfono ----------
   El marco con bordes redondeados y sombra es para mirarla en una
   computadora. Cuando la app está agregada a la pantalla de inicio
   ocupa la pantalla entera, como cualquier otra app.
   Va al final del archivo a propósito: pisa las reglas de arriba. */
@media (display-mode: standalone){
  body{padding:0;display:block}
  #frame{max-width:none;width:100%;height:100dvh;max-height:none;
    border-radius:0;border:0;box-shadow:none}
  #status{height:auto;padding-top:calc(env(safe-area-inset-top, 0px) + 7px);padding-bottom:7px}
}
/* barra de instalación */
.instalar{display:flex;gap:12px;align-items:center;background:var(--tint);
  border:1px solid var(--acc2);border-radius:var(--r);padding:14px;margin:0 0 14px}
.instalar .txt{min-width:0;flex:1}
.instalar .txt b{display:block;font-size:14px;font-weight:800}
.instalar .txt span{display:block;font-size:12px;color:var(--dim);line-height:1.45;margin-top:2px}
.instalar button{flex:0 0 auto;padding:11px 15px;border-radius:11px;border:0;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:800;background:var(--acc2);color:var(--ink);min-height:44px}
.instalar .x{background:transparent;color:var(--dim2);border:0;padding:8px 4px;font-size:17px;
  cursor:pointer;font-family:inherit;min-width:44px;min-height:44px}
</style>
</head>
<body>
<div id="frame">
  <!-- La barra de estado del teléfono ya está arriba. Acá sólo el nombre del club. -->
  <div id="status"><span id="appname">Trisquelia</span></div>
  <div id="screen"></div>
  <div id="barra"></div>
  <div id="nav"></div>
  <div id="hoja"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   DATOS
   ============================================================ */
const S = {
  tab:'home', mode:'player', hole:1, playing:false, statTab:'general', clubTab:'tee',
  socialTab:'amigos', persona:0, comoQuien:0, tipo:'socio', resultadosPublicos:true, onb:0, onboarded:false, pickedClub:null,
  mat:'', fedOk:false, indexDias:9, chequeoRonda:false,
  dni:'', nsocio:'', padronOk:false, soloSeguir:false, vA:10, vB:18,
  marco:1,              // a quién le llevo la tarjeta yo (índice en el grupo)
  meMarca:2,            // quién lleva la mía
  torneo:true,          // en torneo la tarjeta se cruza y se firma
  certifico:false, firmoLaOtra:false, entregada:false, presento:null, padronEstado:null, hallado:null, codigo:'', email:'', clave:0,
  shotOpen:false, cerrando:false,
  tee:'mixta', vuelta:18,
  user:{name:'Mauro Domina', ini:'MD', hcp:7.4, socio:'—', club:'Trisquelia Golf Club',
        cat:null},   // 'cab' | 'dam' — categoría de juego, define la salida
  hoja:null,             // hoja abierta en la pantalla de jugar
  verDatos:null,         // cuadro de texto con los datos de la prueba
  codigoIn:'', uniendo:false,   // entrar a la ronda de un grupo
  instalarVisto:false,   // cerró el aviso de "agregala al teléfono"
  booked:{}, // "07:30": true
};

/* ================================================================
   ██  CONFIGURACIÓN DEL CLUB  ██
   Todo lo que cambia de un club a otro vive ACÁ y solo acá.
   Para lanzar la app en otro club: se duplica este bloque, se cambian
   los datos, y el resto de la aplicación queda igual.
   ================================================================ */
/* ---------------------------------------------------------------
   PENDIENTE DE CONFIRMAR CON EL CLUB
   (cada punto se arregla cambiando un valor de este mismo bloque)

   [ ] Negras: yardas hoyo por hoyo. Hoy la app reparte las +540 sobre
       las blancas (par 5 +40, par 4 +31, par 3 +20). Cuando llegue la
       medición: borrar "extra/desde" y poner las 18 yardas reales.
   [ ] BLANCAS/AZULES: puse 69.8 / 122 despejándolo de dos datos reales
       (7.4 juega 7 y 6.9 juega 6). Cualquier par entre slope 105-140 y
       rating 68.4-71.0 cumple esos dos; elegí el centro del rango.
       Para cerrarlo del todo alcanza con UN dato más de un handicap alto:
       ¿con cuánto juega alguien de index 20 o 25? O los números oficiales.

/* MIENTRAS NO HAYA SERVIDOR.
   El padrón real tiene 123 socios, pero no puede vivir acá adentro: este archivo
   es público y estaríamos publicando los datos de todo el club en internet.
   Así que cualquier DNI válido entra como "socio de prueba" y la persona escribe
   su propio nombre, para que vea el suyo y no el de otro mientras prueba.
   Cuando esté el servidor, esta función consulta el padrón de verdad y el código
   de verificación sale al contacto que el club ya tiene. */
function buscarEnPadron(d){
  const n = String(d).replace(/\D/g,'');
  const real = PADRON.find(x=>x.dni===n);
  if(real) return real;
  if(n.length < 7) return null;
  return {dni:n, n:null, socio:'—', alta:'—', cuenta:null,
          mail:'prueba@trisquelia.com', tel:null, deMentira:true};
}
function tapar(m){
  if(!m) return '';
  const [u,d] = m.split('@');
  return u.slice(0,2) + '•'.repeat(Math.max(3,u.length-2)) + '@' + d;
}
function taparTel(t){ return t ? '•••• ••• '+t.slice(-3) : ''; }

function crest(size=44){
  const r=Math.max(8,Math.round(size*0.26));
  return `<div style="width:${size}px;height:${size}px;border-radius:${r}px;background:#fff;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.12)">
    <img src="${LOGO_MARK}" alt="Trisquelia" style="width:${Math.round(size*0.86)}px;
      height:${Math.round(size*0.86)}px;object-fit:contain;display:block"></div>`;
}
function crestWord(){
  return `<div style="background:#fff;border-radius:22px;padding:20px 24px;display:inline-block">
    <img src="${LOGO_FULL}" alt="Campo de golf Trisquelia" style="width:250px;display:block"></div>`;
}
/* --- aplica los colores del club a toda la interfaz --- */
function applyTheme(){
  const t=CLUB.theme, r=document.documentElement.style;
  r.setProperty('--acc',t.p);   r.setProperty('--acc2',t.p2);
  r.setProperty('--bg',t.bg);   r.setProperty('--bg2',t.bg2);
  r.setProperty('--card',t.card); r.setProperty('--line',t.line);
  r.setProperty('--dim',t.dim); r.setProperty('--dim2',t.dim2);
  r.setProperty('--gold',t.gold);
  ['ink','tint','nav','hair','rojo'].forEach(k=>{ if(t[k]) r.setProperty('--'+k,t[k]); });
  document.title = CLUB.nombre;
}
/* --- cambiar de club (demo de replicación) --- */
function setClub(id){
  CLUB = CLUBS_DB[id]; COURSE = CLUB.cancha;
  S.user.club = CLUB.nombre;
  applyTheme(); render();
  toast(`Instalación de ${CLUB.corto} cargada`);
}
const tee = () => CLUB.tees.find(t=>t.id===S.tee) || CLUB.tees[0];
/* De qué tee sale cada hoyo. */
function teeDelHoyo(h){
  const t=tee();
  if(t.id==='mixta') return h<=9 ? 'blancas' : 'azules';
  return t.n.toLowerCase();
}

const ETIQ = {PW:'46°', AW:'50°', GW:'52°', SW:'54°', S6:'56°', LW:'58°', L0:'60°', L4:'64°'};

// generamos el historial inicial de forma determinista (como si el jugador ya hubiera cargado golpes)
BAG.forEach((b,i)=>{
  b.shots=[];
  if(b.putter) return;
  for(let k=0;k<b.n;k++){
    const w=((k*37+i*13)%21)-10;               // −10 .. +10
    const flyer=((k*7+i)%11===0)? 6 : 0;
    b.shots.push(Math.round(b.base + w*(b.base/200) + flyer));
  }
});
const avg  = b => b.shots.length ? Math.round(b.shots.reduce((a,c)=>a+c,0)/b.shots.length) : 0;

/* La media que usa el caddie.
   Arranca en la distancia general del palo y cada golpe que el jugador carga la
   corre un poco hacia lo suyo. Sin escalones: a los 8 golpes pesa mitad y mitad,
   a los 25 el número ya es prácticamente el de él.
   Esto evita el problema de recomendar con dos golpes cargados, que puede estar
   cualquier cosa, y también el de ignorar 30 golpes propios por no llegar a un
   número redondo. */
const PESO_BASE = 8;
const media = b => {
  if(!b) return 0;
  const n = b.shots.length, suma = b.shots.reduce((a,c)=>a+c,0);
  return Math.round((b.base*PESO_BASE + suma) / (PESO_BASE + n));
};
/* En qué etapa está ese palo, para poder decirlo sin mentir. */
function confianza(b){
  const n = b ? b.shots.length : 0;
  if(n === 0)  return {nivel:'estimado',  txt:'estimado',                 clase:'dim2'};
  if(n < 5)    return {nivel:'arrancando',txt:`arrancando · ${n} golpe${n>1?'s':''}`, clase:'dim2'};
  if(n < 20)   return {nivel:'afinando',  txt:`afinándose · ${n} golpes`, clase:'dim'};
  return              {nivel:'tuyo',      txt:`tuyo · ${n} golpes`,       clase:'acc'};
}
const best = b => b.shots.length ? Math.max(...b.shots) : 0;
const disp = b => { if(b.shots.length<2) return 0; const m=avg(b);
  return Math.round(Math.sqrt(b.shots.reduce((a,c)=>a+(c-m)**2,0)/b.shots.length)); };

/* Acá vivía `deltas()`, que repartía a ojo las yardas extra de una salida
   sin medir. Ya no hace falta: las tres salidas tienen yardas propias, las
   negras medidas con GPS el 5/8/2026. Si vuelve a hacer falta, está en el
   historial de git. */
/* ---------- MEDIDA Y HOMOLOGACIÓN NO SON LO MISMO ----------
   MEDIDA: sabemos cuántas yardas tiene. Las negras sí lo están, con GPS.
   HOMOLOGADA: tiene rating y slope oficiales de la federación. Las negras
   NO, y por eso no dan handicap de cancha propio.
   Qué hace el club con eso: el que sale de negras anota en el casillero
   de blancas la ida y de azules la vuelta, así que su handicap sale de esa
   tabla. La app hace lo mismo en vez de mostrar un hueco. */
const homologada = t => !!(t && t.r && t.s);
/* De qué salida sale el handicap de cancha de esta salida. */
const teeDelHcp  = t => homologada(t) ? t
  : (CLUB.tees.find(x => homologada(x)) || t);
/* Cómo se escribe el rating y el slope de una salida, sin mentir ni dejar huecos. */
const ratingTxt  = t => homologada(t) ? `${t.r}/${t.s}`
  : `sin homologar · handicap de ${teeDelHcp(t).n.toLowerCase()}`;
const sinMedida = t => !t.y && !t.f;
function yardaDe(t,h){
  if(t.y) return t.y[h-1];
  if(t.f) return Math.round(COURSE.holes[h-1].y * t.f);
  return null;
}
function yards(h){ return yardaDe(tee(), h); }
/* Para dibujar el hoyo hace falta un largo sí o sí: si la salida no está medida,
   usamos la de blancas/azules sólo para la forma del dibujo, nunca para mostrar. */
const largoDibujo = h => yards(h) ?? yardaDe(CLUB.tees.find(t=>t.id==='mixta'), h);
/* ¿este hoyo se juega del mismo tee que su par de la otra vuelta? */
function repiteTee(h){
  const t=tee(); if(!t.mismoTee) return false;
  return t.mismoTee[CLUB.fisico[h-1]-1];
}
const parTotal = () => COURSE.holes.reduce((a,h)=>a+h.par,0);
/* Handicap de cancha = Index × (Slope/113) + (Rating − Par).
   Es la fórmula del WHS. Cuando tengamos la tabla oficial del club
   se compara contra esta y se ajusta si hace falta. */
function hcpCancha(index, t, hoyos){
  /* Si la salida no está homologada, el handicap sale de la que sí lo está.
     Es lo que el club ya hace en la tarjeta de papel. */
  t = teeDelHcp(t || tee()); hoyos = hoyos || 18;
  if(!t.r) return null;                    // ningún tee homologado: no inventamos
  const f = hoyos===9 ? 0.5 : 1;
  const par9 = COURSE.holes.slice(0,9).reduce((a,h)=>a+h.par,0);
  const par_ = hoyos===9 ? par9 : parTotal();
  return Math.round(index*f*(t.s/113) + (t.r*f - par_));
}
/* hace cuántos días se actualizó el index */

  : null;

function stableford(s,p,hcp,phcp){ // puntos stableford netos
  const extra = Math.floor(phcp/18) + (hcp <= (phcp%18) ? 1 : 0);
  const net = s - extra; const d = net - p;

function clubFor(d){

  let bb=l[0],diff=1e9;

}

/* ---------- dónde está el jugador ---------- */
let POS = null;                 // {lat, lon, acc} o null si todavía no enganchó
let POS_T = 0;                  // cuándo llegó esa posición
let POS_ERR = null;

/* Una posición de hace un minuto no es dónde estás parado. Antes, cuando el
   GPS fallaba, `POS` se quedaba con la última lectura y la app seguía
   diciendo "GPS ±4 m" y midiendo contra una coordenada congelada: el error
   nunca se veía. Dar una distancia falsa con cara de real es lo peor que
   puede hacer esta app. Después de 30 segundos sin lectura nueva, no hay
   posición. */
const POS_VENCE = 30000;
const gpsVivo = () => !!POS && (Date.now() - POS_T) < POS_VENCE;

function arrancarGPS(){
  if(!navigator.geolocation){ POS_ERR='Este teléfono no tiene GPS.'; refrescarGPS(); return; }
  navigator.geolocation.watchPosition(
    p => { POS = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
           POS_T = Date.now(); POS_ERR = null; refrescarGPS(); },
    e => { /* Permiso negado: no hay posición, y la vieja tampoco vale. */
           if(e.code===1){ POS = null; POS_T = 0; }
           POS_ERR = e.code===1 ? 'No diste permiso de ubicación.'
                   : e.code===2 ? 'Sin señal. Salí a cielo abierto.'
                   : 'El GPS tardó demasiado.';
           refrescarGPS(); },
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
  /* Si el navegador no llama a NINGUNO de los dos callbacks —pasa cuando el
     permiso quedó en "preguntar" y nadie contestó— la app diría "Buscando
     señal" para siempre. A los 12 segundos lo decimos. `medir.html` ya tenía
     esta red; acá faltaba. */
  setTimeout(() => {
    if(!POS && !POS_ERR){
      POS_ERR = 'No se pudo tomar la ubicación. Fijate que esté prendida.';
      refrescarGPS();
    }
  }, 12000);
}

function refrescarGPS(){
  if(!S.onboarded) return;
  if(S.tab === 'play') return pintarDistancias();
  if(S.tab !== 'arranque') return;      /* en el resto de la app no cambia nada */
  /* Nunca redibujar mientras alguien escribe: en esta pantalla se tipea el
     código de la ronda del grupo y `render()` se lo borraría. */
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  render();
}
/* ---------- ¿en qué tee estás parado? ----------
   Las 65 coordenadas medidas a pie dan algo que ninguna app global puede
   tener en esta cancha: saber en qué hoyo está el socio. Y sirve para el
   momento exacto en que quiere anotar, porque no anota en el green — camina
   al tee siguiente y anota ahí, para no frenar la cancha.

   Los números de la cancha, medidos sobre esas coordenadas:
     · entre tees de hoyos DISTINTOS, el par más cercano está a 80 m;
     · el aprieto real es el green anterior: el tee del 2 está a 25 m del
       fondo del green 1.

   Por eso el radio de 30 m es holgado para no confundir un hoyo con otro
   (haría falta bajar de 40), y la confusión con el green se resuelve sin
   radio: se pide estar MÁS CERCA del tee que de cualquier green. El que está
   puteando en el 1 está más cerca del green; el que caminó al tee del 2 está
   más cerca del tee. La misma regla separa los dos casos.

   Nunca cambia de hoyo sola. Garmin lo hace y hay gente que subió tarjetas
   incompletas sin enterarse: acá se sugiere y decide el socio. */
const TEE_CERCA = 30;               // metros

function hoyoDelTee(){
  const g = CLUB.geo;
  if(!gpsVivo() || !g || !g.tees) return null;
  const p = [POS.lat, POS.lon];

  let cerca = null;                 // el tee más cercano, sea de la marca que sea
  for(const fis of Object.keys(g.tees))
    for(const c of Object.values(g.tees[fis])){
      const d = metros(p, c);
      if(!cerca || d < cerca.d) cerca = { fis:+fis, d };
    }
  if(!cerca || cerca.d > TEE_CERCA) return null;

  let green = Infinity;             // el green más cercano, el que sea
  for(const k of Object.keys(g.greens)){
    const gr = g.greens[k];
    for(const c of [gr.f, gr.c, gr.b]) green = Math.min(green, metros(p, c));
  }
  if(green <= cerca.d) return null; // estás en el green, no en el tee

  /* Un hoyo físico es dos hoyos de la tarjeta (ida y vuelta). Elegimos el que
     tenga sentido según dónde venía el socio. */
  const cand = CLUB.fisico.map((f,i) => f === cerca.fis ? i+1 : null).filter(Boolean)
                          .filter(h => h <= S.vuelta);
  if(!cand.length) return null;
  const meta = S.hole + 1;
  return cand.reduce((a,b) => Math.abs(b-meta) < Math.abs(a-meta) ? b : a);
}

/* Qué proponerle, o null si no hay nada que proponer. */
function sugerenciaTee(){
  if(!S.playing || S.cerrando || S.hoja) return null;
  const h = hoyoDelTee();
  if(h === null || h === S.hole) return null;
  if(S.teeVisto === h) return null;              // ya dijo que no
  return { hoyo:h, cerrar: R.scores[S.hole] === undefined };
}
function irAlTeeSugerido(){
  const s = sugerenciaTee();

  if(s.cerrar) return abrirCierre(S.hole);       // primero se cierra el que venía
  S.hole = s.hoyo; S.teeVisto = null;
  render(); $('#screen').scrollTop = 0;
  toast(`Vamos al hoyo ${s.hoyo}`);
}

/* metros entre dos coordenadas */
function metros(a,b){
  const R_=6371000, f1=a[0]*Math.PI/180, f2=b[0]*Math.PI/180;
  const df=(b[0]-a[0])*Math.PI/180, dl=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return 2*R_*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
const aYardas = m => Math.round(m*1.09361);
const greenDe = h => CLUB.geo && CLUB.geo.greens[CLUB.fisico[h-1]];

/* Distancia al green.
   Con GPS enganchado: medida real desde donde estás.
   Sin GPS: se estima con el largo del hoyo menos lo que llevás pegado. */
function gps(h){
  const g = greenDe(h);
  if(GPS_REAL && gpsVivo() && g){
    const p=[POS.lat,POS.lon];
    return {front:aYardas(metros(p,g.f)), mid:aYardas(metros(p,g.c)),
            back:aYardas(metros(p,g.b)), real:true, acc:Math.round(POS.acc),
            desdeTee:!(R.shots[h]||[]).length, dados:0};
  }
  const largo = yards(h);
  const dados = (R.shots[h]||[]).reduce((a,x)=>{
    const b = BAG.find(z=>z.c===x.c);
    return a + ((b && b.putter) || x.d==null ? 0 : x.d);
  }, 0);
  if(largo==null) return {front:null, mid:null, back:null, sinMedir:true,
                          desdeTee:dados===0, dados};
  const centro = Math.max(0, largo - dados);
  const prof = par(h)===3 ? 9 : PROF_GREEN;
  return {front: Math.max(0,centro-prof), mid: centro, back: centro+prof,
          desdeTee: dados===0, dados, esperandoGPS: GPS_REAL && !gpsVivo()};
}
/* Refresca sólo los tres números, sin redibujar la pantalla entera:
   el GPS avisa una vez por segundo y no queremos que parpadee todo. */
function pintarDistancias(){
  const g = gps(S.hole);
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent = v ?? '—';};
  set('dFront',g.front); set('dMid',g.mid); set('dBack',g.back);
  const e=document.getElementById('gpsPill');
  if(e) e.textContent = g.real ? `GPS ±${g.acc} m` : (POS_ERR || 'Buscando señal…');
  const dg=document.getElementById('dGolpe');
  if(dg){ const v=desdeElGolpe(S.hole); dg.textContent = v ?? '—'; }
  pintarAvisoTee();
}
/* qué palo tiene sentido: en la salida de un par 4 o 5, el más largo que
   tengas; en el resto, el que más se acerque a lo que falta. */
function paloSugerido(h){
  const g = gps(h);
  if(g.sinMedir) return {club:null, salida:g.desdeTee, dist:null};
  if(g.desdeTee && par(h)>3){
    const largos = inBag().slice().sort((a,b)=>media(b)-media(a));
    if(!largos.length) return {club:null, salida:true, dist:g.mid};
    return {club:largos[0], salida:true, dist:g.mid};
  }
  return {club:clubFor(g.mid), salida:false, dist:g.mid};
}

/* ---------- DIBUJO DEL HOYO ----------
   Forma de cada una de las 9 canchas, armada con las vistas de la cancha
   y las correcciones que fue haciendo el club. Las distancias son las
   reales de la tarjeta; los obstáculos van ubicados por yardas desde el
   tee. Queda exacto cuando estén las coordenadas del trazado. */
const CANCHA = {
  1:{dog: 0.10, ancho:1.00, casas:'der',
     haz:[{t:'b',d:250,lado:-1,w:9}],
     gb:[{a:210,r:1},{a:330,r:1}]},
  2:{dog: 0.00, ancho:1.05, casas:'der',
     haz:[{t:'a',d:40,lado:-1,w:16},{t:'b',d:60,lado:0,w:13},{t:'b',d:290,lado:1,w:9}],
     gb:[{a:200,r:1},{a:150,r:1.1}]},
  3:{dog:-0.25, ancho:1.00, casas:'der',
     haz:[{t:'a',d:270,lado:-1,w:20},{t:'b',d:150,lado:1,w:8}],
     gb:[{a:180,r:1},{a:250,r:1},{a:320,r:.9}]},
  4:{dog: 0.00, ancho:0.70,
     haz:[{t:'a',d:70,lado:-1,w:17},{t:'a',d:80,lado:1,w:19}],
     gb:[{a:150,r:1.1},{a:30,r:1}]},
  5:{dog: 0.12, ancho:1.00,
     haz:[{t:'a',d:140,lado:-1,w:21},{t:'a',d:150,lado:1,w:18},{t:'a',d:60,lado:1,w:11}],
     gb:[{a:20,r:1}]},
  6:{dog:-0.15, ancho:0.95, ob:true,
     haz:[{t:'b',d:200,lado:-1,w:8},{t:'b',d:255,lado:-1,w:8}],
     gb:[{a:190,r:1},{a:240,r:.9}]},
  7:{dog: 0.10, ancho:0.95, camino:'der',
     haz:[{t:'b',d:150,lado:0,w:10},{t:'a',d:50,lado:-1,w:13}],
     gb:[{a:170,r:1.1}]},
  8:{dog: 0.00, ancho:0.65,
     haz:[],
     gb:[{a:130,r:1.1},{a:210,r:1},{a:300,r:1.2}]},
  9:{dog: 0.15, ancho:1.05,
     haz:[{t:'a',d:120,lado:-1,w:15},{t:'b',d:280,lado:1,w:9}],
     gb:[{a:180,r:1},{a:0,r:1.15}]}
};
function holeSVG(h){
  const c   = CANCHA[CLUB.fisico[h-1]] || {dog:0,ancho:1,haz:[],gb:[]};
  const p   = par(h), W=200, H=312, base=272, gy=54;
  const largoRef = 545;
  const yDe = v => base - (v/largoRef)*(base-gy);
  const tAct = tee(), largo = largoDibujo(h), yTee = yDe(largo);
  // el fairway va del tee al green, curvado según el dogleg
  const cx  = 100 + c.dog*32, anc = 25*c.ancho;
  const yPos = d => yTee - (d/largoRef)*(base-gy);      // yardas desde el tee
  const lado = (l,y) => 100 + c.dog*32*(1-Math.abs((y-gy)/(base-gy))*.6) + l*anc*1.15;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:214px;display:block">
    <defs>
      <linearGradient id="fw${h}" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#1c4d32"/><stop offset="1" stop-color="#2f7a4f"/></linearGradient>
      <radialGradient id="gr${h}"><stop offset="0" stop-color="#63e79a"/><stop offset="1" stop-color="#3ab96d"/></radialGradient>
      <linearGradient id="ag${h}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2f6fd0"/><stop offset="1" stop-color="#1d4a95"/></linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="#0f2318"/>

    <!-- rough -->
    <path d="M${100-anc-15} ${base+18} Q ${cx-anc-21} ${(base+gy)/2} ${100-anc-7} ${gy+16}
             L ${100+anc+7} ${gy+16} Q ${cx+anc+21} ${(base+gy)/2} ${100+anc+15} ${base+18} Z"
          fill="#173f28" opacity=".7"/>
    <!-- fairway -->
    <path d="M${100-anc} ${base+10} Q ${cx-anc} ${(base+gy)/2} ${100-anc*0.72} ${gy+20}
             L ${100+anc*0.72} ${gy+20} Q ${cx+anc} ${(base+gy)/2} ${100+anc} ${base+10} Z"
          fill="url(#fw${h})"/>

    ${c.casas?`<g opacity=".5">${[0,1,2,3,4].map(k=>{
      const y=gy+26+k*40, x=c.casas==='der'?W-13:6;
      return `<rect x="${x}" y="${y}" width="9" height="7" rx="1.4" fill="#8d8377"/>`;}).join('')}</g>`:''}
    ${c.camino?`<path d="M${W-10} ${gy} L${W-16} ${H}" stroke="#a08f76" stroke-width="4" opacity=".6"/>`:''}
    ${c.ob?`<line x1="8" y1="${gy-19}" x2="${W-8}" y2="${gy-19}" stroke="#e0e0e0"
       stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>
      <text x="${W-10}" y="${gy-23}" fill="#cfd8de" font-size="7" text-anchor="end"
       font-family="sans-serif">fuera de límites</text>`:''}

    <!-- obstáculos, ubicados por yardas desde el tee -->
    ${(c.haz||[]).filter(z=>z.d<largo).map(z=>{
      const y=yPos(z.d), x=lado(z.lado*0.72, y);
      return z.t==='a'
        ? `<ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.62}" fill="url(#ag${h})"/>
           <ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.62}" fill="none" stroke="#7fb2ef" stroke-width=".6" opacity=".7"/>`
        : `<ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.6}" fill="#e6d9bb"/>`;
    }).join('')}

    <!-- bunkers del green -->
    ${(c.gb||[]).map(g=>{
      const a=g.a*Math.PI/180, rx=(p===3?26:31)+7;
      return `<ellipse cx="${100+rx*Math.cos(a)*0.92}" cy="${gy+(p===3?18:22)*Math.sin(a)*1.15}"
        rx="${8*g.r}" ry="${5.4*g.r}" fill="#e6d9bb"/>`;}).join('')}

    <!-- green -->
    <ellipse cx="100" cy="${gy}" rx="${p===3?25:30}" ry="${p===3?18:22}" fill="url(#gr${h})"/>
    <ellipse cx="100" cy="${gy}" rx="${p===3?25:30}" ry="${p===3?18:22}" fill="none"
             stroke="#9ff5c2" stroke-width=".7" opacity=".45"/>
    <circle cx="100" cy="${gy+2}" r="2.4" fill="#0b1710"/>
    <path d="M100 ${gy+2} v-17 l10 4.5 -10 4.5" fill="#c8202e" stroke="#c8202e" stroke-width="1"/>

    <!-- las salidas, cada una a su distancia real -->
    ${CLUB.tees.filter(t=>yardaDe(t,h)!=null).map(t=>{
      const v=yardaDe(t,h), y=yDe(v), act=t.id===tAct.id;
      const nom = t.id==='mixta' ? (h<=9?'Blancas':'Azules') : t.n;
      const col = t.id==='mixta' ? (h<=9?'#f5f5f5':'#3b82f6') : t.c;
      return `<g opacity="${act?1:.5}">
        <rect x="${100-(act?11:8)}" y="${y}" width="${act?22:16}" height="${act?7:5}" rx="2.5"
              fill="${col}" stroke="#0008" stroke-width=".6"/>
        <text x="${100+(act?16:13)}" y="${y+(act?6:5)}" fill="${act?'#e8eef6':'#93a9c4'}"
              font-size="${act?8:7}" font-family="sans-serif" font-weight="${act?'700':'400'}">
          ${nom} ${v}</text></g>`;}).join('')}

    <!-- la estaca de 150 -->
    ${largo>170?(()=>{const y=yPos(largo-150);
      return `<line x1="${lado(-1,y)}" y1="${y}" x2="${lado(1,y)}" y2="${y}"
        stroke="#f5f5f5" stroke-width=".8" stroke-dasharray="3 3" opacity=".5"/>
      <circle cx="${lado(1,y)}" cy="${y}" r="2.6" fill="#f5f5f5" opacity=".85"/>
      <text x="${lado(1,y)+6}" y="${y+3}" fill="#dbe7f0" font-size="7" font-family="sans-serif">150</text>`;})():''}

    <text x="8" y="${H-8}" fill="#5f7d90" font-size="7.5" font-family="sans-serif">
      cancha ${CLUB.fisico[h-1]} · distancias reales · forma aproximada</text>
  </svg>`;
}

   REGISTRAR UN GOLPE
   Un solo toque: elegís el palo y la app se guarda dónde estás.
   Cuando registrás el siguiente, mide entre los dos puntos y te dice
   cuánto voló el anterior. El jugador nunca escribe una distancia.
   Registrar es opcional: se puede jugar la vuelta entera sin tocar nada.
   ============================================================ */
const FW = [['fw','Fairway','✓'],['izq','Izquierda','←'],['der','Derecha','→'],
            ['largo','Largo','↑'],['corto','Corto','↓']];

/* el último golpe registrado que todavía no tiene distancia */
const golpeAbierto = h => (R.shots[h]||[]).find(x=>x.d==null && x.lat!=null);

/* cuánto llevás desde donde pegaste — se actualiza mientras caminás */
function desdeElGolpe(h){
  const a = golpeAbierto(h);
  if(!a || !gpsVivo()) return null;
  return aYardas(metros([a.lat,a.lon],[POS.lat,POS.lon]));
}

function registrarGolpe(h, club){
  const b = palo(club);
  R.shots[h] = R.shots[h] || [];
  // el golpe anterior queda medido con lo que caminaste
  cerrarGolpeAbierto(h);
  R.shots[h].push({c:club, lat:gpsVivo()?POS.lat:null, lon:gpsVivo()?POS.lon:null, d:null});
  S.shotOpen = false;
  toast(gpsVivo() ? `${etiq(b)} registrado. Cuando llegues a la bola te digo cuánto voló`
            : `${etiq(b)} registrado, sin GPS no puedo medir la distancia`);
  render();
}
/* Cierra el golpe pendiente midiendo desde donde se pegó hasta donde estás.
   Sólo cuenta para las estadísticas si es un palo que mide distancia. */
function cerrarGolpeAbierto(h){
  const a = golpeAbierto(h);
  if(!a || !gpsVivo()) return null;
  const d = aYardas(metros([a.lat,a.lon],[POS.lat,POS.lon]));
  if(d < 5) return null;                       // no te moviste: no fue un golpe
  a.d = d;
  const b = palo(a.c);
  if(b && !b.putter) b.shots.push(d);
  return d;
}
function borrarGolpe(h,i){
  const g = R.shots[h][i], b = palo(g.c);
  if(b && g.d!=null){ const k=b.shots.lastIndexOf(g.d); if(k>-1) b.shots.splice(k,1); }
  R.shots[h].splice(i,1);
  render();
}

function shotPanel(h){
  const list = R.shots[h] || [];
  const enCurso = golpeAbierto(h);
  const llevas = desdeElGolpe(h);
  return `
  <div class="card">
    <div class="between"><h3 style="margin:0">Tus palos en el hoyo ${h}</h3>
      <span class="pill ${list.length?'':'gold'}">${list.length}</span></div>
    <div class="dim2" style="font-size:11px;margin-top:2px">Es opcional. Sirve para armar tus distancias reales.</div>

    ${enCurso ? `
    <div style="background:var(--tint);border-radius:13px;padding:14px;margin-top:11px;text-align:center">
      <div class="lbl">Pegaste con el ${etiq(palo(enCurso.c))} · llevás caminando</div>
      <div class="big acc" id="dGolpe" style="font-size:38px;margin:2px 0">${llevas ?? '—'}</div>
      <div class="dim2" style="font-size:11px">yardas. Cuando llegues a la bola, ese es tu golpe.</div>
    </div>` : ''}

    ${list.length ? `<div style="margin-top:10px">${list.map((g,i)=>`
      <div class="item" style="padding:9px 0">
        <div class="ico" style="font-size:13px;font-weight:800">${i+1}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${etiq(palo(g.c))}</div>
          <div class="dim" style="font-size:12px">${g.d!=null ? g.d+' yds' : 'midiendo…'}</div></div>
        <button class="chip" style="padding:6px 10px" onclick="borrarGolpe(${h},${i})">✕</button>
      </div>`).join('')}</div>` : ''}

    ${S.shotOpen ? `
    <div class="sep"></div>
    <div class="lbl" style="margin-bottom:8px">¿Con qué palo pegaste?</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
      ${BAG.filter(b=>b.on).map(b=>
        `<button class="chip" style="padding:12px 2px;font-size:12px"
          onclick="registrarGolpe(${h},'${b.c}')">${etiq(b)}</button>`).join('')}
    </div>
    <button class="btn ghost sm" style="margin-top:10px" onclick="S.shotOpen=false;render()">Cancelar</button>`
    : `<button class="btn sm" style="margin-top:12px" onclick="S.shotOpen=true;render()">
        ${list.length?'+ Otro palo':'+ Registrar el palo'}</button>`}
  </div>`;
}

/* ============================================================
   CERRAR EL HOYO
   Todo junto y al final, como en la tarjeta de papel: golpes, putts,
   bunker, penalidades, dónde quedó la salida, y el score del compañero
   al que le llevás la tarjeta.
   El score NO sale de contar los palos registrados: registrar palos es
   opcional y sirve para otra cosa.
   ============================================================ */
function abrirCierre(h){
  cerrarGolpeAbierto(h);          // el último palo queda medido hasta acá
  S.cerrando = true; S.shotOpen = false; S.cierrePaso = 1;
  render(); $('#screen').scrollTop = 0;
}
function fijar(campo, v){
  const h = S.hole;
  if(campo==='sc'){ R.scores[h]=v; S.playing=true;
    if(R.putts[h]!=null && R.putts[h]>v) R.putts[h]=v; }
  else if(campo==='putts'){ R.putts[h]=v; }
  else if(campo==='bunker'){ R.bunker[h]=v; }
  else if(campo==='penal'){ R.penal[h]=v; }
  else if(campo==='fw'){ R.fw[h] = R.fw[h]===v ? null : v; }
  else if(campo==='otro'){ OTRO[h]=v; }
  render();
}
/* El green en regulación NO se pregunta: se calcula. Llegar en regulación es
   alcanzar el green en par−2 golpes, y los golpes hasta el green son los
   totales menos los putts. Como el socio carga putts siempre, sale solo — y
   de paso se va el bug de que el botón decía "No" sin que nadie lo tocara,
   indistinguible de un No de verdad. Sin putts no se calcula y no se guarda:
   la app no inventa. */
function girDe(h){
  const s = R.scores[h], pu = R.putts[h];
  if(s === undefined || pu === undefined || pu === null) return null;
  return (s - pu) <= (par(h) - 2);
}
function pasoMarcador(){
  if(R.scores[S.hole]===undefined){ toast('Poné cuántos golpes hiciste'); return; }
  S.cierrePaso = 2; render(); $('#screen').scrollTop = 0;
}
function cerrarHoyo(){
  const h = S.hole;
  if(R.scores[h]===undefined){ toast('Poné cuántos golpes hiciste'); return; }
  const g = girDe(h);
  if(g === null) delete R.gir[h]; else R.gir[h] = g;
  anotarEnLaNube(h);          // si estás jugando con el grupo, se manda solo
  S.cerrando = false; S.cierrePaso = 1; S.teeVisto = null;
  if(h < S.vuelta){ S.hole = h+1; toast(`Hoyo ${h} cerrado · vamos al ${h+1}`); }
  else toast('Vuelta terminada');
  render(); $('#screen').scrollTop = 0;
}

/* ============================================================
   CERRAR EL HOYO
   El socio no anota en el green: camina al tee siguiente y anota ahí, antes
   de salir, para no frenar la cancha. Eso manda todo el diseño de esta
   pantalla: entra entera sin scrollear en un teléfono de 360×640, el botón
   de guardar queda siempre a la vista, y la tarjeta del que marcás es un
   segundo paso — meterla acá abajo obligaba a scrollear dos pantallas.
   ============================================================ */
function panelCierre(){
  if(S.cierrePaso === 2 && S.torneo) return panelMarcador();
  const h = S.hole, p = par(h), sc = R.scores[h], gir = girDe(h);
  const nums = n => Array.from({length:n}, (_,i)=>i+1);
  const chip = (campo,v,txt,act) => `<button class="chip ${act?'on':''}"
    style="padding:12px 2px;font-size:14px;font-weight:800" onclick="fijar('${campo}',${v})">${txt}</button>`;
  const fila = n => `display:grid;grid-template-columns:repeat(${n},1fr);gap:7px`;
  return `<div class="fade">
  <div class="pad" style="padding-top:10px">
    <div class="row" style="margin-bottom:12px">
      <button class="arrow" onclick="S.cerrando=false;render()">‹</button>
      <div style="min-width:0"><div style="font-weight:800;font-size:17px">Hoyo ${h} · par ${p}</div>
        <div class="dim" style="font-size:12px">${yards(h) ?? '—'} yds · ${tee().n.toLowerCase()}</div></div>
    </div>

    <div class="bloque">
      <div class="lbl" style="display:flex;justify-content:space-between;gap:8px">
        <span>¿Cuántos golpes?</span>
        ${sc!==undefined?`<span class="acc" style="text-transform:none;letter-spacing:0">${
          sc-p===0?'Par':sc-p===-1?'Birdie':sc-p<=-2?'Eagle':sc-p===1?'Bogey':'+'+(sc-p)+' al par'}</span>`:''}
      </div>
      <div style="${fila(5)}">${nums(10).map(v=>chip('sc',v,v,sc===v)).join('')}</div>
    </div>

    <div class="bloque">
      <div class="lbl" style="display:flex;justify-content:space-between;gap:8px">
        <span>Putts</span>
        ${gir===null?'':`<span style="text-transform:none;letter-spacing:0;color:${
          gir?'var(--acc)':'var(--dim2)'}">${gir?'en regulación':'fuera de regulación'}</span>`}
      </div>
      <div style="${fila(5)}">${[0,1,2,3,4].map(v=>chip('putts',v,v===4?'4+':v,R.putts[h]===v)).join('')}</div>
    </div>

    <div class="bloque">
      <div class="lbl">Bunker</div>
      <div class="grid4">${[0,1,2,3].map(v=>chip('bunker',v,v===3?'3+':v,R.bunker[h]===v)).join('')}</div>
    </div>

    <div class="bloque">
      <div class="lbl">Penalidades</div>
      <div class="grid4">${[0,1,2,3].map(v=>chip('penal',v,v===3?'3+':v,R.penal[h]===v)).join('')}</div>
    </div>

    ${p>3?`
    <div class="bloque">
      <div class="lbl">¿Dónde quedó tu salida?</div>
      <div style="${fila(5)}">
        ${FW.map(([k,l,f])=>`<button class="chip ${R.fw[h]===k?'on':''}"
          style="padding:8px 2px" onclick="fijar('fw','${k}')">
          <div style="font-size:18px;line-height:1.1">${f}</div>
          <div style="font-size:10px">${l}</div></button>`).join('')}
      </div>
    </div>`:''}

    <div class="guardar">
      <button class="btn" onclick="${S.torneo?'pasoMarcador()':'cerrarHoyo()'}">
        ${S.torneo ? 'Seguir · la tarjeta de '+GROUP()[S.marco].n
          : S.hole < S.vuelta ? 'Guardar y pasar al hoyo '+(S.hole+1) : 'Guardar y terminar la vuelta'}</button>
    </div>
  </div></div>`;
}

/* El segundo paso: la tarjeta del que marcás. Va aparte y no abajo del
   primero porque es otro acto mental —dejás de ser jugador y pasás a ser
   marcador— y porque juntos no entraban en una pantalla. */
function panelMarcador(){
  const h = S.hole, otro = GROUP()[S.marco];
  const nums = n => Array.from({length:n}, (_,i)=>i+1);
  return `<div class="fade">
  <div class="pad" style="padding-top:10px">
    <div class="row" style="margin-bottom:12px">
      <button class="arrow" onclick="S.cierrePaso=1;render()">‹</button>
      <div style="min-width:0"><div style="font-weight:800;font-size:17px">Hoyo ${h} · par ${par(h)}</div>
        <div class="dim" style="font-size:12px">Tu hoyo quedó en ${R.scores[h]}</div></div>
    </div>

    <div class="card" style="border-color:var(--acc2);background:var(--tint)">
      <div class="row" style="align-items:flex-start;margin-bottom:11px">
        <div class="avatar">${esc(otro.i)}</div>
        <div style="min-width:0"><div style="font-weight:800;font-size:15px">La tarjeta de ${esc(otro.n)}</div>
          <div class="dim" style="font-size:12px">Sos su marcador: anotá lo que hizo <b>él</b> en el hoyo ${h}.</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">
        ${nums(10).map(v=>`<button class="chip ${OTRO[h]===v?'on':''}"
          style="padding:12px 2px;font-size:14px;font-weight:800" onclick="fijar('otro',${v})">${v}</button>`).join('')}
      </div>
    </div>

    <div class="guardar">
      <button class="btn" onclick="cerrarHoyo()">
        ${S.hole < S.vuelta ? 'Guardar y pasar al hoyo '+(S.hole+1) : 'Guardar y terminar la vuelta'}</button>
    </div>
  </div></div>`;
}

/* ============================================================
   PANTALLA DE JUGAR
   Referente: Hole19. Lo que se mira con la bola adelante va primero y
   grande —el mapa y las tres distancias—, la acción está siempre a un
   toque, y el hoyo se cambia desde una barra fija abajo.
   Todo lo demás (salida, tarjetas, estacas) se abre en una hoja y no
   ocupa lugar en el camino.
   ============================================================ */
function vPlay(){
  if(S.cerrando) return panelCierre();
  const h = S.hole, p = par(h), g = gps(h), rec = clubFor(g.mid), sc = R.scores[h];
  const conf = rec ? confianza(rec) : null;

  return `<div class="fade">

  <div id="avisoTee">${avisoTeeHTML()}</div>

  <div class="mapa">
    ${holeSVG(h)}
    <div class="over tl"><span class="pill ${g.real?'':'gold'}" id="gpsPill">${
      g.real ? `GPS ±${g.acc} m` : (POS_ERR || 'Buscando señal…')}</span></div>
    ${rec?`<div class="over tr"><span class="pill blue">🎯 ${etiq(rec)}</span></div>`:''}
  </div>

  <div class="pad">
    <div class="card" style="padding:6px 10px 12px">
      <div class="dists">
        <div class="d"><div class="k">Frente</div><div class="v" id="dFront">${g.front ?? '—'}</div></div>
        <div class="d c"><div class="k">Al centro</div><div class="v" id="dMid">${g.mid ?? '—'}</div></div>
        <div class="d"><div class="k">Fondo</div><div class="v" id="dBack">${g.back ?? '—'}</div></div>
      </div>
      <div class="u">yardas ${g.real ? 'desde donde estás parado' : 'estimadas'}</div>
      ${g.esperandoGPS && !POS_ERR?`<div class="dim" style="background:var(--tint);border-radius:11px;
        padding:9px 12px;margin-top:8px;font-size:12px">
        Buscando el GPS. Mientras tanto es una estimación con el largo del hoyo;
        en cuanto enganche pasan a ser tu distancia real.</div>`:''}
      ${!g.real && POS_ERR?`<div style="background:#3a3117;border:1px solid #5c4a1f;border-radius:11px;
        padding:10px 12px;margin-top:8px;font-size:12px">
        <b class="gold">Se perdió la ubicación</b>
        <div class="dim" style="margin-top:3px;line-height:1.5">${POS_ERR}
        Las distancias de arriba son estimadas. Tu tarjeta se sigue anotando igual.</div></div>`:''}
      ${g.sinMedir?`<div class="dim" style="background:var(--tint);border-radius:11px;
        padding:9px 12px;margin-top:8px;font-size:12px">
        Sin distancias en este hoyo: falta la medición y el GPS todavía no enganchó.</div>`:''}
    </div>

    ${rec ? `<button class="palo" onclick="go('bag')">
      <span class="cual">${etiq(rec)}</span>
      <span class="det"><b style="color:var(--txt)">${media(rec)} yds</b> de media ·
        <span class="${conf.clase}">${conf.txt}</span>${
        conf.nivel==='tuyo' ? ` · dispersión ±${disp(rec)}` : ''}</span>
      <span class="fl">›</span></button>`
    : `<button class="palo" onclick="go('bag')">
      <span class="cual">🎒</span>
      <span class="det">Armá tu bolsa y te digo con qué palo pegar en cada distancia.</span>
      <span class="fl">›</span></button>`}

    <div style="height:12px"></div>
    ${shotPanel(h)}

    ${avisoCruce(h)}

    <div class="card" style="border-color:var(--acc2)">
      <div class="between" style="margin-bottom:10px">
        <div><div class="lbl">Tu score en el hoyo ${h}</div>
          <div class="big ${sc!==undefined?'acc':''}" style="font-size:32px">${sc ?? '–'}</div></div>
        <div style="text-align:right">
          <div class="lbl">Putts</div>
          <div style="font-weight:800;font-size:19px">${R.putts[h] ?? '–'}</div></div>
      </div>
      <button class="btn" onclick="abrirCierre(${h})">
        ${sc!==undefined ? 'Corregir el hoyo' : 'Terminar el hoyo'}</button>
      <div class="dim2" style="font-size:11px;text-align:center;margin-top:7px">
        Ahí cargás golpes, putts, bunker, penalidades y dónde quedó tu salida.</div>
    </div>

    ${(indexViejo() && !S.chequeoRonda)?`
    <div class="card" style="background:#3a3117;border-color:#5c4a1f">
      <div class="row" style="align-items:flex-start"><div class="ico" style="background:#5c4a1f">🏅</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:14px">¿Controlaste tu index?</div>
          <div class="dim" style="font-size:12px">Lo actualizaste hace ${diasIndex()} días y el handicap
          cambia los jueves. Con index ${verIndex(S.user.hcp)} salís
          ${verHcp(hcpCancha(S.user.hcp))} de ${tee().n.toLowerCase()}.</div></div></div>
      <div class="grid2" style="margin-top:11px">
        <button class="chip" onclick="go('handicap')">Actualizarlo</button>
        <button class="chip" onclick="S.chequeoRonda=true;render();toast('Listo, seguimos')">Está al día</button>
      </div>
    </div>`:''}

    ${panelPrueba()}

    <div class="accesos">
      <button onclick="abrirHoja('salida')"><span class="i">⛳</span>Salida</button>
      <button onclick="abrirHoja('grupo')"><span class="i">👥</span>Grupo</button>
      <button onclick="abrirHoja('tarjeta')"><span class="i">📋</span>Tarjeta</button>
      <button onclick="abrirHoja('cancha')"><span class="i">🚩</span>Cancha</button>
    </div>

    <div style="margin:18px 0 24px">
      <button class="btn ghost" onclick="finish()">
        ${S.torneo?'Cerrar y firmar la tarjeta':'Guardar la tarjeta'}</button>
    </div>
  </div></div>`;
}

/* ---------- LA BARRA FIJA DEL HOYO ----------
   Como en Hole19: flechas para moverse, y el centro se toca para saltar
   a cualquier hoyo. Está siempre a la vista, no se va con el scroll. */
function pintarBarra(){
  const b = document.getElementById('barra');
  if(!b) return;
  const jugando = S.tab === 'play' && !S.cerrando;
  b.className = jugando ? 'on' : '';
  if(!jugando){ b.innerHTML = ''; return; }
  const h = S.hole;
  b.innerHTML = `
    <button class="fl" onclick="mv(-1)" ${h===1?'disabled':''} aria-label="Hoyo anterior">‹</button>
    <button class="mid" onclick="abrirHoja('hoyos')">
      <div class="h">Hoyo ${h} · Par ${par(h)}</div>
      <div class="s">valuación ${COURSE.holes[h-1].hcp} · ${yards(h) ?? '—'} yds ·
        ${teeDelHoyo(h)} · tocá para saltar</div>
    </button>
    <button class="fl" onclick="mv(1)" ${h===S.vuelta?'disabled':''} aria-label="Hoyo siguiente">›</button>`;
}

/* ---------- LAS HOJAS ----------
   Todo lo que antes estaba en el camino y se usa de vez en cuando. */
function abrirHoja(cual){ S.hoja = cual; render(); }
function cerrarHoja(){ S.hoja = null; render(); }

function pintarHoja(){
  const e = document.getElementById('hoja');
  if(!e) return;
  if(!S.hoja){ e.className = ''; e.innerHTML = ''; return; }
  const H = HOJAS[S.hoja];
  if(!H){ e.className = ''; e.innerHTML = ''; return; }
  e.className = 'on';
  e.innerHTML = `<div class="fondo" onclick="cerrarHoja()"></div>
    <div class="panel" role="dialog" aria-label="${H.t}">
      <div class="tirador"></div>
      <div class="cab"><h3>${H.t}</h3>
        <button onclick="cerrarHoja()" aria-label="Cerrar">✕</button></div>
      <div class="cuerpo">${H.c()}</div>
    </div>`;
}

const HOJAS = {

  hoyos: { t:'Saltar a un hoyo', c: () => `
    <div class="g9" style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">
      ${Array.from({length:S.vuelta},(_,i)=>i+1).map(n=>{
        const s = R.scores[n];
        return `<button class="chip ${n===S.hole?'on':''}" style="padding:13px 2px;position:relative"
          onclick="S.hole=${n};cerrarHoja();$('#screen').scrollTop=0">
          ${n}<div style="font-size:9px;font-weight:600;opacity:.7">par ${par(n)}</div>
          ${s!==undefined?`<span style="position:absolute;top:2px;right:4px;font-size:9px;
            font-weight:800" class="${n===S.hole?'':'ok'}">${s}</span>`:''}
        </button>`}).join('')}
    </div>
    <div class="dim2" style="font-size:11px;margin:12px 0 4px">
      El número chico arriba a la derecha es lo que ya cargaste en ese hoyo.</div>` },

  salida: { t:'Salida y recorrido', c: () => `
    <div class="between" style="margin-bottom:10px">
      <div><div class="lbl">Estás jugando</div>
        <div style="font-weight:700;font-size:14px">${tee().n} · ${totalYds()} yds</div>
        <div class="dim2" style="font-size:11px">${ratingTxt(tee())}</div></div>
      <button class="chip" style="padding:9px 13px;font-size:12px;flex:0 0 auto"
        onclick="setVuelta(${S.vuelta===9?18:9})">${S.vuelta} hoyos ⇄</button>
    </div>
    <div class="grid3">
      ${CLUB.tees.map(t=>`<button class="chip ${S.tee===t.id?'on':''}"
        style="padding:11px 3px;font-size:11.5px" onclick="setTee('${t.id}')">
        ${bolita(t)}${t.n}</button>`).join('')}
    </div>

    </div>

    ${l.map(b=>`<div style="margin-bottom:13px">
      <div class="between" style="font-size:13px;margin-bottom:4px">

        <span class="mono" style="font-weight:800">${avg(b)} <span class="dim2" style="font-size:11px;font-weight:600">±${disp(b)}</span></span></div>
      <div style="position:relative;height:9px;background:var(--tint);border-radius:99px">
        <div style="position:absolute;left:${Math.max(0,((avg(b)-disp(b))/mx)*100)}%;
          width:${((disp(b)*2)/mx)*100}%;height:100%;background:#4ade8055;border-radius:99px"></div>
        <div style="position:absolute;left:${((avg(b)/mx)*100)}%;width:3px;height:100%;
          background:var(--acc);border-radius:2px;transform:translateX(-1px)"></div>
      </div></div>`).join('')}
    <div class="dim2" style="font-size:11px">La barra clara es tu dispersión: cuánto varía ese palo entre golpe y golpe.</div>
  </div>

  <div class="card"><h3>Huecos entre palos</h3>
    ${G.map(x=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--hair)">
      <span style="font-size:13px"><b>${etiq(x.a)}</b> <span class="dim2">→</span> <b>${etiq(x.b)}</b></span>

    ${BAG.filter(b=>b.on&&b.shots.length).slice().sort((a,b)=>b.shots.length-a.shots.length).slice(0,5)
      .map(b=>{const w=Math.round(b.shots.length/Math.max(1,tot)*100*4);

function clubInvierno(){
  const I=CLUB.invierno;
  const yo = INVIERNO.find(x=>x.yo);
  const porGross = INVIERNO.slice().sort((a,b)=>sumaGross(a)-sumaGross(b));
  const clasClub = porGross.filter(j=>j.negras>=I.copas[0].req.negras).slice(0,I.copas[0].cupo);
  const enClub = new Set(clasClub.map(j=>j.n));
  const porNeto = INVIERNO.filter(j=>!enClub.has(j.n)).sort((a,b)=>sumaNeto(a)-sumaNeto(b));
  const faltaNegras = Math.max(0, I.copas[0].req.negras - yo.negras);
  const faltaFechas = Math.max(0, I.cuentan - yo.fechas);

  return `
  <div class="card" style="background:linear-gradient(135deg,var(--tint),var(--card));border-color:var(--acc2)">
    <div class="between"><div style="min-width:0">
      <div class="lbl">${I.desde} al ${I.hasta}</div>
      <div style="font-weight:800;font-size:17px">${I.n}</div>
      <div class="dim" style="font-size:12px">Suman tus mejores ${I.cuentan} tarjetas</div></div>
      <div style="text-align:right"><div class="lbl">Fechas</div>
        <div class="big">${I.fechasJugadas}</div>
        <div class="dim2" style="font-size:11px">de ${I.minFechas} mín.</div></div>
    </div>
  </div>

  <h3>Cómo venís vos</h3>
  <div class="card">
    <div class="grid3" style="text-align:center;margin-bottom:12px">
      <div><div class="big" style="font-size:26px">${yo.fechas}</div><div class="lbl" style="font-size:9px">Tarjetas</div></div>
      <div><div class="big acc" style="font-size:26px">${sumaGross(yo)}</div><div class="lbl" style="font-size:9px">Gross (mejores ${I.cuentan})</div></div>
      <div><div class="big" style="font-size:26px">${sumaNeto(yo)}</div><div class="lbl" style="font-size:9px">Neto</div></div>
    </div>
    <div class="sep"></div>
    ${[['🏆','Copa Trisquelia', porNeto.findIndex(j=>j.yo)>=0 && porNeto.findIndex(j=>j.yo)<I.copas[1].cupo,
        `Vas ${porNeto.findIndex(j=>j.yo)+1}º en la tabla neto. Entran ${I.copas[1].cupo}.`],
       ['🥇','Copa del Club', clasClub.some(j=>j.yo),
        faltaNegras? `Te faltan ${faltaNegras} salidas de negras (llevás ${yo.negras} de ${I.copas[0].req.negras}).`
                   : `Vas ${porGross.findIndex(j=>j.yo)+1}º en la tabla gross. Entran ${I.copas[0].cupo}.`]]
      .map(([ic,t,ok,d])=>`<div class="item"><div class="ico">${ic}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${t}</div>
          <div class="dim" style="font-size:12px">${d}</div></div>
        <span class="pill ${ok?'':'gold'}">${ok?'Entrando':'Afuera'}</span></div>`).join('')}
    ${faltaFechas?`<div class="dim2" style="font-size:11px;margin-top:9px">
      Con ${yo.fechas} tarjetas todavía no llegás a las ${I.cuentan} que suman. Te faltan ${faltaFechas}.</div>`:''}
    <div class="dim2" style="font-size:11px;margin-top:9px">
      Las salidas de negras las cuenta sola la app: sale de la tarjeta que firmás en cada fecha.</div>
  </div>

  <h3>Copa del Club · tabla gross</h3>
  <div class="card" style="padding:12px">
    <div class="dim" style="font-size:12px;margin-bottom:9px">
      Entran los ${I.copas[0].cupo} de menor gross. ${I.copas[0].extra}.</div>
    <table><thead><tr><th style="text-align:left">#</th><th style="text-align:left">Jugador</th>
      <th>Tarj.</th><th>Negras</th><th>Gross</th></tr></thead><tbody>
    ${porGross.slice(0,10).map((j,k)=>{
      const dentro = clasClub.includes(j);
      return `<tr style="${j.yo?'background:var(--tint)':''};${dentro?'':'opacity:.55'}">
        <td class="${dentro?'gold':''}" style="font-weight:800">${k+1}</td>
        <td class="name">${j.n}</td><td class="dim">${j.fechas}</td>
        <td class="${j.negras>=I.copas[0].req.negras?'acc':'red'}">${j.negras}</td>
        <td style="font-weight:800">${sumaGross(j)}</td></tr>`}).join('')}
    </tbody></table>
    <div class="dim2" style="font-size:11px;margin-top:9px">
      En gris, los que hoy no cumplen las ${I.copas[0].req.negras} salidas de negras.</div>

  <h3>Copa Trisquelia · tabla neto</h3>

      <td class="${k<I.copas[1].cupo?'gold':''}" style="font-weight:800">${k+1}</td>
      <td class="name">${j.n}</td><td class="dim">${j.hcp}</td><td class="dim">${j.fechas}</td>
      <td style="font-weight:800">${sumaNeto(j)}</td></tr>`).join('')}

  <h3>El reglamento, en corto</h3>

    ${[['👤','Quién puede',I.requisitos],
       ['📋','Cómo se clasifica',`Suman las mejores ${I.cuentan} tarjetas del ${I.desde} al ${I.hasta}. Mínimo ${I.minFechas} fechas.`],
       ['🥇',I.copas[0].n,I.copas[0].juego+' '+I.copas[0].req.txt+'.'],
       ['🏆',I.copas[1].n,I.copas[1].juego],
       ['⚖️','Desempate',I.desempate],
       ['⛳','Tees',I.tees],
       ['📞','Oficial de Reglas',CLUB.pro.tel
          ? `${CLUB.pro.n} · ${CLUB.pro.tel}`
          : `${CLUB.pro.n} · pedile el teléfono en la sede`]].map(([ic,t,d])=>
      `<div class="item"><div class="ico">${ic}</div><div style="min-width:0">
        <div style="font-weight:600;font-size:13px">${t}</div>
        <div class="dim" style="font-size:12px">${d}</div></div></div>`).join('')}
    <div class="sep"></div>
    <h3>Calculadora de ventaja</h3>
    <div class="dim" style="font-size:12px;margin-bottom:10px">
      En la Copa Trisquelia se dan el 85% de la diferencia de handicap.</div>
    <div class="grid2">
      <div><div class="lbl">Tu handicap</div>
        <input value="${S.vA??10}" inputmode="decimal" oninput="S.vA=+this.value||0;pintarVentaja()"
          style="width:100%;margin-top:6px;padding:12px;border-radius:11px;background:var(--nav);
          border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px;font-weight:700;text-align:center"></div>
      <div><div class="lbl">El del rival</div>
        <input value="${S.vB??18}" inputmode="decimal" oninput="S.vB=+this.value||0;pintarVentaja()"
          style="width:100%;margin-top:6px;padding:12px;border-radius:11px;background:var(--nav);
          border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px;font-weight:700;text-align:center"></div>

}

/* ---------- LA TARJETA COMPLETA ----------
   Si la digital reemplaza al papel, tiene que decir exactamente lo mismo:
   par y valuación de cada hoyo, yardas de las tres salidas, subtotales de
   ida y vuelta, rating y slope, y el bloque de firmas. */
function ydsTee(t,h){ return yardaDe(t,h); }
function tablaTarjeta(desde,hasta,rot){
  const hs = COURSE.holes.slice(desde-1,hasta);
  const sub = a => a.reduce((x,y)=>x+y,0);
  const jug = hs.map(x=>R.scores[x.n]);
  return `<table style="min-width:${(hasta-desde+1)*34+108}px">
    <thead><tr><th style="text-align:left;min-width:98px">Hoyo</th>
      ${hs.map(x=>`<th>${x.n}</th>`).join('')}<th style="min-width:42px">${rot}</th></tr></thead>
    <tbody>
      ${CLUB.tees.map(t=>`<tr><td class="name" style="font-size:11px">${bolita(t)}${t.n}</td>
        ${hs.map(x=>`<td class="dim">${ydsTee(t,x.n)}</td>`).join('')}
        <td style="font-weight:700">${sub(hs.map(x=>ydsTee(t,x.n)))}</td></tr>`).join('')}
      <tr><td class="name" style="font-weight:800">Par</td>
        ${hs.map(x=>`<td style="font-weight:800">${x.par}</td>`).join('')}
        <td style="font-weight:800">${sub(hs.map(x=>x.par))}</td></tr>
      <tr><td class="name dim2" style="font-size:11px">Valuación</td>
        ${hs.map(x=>`<td class="dim2">${x.hcp}</td>`).join('')}<td></td></tr>
      <tr><td class="name">Golpes</td>
        ${hs.map(x=>{const v=R.scores[x.n];
          return `<td>${v?`<span class="sq ${scoreClass(v,x.par)}">${v}</span>`:'<span class="dim2">–</span>'}</td>`}).join('')}
        <td style="font-weight:800">${jug.some(v=>v)?sub(jug.filter(Boolean)):'–'}</td></tr>
    </tbody></table>`;
}

   puede dejarle todo masticado: los datos en el orden que los pide,

          ${[['Fecha',t.fecha],['Cancha',CLUB.corto],
             ['Salida', dela ? dela.n + (s2 && s2!==dela ? ` (se carga como ${s2.n.toLowerCase()})` : '') : '—'],
             ['Rating / Slope', s2 ? s2.r+' / '+s2.s : '—'],['Score',t.gross],

      <div class="dim" style="font-size:13px;margin-top:4px">Todas las tarjetas de la fecha ya están en la federación.</div>
    </div>`}

    <div class="card"><h3>Para hacerlo más rápido</h3>

    ${listas.length?`<div class="card" style="margin-bottom:24px"><h3>Ya cargadas</h3>

   antes de firmar, que es lo que en papel se descubre tarde. */
function difs(){
  return played().filter(h => MARCA[h]!==undefined && MARCA[h]!==R.scores[h]);
}

        <span class="pill ${S.presento===false?'red':(S.certifico?'':'gold')}">
