/* ---------- DIBUJO DEL HOYO ----------
   Forma de cada una de las 9 canchas, armada con las vistas de la cancha
   y las correcciones que fue haciendo el club. Las distancias son las
   reales de la tarjeta; los obstáculos van ubicados por yardas desde el
   tee. Queda exacto cuando estén las coordenadas del trazado. */
const CANCHA = {
  1:{dog: 0.10, ancho:1.00, casas:'der',
     haz:[{t:'b',d:250,lado:-1,w:9}],
     gb:[{a:210,r:1},{a:330,r:1}]},
  2:{dog: 0.00, ancho:1.05, casas:'der',
     haz:[{t:'a',d:40,lado:-1,w:16},{t:'b',d:60,lado:0,w:13},{t:'b',d:290,lado:1,w:9}],
     gb:[{a:200,r:1},{a:150,r:1.1}]},
  3:{dog:-0.25, ancho:1.00, casas:'der',
     haz:[{t:'a',d:270,lado:-1,w:20},{t:'b',d:150,lado:1,w:8}],
     gb:[{a:180,r:1},{a:250,r:1},{a:320,r:.9}]},
  4:{dog: 0.00, ancho:0.70,
     haz:[{t:'a',d:70,lado:-1,w:17},{t:'a',d:80,lado:1,w:19}],
     gb:[{a:150,r:1.1},{a:30,r:1}]},
  5:{dog: 0.12, ancho:1.00,
     haz:[{t:'a',d:140,lado:-1,w:21},{t:'a',d:150,lado:1,w:18},{t:'a',d:60,lado:1,w:11}],
     gb:[{a:20,r:1}]},
  6:{dog:-0.15, ancho:0.95, ob:true,
     haz:[{t:'b',d:200,lado:-1,w:8},{t:'b',d:255,lado:-1,w:8}],
     gb:[{a:190,r:1},{a:240,r:.9}]},
  7:{dog: 0.10, ancho:0.95, camino:'der',
     haz:[{t:'b',d:150,lado:0,w:10},{t:'a',d:50,lado:-1,w:13}],
     gb:[{a:170,r:1.1}]},
  8:{dog: 0.00, ancho:0.65,
     haz:[],
     gb:[{a:130,r:1.1},{a:210,r:1},{a:300,r:1.2}]},
  9:{dog: 0.15, ancho:1.05,
     haz:[{t:'a',d:120,lado:-1,w:15},{t:'b',d:280,lado:1,w:9}],
     gb:[{a:180,r:1},{a:0,r:1.15}]}
};
/* ---------- LA FORMA MEDIDA DE CADA HOYO ----------
   Hasta la v17 el dibujo salía de tres parámetros puestos a ojo por hoyo. Pero
   la cancha está medida a pie: de cada green tenemos el frente, el centro y el
   fondo, y de cada salida su coordenada. De ahí salen tres cosas que antes eran
   inventadas y ahora son REALES:

     · cuánto mide el green de frente a fondo — 18 yardas en el 6, 29 en el 7
     · en qué ángulo está cruzado respecto de la línea de juego — de −41° en el
       7 a +44° en el 9, que es lo que hace que un hoyo se reconozca de un
       vistazo y que entrarle de frente no sea lo mismo que entrarle en diagonal
     · dónde cae cada salida: no sólo a qué distancia, también cuánto corrida
       del eje (el azul del 9 está 138 yardas adelante y 21 a la derecha)

   Lo que sigue siendo a ojo, y lo dice el pie del dibujo: el ANCHO del green,
   el contorno del fairway y dónde caen bunkers y lagunas. Eso se arregla
   caminando la cancha con medir.html, no escribiendo código.

   Si un club todavía no tiene coordenadas, esto devuelve null y el dibujo cae
   al esquema de siempre. */

/* Qué coordenada le toca a esta salida en este hoyo. Un hoyo físico se juega
   dos veces: blancas en la ida y azules en la vuelta, y en el 4 y el 9 las
   negras tienen un segundo tee propio. */
function puntoTee(t, h){
  const T = CLUB.geo && CLUB.geo.tees && CLUB.geo.tees[CLUB.fisico[h-1]];
  if(!T) return null;
  if(t.id === 'mixta')  return h<=9 ? T.blancas : T.azules;
  if(t.id === 'damas')  return T.damas;
  if(t.id === 'negras') return (!repiteTeeDe(t,h) && T.negras2) ? T.negras2 : T.negras;
  return T[t.id] || null;
}
const repiteTeeDe = (t,h) => !t.mismoTee || t.mismoTee[CLUB.fisico[h-1]-1] !== false || h<=9;

const YARDA = 1.0936133;
function formaHoyo(h){
  const g = CLUB.geo, fis = CLUB.fisico[h-1];
  const G = g && g.greens && g.greens[fis];
  const O = puntoTee(tee(), h);
  if(!G || !O) return null;
  /* Coordenadas planas en metros desde la salida de hoy. A esta escala —menos
     de un kilómetro— la Tierra es plana y el error no llega al centímetro. */
  const xy = q => { const la = (q[0]+O[0])*Math.PI/360;
    return [ (q[1]-O[1])*Math.PI/180*6371000*Math.cos(la),
             (q[0]-O[0])*Math.PI/180*6371000 ]; };
  const c = xy(G.c), largoM = Math.hypot(c[0], c[1]);
  if(!(largoM > 1)) return null;
  const ux = c[0]/largoM, uy = c[1]/largoM;         // hacia el green
  /* `a` avanza hacia el green, `l` es cuánto se corre a la derecha de la línea. */
  const proy = q => { const v = xy(q);
    return { a:(v[0]*ux + v[1]*uy)*YARDA, l:(v[0]*uy - v[1]*ux)*YARDA }; };
  const f = proy(G.f), b = proy(G.b);
  return {
    largo: largoM*YARDA,
    green: { largo: Math.hypot(b.a-f.a, b.l-f.l), da: b.a-f.a, dl: b.l-f.l },
    tees: CLUB.tees.map(t => { const q = puntoTee(t, h);
            return q ? Object.assign({id:t.id}, proy(q)) : null; }).filter(Boolean)
  };
}

function holeSVG(h){
  const c   = CANCHA[CLUB.fisico[h-1]] || {dog:0,ancho:1,haz:[],gb:[]};
  const p   = par(h), W=200, H=312, base=272, gy=54;
  const tAct = tee(), F = formaHoyo(h);
  const LARGO = F ? F.largo : largoDibujo(h);
  /* El alto del dibujo va a escala: entra desde la salida más atrasada hasta el
     centro del green. El ANCHO va exagerado —1,3 px por yarda— porque a escala
     real un hoyo de 400 yardas es un hilo de tres píxeles. Todo plano de golf
     hace lo mismo. */
  const aMin = F ? Math.min(0, ...F.tees.map(t=>t.a)) : 0;
  const tope = Math.max(60, LARGO - aMin);
  const yA = a => base - ((a - aMin)/tope)*(base-gy);   // yardas avanzadas desde la salida
  const yDe = v => yA(LARGO - v);                       // yardas que FALTAN al green
  const yTee = yA(0), KL = 1.3, xL = l => 100 + l*KL;
  /* El green se dibuja con su largo real —más grande el del 7 que el del 6— pero
     agrandado para que se lea, y con su inclinación medida. El ancho es el único
     dato que no tenemos: se asume. */
  const glargo = F ? F.green.largo : 22;
  /* Alargado 1,6 a 1: un green redondo esconde la inclinación, que es
     justamente el dato que medimos y el que cambia cómo se le entra. */
  const ryG = Math.max(15, 20 + (glargo-22)*0.7), rxG = ryG*0.62;
  const girG = F ? Math.atan2(F.green.dl*KL, F.green.da*(base-gy)/tope)*180/Math.PI : 0;
  const rotG = `rotate(${girG.toFixed(1)} 100 ${gy})`;
  // el fairway va del tee al green, curvado según el dogleg
  const cx  = 100 + c.dog*32, anc = 25*c.ancho;
  const yPos = d => yA(d);                              // yardas desde el tee
  const lado = (l,y) => 100 + c.dog*32*(1-Math.abs((y-gy)/(base-gy))*.6) + l*anc*1.15;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;min-height:190px;display:block">
    <defs>
      <linearGradient id="fw${h}" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#aed086"/><stop offset="1" stop-color="#bedd95"/></linearGradient>
      <radialGradient id="gr${h}"><stop offset="0" stop-color="#e2f4b4"/><stop offset="1" stop-color="#cfe89f"/></radialGradient>
      <linearGradient id="ag${h}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fc3e0"/><stop offset="1" stop-color="#6ba3c9"/></linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="#7e9f60"/>

    <!-- rough -->
    <path d="M${100-anc-15} ${base+18} Q ${cx-anc-21} ${(base+gy)/2} ${100-anc-7} ${gy+16}
             L ${100+anc+7} ${gy+16} Q ${cx+anc+21} ${(base+gy)/2} ${100+anc+15} ${base+18} Z"
          fill="#6d8e51" opacity=".85"/>
    <!-- fairway -->
    <path d="M${100-anc} ${base+10} Q ${cx-anc} ${(base+gy)/2} ${100-anc*0.72} ${gy+20}
             L ${100+anc*0.72} ${gy+20} Q ${cx+anc} ${(base+gy)/2} ${100+anc} ${base+10} Z"
          fill="url(#fw${h})"/>

    ${c.casas?`<g opacity=".5">${[0,1,2,3,4].map(k=>{
      const y=gy+26+k*40, x=c.casas==='der'?W-13:6;
      return `<rect x="${x}" y="${y}" width="9" height="7" rx="1.4" fill="#b3a99c"/>`;}).join('')}</g>`:''}
    ${c.camino?`<path d="M${W-10} ${gy} L${W-16} ${H}" stroke="#cbb894" stroke-width="4" opacity=".6"/>`:''}
    ${c.ob?`<line x1="8" y1="${gy-19}" x2="${W-8}" y2="${gy-19}" stroke="#ffffff"
       stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>
      <text x="${W-10}" y="${gy-23}" fill="#3f5540" font-size="4" text-anchor="end"
       font-family="sans-serif">fuera de límites</text>`:''}

    <!-- obstáculos, ubicados por yardas desde el tee -->
    ${(c.haz||[]).filter(z=>z.d<LARGO).map(z=>{
      const y=yPos(z.d), x=lado(z.lado*0.72, y);
      return z.t==='a'
        ? `<ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.62}" fill="url(#ag${h})"/>
           <ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.62}" fill="none" stroke="#4d87ae" stroke-width=".6" opacity=".7"/>`
        : `<ellipse cx="${x}" cy="${y}" rx="${z.w}" ry="${z.w*0.6}" fill="#e0cda0"/>`;
    }).join('')}

    <!-- bunkers del green -->
    ${(c.gb||[]).map(g=>{
      const a=g.a*Math.PI/180;
      return `<ellipse cx="${(100+(rxG+9)*Math.cos(a)).toFixed(1)}" cy="${(gy+(ryG+6)*Math.sin(a)).toFixed(1)}"
        rx="${8*g.r}" ry="${5.4*g.r}" fill="#e0cda0"/>`;}).join('')}

    <!-- green -->
    <ellipse cx="100" cy="${gy}" rx="${rxG.toFixed(1)}" ry="${ryG.toFixed(1)}"
             transform="${rotG}" fill="url(#gr${h})"/>
    <ellipse cx="100" cy="${gy}" rx="${rxG.toFixed(1)}" ry="${ryG.toFixed(1)}"
             transform="${rotG}" fill="none" stroke="#7fbb8e" stroke-width=".7" opacity=".45"/>
    <circle cx="100" cy="${gy+2}" r="2.4" fill="#24331f"/>
    <path d="M100 ${gy+2} v-17 l10 4.5 -10 4.5" fill="#c8202e" stroke="#c8202e" stroke-width="1"/>

    <!-- las salidas, cada una a su distancia real -->
    ${CLUB.tees.filter(t=>yardaDe(t,h)!=null).map(t=>{
      const v=yardaDe(t,h), act=t.id===tAct.id;
      const m = F && F.tees.find(x=>x.id===t.id);
      const y = m ? yA(m.a) : yDe(v), x = m ? xL(m.l) : 100;
      const nom = t.id==='mixta' ? (h<=9?'Blancas':'Azules') : t.n;
      const col = t.id==='mixta' ? (h<=9?'#f5f5f5':'#3b82f6') : t.c;
      return `<g opacity="${act?1:.5}">
        <rect x="${(x-(act?11:8)).toFixed(1)}" y="${y.toFixed(1)}" width="${act?22:16}" height="${act?7:5}" rx="2.5"
              fill="${col}" stroke="#24331f80" stroke-width=".6"/>
        <text x="${(x+(act?16:13)).toFixed(1)}" y="${(y+(act?6:5)).toFixed(1)}" fill="${act?'#12220f':'#2b3f24'}"
              font-size="${act?4.6:4}" font-family="sans-serif" font-weight="${act?'700':'400'}">
          ${nom} ${v}</text></g>`;}).join('')}

    <!-- la estaca de 150 -->
    ${LARGO>170?(()=>{const y=yPos(LARGO-150);
      return `<line x1="${lado(-1,y)}" y1="${y}" x2="${lado(1,y)}" y2="${y}"
        stroke="#ffffff" stroke-width=".8" stroke-dasharray="3 3" opacity=".5"/>
      <circle cx="${lado(1,y)}" cy="${y}" r="2.6" fill="#ffffff" opacity=".95"/>
      <text x="${lado(1,y)+6}" y="${y+3}" fill="#12220f" font-size="4.2" font-family="sans-serif">150</text>`;})():''}

    <text x="8" y="${H-8}" fill="#2f4429" font-size="4.4" font-family="sans-serif">
      cancha ${CLUB.fisico[h-1]} · ${F ? 'largo, green y salidas medidos' : 'forma aproximada'} ·
      ancho y obstáculos a ojo</text>
  </svg>`;
}

/* ---------- REGISTRO DE GOLPES: el corazón de las estadísticas propias ---------- */
const RES = [['fw','Fairway','🟢'],['green','Green','⛳'],['rough','Rough','🌾'],
             ['bunker','Bunker','🏖️'],['agua','Agua','💧'],['ob','Fuera','🚫'],['hoyo','Emboqué','🕳️']];

/* ============================================================
   REGISTRAR UN GOLPE
   Un solo toque: elegís el palo y la app se guarda dónde estás.
   Cuando registrás el siguiente, mide entre los dos puntos y te dice
   cuánto voló el anterior. El jugador nunca escribe una distancia.
   Registrar es opcional: se puede jugar la vuelta entera sin tocar nada.
   ============================================================ */
const FW = [['fw','Fairway','✓'],['izq','Izquierda','←'],['der','Derecha','→'],
            ['largo','Largo','↑'],['corto','Corto','↓']];

/* el último golpe registrado que todavía no tiene distancia */
const golpeAbierto = h => (R.shots[h]||[]).find(x=>x.d==null && x.lat!=null);

/* cuánto llevás desde donde pegaste — se actualiza mientras caminás */
function desdeElGolpe(h){
  const a = golpeAbierto(h);
  if(!a || !gpsVivo()) return null;
  return aYardas(metros([a.lat,a.lon],[POS.lat,POS.lon]));
}

function registrarGolpe(h, club){
  const b = palo(club);
  R.shots[h] = R.shots[h] || [];
  // el golpe anterior queda medido con lo que caminaste
  cerrarGolpeAbierto(h);
  R.shots[h].push({c:club, lat:gpsVivo()?POS.lat:null, lon:gpsVivo()?POS.lon:null, d:null});
  S.shotOpen = false;
  toast(gpsVivo() ? `${etiq(b)} registrado. Cuando llegues a la bola te digo cuánto voló`
            : `${etiq(b)} registrado, sin GPS no puedo medir la distancia`);
  render();
}
/* Cierra el golpe pendiente midiendo desde donde se pegó hasta donde estás.
   Sólo cuenta para las estadísticas si es un palo que mide distancia. */
function cerrarGolpeAbierto(h){
  const a = golpeAbierto(h);
  if(!a || !gpsVivo()) return null;
  const d = aYardas(metros([a.lat,a.lon],[POS.lat,POS.lon]));
  if(d < 5) return null;                       // no te moviste: no fue un golpe
  const b = palo(a.c);
  /* Un número imposible para ese palo no es un golpe: es alguien que caminó a
     otro lado. Queda registrado el palo, sin distancia, y no entra a la bolsa. */
  const tope = Math.min(TIRO_MAX, b && !b.putter ? Math.max(60, Math.round(media(b) * 1.7)) : 60);
  if(d > tope){ a.lat = null; a.lon = null; return null; }
  a.d = d;
  if(b && !b.putter) b.shots.push(d);
  return d;
}
function borrarGolpe(h,i){
  const g = R.shots[h][i], b = palo(g.c);
  if(b && g.d!=null){ const k=b.shots.lastIndexOf(g.d); if(k>-1) b.shots.splice(k,1); }
  R.shots[h].splice(i,1);
  render();
}

function shotPanel(h){
  const list = R.shots[h] || [];
  const enCurso = golpeAbierto(h);
  const llevas = desdeElGolpe(h);
  return `
  <div class="card">
    <div class="between"><h3 style="margin:0">Tus palos en el hoyo ${h}</h3>
      <span class="pill ${list.length?'':'gold'}">${list.length}</span></div>
    <div class="dim2" style="font-size:11px;margin-top:2px">Es opcional. Sirve para armar tus distancias reales.</div>

    ${enCurso ? `
    <div style="background:var(--tint);border-radius:13px;padding:14px;margin-top:11px;text-align:center">
      <div class="lbl">Pegaste con el ${etiq(palo(enCurso.c))} · llevás caminando</div>
      <div class="big acc" id="dGolpe" style="font-size:38px;margin:2px 0">${llevas ?? '—'}</div>
      <div class="dim2" style="font-size:11px">yardas. Cuando llegues a la bola, ese es tu golpe.</div>
    </div>` : ''}

    ${list.length ? `<div style="margin-top:10px">${list.map((g,i)=>`
      <div class="item" style="padding:9px 0">
        <div class="ico" style="font-size:13px;font-weight:800">${i+1}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${etiq(palo(g.c))}</div>
          <div class="dim" style="font-size:12px">${g.d!=null ? g.d+' yds' : 'midiendo…'}</div></div>
        <button class="chip" style="padding:6px 10px" onclick="borrarGolpe(${h},${i})">✕</button>
      </div>`).join('')}</div>` : ''}

    ${S.shotOpen ? `
    <div class="sep"></div>
    <div class="lbl" style="margin-bottom:8px">¿Con qué palo pegaste?</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
      ${BAG.filter(b=>b.on).map(b=>
        `<button class="chip" style="padding:12px 2px;font-size:12px"
          onclick="registrarGolpe(${h},'${b.c}')">${etiq(b)}</button>`).join('')}
    </div>
    <button class="btn ghost sm" style="margin-top:10px" onclick="S.shotOpen=false;render()">Cancelar</button>`
    : `<button class="btn sm" style="margin-top:12px" onclick="S.shotOpen=true;render()">
        ${list.length?'+ Otro palo':'+ Registrar el palo'}</button>`}
  </div>`;
}

/* ============================================================
   CERRAR EL HOYO
   Todo junto y al final, como en la tarjeta de papel: golpes, putts,
   bunker, penalidades, dónde quedó la salida, y el score del compañero
   al que le llevás la tarjeta.
   El score NO sale de contar los palos registrados: registrar palos es
   opcional y sirve para otra cosa.
   ============================================================ */
function abrirCierre(h){
  /* El último palo del hoyo NO se mide acá. El socio cierra el hoyo en el tee
     siguiente, a propósito, y medir hasta donde está parado le sumaba a la bolsa
     un wedge de 100 yardas como si hubiera volado 129, o un drive corregido
     desde el tee del 6 como de 565 (revisión adversaria de la v26). Un golpe se
     mide con el golpe que sigue, que es donde quedó la bola. */
  S.cerrando = true; S.shotOpen = false; S.cierrePaso = 1;
  render(); $('#screen').scrollTop = 0;
}
function fijar(campo, v){
  const h = S.hole;
  /* Anotar ya no pone `S.playing` en true: eso era una puerta de atrás para
     "empezar" una vuelta sin pasar por `empezarRonda()`, o sea sin vaciar la
     anterior. Una vuelta sólo empieza ahí. */
  /* Y una tarjeta certificada que cambia ya no es la que se certificó: se
     descertifica, y lo mismo la del otro si se la firmó como marcador. La
     revisión adversaria de la v25 certificó, cambió un 4 por un 2 y la firma
     seguía "Certificada"; se entregaba con un número que nadie certificó.
     Venía de antes de la v25. */
  if(campo==='sc'){
    if(S.certifico && R.scores[h] !== v){ S.certifico = false; S.presento = null;
      toast('Cambiaste un golpe · tu tarjeta hay que volver a certificarla'); }
    R.scores[h]=v;
    if(R.putts[h]!=null && R.putts[h]>v) R.putts[h]=v; }
  else if(campo==='putts'){ R.putts[h]=v; }
  else if(campo==='bunker'){ R.bunker[h]=v; }
  else if(campo==='penal'){ R.penal[h]=v; }
  else if(campo==='fw'){ R.fw[h] = R.fw[h]===v ? null : v; }
  else if(campo==='otro'){
    if(S.firmoLaOtra && OTRO[h] !== v){ S.firmoLaOtra = false;
      toast('Cambiaste la tarjeta que llevás · hay que volver a firmarla'); }
    OTRO[h]=v; }
  render();
}
/* El green en regulación NO se pregunta: se calcula. Llegar en regulación es
   alcanzar el green en par−2 golpes, y los golpes hasta el green son los
   totales menos los putts. Como el socio carga putts siempre, sale solo — y
   de paso se va el bug de que el botón decía "No" sin que nadie lo tocara,
   indistinguible de un No de verdad. Sin putts no se calcula y no se guarda:
   la app no inventa. */
function girDe(h){
  const s = R.scores[h], pu = R.putts[h];
  if(s === undefined || pu === undefined || pu === null) return null;
  return (s - pu) <= (par(h) - 2);
}
function pasoMarcador(){
  if(R.scores[S.hole]===undefined){ toast('Poné cuántos golpes hiciste'); return; }
  if(!hayAQuienMarcar()) return cerrarHoyo();      // sin a quién marcar, no hay tarjeta del otro
  S.cierrePaso = 2; render(); $('#screen').scrollTop = 0;
}
function cerrarHoyo(){
  const h = S.hole;
  if(R.scores[h]===undefined){ toast('Poné cuántos golpes hiciste'); return; }
  const g = girDe(h);
  if(g === null) delete R.gir[h]; else R.gir[h] = g;
  anotarEnLaNube(h);          // si estás jugando con el grupo, se manda solo
  S.cerrando = false; S.cierrePaso = 1; S.teeVisto = null;
  if(h < S.vuelta){ S.hole = h+1; toast(`Hoyo ${h} cerrado · vamos al ${h+1}`); }
  else {
    /* Decía "Vuelta terminada" y se quedaba en la pantalla de jugar: la vuelta
       no terminaba —eso sólo lo hace `finish()`— y el botón para terminarla
       estaba escondido al final de la hoja de la tarjeta. Ahora se abre esa
       hoja, que es donde se revisa y se cierra. */
    S.hoja = 'tarjeta';
    toast('Último hoyo · revisá la tarjeta y terminala abajo');
  }
  render(); $('#screen').scrollTop = 0;
}

/* ============================================================
   CERRAR EL HOYO
   El socio no anota en el green: camina al tee siguiente y anota ahí, antes
   de salir, para no frenar la cancha. Eso manda todo el diseño de esta
   pantalla: entra entera sin scrollear en un teléfono de 360×640, el botón
   de guardar queda siempre a la vista, y la tarjeta del que marcás es un
   segundo paso — meterla acá abajo obligaba a scrollear dos pantallas.
   ============================================================ */
function panelCierre(){
  if(S.cierrePaso === 2 && S.torneo) return panelMarcador();
  const h = S.hole, p = par(h), sc = R.scores[h], gir = girDe(h);
  const nums = n => Array.from({length:n}, (_,i)=>i+1);
  const chip = (campo,v,txt,act) => `<button class="chip ${act?'on':''}"
    style="padding:12px 2px;font-size:14px;font-weight:800" onclick="fijar('${campo}',${v})">${txt}</button>`;
  const fila = n => `display:grid;grid-template-columns:repeat(${n},1fr);gap:7px`;
  return `<div class="fade">
  <div class="pad" style="padding-top:10px">
    <div class="row" style="margin-bottom:12px">
      <button class="arrow" onclick="S.cerrando=false;render()">‹</button>
      <div style="min-width:0"><div style="font-weight:800;font-size:17px">Hoyo ${h} · par ${p}</div>
        <div class="dim" style="font-size:12px">${yards(h) ?? '—'} yds · ${tee().n.toLowerCase()}</div></div>
    </div>

    <div class="bloque">
      <div class="lbl" style="display:flex;justify-content:space-between;gap:8px">
        <span>¿Cuántos golpes?</span>
        ${sc!==undefined?`<span class="acc" style="text-transform:none;letter-spacing:0">${
          sc-p===0?'Par':sc-p===-1?'Birdie':sc-p<=-2?'Eagle':sc-p===1?'Bogey':'+'+(sc-p)+' al par'}</span>`:''}
      </div>
      <div style="${fila(5)}">${nums(10).map(v=>chip('sc',v,v,sc===v)).join('')}</div>
    </div>

    <div class="bloque">
      <div class="lbl" style="display:flex;justify-content:space-between;gap:8px">
        <span>Putts</span>
        ${gir===null?'':`<span style="text-transform:none;letter-spacing:0;color:${
          gir?'var(--acc)':'var(--dim2)'}">${gir?'en regulación':'fuera de regulación'}</span>`}
      </div>
      <div style="${fila(5)}">${[0,1,2,3,4].map(v=>chip('putts',v,v===4?'4+':v,R.putts[h]===v)).join('')}</div>
    </div>

    <div class="bloque">
      <div class="lbl">Bunker</div>
      <div class="grid4">${[0,1,2,3].map(v=>chip('bunker',v,v===3?'3+':v,R.bunker[h]===v)).join('')}</div>
    </div>

    <div class="bloque">
      <div class="lbl">Penalidades</div>
      <div class="grid4">${[0,1,2,3].map(v=>chip('penal',v,v===3?'3+':v,R.penal[h]===v)).join('')}</div>
    </div>

    ${p>3?`
    <div class="bloque">
      <div class="lbl">¿Dónde quedó tu salida?</div>
      <div style="${fila(5)}">
        ${FW.map(([k,l,f])=>`<button class="chip ${R.fw[h]===k?'on':''}"
          style="padding:8px 2px" onclick="fijar('fw','${k}')">
          <div style="font-size:18px;line-height:1.1">${f}</div>
          <div style="font-size:10px">${l}</div></button>`).join('')}
      </div>
    </div>`:''}

    <div class="guardar">
      ${S.torneo && RONDA && !RONDA.marcoA ? `<div class="dim2" style="font-size:11.5px;margin-bottom:8px">
        Todavía no elegiste a quién le llevás la tarjeta: se elige en la ronda del grupo, desde el arranque.</div>` : ''}
      <button class="btn" onclick="${S.torneo && hayAQuienMarcar() ?'pasoMarcador()':'cerrarHoyo()'}">
        ${S.torneo && hayAQuienMarcar() ? 'Seguir · la tarjeta de '+esc(marcado().n)
          : S.hole < S.vuelta ? 'Guardar y pasar al hoyo '+(S.hole+1) : 'Guardar y terminar la vuelta'}</button>
    </div>
  </div></div>`;
}

/* El segundo paso: la tarjeta del que marcás. Va aparte y no abajo del
   primero porque es otro acto mental —dejás de ser jugador y pasás a ser
   marcador— y porque juntos no entraban en una pantalla. */
function panelMarcador(){
  const h = S.hole, otro = marcado();
  const nums = n => Array.from({length:n}, (_,i)=>i+1);
  return `<div class="fade">
  <div class="pad" style="padding-top:10px">
    <div class="row" style="margin-bottom:12px">
      <button class="arrow" onclick="S.cierrePaso=1;render()">‹</button>
      <div style="min-width:0"><div style="font-weight:800;font-size:17px">Hoyo ${h} · par ${par(h)}</div>
        <div class="dim" style="font-size:12px">Tu hoyo quedó en ${R.scores[h]}</div></div>
    </div>

    <div class="card" style="border-color:var(--acc2);background:var(--tint)">
      <div class="row" style="align-items:flex-start;margin-bottom:11px">
        <div class="avatar">${esc(otro.i)}</div>
        <div style="min-width:0"><div style="font-weight:800;font-size:15px">La tarjeta de ${esc(otro.n)}${deEjemplo(otro)}</div>
          <div class="dim" style="font-size:12px">Sos su marcador: anotá lo que hizo <b>él</b> en el hoyo ${h}.</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">
        ${nums(10).map(v=>`<button class="chip ${OTRO[h]===v?'on':''}"
          style="padding:12px 2px;font-size:14px;font-weight:800" onclick="fijar('otro',${v})">${v}</button>`).join('')}
      </div>
    </div>

    <div class="guardar">
      <button class="btn" onclick="cerrarHoyo()">
        ${S.hole < S.vuelta ? 'Guardar y pasar al hoyo '+(S.hole+1) : 'Guardar y terminar la vuelta'}</button>
    </div>
  </div></div>`;
}

/* ============================================================
   PANTALLA DE JUGAR
   Referente: Hole19. Lo que se mira con la bola adelante va primero y
   grande —el mapa y las tres distancias—, la acción está siempre a un
   toque, y el hoyo se cambia desde una barra fija abajo.
   Todo lo demás (salida, tarjetas, estacas) se abre en una hoja y no
   ocupa lugar en el camino.
   ============================================================ */
/* Los íconos del riel van dibujados, no en emoji: un emoji se ve distinto en
   cada teléfono y al lado del escudo del club queda de juguete. */
const ICO = {
  golpe:'<circle cx="12" cy="12" r="8"/><path d="M12 8.5v7M8.5 12h7"/>',
  grupo:'<path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-6 8a6 6 0 0 1 12 0m3-11a3 3 0 0 1 0 6m4 5a6 6 0 0 0-4-5.6"/>',
  tarjeta:'<path d="M6 3h8.5L19 7.5V21H6Z"/><path d="M14 3v5h5"/><path d="M9 12h7M9 16h5"/>',
  salida:'<path d="M6 21V4"/><path d="M6 4h11l-2.5 4L17 12H6"/>',
  cancha:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.2"/>'
};
const iconoRiel = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`;

function vPlay(){
  if(S.cerrando) return panelCierre();
  const h = S.hole, p = par(h), g = gps(h), rec = clubFor(g.mid), sc = R.scores[h];
  const conf = rec ? confianza(rec) : null;

  /* Lo único que puede empujar al plano hacia abajo son los avisos que piden
     una respuesta: el tee al que llegaste, el cruce que no coincide, el index
     viejo y la prueba grabando. Todos son raros y todos se responden y se van. */
  return `<div class="fade jugar">

  <div id="avisoTee">${avisoTeeHTML()}</div>
  ${avisoCruce(h) ? `<div class="pad">${avisoCruce(h)}</div>` : ''}
  ${(indexViejo() && !S.chequeoRonda)?`
  <div class="pad"><div class="card" style="background:var(--avisoBg);border-color:var(--avisoLn);margin-bottom:8px">
    <div class="row" style="align-items:flex-start"><div class="ico" style="background:var(--avisoIco)">${ico('🏅')}</div>
      <div style="min-width:0"><div style="font-weight:700;font-size:14px">¿Controlaste tu index?</div>
        <div class="dim" style="font-size:12px">${haceCuanto()}, y el handicap
        cambia los jueves. Con index ${verIndex(S.user.hcp)} salís
        ${verHcp(hcpJuego())} de ${tee().n.toLowerCase()}.</div></div></div>
    <div class="grid2" style="margin-top:11px">
      <button class="chip" onclick="go('handicap')">Actualizarlo</button>
      <button class="chip" onclick="S.chequeoRonda=true;render();toast('Listo, seguimos')">Está al día</button>
    </div>
  </div></div>`:''}
  ${panelPrueba() ? `<div class="pad">${panelPrueba()}</div>` : ''}

  <div class="mapa">
    ${holeSVG(h)}

    <div class="over tl">
      <span class="chapa"><b>Hoyo ${h}</b> · par ${p} · val ${COURSE.holes[h-1].hcp}</span>
      <button class="chapa suave" onclick="abrirHoja('salida')"
        style="border:0;font-family:inherit;cursor:pointer">${yards(h) ?? '—'} yds · ${teeDelHoyo(h)} ›</button>
      <span class="pill ${g.real?'':'gold'}" id="gpsPill">${
        g.real ? `GPS ±${g.acc} m` : (POS_ERR || 'Buscando señal…')}</span>
      <button class="pill" id="climaPill" onclick="abrirHoja('clima')" aria-label="El clima en la cancha"
        style="border:0;font-family:inherit;cursor:pointer;${climaCorto()?'':'display:none'}">${esc(climaCorto())}</button>
    </div>

    <div class="over tr">
     <div class="dists">
      <div class="k">Al centro</div>
      <div class="v" id="dMid">${g.mid ?? '—'}</div>
      <div class="fb"><span>frente <b id="dFront">${g.front ?? '—'}</b></span>
        <span>fondo <b id="dBack">${g.back ?? '—'}</b></span></div>
     </div>
     <div class="u" id="dUnid">${textoUnidad(g)}</div>
    </div>

    <div class="riel">
      <button onclick="abrirHoja('golpes')" aria-label="Registrar el palo">${iconoRiel('golpe')}Golpe</button>
      <button onclick="abrirHoja('grupo')" aria-label="La tarjeta del grupo">${iconoRiel('grupo')}Grupo</button>
      <button onclick="abrirHoja('tarjeta')" aria-label="Mi tarjeta">${iconoRiel('tarjeta')}Tarjeta</button>
      <button onclick="abrirHoja('cancha')" aria-label="Estacas y banderas">${iconoRiel('cancha')}Cancha</button>
    </div>

    ${rec ? `<button class="palo flota" onclick="go('bag')">
      <span class="cual">${etiq(rec)}</span>
      <span class="det"><b style="color:var(--txt)">${media(rec)} yds</b>${conf.nivel==='estimado'?'':' de media'} ·
        <span class="${conf.clase}">${conf.txt}</span></span>
      <span class="fl">›</span></button>`
    : `<button class="palo flota" onclick="go('bag')">
      <span class="det">Armá tu bolsa y te digo con qué palo pegar.</span>
      <span class="fl">›</span></button>`}

  </div>

  ${g.esperandoGPS && !POS_ERR?`<div class="avisoGps calmo">
    Buscando el GPS. Mientras tanto es una estimación con el largo del hoyo;
    en cuanto enganche pasan a ser tu distancia real.</div>`:''}
  ${!g.real && POS_ERR?`<div class="avisoGps">
    <b class="gold">Se perdió la ubicación</b> · <span class="dim">${POS_ERR}
    Las distancias son estimadas. Tu tarjeta se sigue anotando igual.</span></div>`:''}
  ${g.sinMedir?`<div class="avisoGps calmo">
    Sin distancias en este hoyo: falta la medición y el GPS todavía no enganchó.</div>`:''}

  <div class="barraJugar">
    <div class="sc"><div class="k">Tu score</div>
      <div class="v ${sc!==undefined?'acc':''}">${sc ?? '–'}</div></div>
    <button class="btn" onclick="abrirCierre(${h})">
      ${sc!==undefined ? 'Corregir el hoyo' : 'Terminar el hoyo'}</button>
  </div>
  </div>`;
}

/* ---------- LA BARRA FIJA DEL HOYO ----------
   Como en Hole19: flechas para moverse, y el centro se toca para saltar
   a cualquier hoyo. Está siempre a la vista, no se va con el scroll. */
function pintarBarra(){
  const b = document.getElementById('barra');
  if(!b) return;
  const jugando = S.tab === 'play' && !S.cerrando;
  b.className = jugando ? 'on' : '';
  if(!jugando){ b.innerHTML = ''; return; }
  const h = S.hole;
  b.innerHTML = `
    <button class="fl" onclick="mv(-1)" ${h===1?'disabled':''} aria-label="Hoyo anterior">‹</button>
    <button class="mid" onclick="abrirHoja('hoyos')">
      <div class="h">Hoyo ${h} · Par ${par(h)}</div>
      <div class="s">valuación ${COURSE.holes[h-1].hcp} · ${yards(h) ?? '—'} yds ·
        ${teeDelHoyo(h)} · tocá para saltar</div>
    </button>
    <button class="fl" onclick="mv(1)" ${h===S.vuelta?'disabled':''} aria-label="Hoyo siguiente">›</button>`;
}

/* ---------- LAS HOJAS ----------
   Todo lo que antes estaba en el camino y se usa de vez en cuando. */
function abrirHoja(cual){ S.hoja = cual; render(); }
function cerrarHoja(){ S.hoja = null; render(); }

function pintarHoja(){
  const e = document.getElementById('hoja');
  if(!e) return;
  if(!S.hoja){ e.className = ''; e.innerHTML = ''; return; }
  const H = HOJAS[S.hoja];
  if(!H){ e.className = ''; e.innerHTML = ''; return; }
  e.className = 'on';
  e.innerHTML = `<div class="fondo" onclick="cerrarHoja()"></div>
    <div class="panel" role="dialog" aria-label="${H.t}">
      <div class="tirador"></div>
      <div class="cab"><h3>${H.t}</h3>
        <button onclick="cerrarHoja()" aria-label="Cerrar">✕</button></div>
      <div class="cuerpo">${H.c()}</div>
    </div>`;
}

const HOJAS = {

  hoyos: { t:'Saltar a un hoyo', c: () => `
    <div class="g9" style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">
      ${Array.from({length:S.vuelta},(_,i)=>i+1).map(n=>{
        const s = R.scores[n];
        return `<button class="chip ${n===S.hole?'on':''}" style="padding:13px 2px;position:relative"
          onclick="S.hole=${n};cerrarHoja();$('#screen').scrollTop=0">
          ${n}<div style="font-size:9px;font-weight:600;opacity:.7">par ${par(n)}</div>
          ${s!==undefined?`<span style="position:absolute;top:2px;right:4px;font-size:9px;
            font-weight:800" class="${n===S.hole?'':'ok'}">${s}</span>`:''}
        </button>`}).join('')}
    </div>
    <div class="dim2" style="font-size:11px;margin:12px 0 4px">
      El número chico arriba a la derecha es lo que ya cargaste en ese hoyo.</div>` },

  salida: { t:'Salida y recorrido', c: () => `
    <div class="between" style="margin-bottom:10px">
      <div><div class="lbl">Estás jugando</div>
        <div style="font-weight:700;font-size:14px">${tee().n} · ${totalYds()} yds</div>
        <div class="dim2" style="font-size:11px">${ratingTxt(tee(), S.vuelta)}${
          S.vuelta===9?' · rating de la ida':''}</div></div>
      <button class="chip" style="padding:9px 13px;font-size:12px;flex:0 0 auto"
        onclick="setVuelta(${S.vuelta===9?18:9})">${S.vuelta} hoyos ⇄</button>
    </div>
    <div class="grid3">
      ${CLUB.tees.map(t=>`<button class="chip ${S.tee===t.id?'on':''}"
        style="padding:11px 3px;font-size:11.5px" onclick="setTee('${t.id}')">
        ${bolita(t)}${t.n}</button>`).join('')}
    </div>
    ${tee().nota?`<div class="dim2" style="font-size:11.5px;margin-top:10px">${tee().nota}</div>`:''}
    ${homologada(tee())?'':`<div class="aviso" style="margin-top:12px;background:var(--avisoBg);
      border:1px solid var(--avisoLn);border-radius:13px;padding:11px 13px">
      <div style="font-size:12.5px;font-weight:700;color:var(--gold)">${tee().n}: sin homologar</div>
      <div class="dim" style="font-size:11.5px;line-height:1.55;margin-top:3px">
        Las yardas son reales, pero esta salida todavía no tiene rating ni slope oficiales,
        así que tu handicap de cancha sale de la tabla de
        ${teeDelHcp(tee()).n.toLowerCase()} — lo mismo que se hace en el papel.</div>
    </div>`}
    <button class="btn ghost sm" style="margin-top:14px"
      onclick="cerrarHoja();go('handicap')">Ver mi handicap en cada salida</button>` },

  grupo: { t:'Tarjeta del grupo', c: () => RONDA ? grupoEnVivo() : `
    <table><thead><tr><th style="text-align:left">Jugador</th><th>Index</th><th>Cancha</th>
      <th>Golpes</th><th>Al par</th><th>Stbl</th></tr></thead><tbody>
    ${GROUP().map((pl,i)=>{
      /* Los hoyos de verdad: con el par y la valuación de ESE hoyo, no los de
         su posición en la lista (si te salteaste el 2, el 3 se contaba como 2). */
      const hs  = i===0 ? played() : pl.sc.map((_,j)=>j+1);
      const arr = i===0 ? hs.map(x=>R.scores[x]) : pl.sc;
      const t = arr.reduce((a,b)=>a+b,0);
      const parr = hs.reduce((a,h)=>a+par(h),0);
      /* Sin handicap no hay stableford: con 0 saldría el de un scratch, que es
         un puntaje inventado para alguien que todavía no cargó su index. */
      const stb = pl.hcp==null ? null
        : arr.reduce((a,s,j)=>a+stableford(s,par(hs[j]),COURSE.holes[hs[j]-1].hcp,pl.hcp),0);
      return `<tr><td class="name"><span class="avatar" style="width:22px;height:22px;font-size:9px;
        display:inline-flex;vertical-align:-6px;margin-right:7px">${esc(pl.i)}</span>${esc(pl.n)}</td>
        <td class="dim">${verIndex(pl.index)}</td><td class="dim">${verHcp(pl.hcp)}</td>
        <td style="font-weight:800">${t||'–'}</td>
        <td class="${t-parr<=0?'acc':''}">${arr.length?fmtPar(t-parr):'–'}</td>
        <td class="gold" style="font-weight:800">${arr.length&&stb!=null?stb:'–'}</td></tr>`;}).join('')}
    </tbody></table>
    <div class="dim2" style="font-size:11px;margin-top:10px">
      Los otros tres son de ejemplo. Para ver tu grupo de verdad, abrí una ronda con el grupo
      desde <b>Empezar la ronda</b>: cada uno entra con el mismo código y se ven entre todos.</div>` },

  /* Registrar con qué palo pegaste. Antes estaba apilado en la pantalla de
     jugar, entre las distancias y el score; ahora se abre desde el riel, que
     es como lo resuelve Hole19 y deja el plano limpio. */
  golpes: { t:'Registrar el palo', c: () => shotPanel(S.hole) },

  tarjeta: { t:'Mi tarjeta', c: () => {
    const fila = (desde, hasta, rot) => `
      <table style="min-width:100%"><thead><tr><th style="text-align:left">H</th>
        ${COURSE.holes.slice(desde,hasta).map(x=>`<th>${x.n}</th>`).join('')}<th>${rot}</th></tr></thead>
      <tbody>
        <tr><td class="name dim2" style="font-size:11px">PAR</td>
          ${COURSE.holes.slice(desde,hasta).map(x=>`<td class="dim2">${x.par}</td>`).join('')}
          <td class="dim2">${COURSE.holes.slice(desde,hasta).reduce((a,x)=>a+x.par,0)}</td></tr>
        <tr><td class="name">Yo</td>
          ${COURSE.holes.slice(desde,hasta).map(x=>{const s=R.scores[x.n];
            return `<td>${s?`<span class="sq ${scoreClass(s,x.par)}">${s}</span>`
              :'<span class="dim2">–</span>'}</td>`}).join('')}
          <td style="font-weight:800">${played().filter(x=>x>desde&&x<=hasta)
            .reduce((a,x)=>a+R.scores[x],0)||'–'}</td></tr>
      </tbody></table>`;
    return `<div style="overflow-x:auto">${fila(0,9,'IDA')}</div>
      ${S.vuelta>9?`<div style="overflow-x:auto;margin-top:14px">${fila(9,18,'VUELTA')}</div>`:''}
      <div class="between" style="margin-top:14px;padding:11px 13px;background:var(--tint);
        border-radius:13px">
        <div><div class="lbl">Golpes</div><div style="font-weight:800;font-size:20px">${total()||'–'}</div></div>
        <div><div class="lbl">Al par</div><div style="font-weight:800;font-size:20px"
          class="${toPar()<=0?'acc':''}">${played().length?fmtPar(toPar()):'–'}</div></div>
        <div><div class="lbl">Hoyos</div><div style="font-weight:800;font-size:20px">${played().length}</div></div>
      </div>
      <button class="btn ghost sm" style="margin:14px 0 8px"
        onclick="cerrarHoja();go('tarjeta')">Ver la tarjeta oficial completa</button>
      <button class="btn" style="margin-bottom:4px" onclick="cerrarHoja();finish()">
        ${S.torneo?'Cerrar y firmar la tarjeta':'Guardar la tarjeta'}</button>`; } },

  clima: { t:'El clima en la cancha', c: () => `${climaDetalle()}
    <div class="dim2" style="font-size:11px;margin-top:10px;line-height:1.5">Es el de la cancha, no el de cada hoyo.
    Se pide al abrir la app y al volver a ella, no más de una vez cada 15 minutos.</div>` },

  cancha: { t:'Estacas y banderas', c: () => `
    <div class="grid2">
      <div><div class="lbl" style="margin-bottom:8px">Estacas</div>
        ${CLUB.estacas.map(([t,c])=>`<div class="row" style="gap:9px;margin-bottom:7px">
          <span style="width:14px;height:14px;border-radius:50%;background:${c};
            border:1px solid #ffffff44;flex:0 0 auto"></span>
          <span style="font-size:13px">${t}</span></div>`).join('')}</div>

/* ============================================================
   TUS NÚMEROS, DE TUS VUELTAS
   ============================================================
   Hasta la v25 esta pantalla era un dibujo con cara de dato: "Score promedio
   86.4", "Handicap 14.2 ↓ desde 16.1", "23 rondas este año", los strokes gained,
   el patrón del driver, cuánto se emboca por distancia, un plan "generado con tus
   últimas 8 rondas"… todo escrito a mano y presentado como tuyo (relevamiento
   del 26/10/2026). Ahora sale de "Mis rondas" (`VUELTAS`, desde la v25) y de los
   golpes medidos de la bolsa, y donde no hay dato va una raya. Lo que todavía no
   se puede calcular con lo que se guarda —strokes gained, embocado por distancia,
   la historia del index— se dice como lo que es, sin números.
   `VUELTAS` puede venir de una copia armada a mano: `vueltaSana()` controla los
   totales, pero lo de adentro de cada `R` se vuelve a mirar acá (`enteroEn`). */
const hoyosDe = v => Object.keys((v && v.R && v.R.scores) || {})
  .map(Number).filter(h => enteroEn(h,1,18) && enteroEn(v.R.scores[h],1,20));
const vueltaEntera = v => (v.vuelta === 9 || v.vuelta === 18) && hoyosDe(v).length === v.vuelta;
/* Los golpes de una vuelta se cuentan de su tarjeta, no del total guardado:
   una copia armada a mano decía "Mejor vuelta 18" (revisión adversaria de la v26). */
const golpesDe = v => hoyosDe(v).reduce((a,h) => a + v.R.scores[h], 0);
/* "Por vuelta" estira a 18 hoyos lo que se anotó: con menos de nueve hoyos el
   número no dice nada (un hoyo de 3 putts daba "54.0 putts por vuelta"). */
const MIN_HOYOS = 9;
const promedio = l => l.length ? l.reduce((x,y)=>x+y,0) / l.length : null;
const un = (v, d=1) => v == null ? '–' : (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
const pct = (a, n) => n ? Math.round(a/n*100) + '%' : '–';
/* Cada hoyo jugado de cada vuelta guardada, con lo que se anotó. */
function hoyosJugados(){
  const l = [];
  VUELTAS.forEach(v => hoyosDe(v).forEach(h => {
    const R_ = v.R, pt = R_.putts && R_.putts[h];
    l.push({ h, par: par(h), sc: R_.scores[h],
             putts: enteroEn(pt,0,15) ? pt : null,
             fw: R_.fw && FW.some(([k]) => k === R_.fw[h]) ? R_.fw[h] : null,
             gir: R_.gir && typeof R_.gir[h] === 'boolean' ? R_.gir[h] : null });
  }));
  return l;
}
const golpesMedidos = () => BAG.reduce((a,b)=>a + (b.putter ? 0 : b.shots.length), 0);
const sinVueltas = () => `<div class="card" style="text-align:center;padding:22px 18px">
  <div style="font-weight:700">Todavía no terminaste ninguna vuelta en este teléfono</div>
  <div class="dim" style="font-size:13px;margin-top:5px">Cuando termines una, tus números salen de ahí.</div></div>`;

function kpi(a){return `<div class="grid2">${a.map(([l,v,s,c])=>
  `<div class="card" style="margin:0 0 10px"><div class="lbl">${l}</div>
   <div class="big ${c||''}" style="margin:5px 0 3px">${v}</div>
   <div class="dim" style="font-size:12px">${s}</div></div>`).join('')}</div>`;}

function statGeneral(){
  if(!VUELTAS.length) return sinVueltas() + statViene();
  /* Las de 18 y las de 9 no se promedian juntas: un 45 no es mejor que un 88. */
  const de = n => VUELTAS.filter(v => v.vuelta === n && vueltaEntera(v));
  const base = de(18).length ? 18 : de(9).length ? 9 : null;
  const enteras = base ? de(base) : [];
  const mejor = enteras.slice().sort((x,y)=>golpesDe(x)-golpesDe(y))[0];
  const anio = String(new Date().getFullYear());
  const H = hoyosJugados();
  const porPar = [3,4,5].map(p => { const l = H.filter(x=>x.par===p).map(x=>x.sc);
    return [p, promedio(l), l.length]; }).filter(([,m]) => m != null);
  return `${kpi([[base ? `Promedio en ${base} hoyos` : 'Promedio', base ? un(promedio(enteras.map(golpesDe))) : '–',
      base ? `${enteras.length} vuelta${enteras.length===1?'':'s'} completa${enteras.length===1?'':'s'}` : 'todavía ninguna completa'],
    ['Mejor vuelta', mejor ? golpesDe(mejor) : '–', mejor ? `${base} hoyos · ${fechaCorta(new Date(mejor.fecha+'T12:00:00'))}` : 'falta una completa'],
    ['Index', verIndex(S.user.hcp), S.user.hcp==null ? 'todavía no lo cargaste' : 'el que cargaste'],
    ['Vueltas', VUELTAS.filter(v => String(v.fecha).slice(0,4) === anio).length, 'este año, en este teléfono']])}
  <div class="card"><h3>Promedio por par</h3>
    ${porPar.length ? porPar.map(([p,m,n])=>`<div style="margin-bottom:12px"><div class="between" style="font-size:13px;margin-bottom:5px">
        <span style="font-weight:600">Par ${p} <span class="dim2" style="font-weight:500;font-size:11px">${n} hoyo${n===1?'':'s'}</span></span>
        <span class="mono" style="font-weight:800">${un(m)} <span class="dim2" style="font-size:11px">${fmtPar(Math.round((m-p)*10)/10)}</span></span></div>
        <div class="bar"><i style="width:${Math.max(3, Math.min(100, (m-p)*50))}%"></i></div></div>`).join('')
      : '<div class="dim" style="font-size:13px">Sin hoyos anotados todavía.</div>'}
    <div class="dim2" style="font-size:11px">La barra es cuánto pasás el par: llena son dos golpes.</div>
  </div>
  ${statViene()}`;
}

    <div class="between"><div><div class="lbl">Golpes medidos</div>

      <div style="text-align:right"><div class="lbl">Palos</div><div class="big">${BAG.filter(b=>b.on).length}</div></div>
    </div>

  <div class="card"><h3>Tus distancias medidas</h3>
    ${medidos.length ? medidos.map(b=>`<div style="margin-bottom:13px">

        <span class="mono" style="font-weight:800">${avg(b)} <span class="dim2" style="font-size:11px;font-weight:600">±${disp(b)}</span></span></div>
      <div style="position:relative;height:9px;background:var(--tint);border-radius:99px">

        <div style="position:absolute;left:${Math.min(100,(avg(b)/mx)*100)}%;width:3px;height:100%;

    : `<div class="dim" style="font-size:13px;line-height:1.5">Aparecen cuando midas golpes en la cancha:
       registrás el palo al pegar, y la app mide hasta donde quedó la bola cuando cerrás el hoyo o pegás el siguiente.</div>`}
  </div>

  <div class="card"><h3>Huecos entre palos</h3>
    ${G.map(x=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--hair)">

    <div class="dim" style="font-size:12px;margin-top:10px">
      ${hueco.length
        ? `Hay ${hueco.length} hueco${hueco.length>1?'s':''} de 20+ yds (${hueco.map(x=>etiq(x.a)+'–'+etiq(x.b)).join(', ')}). Ahí quedan golpes "entre palos".`
        : 'La bolsa está bien escalonada, sin huecos grandes.'}

function statJuego(){
  const dr = BAG.find(b=>b.c==='Dr'), H = hoyosJugados();
  const sal = H.filter(x=>x.fw), fw = sal.filter(x=>x.fw==='fw').length;
  const izq = sal.filter(x=>x.fw==='izq').length, der = sal.filter(x=>x.fw==='der').length;
  const g = H.filter(x=>x.gir!=null), gir = g.filter(x=>x.gir).length;
  const lado = izq===der ? (izq ? 'tantas a un lado como al otro' : 'sin salidas erradas a los costados')
             : `más a la ${izq>der?'izquierda':'derecha'}`;
  return `${kpi([['Fairways', pct(fw, sal.length), sal.length ? `${fw} de ${sal.length} salidas anotadas` : 'anotá dónde quedó el drive'],
    ['Greens en regulación', pct(gir, g.length), g.length ? `${gir} de ${g.length} hoyos` : 'sale de golpes y putts'],
    ['Distancia driver', dr && dr.shots.length ? avg(dr) : '–', dr && dr.shots.length ? `yds · ${dr.shots.length} golpe${dr.shots.length===1?'':'s'} medido${dr.shots.length===1?'':'s'}` : 'sin golpes medidos'],
    ['Salidas erradas', sal.length ? `${izq} · ${der}` : '–', sal.length ? `izquierda · derecha: ${lado}` : 'todavía sin datos', izq+der ? 'red' : '']])}
  <div class="card" style="margin-bottom:24px">
    <div class="dim" style="font-size:12px;line-height:1.55">Sale de lo que anotás al cerrar cada hoyo en tus vueltas
    terminadas. El patrón del driver —cuánto y hacia dónde se abre— necesita la posición donde quedó cada
    salida, que la app todavía no guarda.</div></div>`;
}
function statCorto(){
  const H = hoyosJugados(), P = H.filter(x=>x.putts!=null);
  const pg = P.filter(x=>x.gir===true);
  const tres = P.filter(x=>x.putts>=3).length;
  const sinGir = H.filter(x=>x.gir===false), salvo = sinGir.filter(x=>x.sc<=x.par).length;
  const alcanza = P.length >= MIN_HOYOS, faltan = `hacen falta ${MIN_HOYOS} hoyos con putts (van ${P.length})`;
  return `${kpi([['Putts por vuelta', alcanza ? un(promedio(P.map(x=>x.putts))*18) : '–', alcanza ? `de 18 hoyos · ${P.length} hoyos con putts` : faltan],
    ['Putts en green en regulación', pg.length ? un(promedio(pg.map(x=>x.putts)),2) : '–', pg.length ? `${pg.length} hoyos` : 'todavía sin datos'],
    ['Par o mejor sin green', pct(salvo, sinGir.length), sinGir.length ? `${salvo} de ${sinGir.length} hoyos` : 'todavía sin datos'],
    ['3 putts', alcanza ? un(tres/P.length*18) : '–', alcanza ? `por vuelta de 18 · ${tres} en total` : faltan, alcanza && tres ? 'red' : '']])}
  <div class="card" style="margin-bottom:24px">

    dónde fue cada putt, y la app todavía no lo pregunta.</div></div>`;
}

function clubInvierno(){
  const I=CLUB.invierno;
  const yo = INVIERNO.find(x=>x.yo);
  const porGross = INVIERNO.slice().sort((a,b)=>sumaGross(a)-sumaGross(b));
  const clasClub = porGross.filter(j=>j.negras>=I.copas[0].req.negras).slice(0,I.copas[0].cupo);
  const enClub = new Set(clasClub.map(j=>j.n));
  const porNeto = INVIERNO.filter(j=>!enClub.has(j.n)).sort((a,b)=>sumaNeto(a)-sumaNeto(b));
  const faltaNegras = Math.max(0, I.copas[0].req.negras - yo.negras);
  const faltaFechas = Math.max(0, I.cuentan - yo.fechas);

  return `
  <div class="card" style="background:linear-gradient(135deg,var(--tint),var(--card));border-color:var(--acc2)">
    <div class="between"><div style="min-width:0">
      <div class="lbl">${I.desde} al ${I.hasta}</div>
      <div style="font-weight:800;font-size:17px">${I.n}</div>
      <div class="dim" style="font-size:12px">Suman tus mejores ${I.cuentan} tarjetas</div></div>
      <div style="text-align:right"><div class="lbl">Fechas</div>
        <div class="big">${I.fechasJugadas}</div>
        <div class="dim2" style="font-size:11px">de ${I.minFechas} mín.</div></div>
    </div>
  </div>

  <h3>Cómo venís vos</h3>
  <div class="card">
    <div class="grid3" style="text-align:center;margin-bottom:12px">
      <div><div class="big" style="font-size:26px">${yo.fechas}</div><div class="lbl" style="font-size:9px">Tarjetas</div></div>
      <div><div class="big acc" style="font-size:26px">${sumaGross(yo)}</div><div class="lbl" style="font-size:9px">Gross (mejores ${I.cuentan})</div></div>
      <div><div class="big" style="font-size:26px">${sumaNeto(yo)}</div><div class="lbl" style="font-size:9px">Neto</div></div>
    </div>
    <div class="sep"></div>
    ${[['🏆','Copa Trisquelia', porNeto.findIndex(j=>j.yo)>=0 && porNeto.findIndex(j=>j.yo)<I.copas[1].cupo,
        `Vas ${porNeto.findIndex(j=>j.yo)+1}º en la tabla neto. Entran ${I.copas[1].cupo}.`],
       ['🥇','Copa del Club', clasClub.some(j=>j.yo),
        faltaNegras? `Te faltan ${faltaNegras} salidas de negras (llevás ${yo.negras} de ${I.copas[0].req.negras}).`
                   : `Vas ${porGross.findIndex(j=>j.yo)+1}º en la tabla gross. Entran ${I.copas[0].cupo}.`]]
      .map(([ic,t,ok,d])=>`<div class="item"><div class="ico">${ico(ic)}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${t}</div>
          <div class="dim" style="font-size:12px">${d}</div></div>
        <span class="pill ${ok?'':'gold'}">${ok?'Entrando':'Afuera'}</span></div>`).join('')}
    ${faltaFechas?`<div class="dim2" style="font-size:11px;margin-top:9px">
      Con ${yo.fechas} tarjetas todavía no llegás a las ${I.cuentan} que suman. Te faltan ${faltaFechas}.</div>`:''}
    <div class="dim2" style="font-size:11px;margin-top:9px">
      Las salidas de negras las cuenta sola la app: sale de la tarjeta que firmás en cada fecha.</div>
  </div>

  <h3>Copa del Club · tabla gross</h3>
  <div class="card" style="padding:12px">
    <div class="dim" style="font-size:12px;margin-bottom:9px">
      Entran los ${I.copas[0].cupo} de menor gross. ${I.copas[0].extra}.</div>
    <table><thead><tr><th style="text-align:left">#</th><th style="text-align:left">Jugador</th>
      <th>Tarj.</th><th>Negras</th><th>Gross</th></tr></thead><tbody>
    ${porGross.slice(0,10).map((j,k)=>{
      const dentro = clasClub.includes(j);
      return `<tr style="${j.yo?'background:var(--tint)':''};${dentro?'':'opacity:.55'}">
        <td class="${dentro?'gold':''}" style="font-weight:800">${k+1}</td>
        <td class="name">${esc(nomDe(j))}</td><td class="dim">${j.fechas}</td>
        <td class="${j.negras>=I.copas[0].req.negras?'acc':'red'}">${j.negras}</td>
        <td style="font-weight:800">${sumaGross(j)}</td></tr>`}).join('')}
    </tbody></table>
    <div class="dim2" style="font-size:11px;margin-top:9px">
      En gris, los que hoy no cumplen las ${I.copas[0].req.negras} salidas de negras.</div>
  </div>

  <h3>Copa Trisquelia · tabla neto</h3>
  <div class="card" style="padding:12px">
    <div class="dim" style="font-size:12px;margin-bottom:9px">
      Entran ${I.copas[1].cupo} por neto, sin contar a los ya clasificados a la Copa del Club.</div>
    <table><thead><tr><th style="text-align:left">#</th><th style="text-align:left">Jugador</th>
      <th>Hcp</th><th>Tarj.</th><th>Neto</th></tr></thead><tbody>
    ${porNeto.map((j,k)=>`<tr style="${j.yo?'background:var(--tint)':''}">
      <td class="${k<I.copas[1].cupo?'gold':''}" style="font-weight:800">${k+1}</td>
      <td class="name">${esc(nomDe(j))}</td><td class="dim">${j.hcp}</td><td class="dim">${j.fechas}</td>
      <td style="font-weight:800">${sumaNeto(j)}</td></tr>`).join('')}
    </tbody></table>
  </div>

  <h3>El reglamento, en corto</h3>
  <div class="card" style="margin-bottom:24px">
    ${[['👤','Quién puede',I.requisitos],
       ['📋','Cómo se clasifica',`Suman las mejores ${I.cuentan} tarjetas del ${I.desde} al ${I.hasta}. Mínimo ${I.minFechas} fechas.`],
       ['🥇',I.copas[0].n,I.copas[0].juego+' '+I.copas[0].req.txt+'.'],
       ['🏆',I.copas[1].n,I.copas[1].juego],
       ['⚖️','Desempate',I.desempate],
       ['⛳','Tees',I.tees],
       ['📞','Oficial de Reglas',CLUB.pro.tel
          ? `${CLUB.pro.n} · ${CLUB.pro.tel}`
          : `${CLUB.pro.n} · pedile el teléfono en la sede`]].map(([ic,t,d])=>
      `<div class="item"><div class="ico">${ico(ic)}</div><div style="min-width:0">
        <div style="font-weight:600;font-size:13px">${t}</div>
        <div class="dim" style="font-size:12px">${d}</div></div></div>`).join('')}
    <div class="sep"></div>
    <h3>Calculadora de ventaja</h3>
    <div class="dim" style="font-size:12px;margin-bottom:10px">
      En la Copa Trisquelia se dan el 85% de la diferencia de handicap.</div>
    <div class="grid2">
      <div><div class="lbl">Tu handicap</div>
        <input value="${esc(S.vA??10)}" inputmode="decimal" oninput="S.vA=+this.value||0;pintarVentaja()"
          style="width:100%;margin-top:6px;padding:12px;border-radius:11px;background:var(--nav);
          border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px;font-weight:700;text-align:center"></div>
      <div><div class="lbl">El del rival</div>
        <input value="${esc(S.vB??18)}" inputmode="decimal" oninput="S.vB=+this.value||0;pintarVentaja()"
          style="width:100%;margin-top:6px;padding:12px;border-radius:11px;background:var(--nav);
          border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px;font-weight:700;text-align:center"></div>

    </div>
  </div>`;
}

   inventadas —"Tu tee time es en 2 horas", "Quedan 11 lugares en la Copa",

/* ---------- LA TARJETA COMPLETA ----------
   Si la digital reemplaza al papel, tiene que decir exactamente lo mismo:
   par y valuación de cada hoyo, yardas de las tres salidas, subtotales de
   ida y vuelta, rating y slope, y el bloque de firmas. */
function ydsTee(t,h){ return yardaDe(t,h); }
function tablaTarjeta(desde,hasta,rot){
  const hs = COURSE.holes.slice(desde-1,hasta);
  const sub = a => a.reduce((x,y)=>x+y,0);
  const jug = hs.map(x=>R.scores[x.n]);
  return `<table style="min-width:${(hasta-desde+1)*34+108}px">
    <thead><tr><th style="text-align:left;min-width:98px">Hoyo</th>
      ${hs.map(x=>`<th>${x.n}</th>`).join('')}<th style="min-width:42px">${rot}</th></tr></thead>
    <tbody>
      ${CLUB.tees.map(t=>`<tr><td class="name" style="font-size:11px">${bolita(t)}${t.n}</td>
        ${hs.map(x=>`<td class="dim">${ydsTee(t,x.n)}</td>`).join('')}
        <td style="font-weight:700">${sub(hs.map(x=>ydsTee(t,x.n)))}</td></tr>`).join('')}
      <tr><td class="name" style="font-weight:800">Par</td>
        ${hs.map(x=>`<td style="font-weight:800">${x.par}</td>`).join('')}
        <td style="font-weight:800">${sub(hs.map(x=>x.par))}</td></tr>
      <tr><td class="name dim2" style="font-size:11px">Valuación</td>
        ${hs.map(x=>`<td class="dim2">${x.hcp}</td>`).join('')}<td></td></tr>
      <tr><td class="name">Golpes</td>
        ${hs.map(x=>{const v=R.scores[x.n];
          return `<td>${v?`<span class="sq ${scoreClass(v,x.par)}">${v}</span>`:'<span class="dim2">–</span>'}</td>`}).join('')}
        <td style="font-weight:800">${jug.some(v=>v)?sub(jug.filter(Boolean)):'–'}</td></tr>
    </tbody></table>`;
}

/* ---------- PASAR LAS TARJETAS A LA FEDERACIÓN ----------

          <button class="btn sm" onclick="yaCargada(${PARA_AAG.indexOf(t)})">Ya la cargué</button>

      <div style="font-size:32px">✅</div>
      <div style="font-weight:700;margin-top:8px">No queda ninguna pendiente</div>
      <div class="dim" style="font-size:13px;margin-top:4px">Todas las tarjetas de la fecha ya están en la federación.</div>

    ${listas.length?`<div class="card" style="margin-bottom:24px"><h3>Ya cargadas</h3>
      ${listas.map(t=>`<div class="item"><div class="ico">${ico('✓')}</div>

        ${!S.torneo?'border-color:var(--acc);background:var(--tint)':''}" onclick="S.torneo=false;render()">

        <div style="font-weight:800;font-size:15px;margin-top:6px">Práctica</div>
        <div class="dim" style="font-size:11px">Para vos, no va al club</div>

    </div>

    ${!S.torneo?`
    <div class="card">
      <div class="row" style="align-items:flex-start"><div class="ico">${ico('🎯')}</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:14px">Ronda de práctica</div>
          <div class="dim" style="font-size:12px">Llevás vos tu tarjeta. Cargás los palos y las distancias

/* ---------- FIRMA DE LA TARJETA ----------
   Regla 3.3b: la tarjeta la anota un marcador y la firman los dos.
   Sin las dos firmas no es válida. Acá se cruzan los dos anotadores
   antes de firmar, que es lo que en papel se descubre tarde. */
/* LO QUE ANOTÓ MI MARCADOR, de donde esté: con la ronda compartida, en lo que
   mandó al servidor; sin ella, en `MARCA`. Hasta la v26 la firma miraba sólo
   `MARCA`, que en la ronda compartida nadie llena: con el nombre de verdad del
   marcador decía "Ana todavía no anotó nada tuyo" mientras Jugar avisaba "No
   coinciden en el hoyo 1", y dejaba certificar con el cruce abierto (revisión
   adversaria de la v26). */
const marcaDe = h => RONDA ? (loQueDiceMiMarcador(h) || {}).golpes : MARCA[h];
function difs(){
  return played().filter(h => marcaDe(h)!==undefined && marcaDe(h)!==R.scores[h]);
}
/* VACÍO NO ES "COINCIDE".
   `MARCA` guarda lo que el marcador anotó de mí. Mientras no haya anotado
   nada está vacío, y hasta la v21 la pantalla leía ese vacío como acuerdo:
   decía "Lo que anotó MD coincide con tus golpes en los 18 hoyos" cuando el
   marcador no había escrito un solo número, y el total de su fila sumaba MIS
   golpes con el rótulo de los suyos (`MARCA[h] ?? R.scores[h]`), al lado de
   una fila de rayas. Una tarjeta que dice "está todo bien" sin que nadie la
   haya cruzado es peor que no mostrar nada: es la clase de confirmación falsa
   que en papel termina en descalificación.
   Mientras el cruce de verdad viva en la ronda compartida, acá se dice la
   verdad: que todavía no hay nada del otro lado. */
const hayMarca = () => played().some(h => marcaDe(h) !== undefined);
function vFirma(){
  const mio = marcador(), suyo = marcado();
  const d = difs(), p = played();
  return `<div class="fade">
  <div class="hdr"><div class="row"><button class="arrow" onclick="go('play')">‹</button>
    <div><div class="lbl">${CLUB.corto} · ${p.length} hoyos</div><h1 style="font-size:22px">Cerrar la tarjeta</h1></div></div></div>
  <div class="pad">
    ${mio.ejemplo ? cartelEjemplo('Sin la ronda del grupo', 'Tu marcador y el jugador que marcás son de ejemplo: lo que se firma acá queda sólo en este teléfono. Para cruzar la tarjeta de verdad, jugá con la ronda compartida.') : ''}

    <h3>1 · Tu tarjeta, la que anotó ${esc(mio.n)}</h3>
    <div class="card" style="padding:12px">
      <table><thead><tr><th style="text-align:left">H</th>
        ${p.map(h=>`<th>${h}</th>`).join('')}<th>TOT</th></tr></thead><tbody>
        <tr><td class="name dim2" style="font-size:11px">PAR</td>
          ${p.map(h=>`<td class="dim2">${par(h)}</td>`).join('')}
          <td class="dim2">${p.reduce((a,h)=>a+par(h),0)}</td></tr>
        <tr><td class="name">${esc(mio.i)} anotó</td>
          ${p.map(h=>{ const m = marcaDe(h);
            return `<td><span class="sq ${m!==undefined?scoreClass(m,par(h)):''}">${m!==undefined?esc(m):'–'}</span></td>`; }).join('')}
          <td style="font-weight:800">${p.length && p.every(h=>marcaDe(h)!==undefined) ? p.reduce((a,h)=>a+marcaDe(h),0) : '–'}</td></tr>
        <tr><td class="name dim2" style="font-size:11px">tus golpes</td>
          ${p.map(h=>`<td class="${marcaDe(h)!==undefined&&marcaDe(h)!==R.scores[h]?'red':'dim2'}">${R.scores[h]}</td>`).join('')}
          <td class="dim2">${total()}</td></tr>
      </tbody></table>

      ${d.length?`
      <div style="background:var(--malBg);border:1px solid var(--malLn);border-radius:12px;padding:12px;margin-top:12px">
        <div style="font-weight:700;font-size:13px" class="red">No coincide en ${d.length} hoyo${d.length>1?'s':''}</div>
        <div class="dim" style="font-size:11px;margin-bottom:8px">
          Resolvelo con ${esc(mio.n)} antes de certificar. En papel esto termina en descalificación.</div>
        ${d.map(h=>`<div class="between" style="padding:8px 0;border-top:1px solid var(--hair)">
          <span style="font-weight:700;font-size:13px">Hoyo ${h}</span>
          <div style="display:flex;gap:7px">
            <button class="chip" style="padding:7px 11px" onclick="resolver(${h},${R.scores[h]})">Van ${R.scores[h]}</button>
            <button class="chip" style="padding:7px 11px" onclick="resolver(${h},${+marcaDe(h)})">Van ${esc(marcaDe(h))}</button>
          </div></div>`).join('')}
      </div>`:!hayMarca()?`
      <div class="row" style="background:var(--ojoBg);border:1px solid var(--ojoLn);border-radius:11px;padding:10px 12px;margin-top:12px">
        <div class="ico" style="width:30px;height:30px;font-size:14px">${ico('👀')}</div>
        <div class="dim" style="font-size:12px">${esc(mio.n)} todavía no anotó nada tuyo, así que no hay con qué
        cruzar. Cruzala con ${esc(mio.n)} antes de firmar.</div>
      </div>`:`
      <div class="row" style="background:var(--tint);border-radius:11px;padding:10px 12px;margin-top:12px">
        <div class="ico" style="width:30px;height:30px;font-size:14px">${ico('✅')}</div>
        <div class="dim" style="font-size:12px">${(() => { const n = p.filter(h => marcaDe(h) !== undefined).length;
          return n === p.length ? `Lo que anotó ${esc(mio.n)} coincide con tus golpes en los ${p.length} hoyos.`
            : `Coincide en los ${n} hoyo${n===1?'':'s'} que anotó ${esc(mio.n)}. Le falta${p.length-n===1?'':'n'} ${p.length-n}: cruzalos antes de firmar.`; })()}</div>
      </div>`}

      ${S.presento===false?`
      <div class="row" style="background:var(--avisoBg);border:1px solid var(--avisoLn);border-radius:11px;padding:11px 13px;margin-top:12px">
        <div class="ico" style="background:var(--avisoIco);width:32px;height:32px;font-size:15px">${ico('🚫')}</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:13px" class="gold">No presentás esta tarjeta</div>
        <div class="dim" style="font-size:11px">No cuenta para el Invierno ni va al club.
        Igual te queda guardada para vos, con los palos y las distancias que cargaste.</div></div>
      </div>
      <button class="btn ghost sm" style="margin-top:11px" onclick="S.presento=null;render()">Volver atrás</button>`
      : S.certifico?`
      <button class="btn ghost sm" style="margin-top:12px">✓ Certificada y lista para presentar</button>`
      :`
      <button class="btn sm" style="margin-top:12px" onclick="certificar()">Certificar y presentar</button>
      <button class="btn ghost sm" style="margin-top:8px" onclick="noPresentar()">No presentar mi tarjeta</button>
      <div class="dim2" style="font-size:11px;margin-top:9px">
        Podés no presentarla, como en papel. La que llevás vos de ${esc(suyo.n)} se entrega igual.</div>`}
    </div>

    <h3>2 · La tarjeta de ${esc(suyo.n)}, que llevaste vos</h3>
    <div class="card" style="padding:12px">
      <table><thead><tr><th style="text-align:left">H</th>
        ${p.map(h=>`<th>${h}</th>`).join('')}<th>TOT</th></tr></thead><tbody>
        <tr><td class="name dim2" style="font-size:11px">PAR</td>
          ${p.map(h=>`<td class="dim2">${par(h)}</td>`).join('')}
          <td class="dim2">${p.reduce((a,h)=>a+par(h),0)}</td></tr>
        <tr><td class="name">${esc(suyo.i)}</td>
          ${p.map(h=>`<td><span class="sq ${OTRO[h]!=null?scoreClass(OTRO[h],par(h)):''}">${OTRO[h]??'–'}</span></td>`).join('')}
          <td style="font-weight:800">${p.length && p.every(h=>OTRO[h]!=null) ? p.reduce((a,h)=>a+OTRO[h],0) : '–'}</td></tr>

/* ---------- RESUMEN DE RONDA ---------- */
/* EL RESUMEN SÓLO DICE LO QUE JUGASTE.
   Hasta la v24 mezclaba los números de la vuelta con frases escritas a mano:
   "Stableford 31 pts", "Hoyo 6 — birdie", "Hoyo 2 — doble bogey · es tu patrón",
   "por encima de tu media de la temporada", "si convertías dos de los tres
   up&down que fallaste…". Ninguna salía de la tarjeta, y después de una vuelta
   de verdad le contaban al socio un birdie que no hizo. Ahora todo sale de `R`,
   y lo que no se cargó no aparece como cero: "0 putts" en una vuelta en la que
   nadie anotó putts es un número inventado. El Stableford usa la misma cuenta
   que la tabla del grupo, y sin index no hay Stableford. */
function vSummary(){
  const p=played(), t=total(), tp=toPar();
  const b=p.filter(h=>R.scores[h]<par(h)).length;
  const pars=p.filter(h=>R.scores[h]===par(h)).length;
  const bog=p.filter(h=>R.scores[h]>par(h)).length;
  const conPutts = p.filter(h => R.putts[h] != null);
  const putts = conPutts.length ? conPutts.reduce((a,h)=>a+R.putts[h],0) : null;
  const tresPutts = conPutts.filter(h => R.putts[h] >= 3).length;
  const conFw = p.filter(h => par(h) > 3 && R.fw[h] != null);
  const fw = conFw.filter(h => R.fw[h] === 'fw').length;
  const hc = hcpJuego();
  const stb = (hc == null || !p.length) ? null
    : p.reduce((a,h)=>a+stableford(R.scores[h], par(h), COURSE.holes[h-1].hcp, hc), 0);
  const dif = h => R.scores[h] - par(h);
  const orden = p.slice().sort((x,y)=> dif(x)-dif(y) || x-y);
  const mejor = orden[0], peor = orden[orden.length-1];
  const hayExtremos = p.length >= 2 && dif(mejor) !== dif(peor);
  const resultado = d => d<=-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':d===2?'doble bogey':`+${d}`;
  const detalle = h => { const y = yards(h);
    return `Par ${par(h)}${y != null ? ' · ' + y + ' yds' : ''}${R.putts[h] != null
      ? ' · ' + R.putts[h] + (R.putts[h] === 1 ? ' putt' : ' putts') : ''}`; };
  return `<div class="fade">
  <div class="pad" style="padding-top:20px">
    <div class="card" style="background:linear-gradient(135deg,var(--tint),var(--card));border-color:var(--acc2);text-align:center;padding:24px">
      <div style="font-size:40px">⛳</div>
      <div class="lbl" style="margin-top:6px">${!S.torneo?'Ronda de práctica'
        :(S.presento===false?'No presentada · queda para vos'
        :(S.entregada?'Tarjeta firmada':'Tarjeta de torneo'))} · ${CLUB.corto}</div>
      <div style="font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.05">${t}</div>
      <div class="pill" style="font-size:14px;padding:6px 16px">${fmtPar(tp)} al par · ${p.length} hoyos</div>
      <div class="sep"></div>
      <div class="between"><div><div class="lbl">Handicap</div>
        <div style="font-weight:800;font-size:18px">${verIndex(S.user.hcp)} · cancha ${verHcp(hcpJuego())}</div></div>
        <div style="text-align:right"><div class="lbl">Stableford</div>
        <div style="font-weight:800;font-size:18px">${stb == null ? '–' : stb + ' pts'}</div></div></div>
    </div>

    <div class="grid4">
      ${[['Birdies',b,'acc'],['Pares',pars,''],['Bogeys+',bog,''],['Putts',putts == null ? '–' : putts,'']].map(([l,v,c])=>
        `<div class="card" style="margin:0 0 10px;text-align:center;padding:12px 6px">
          <div class="big ${c}" style="font-size:24px">${v}</div>
          <div class="lbl" style="font-size:9px">${l}</div></div>`).join('')}
    </div>

    ${hayExtremos || conFw.length ? `<div class="card"><h3>Lo mejor y lo peor</h3>
      ${hayExtremos ? `
      <div class="item"><div class="ico">${ico('🔥')}</div><div><div style="font-weight:700">Hoyo ${mejor} — ${resultado(dif(mejor))}</div>
        <div class="dim" style="font-size:12px">${detalle(mejor)}</div></div></div>
      <div class="item"><div class="ico">${ico('🩹')}</div><div><div style="font-weight:700">Hoyo ${peor} — ${resultado(dif(peor))}</div>
        <div class="dim" style="font-size:12px">${detalle(peor)}</div></div></div>` : ''}
      ${conFw.length ? `
      <div class="item"><div class="ico">${ico('📈')}</div><div><div style="font-weight:700">${fw} fairways de ${conFw.length}</div>
        <div class="dim" style="font-size:12px">En los par 4 y par 5 donde anotaste la salida.</div></div></div>` : ''}
    </div>` : ''}

    ${(()=>{const all=[].concat(...Object.values(R.shots));
      if(!all.length)return '';
      const by={};all.forEach(s=>{(by[s.c]=by[s.c]||[]).push(s.d)});
      /* A la bolsa entra sólo lo MEDIDO, y nunca el putter (`cerrarGolpeAbierto`).
         Decía "estos N golpes ya se sumaron" contando todos, y los sin medir
         salían como huecos en la lista. */
      const aLaBolsa = all.filter(s => s.d != null && !(palo(s.c)||{}).putter).length;
      return `<div class="card"><h3>Lo que cargaste esta ronda</h3>
        ${Object.entries(by).map(([c,ds])=>{ const med = ds.filter(d => d != null);
          return `<div class="between" style="padding:8px 0;border-bottom:1px solid var(--hair)">
            <span style="font-weight:700">${esc(etiq(palo(c)))} <span class="dim2" style="font-weight:500;font-size:12px">×${ds.length}</span></span>
            <span class="mono dim" style="font-size:13px">${med.length ? med.join(' · ') + ' yds' : ''}${med.length < ds.length
              ? (med.length ? ' · ' : '') + (ds.length - med.length) + ' sin medir' : ''}</span></div>`; }).join('')}
        <div class="dim" style="font-size:12px;margin-top:10px">
          ${aLaBolsa ? (aLaBolsa === 1 ? 'El golpe medido ya se sumó' : `Los ${aLaBolsa} golpes medidos ya se sumaron`)
            + ' a las medias de tu bolsa. Los del putter y los que no se pudieron medir no cuentan.'
            : 'Ninguno se pudo medir —hace falta GPS al pegar y al llegar a la bola—, así que tu bolsa no cambió.'}</div>
        <button class="btn ghost sm" style="margin-top:10px" onclick="go('bag')">Ver mi bolsa</button>
      </div>`})()}

    ${putts != null ? `<div class="card"><h3>En el green</h3>
      <p style="font-size:13px;margin:0">${putts} putts en ${conPutts.length} ${conPutts.length === 1 ? 'hoyo' : 'hoyos'}${
        tresPutts ? `, y ${tresPutts} ${tresPutts === 1 ? 'hoyo' : 'hoyos'} con tres putts o más.` : ', sin ningún tres putts.'}</p>
    </div>` : ''}

    <div style="margin-bottom:24px">
      <button class="btn" onclick="dibujo('compartir la tarjeta')">Compartir tarjeta</button>
      <div style="height:8px"></div>
      <button class="btn ghost sm" onclick="go('home')">Volver al inicio</button>
    </div>
  </div></div>`;
}

  /* ---- 4. handicap ---- */
  if(S.onb===4) return `<div class="fade">${paso(3,'Tu handicap')}

  if(S.onb===5) return `<div class="fade">${paso(4,'Armá tu bolsa')}

        <div class="lbl" style="margin:10px 0 2px">${g}</div>
        ${lista.map(({b,i})=>`<div class="item" style="padding:9px 0">

  return `<div class="fade" style="height:100%;display:flex;flex-direction:column;

}

/* Antes esto administraba al equipo: listaba las cuatro personas y dejaba
   cambiarles el rol. Los dos lados eran mentira — la lista estaba escrita
   en el código y el cambio de rol se perdía al recargar. Ahora muestra lo
   único que la app sabe con certeza: tu propio acceso, tal como te lo
   contestó el servidor cuando pegaste la llave. Dar y quitar permisos lo

   escribir ahí y no en una constante. */
function vPermisos(){
  const q = quien();
  if(!q) return vHome();
  const rol = ROLES[q.rol] || {n:q.rol, c:'', p:q.permisos};
  return `<div class="fade">
  <div class="hdr"><div class="row"><button class="arrow" onclick="go('dash')">‹</button>
    <div><div class="lbl">Panel · ${CLUB.corto}</div><h1 style="font-size:22px">Tu acceso</h1></div></div></div>

    <div class="card" style="background:linear-gradient(135deg,var(--tint),var(--card));border-color:var(--acc2)">
      <div class="lbl">Puesto</div>
      <div style="font-weight:800;font-size:18px">${esc(q.puesto||'—')}</div>
      ${q.persona?`<div class="dim" style="font-size:13px;margin-top:2px">Lo ocupa ${esc(q.persona)}</div>`:
        `<div class="dim" style="font-size:13px;margin-top:2px">Sin titular cargado</div>`}
      <div class="sep"></div>
      <div class="between"><div><div class="lbl">Rol</div>
        <div style="font-weight:700;font-size:15px">${rol.n}</div></div>
        <span class="pill ${rol.c||''}">${q.permisos.length} permiso${q.permisos.length===1?'':'s'}</span></div>
    </div>

    <h3>Qué podés hacer</h3>
    <div class="card">
      ${Object.entries(PERMISOS).map(([k,pm])=>{const t2=q.permisos.indexOf(k)>=0;
        return `<div class="between" style="padding:10px 0;border-bottom:1px solid var(--hair)">
          <div class="row" style="min-width:0;flex:1;gap:10px">
            <span class="ico" style="width:26px;height:26px;flex:0 0 auto;${t2?'':'opacity:.3'}">${ico(pm.ic)}</span>
            <div style="min-width:0"><div style="font-weight:600;font-size:13px;${t2?'':'opacity:.45'}">${pm.n}</div>
              <div class="dim2" style="font-size:11px;${t2?'':'opacity:.5'}">${pm.d}</div></div></div>
          <span style="font-size:16px;color:${t2?'var(--acc)':'var(--dim2)'}">${t2?'✓':'—'}</span></div>`}).join('')}
      <div class="dim2" style="font-size:11px;margin-top:11px;line-height:1.6">

        teléfono: si hiciera falta, no serviría de nada como permiso.</div>
    </div>

    <div class="card" style="margin-bottom:24px">
      <h3>La llave de este teléfono</h3>

      para borrarla.</div>
      <button class="btn ghost sm" style="margin-top:11px" onclick="salirComision()">
        Salir del panel y borrar la llave</button>
    </div>
  </div></div>`;
}

const totalYds = () => COURSE.holes.slice(0,S.vuelta).reduce((a,h)=>a+yards(h.n),0);
function mv(d){
  // Ir al hoyo siguiente sin haber cargado el score abre la pantalla de cierre.
  if(d>0 && R.scores[S.hole]===undefined && (S.playing || (R.shots[S.hole]||[]).length)){
    abrirCierre(S.hole); return;
  }
  const n=S.hole+d;
  if(n>=1&&n<=S.vuelta){S.hole=n;render();$('#screen').scrollTop=0;}
}
function setTee(id){S.tee=id;render();
  toast(homologada(tee())
    ? `${tee().n} · ${totalYds()} yds · rating ${tee().r} slope ${tee().s}`
    : `${tee().n} · ${totalYds()} yds · sin homologar: handicap de ${teeDelHcp(tee()).n.toLowerCase()}`);}
function setVuelta(v){
  /* Con hoyos de la vuelta ya anotados no se pasa a 9: la tarjeta escondía la
     vuelta, decía "18 de 9 hoyos jugados" y el stableford salía con el
     handicap de 9 sobre 18 hoyos (revisión adversaria de la v26). */
  if(v === 9 && played().some(h => h > 9)){ toast('Ya anotaste hoyos de la vuelta: esta tarjeta es de 18'); return; }
  S.vuelta=v;if(S.hole>v)S.hole=v;render();
  toast(v===9?'Recorrido de 9 hoyos (una vuelta)':'Recorrido de 18 hoyos (dos vueltas)');}
function setScore(v){R.scores[S.hole]=v;
  const d=v-par(S.hole);
  toast(d<=-2?'🦅 ¡Eagle!':d===-1?'🐦 ¡Birdie!':d===0?'✓ Par':d===1?'Bogey':'Doble bogey');
  render();}
function setPutt(v){R.putts[S.hole]=v;render();}
function setOtro(v){ OTRO[S.hole]=v; render();
  toast(`${marcado().n}: ${v} en el hoyo ${S.hole}`); }
function tg(k){R[k][S.hole]=!R[k][S.hole];render();}   // sólo lo usa el GIR
function yaCargada(i){ PARA_AAG[i].cargada=!PARA_AAG[i].cargada; render();
  toast(PARA_AAG[i].cargada?`${PARA_AAG[i].n} marcada como cargada`:`${PARA_AAG[i].n} vuelve a pendientes`); }
/* El estado del GPS, reducido a lo que cambia la FORMA de la pantalla: si está
   listo o no, y qué error hay. La precisión exacta no entra a propósito — baila
   todo el tiempo y no cambia nada de lo que se ve, salvo el número. */
const firmaGps = () => (gpsVivo() ? 'listo' : 'no') + '·' + (POS_ERR || '');
let _gpsFirma = null;
function textoEstadoGps(){
  _gpsFirma = firmaGps();          // queda anotado qué estado se dibujó
  if(gpsVivo()) return `<b style="color:var(--acc)">Lista</b> · precisión de ±${Math.round(POS.acc)} m`;
  return `<b class="gold">${POS_ERR || 'Buscándola…'}</b>`;
}

/* Sin ubicación no se sale a jugar. Las distancias medidas a pie en esta
   cancha son el producto, y una app que las da flojas sin avisar es peor que
   una que no las da.

   Pero la tarjeta NO se bloquea nunca: es el documento de la vuelta, y si a
   alguien se le apaga el GPS en el hoyo 12 en un torneo no puede quedarse sin
   dónde anotar. Por eso hay una puerta explícita, chica y abajo, para anotar
   sin distancias. Es a propósito que cueste más tocarla que la de arriba. */
function bloqueSalir(texto){
  const listo = gpsVivo();
  return `
    <div class="card" style="${listo?'':'border-color:var(--avisoLn)'}">
