      </div>
      ${listo?'':`<button class="chip" style="flex:0 0 auto;padding:11px 13px"
        onclick="arrancarGPS();toast('Buscando la ubicación…')">Reintentar</button>`}</div>
      ${listo?'':`<div class="dim2" style="font-size:11.5px;margin-top:9px;line-height:1.55">
        Prendé la ubicación del teléfono y dale permiso a la app. Sin eso no hay
        distancias, y las distancias son el motivo de esta app.</div>`}
    </div>
    <button class="btn" id="btnSalir"${listo?'':' disabled style="opacity:.45"'}
      onclick="empezarRonda()">${texto}</button>
    ${listo?'':`<button class="btn ghost sm" style="margin-top:9px;width:100%"
      onclick="empezarRonda(true)">Anotar sin distancias</button>
      <div class="dim2" style="font-size:11px;text-align:center;margin-top:7px;line-height:1.5">
        Tu tarjeta nunca se bloquea. Sin GPS anotás igual; lo que no vas a ver son
        las distancias medidas.</div>`}`;
}

function empezarRonda(sinGps){
  if(S.torneo && S.marco===S.meMarca){toast('Elegí distinto para marcar y ser marcado');return;}
  if(!gpsVivo() && !sinGps){
    arrancarGPS();
    toast(POS_ERR || 'Buscando la ubicación…');
    render(); return;
  }
  const aCiegas = !gpsVivo();
  /* La fecha de la vuelta se fija ACÁ, cuando se sale al 1, y no se recalcula
     al mirar la tarjeta. Una tarjeta es la prueba de una vuelta: si la fecha
     saliera del reloj en el momento de abrirla, la del sábado diría "lunes"
     cuando el socio la muestra el lunes. Antes directamente estaba escrita a
     mano —31/07/2026— y decía lo mismo para todos y para siempre. */
  S.fecha = hoyISO();
  /* La vuelta nueva arranca de cero. Si había una sin terminar, la pantalla de
     arranque ya preguntó; esto es la red por si se llega por otro lado: antes
     de vaciar, se archiva. La ronda compartida NO se toca: si hay una, es la
     que el socio acaba de armar en esta misma pantalla para ESTA vuelta.
     `R`, `MARCA` y `OTRO` son `const`: se vacían por dentro, no se reemplazan. */
  if(enCurso() && !archivarVuelta()){
    toast('No hay lugar en este teléfono para guardar la vuelta anterior · no se empezó otra');
    return;
  }
  S.vueltaId = nuevoIdVuelta();
  Object.keys(R).forEach(k => { R[k] = {}; });
  Object.keys(MARCA).forEach(k => { delete MARCA[k]; });
  Object.keys(OTRO).forEach(k => { delete OTRO[k]; });
  S.certifico = false; S.firmoLaOtra = false; S.entregada = false; S.presento = null;
  S.cerrando = false; S.cierrePaso = 1; S.teeVisto = null; S.hoja = null;
  S.hole=1; S.playing=true; go('play');
  toast(aCiegas ? 'Arrancó sin GPS · vas a anotar sin distancias'
      : S.torneo?`Arrancó · llevás la tarjeta de ${marcado().n}`:'Arrancó la ronda');
}
function finish(){
  /* El botón está a mano desde el hoyo 1 —para quien corta la vuelta por
     lluvia—, así que tocarlo de más es fácil. Si faltan hoyos, se pregunta. */
  const faltan = S.vuelta - played().length;
  if(faltan > 0 && !confirm(`Te ${faltan === 1 ? 'falta 1 hoyo' : 'faltan ' + faltan + ' hoyos'}. ¿Terminar la vuelta igual?`)) return;
  if(!S.torneo){
    const nada = !played().length;
    S.entregada=false;
    if(!terminarVuelta()) return;
    go('summary');
    /* Sin ningún hoyo no hay nada que guardar, y decir "quedó guardada" sería
       mentir. */
    toast(nada ? 'Vuelta terminada · no tenía ningún hoyo anotado'
               : 'Vuelta terminada · quedó guardada en Mis rondas');
    return;
  }
  go('firma');
}
function resolver(h,v){
  /* Con la ronda compartida, lo del marcador lo corrige él en su teléfono: acá
     sólo se puede cambiar lo propio, y lo que se cambia viaja. */
  if(RONDA){
    if(v === R.scores[h]){ toast(`Si van ${v}, ${marcador().n} lo tiene que corregir en su teléfono`); return; }
    R.scores[h] = v; anotarEnLaNube(h); render(); toast(`Hoyo ${h} corregido: ${v}`); return;
  }
  R.scores[h]=v; MARCA[h]=v; render(); toast(`Hoyo ${h} corregido: ${v}`);
}
function certificar(){
  if(difs().length){toast('Primero resolvé las diferencias con tu marcador');return;}
  S.certifico=true; S.presento=true; render(); toast('✍️ Certificaste tu tarjeta');
}
function noPresentar(){
  S.presento=false; S.certifico=false; render();
  toast('No vas a presentar tu tarjeta · queda guardada para vos');
}
function firmarLaOtra(){
  if(!hayAQuienMarcar()){ toast('Primero elegí a quién le llevás la tarjeta, en la ronda del grupo'); return; }
  S.firmoLaOtra=true; render();
  toast(`✍️ Firmaste la tarjeta de ${marcado().n} como su marcador`);
}
function entregar(){
  /* En torneo la vuelta termina acá, no en `finish()`: después de firmar y
     entregar. `terminarVuelta()` archiva con el estado ya puesto. */
  S.entregada=true;
  if(!terminarVuelta()){ S.entregada=false; render(); return; }
  render(); go('summary');
  toast(S.presento===false
    ? `📩 Cerraste la de ${marcado().n} · la tuya no se presenta · la entrega al club todavía no está conectada`
    : '📩 Tarjetas cerradas · la entrega al club todavía no está conectada');
}

function buscarPadron(){
  const d=(S.dni||'').replace(/\D/g,'');
  if(d.length<7){toast('Poné tu DNI completo');return;}
  const p = buscarEnPadron(d);
  if(!p){ S.padronEstado='nopadron'; render(); toast('Ese DNI no figura en el padrón'); return; }
  if(p.cuenta){ S.padronEstado='usado'; S.hallado=p; render(); toast('Ese DNI ya tiene una cuenta'); return; }
  S.hallado=p; S.nsocio=p.socio;
  if(!p.mail && !p.tel){ S.padronEstado='sincontacto'; render();
    toast('El club no tiene tu contacto cargado'); return; }
  // el código va al contacto que el CLUB ya tiene, no al que escribió quien se registra
  S.padronEstado='codigo'; S.codigo=''; render();
  toast(ALTA_DE_PRUEBA ? 'Así se vería · el código todavía no se manda'
                       : `Código enviado a ${p.mail?tapar(p.mail):taparTel(p.tel)}`);
}
function verificarCodigo(){
  if((S.codigo||'').replace(/\D/g,'').length<6){toast('Poné los 6 dígitos del código');return;}
  S.padronEstado='verificado'; S.padronOk=true;
  /* Con padrón de verdad, el nombre verificado ES tu nombre: lo copiamos acá y
     no hay que escribirlo. Hoy el padrón es de mentira, así que la persona lo
     escribe en la pantalla siguiente (usarNombrePrueba). Ojo: sin esta copia,
     la app te mostraba el nombre verificado en pantalla y después seguía
     llamándote como el dueño de la maqueta. */
  if(S.hallado && !S.hallado.deMentira && S.hallado.n) ponerNombre(S.hallado.n);
  if(S.hallado && S.hallado.socio) S.user.socio = S.hallado.socio;
  // Dejamos cargado el mail que el club ya tiene: es el que conviene usar de usuario.
  // El del socio de prueba no: es inventado, y terminaba como "tu" cuenta.
  if(!S.email && S.hallado && S.hallado.mail && !S.hallado.deMentira) S.email = S.hallado.mail;
  render();
  toast(ALTA_DE_PRUEBA ? 'Así se vería · todavía no se verifica nada' : '✅ Identidad verificada');
}
function reiniciarBusqueda(){ S.padronEstado=null; S.padronOk=false; S.hallado=null; S.codigo=''; render(); }
/* Claves: nos importa el largo, no las mayúsculas ni los símbolos.
   Las reglas de composición hacen que la gente ponga Trisquelia1! y se la olvide.
   Lo único que bloqueamos son las claves obvias. Nunca guardamos el texto de la
   clave: sólo el largo y si pasa o no. */
const CLAVES_OBVIAS = ['12345678','123456789','contraseña','password','trisquelia',
  'golf','qwertyui','11111111','abcd1234','clavegolf'];
/* IMPORTANTE: acá no se puede llamar a render(). Redibujar la pantalla en cada
   tecla destruye el campo y borra lo que la persona venía escribiendo.
   Sólo tocamos la barrita y el mensaje. */
function evalClave(v){
  const t = String(v||''), bajo = t.toLowerCase();
  S.clave = t.length;
  if(t.length === 0){ S.claveOk=false; S.claveMsg='Elegí una clave.'; }
  else if(t.length < 8){ const f = 8-t.length;
    S.claveOk=false; S.claveMsg = f===1 ? 'Le falta un carácter.' : `Le faltan ${f} caracteres.`; }
  else {
    const nombre = (S.hallado && S.hallado.n || '').toLowerCase().split(' ').filter(x=>x.length>3);
    const propio = [ (S.dni||'') ].concat(nombre).filter(Boolean);
    if(CLAVES_OBVIAS.indexOf(bajo) >= 0){
      S.claveOk=false; S.claveMsg='Esa clave es de las primeras que prueba cualquiera. Poné otra.';
    } else if(propio.some(x => x && bajo.includes(x.toLowerCase()))){
      S.claveOk=false; S.claveMsg='No uses tu DNI ni tu nombre en la clave.';
    } else {
      S.claveOk=true;
      S.claveMsg = t.length>=14 ? 'Muy buena clave.' : 'Buena clave. Si la hacés más larga, mejor.';
    }
  }
  const bar = document.getElementById('claveBar');
  const msg = document.getElementById('claveMsg');
  if(bar){ bar.style.width = Math.min(100, S.clave*8)+'%';
           bar.style.background = S.claveOk ? 'var(--acc)' : 'var(--gold)'; }
  if(msg){ msg.textContent = S.claveMsg; }
}
/* Igual que en la clave: nada de render() mientras se escribe. */
function pintarVentaja(){
  const v = ventaja(S.vA??10, S.vB??18);
  const a = document.getElementById('ventNum'), b = document.getElementById('ventHasta');
  if(a) a.textContent = v;
  if(b) b.textContent = v;
}
function crearCuenta(){
  /* El socio ya puso su nombre en el paso del padrón; el invitado no pasa por
     ahí, así que se lo pedimos acá. Sin nombre no se sigue: es el dato que
     después ven los otros tres del grupo en la tarjeta. */
  if(!hayNombre() && !ponerNombre(S.nombreIn)){toast('Escribí tu nombre y tu apellido');return;}
  if(!S.email||!S.email.includes('@')){toast('Poné un email válido');return;}
  if((S.clave||0)<8){toast('La clave necesita al menos 8 caracteres');return;}
  if(S.claveOk===false && (S.clave||0)>=8){toast(S.claveMsg);return;}
  // el DNI queda tomado: nadie más puede registrarse con él
  if(S.hallado) S.hallado.cuenta = S.email;
  S.nombreIn = null;
  S.onb=4; render(); toast(ALTA_DE_PRUEBA ? 'Cuenta creada en este teléfono' : 'Cuenta creada · te mandamos un mail de confirmación');
}

/* El ícono se deduce del texto para que la comisión no tenga que elegir

/* De qué salida le toca jugar a cada uno.
   Damas: rojas siempre, sin mirar el index.
   Caballeros: hasta 10.3 de index van de negras; de 10.4 en adelante, blancas/azules.

   DE DÓNDE SALE EL 10.3, y por qué no se movió con la recategorización: era el último
   index que jugaba con 10 de handicap de cancha en la tabla VIEJA, y con la tabla nueva
   de blancas/azules (69.6/120) ese lugar lo ocupa el 11.2. O sea que había dos lecturas
   posibles: "hasta 10 de cancha" o "hasta 10.3 de index". **El club confirmó el
   22/9/2026 que la regla es POR INDEX, hasta 10.3**, así que el número se queda quieto
   y no hay que recalcularlo cada vez que la federación revalúe la cancha. Está en el
   acta.

   Desde la recategorización las negras SÍ tienen rating y slope propios (72.5/128), así
   que el que sale de negras ya recibe el handicap de negras y no el de blancas/azules.
   En la tarjeta de papel el club lo hacía al revés porque no había con qué calcularlo. */
const CORTE_NEGRAS = 10.3;
function salidaPorIndex(idx, cat){
  if(cat === 'dam') return {tee:'damas', hcpCon:'damas',
    por:'En damas se juega siempre de rojas.'};
  // sin categoría no suponemos nada: la regla arranca distinto para cada una
  if(cat !== 'cab' || idx == null) return null;
  if(idx <= CORTE_NEGRAS) return {tee:'negras', hcpCon:'negras',
    por:`Con index hasta ${CORTE_NEGRAS} te corresponden las negras.`};
  return {tee:'mixta', hcpCon:'mixta',
    por:`Con index de ${(CORTE_NEGRAS+0.1).toFixed(1)} en adelante, blancas y azules.`};
}
const teePorId = id => CLUB.tees.find(t=>t.id===id);

/* El index del Sistema Mundial va de +5.0 (los que dan ventaja) a 54.0.
   Los "más" se escriben con el signo adelante y por dentro son negativos:
   un +2.3 resta golpes en vez de sumarlos. */
const INDEX_MIN = -5.0, INDEX_MAX = 54.0;
function leerIndex(txt){
  const t = String(txt||'').trim().replace(',', '.');
  if(!t) return null;
  const mas = t.startsWith('+');
  const n = parseFloat(mas ? t.slice(1) : t);
  if(isNaN(n)) return null;
  const v = mas ? -Math.abs(n) : n;
  if(v < INDEX_MIN || v > INDEX_MAX) return null;
  return Math.round(v*10)/10;
}
/* Cómo se escribe un index para mostrarlo: los "más" llevan el signo adelante. */
const verIndex = v => v==null ? '—' : (v<0 ? '+'+Math.abs(v).toFixed(1) : v.toFixed(1));
/* Igual para el handicap de cancha: los negativos se escriben con más. */
const verHcp = v => v==null ? '—' : (v<0 ? '+'+Math.abs(v) : String(v));

function traer(){
  if(!S.mat||S.mat.length<4){toast('Cargá tu número de matrícula');return;}
  if(S.fedOk){ S.fedOk=false; render(); return; }          // el botón "Corregir"
  if(!S.user.cat){ toast('Elegí desde qué salidas jugás'); return; }
  const idx = leerIndex(S.hcpIn);
  if(idx===null){ toast('Poné tu index. Va de +5.0 a 54.0'); return; }
  S.user.hcp = idx; S.indexFecha = hoyISO(); S.fedOk = true;
  const sal = salidaPorIndex(idx, S.user.cat);
  S.tee = sal.tee;
  toast(`Salís de ${teePorId(sal.tee).n.toLowerCase()} con ${verHcp(hcpCancha(idx, teePorId(sal.hcpCon)))} de cancha`);
  render();
}
function setCat(c){ S.user.cat = c; if(S.fedOk) S.fedOk=false; render(); }
/* El estado de la cancha lo carga una persona, no se deduce de nada.
   Queda registrado quién lo cambió y cuándo — pero eso lo escribe el
   SERVIDOR, no el teléfono: la hora del aparato se puede cambiar, y una
   firma que se puede falsificar no es una firma.

   Los dos botones sólo preparan lo que se va a publicar. Mientras no se
   toque "Guardar y avisar", lo que el socio ve sigue siendo lo anterior:
   nadie cierra la cancha sin querer por rozar un botón. */
let CANCHA_BORRADOR = null;      // {abierta, nota, base, tocada} mientras se edita
/* Sobre qué estado publicado se empezó el borrador. Si mientras tanto llegó otro
   —alguien de la comisión la reabrió desde otro teléfono—, el borrador viejo ya
   no vale: "Guardar y avisar" la volvía a cerrar con la aclaración de antes
   (revisión adversaria de la v26). */
const baseCancha = () => CLUB_VIVO.cancha ? (CLUB_VIVO.cancha.desde || 'sin fecha') : null;
const borradorVigente = () => {
  if(CANCHA_BORRADOR && CANCHA_BORRADOR.base !== baseCancha()) CANCHA_BORRADOR = null;
  return CANCHA_BORRADOR;
};

/* Lo que muestran los botones del panel: el borrador si lo hay, y si no,
   lo que dice el servidor. */
const canchaEditando = () => borradorVigente() && CANCHA_BORRADOR.abierta != null
  ? CANCHA_BORRADOR.abierta
  : (CLUB_VIVO.cancha ? !!CLUB_VIVO.cancha.abierta : null);
const notaCanchaEditando = () => borradorVigente() && CANCHA_BORRADOR.nota !== undefined
  ? CANCHA_BORRADOR.nota : ((CLUB_VIVO.cancha && CLUB_VIVO.cancha.nota) || '');
/* Lo que se escribe en la aclaración queda en el borrador letra por letra, sin
   redibujar: se perdía al primer redibujo —un aviso publicado, o el club que
   contestaba— si todavía no se había tocado Abierta o Cerrada. */
function notaCanchaTipeada(v){
  const b = borradorVigente() || { abierta: null, base: baseCancha() };
  CANCHA_BORRADOR = Object.assign(b, { nota: String(v), tocada: true });
}

function setCancha(abierta){
  /* La aclaración es de un estado. Al reabrir, "Prueba en la reunión" o "lluvia
     hasta el mediodía" quedaban precargadas y se publicaban igual: los socios
     veían "Abierta · Prueba en la reunión" (revisión del 26/10/2026). Si el
     estado cambia y nadie escribió una aclaración nueva, se vacía; lo que sí se
     escribió, se respeta. */
  const inp = $('#notaCancha');
  const mostrada = notaCanchaEditando();
  const escrita = inp ? inp.value : mostrada;
  const tocada = !!(borradorVigente() && CANCHA_BORRADOR.tocada) || escrita !== mostrada;
  const publicada = (CLUB_VIVO.cancha && CLUB_VIVO.cancha.nota) || '';
  const otroEstado = !CLUB_VIVO.cancha || CLUB_VIVO.cancha.abierta !== !!abierta;
  CANCHA_BORRADOR = { abierta: !!abierta, base: baseCancha(), tocada,
                      nota: tocada ? escrita : (otroEstado ? '' : publicada) };
  render();
}
async function publicarCancha(){

/* Anotarse es un dibujo. Decía "Así se vería · todavía no está hecho" y en el

/* ============================================================
   INSTALARLA Y QUE ANDE SIN SEÑAL
   En la cancha hay tramos sin datos y una vuelta dura cuatro horas.
   El service worker guarda la app entera en el teléfono, así abre
   igual de rápido con o sin conexión.
   ============================================================ */

const INSTALADA = () =>
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
  || navigator.standalone === true;

/* iPhone no ofrece botón de instalar: hay que explicar los dos toques. */
const ES_IOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let PROMPT_INSTALAR = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();               // el navegador no muestra el suyo
  PROMPT_INSTALAR = e;              // lo guardamos para nuestro botón
  if(S.onboarded) render();
});
window.addEventListener('appinstalled', () => {
  PROMPT_INSTALAR = null;
  toast('Listo, ya la tenés en el teléfono');
  if(S.onboarded) render();
});

async function instalar(){
  if(!PROMPT_INSTALAR) return;
  PROMPT_INSTALAR.prompt();
  await PROMPT_INSTALAR.userChoice;
  PROMPT_INSTALAR = null;
  render();
}
function ocultarInstalar(){ S.instalarVisto = true; render(); }

function bannerInstalar(){
  if(INSTALADA() || S.instalarVisto || EN_OTRA_APP) return '';
  if(PROMPT_INSTALAR) return `<div class="instalar">
    ${crest(38)}
    <div class="txt"><b>Agregala al teléfono</b>
      <span>Abre sin navegador y funciona sin señal en la cancha.</span></div>
    <button onclick="instalar()">Agregar</button>
    <button class="x" onclick="ocultarInstalar()" aria-label="Cerrar">&times;</button>
  </div>`;
  if(ES_IOS()) return `<div class="instalar" style="align-items:flex-start">
    ${crest(38)}
    <div class="txt"><b>Agregala al teléfono</b>
      <span>Tocá <b style="display:inline;color:var(--txt)">Compartir</b> abajo y elegí
      <b style="display:inline;color:var(--txt)">Agregar a inicio</b>. Así abre sin navegador,
      anda sin señal y el iPhone deja de borrarte los datos.</span></div>
    <button class="x" onclick="ocultarInstalar()" aria-label="Cerrar">&times;</button>
  </div>`;
  return '';
}

/* Que el teléfono no borre la vuelta a medio cargar.
   En iPhone este permiso se concede justamente cuando la app está
   agregada a la pantalla de inicio. Por eso instalarla no es un
   detalle de comodidad: es lo que protege la tarjeta. */
async function cuidarLosDatos(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    if(await navigator.storage.persisted()) return;
    await navigator.storage.persist();
  }catch(e){ /* si no se puede, la app anda igual */ }
}

/* ---------- actualizaciones ----------
   Nunca en el medio de una vuelta: si el jugador está jugando, la
   versión nueva espera y entra cuando termina. */
let VERSION_ESPERANDO = null;

function hayVersionNueva(sw){
  VERSION_ESPERANDO = sw;
  if(momentoDeActualizar()) aplicarVersion();
  else toast('Hay una versión nueva · entra al terminar la vuelta');
}
/* Era `!S.playing && played().length === 0`, y como `S.playing` no volvía nunca
   a false y la tarjeta no se vaciaba, después de la primera vuelta daba false
   para siempre: una versión nueva sólo entraba cerrando la app del todo.
   Ahora que la vuelta termina de verdad, alcanza con no estar jugando. Y dos
   momentos más en que NO: con el cierre del hoyo abierto (recargar ahí corta lo
   que se está anotando) y en el resumen o la firma, que son la vuelta que
   recién terminó: la recarga los tapaba y se volvía a Inicio sin verlos. Las
   dos cosas las encontró la revisión adversaria de la v25. */
const momentoDeActualizar = () => !S.playing && !S.cerrando
  && S.tab !== 'summary' && S.tab !== 'firma';
function aplicarVersion(){
  if(!VERSION_ESPERANDO) return;
  const sw = VERSION_ESPERANDO; VERSION_ESPERANDO = null;
  sw.postMessage({tipo:'ACTIVAR'});
}

/* ---------- qué versión está corriendo en ESTE teléfono ----------
   El número vive en `sw.js` y en ningún otro lado. Escribirlo también acá sería
   cómodo por diez minutos y mentiroso para siempre: el día que alguien suba el
   índice de un archivo y no del otro, el dato deja de servir justo cuando más
   se necesita. Así que se lo preguntamos al service worker, que es el que tiene
   la app guardada, y lo que se muestra es lo que de verdad está sirviendo.
   Sin service worker —primera visita, o abierta como página suelta— no hay
   número que mostrar, y eso también es información: la app todavía no quedó
   guardada en el teléfono. */
let APP_VERSION = null;
/* ¿Está la app guardada en el teléfono, para abrir sin señal? Se mira de
   verdad, en la caché: el final del alta decía "funciona sin señal" sin
   comprobar nada, y si el primer guardado fallaba no era cierto. */
let APP_GUARDADA = false;
function mirarSiEstaGuardada(){
  try{ caches.match('./index.html').then(r => { APP_GUARDADA = !!r; }).catch(()=>{}); }catch(e){}
}
function preguntarVersion(){
  try{
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if(!sw){ APP_VERSION = null; return; }
    const canal = new MessageChannel();
    canal.port1.onmessage = e => {
      if(e.data && e.data !== APP_VERSION){
        APP_VERSION = e.data;
        if(S.tab === 'me') render();
      }
    };
    sw.postMessage({tipo:'VERSION'}, [canal.port2]);
  }catch(e){ /* si no contesta, se muestra que no hay dato */ }
}
const versionTxt = () =>
  (APP_VERSION ? APP_VERSION.replace('trisquelia-','') : 'todavía no está guardada en el teléfono')
  + (VERSION_ESPERANDO ? ' · hay una nueva esperando' : '');

/* Para dar soporte sin interrogatorio. El socio toca la fila de la versión y le
   queda en el portapapeles todo lo que hace falta para entender su caso: qué
   versión tiene, si la instaló o la abre como página, cómo le está yendo con el
   servidor y en qué ronda está. Lo pega en el mensaje y listo. */
function copiarDiagnostico(){
  let instalada = 'no sé';
  try{ instalada = matchMedia('(display-mode: standalone)').matches ? 'sí' : 'no'; }catch(e){}
  const d = [
    'Trisquelia ' + (APP_VERSION || 'sin guardar'),
    'instalada: ' + instalada,
    'servidor: ' + (!hayNube() ? 'sin configurar'
      : NUBE_ESTADO.conectado ? 'al día'
      : (NUBE_ESTADO.error || 'sin conectar')),
    'ronda: ' + (RONDA ? RONDA.codigo : 'ninguna'),
    navigator.userAgent
  ].join(' · ');
  /* El portapapeles sólo funciona en https y con permiso; si no se puede, al
     menos mostramos la versión, que es el 90 % del valor. */
  try{
    navigator.clipboard.writeText(d)
      .then(() => toast('Copiado · pegalo en el mensaje'))
      .catch(() => toast('Versión ' + versionTxt()));
  }catch(e){ toast('Versión ' + versionTxt()); }
}

if('serviceWorker' in navigator){
  /* Se recarga sólo cuando cambia un control que YA había, que es cuando llega
     una versión nueva. En la primera visita no hay service worker, y cuando el
     nuevo toma el control la página ya tiene el código más nuevo: recargarla no
     servía para nada y hacía daño. El que escaneaba el QR en la reunión estaba
     escribiendo su nombre y la recarga se lo borraba (revisión del 26/10/2026),
     y cada pedido de la primera visita salía dos veces. */
  /* `habiaControl` cambia: la primera vez que el service worker toma el control
     no se recarga —y ahí recién se le puede preguntar la versión, que si no
     quedaba "todavía no está guardada" toda la sesión—, pero desde ese momento
     sí hay control, y si en la misma sesión llega otra versión, ésa sí recarga.
     La v26 lo tenía fijo y una segunda versión entraba sin que la página se
     enterara (revisión adversaria de la v26). */
  let habiaControl = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!habiaControl){ habiaControl = true; preguntarVersion(); mirarSiEstaGuardada(); return; }
    if(recargando) return;                     // una sola recarga, no un bucle
    recargando = true; location.reload();
  });
  window.addEventListener('load', async () => {
    cuidarLosDatos();
    preguntarVersion();
    /* Y otra vez cuando el service worker toma el control, que en la primera
       visita pasa después de esto. */
    navigator.serviceWorker.ready.then(() => { preguntarVersion(); mirarSiEstaGuardada(); }).catch(()=>{});
    mirarSiEstaGuardada();
    try{
      const reg = await navigator.serviceWorker.register('./sw.js', {scope:'./'});
      if(reg.waiting) hayVersionNueva(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', () => {
          // la primera vez no es una actualización, es la instalación
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller)
            hayVersionNueva(nuevo);
        });
      });
    }catch(e){
      /* sin service worker la app funciona igual, pero necesita señal */
    }
  });
}

/* ============================================================
   MODO PRUEBA — para la primera vuelta en cancha
   ============================================================
   Hay dos preguntas que no se pueden contestar desde una computadora:
   si el GPS aguanta cuatro horas y si la batería llega al hoyo 18.
   Y una tercera que sólo se contesta parado en la cancha: si las
   distancias que muestra la app coinciden con las estacas.

   Esto se prende a mano antes de salir, guarda una muestra cada veinte
   segundos, y al terminar deja un archivo y un resumen. La idea es que
   vuelvas con números, no con la sensación de que "andaba bien".

   Se guarda aparte de la ronda, en su propia llave, así borrar una cosa
   nunca se lleva la otra puesta.
   ============================================================ */
const PRUEBA_KEY  = 'trisquelia_prueba';
const PRUEBA_CADA = 20000;              // una muestra cada 20 segundos

let PRUEBA = null;
let _pruebaTimer = null;

function cargarPrueba(){
  try{ PRUEBA = JSON.parse(localStorage.getItem(PRUEBA_KEY) || 'null'); }
  catch(e){ PRUEBA = null; }
  if(PRUEBA && PRUEBA.abierta){
    /* Si llegamos acá con la prueba abierta es que la pestaña se recargó
       sola: el teléfono la mató y volvió. Eso también es un dato. */
    PRUEBA.reinicios = (PRUEBA.reinicios || 0) + 1;
    guardarPrueba();
    latirPrueba();
  }
}
function guardarPrueba(){
  try{ localStorage.setItem(PRUEBA_KEY, JSON.stringify(PRUEBA)); }catch(e){}
}

function arrancarPrueba(){
  PRUEBA = { abierta:true, desde:Date.now(), muestras:[], estacas:[], notas:[],
             reinicios:0, telefono:navigator.userAgent };
  guardarPrueba(); latirPrueba(); render();
  toast('Grabando. Dejá la app abierta mientras jugás');
}
function pararPrueba(){
  if(!PRUEBA) return;
  PRUEBA.abierta = false; PRUEBA.hasta = Date.now();
  clearInterval(_pruebaTimer); _pruebaTimer = null;
  guardarPrueba(); render();
  toast('Prueba terminada. Bajate el archivo');
}
function tirarPrueba(){
  if(!confirm('¿Borrar la prueba guardada? No se puede deshacer.')) return;
  PRUEBA = null;
  clearInterval(_pruebaTimer); _pruebaTimer = null;
  try{ localStorage.removeItem(PRUEBA_KEY); }catch(e){}
  render();
}
function latirPrueba(){
  clearInterval(_pruebaTimer);
  _pruebaTimer = setInterval(muestraPrueba, PRUEBA_CADA);
  muestraPrueba();
}

/* Una muestra: dónde estás, con cuánta precisión, y cómo viene la batería.
   Si no hay posición lo anotamos igual — un hueco es información. */
async function muestraPrueba(){
  if(!PRUEBA || !PRUEBA.abierta) return;
  const m = { t: Date.now(), hoyo: S.hole, hay: gpsVivo() };
  if(gpsVivo()){
    m.acc = Math.round(POS.acc);
    m.lat = +POS.lat.toFixed(6);
    m.lon = +POS.lon.toFixed(6);
  } else {
    m.err = POS_ERR || 'sin posición';
  }
  try{
    if(navigator.getBattery){
      const b = await navigator.getBattery();
      m.bat = Math.round(b.level * 100);
      m.enchufado = b.charging;
    }
  }catch(e){ /* iPhone no da batería: se anota sin ese dato */ }
  PRUEBA.muestras.push(m);
  guardarPrueba();
}

/* Parado en una estaca: guardamos qué dice la app contra lo que dice el palo.
   Es la única forma de saber si la medición de la cancha quedó bien. */
function marcarEstaca(yds){
  if(!PRUEBA || !PRUEBA.abierta){ toast('Primero prendé el modo prueba'); return; }
  /* Sin GPS, `gps()` devuelve la ESTIMACIÓN con el largo del hoyo, y se
     guardaba como "la app dijo" y entraba al promedio que valida la cancha
     medida (revisión adversaria de la v26). */
  if(!gpsVivo()){ toast('Sin GPS no hay con qué comparar la estaca · esperá a que vuelva la señal'); return; }
  const g = gps(S.hole);
  PRUEBA.estacas.push({ t:Date.now(), hoyo:S.hole, estaca:yds,
    centro:g.mid ?? null, frente:g.front ?? null, fondo:g.back ?? null,
    acc: gpsVivo() ? Math.round(POS.acc) : null, gpsReal: !!g.real });
  guardarPrueba(); render();
  const d = g.mid != null ? g.mid - yds : null;
  toast(d == null ? 'Anotado, pero sin distancia'
    : `Estaca ${yds} · la app dice ${g.mid} (${d >= 0 ? '+' : ''}${d})`);
}

/* Lo que te moleste, anotado en el momento y no dos horas después. */
function anotarPrueba(){
  if(!PRUEBA){ toast('Primero prendé el modo prueba'); return; }
  const t = prompt('¿Qué te molestó? Cortito.');
  if(!t) return;
  PRUEBA.notas.push({ t:Date.now(), hoyo:S.hole, txt:String(t).slice(0,300) });
  guardarPrueba(); render(); toast('Anotado');
}

/* ---------- las cuentas ---------- */
function resumenPrueba(){
  if(!PRUEBA || !PRUEBA.muestras.length) return null;
  /* Ordenadas por hora antes de contar nada. Normalmente ya vienen en orden,
     pero una medición se guarda después de preguntar por la batería, y esa
     respuesta puede llegar tarde y meterse fuera de lugar. Si eso pasa, la
     duración y el hueco más largo salen cualquier cosa. */
  const ms = PRUEBA.muestras.slice().sort((a, b) => a.t - b.t);
  /* La duración sale de la primera y la última medición, no del reloj: si el
     teléfono mató la app y nunca se tocó "Terminar", desde/hasta mienten. */
  const horas = (ms[ms.length-1].t - ms[0].t) / 3600000;

  const con  = ms.filter(m => m.hay);
  const accs = con.map(m => m.acc).filter(x => x != null).sort((a,b) => a-b);

  /* Cortes: cuántas veces PASÓ de tener señal a no tenerla. No es lo mismo
     que contar muestras sin señal, que exagera un corte largo. */
  let cortes = 0;
  for(let i = 1; i < ms.length; i++) if(ms[i-1].hay && !ms[i].hay) cortes++;

  /* El hueco más grande entre dos muestras dice si el teléfono durmió la app
     con la pantalla apagada. Es el dato que decide si esto sirve en el bolsillo. */
  let hueco = 0;
  for(let i = 1; i < ms.length; i++) hueco = Math.max(hueco, ms[i].t - ms[i-1].t);

  const bats = ms.filter(m => m.bat != null);
  let bateria = null;
  if(bats.length > 1){
    const caida = bats[0].bat - bats[bats.length-1].bat;
    bateria = { desde: bats[0].bat, hasta: bats[bats.length-1].bat, caida,
                porHora: horas > 0.08 ? Math.round(caida / horas) : null };
  }

  const difs = PRUEBA.estacas.filter(e => e.centro != null && e.gpsReal !== false).map(e => e.centro - e.estaca);

  return {
    horas: +horas.toFixed(2),
    muestras: ms.length,
    conSenal: Math.round(con.length / ms.length * 100),
    precision: accs.length
      ? { mediana: accs[Math.floor(accs.length/2)], mejor: accs[0], peor: accs[accs.length-1],
          buenas: Math.round(accs.filter(a => a <= 8).length / accs.length * 100) }
      : null,
    cortes,
    huecoMayor: Math.round(hueco / 1000),
    reinicios: PRUEBA.reinicios || 0,
    bateria,
    estacas: difs.length
      ? { marcadas: PRUEBA.estacas.length,
          errorMedio: Math.round(difs.reduce((a,b) => a + Math.abs(b), 0) / difs.length),
          sesgo: Math.round(difs.reduce((a,b) => a+b, 0) / difs.length) }
      : { marcadas: PRUEBA.estacas.length, errorMedio: null, sesgo: null },
    notas: PRUEBA.notas.length
  };
}

/* ---------- SACAR LOS DATOS DEL TELÉFONO ----------
   Acá hubo un error de diseño que costó una vuelta entera: el único
   camino era "bajar el archivo", con el truco del <a download>. Eso
   anda en una computadora, pero en un teléfono —y sobre todo con la
   app instalada en pantalla completa— la descarga se traba sin avisar
   y el archivo no aparece en ningún lado.
   Ahora hay cuatro caminos, del más cómodo al más rústico, y el último
   funciona siempre. */

function datosPrueba(){
  return { club: CLUB.id, cancha: CLUB.cancha.nombre, salida: S.tee,
           resumen: resumenPrueba(), ...PRUEBA };
}

/* 1. COMPARTIR — el bueno en el teléfono. Abre la hoja del sistema y
      lo mandás por WhatsApp, mail o Drive, como cualquier foto. */
async function compartirPrueba(){
  if(!PRUEBA) return;
  const texto = JSON.stringify(datosPrueba(), null, 1);
  try{
    const archivo = new File([texto], 'trisquelia-prueba.json', {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){
      await navigator.share({files:[archivo], title:'Prueba en cancha · Trisquelia'});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;      // lo canceló, no es un error
  }
  toast('Este teléfono no deja compartir archivos. Probá bajarlo');
  bajarPrueba();
}

/* 2. BAJAR — sirve en la computadora y en el navegador normal. */
function bajarPrueba(){
  if(!PRUEBA) return;
  const b = new Blob([JSON.stringify(datosPrueba(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'trisquelia-prueba.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* 3. COPIAR EL RESUMEN — corto, entra en un mensaje. */
function resumenTexto(){
  const r = resumenPrueba();
  if(!r) return 'Sin datos todavía.';
  const l = [];
  l.push(`Prueba en cancha · ${CLUB.corto} · ${r.horas} h · ${r.muestras} mediciones`);
  l.push(`GPS: ${r.conSenal}% del tiempo con señal · ${r.cortes} cortes`);
  if(r.precision) l.push(`Precisión: típica ±${r.precision.mediana} m · mejor ±${r.precision.mejor} · peor ±${r.precision.peor} · finas ${r.precision.buenas}%`);
  l.push(`Hueco más largo entre mediciones: ${r.huecoMayor} s · reinicios: ${r.reinicios}`);
  if(r.bateria) l.push(`Batería: ${r.bateria.desde}% → ${r.bateria.hasta}%${r.bateria.porHora!=null?` (${r.bateria.porHora}%/h)`:''}`);
  else l.push('Batería: el teléfono no la deja leer');
  if(r.estacas.marcadas) l.push(`Estacas: ${r.estacas.marcadas} marcadas · diferencia media ${r.estacas.errorMedio} yds · sesgo ${r.estacas.sesgo>=0?'+':''}${r.estacas.sesgo}`);
  else l.push('Estacas: ninguna marcada');
  (PRUEBA.estacas||[]).forEach(e => l.push(`  hoyo ${e.hoyo}: estaca ${e.estaca}, la app dijo ${e.centro ?? '—'} (±${e.acc ?? '—'} m)`));
  (PRUEBA.notas||[]).forEach(n => l.push(`  nota hoyo ${n.hoyo}: ${n.txt}`));
  return l.join('\n');
}
async function copiarResumen(){
  const t = resumenTexto();
  try{
    await navigator.clipboard.writeText(t);
    toast('Resumen copiado. Pegalo donde quieras');
  }catch(e){
    S.verDatos = 'resumen'; render();
    toast('Copialo a mano del cuadro de abajo');
  }
}

/* 4. VERLO EN PANTALLA — el que nunca falla. Se mantiene apretado,
      "Seleccionar todo", copiar, y se pega en cualquier lado. */
function verDatos(cual){
  S.verDatos = S.verDatos === cual ? null : cual;
  render();
  const t = document.getElementById('salidaPrueba');
  if(t){ t.focus(); t.select(); }
}

/* ---------- el punto rojo de arriba ---------- */
function pintarGrabando(){
  const nombre = document.getElementById('appname');
  if(!nombre) return;
  const viejo = document.getElementById('grabando');
  if(viejo) viejo.remove();
  if(!(PRUEBA && PRUEBA.abierta)) return;
  const s = document.createElement('span');
  s.id = 'grabando'; s.className = 'grabando'; s.textContent = '● PRUEBA';
  nombre.parentNode.appendChild(s);
}

/* ---------- el panel que aparece al jugar mientras graba ---------- */
function panelPrueba(){
  if(!(PRUEBA && PRUEBA.abierta)) return '';
  return `<div class="card" style="border-color:var(--red);padding:12px 14px">
    <div class="between" style="margin-bottom:8px">
      <div class="lbl" style="color:var(--red)">● Modo prueba · grabando</div>
      <button class="chip" style="padding:6px 11px;font-size:11px" onclick="go('prueba')">Ver</button>
    </div>
    <div class="dim2" style="font-size:11.5px;margin-bottom:9px">
      ¿Estás parado en una estaca? Tocá cuál y guardo lo que dice la app en este momento.</div>
    <div class="grid3">
      ${CLUB.estacas.map(([t,c]) => { const y = parseInt(t, 10);
        return `<button class="chip" style="padding:11px 2px;font-size:12.5px"
          onclick="marcarEstaca(${y})">
          <span style="display:inline-block;width:9px;height:9px;border-radius:50%;
            background:${c};border:1px solid #ffffff44;margin-right:5px;vertical-align:-1px"></span>${y}</button>`;
      }).join('')}
    </div>
    <button class="btn ghost sm" style="margin-top:9px" onclick="anotarPrueba()">
      Anotar algo que me molestó</button>
  </div>`;
}

/* ---------- la pantalla ---------- */
function vPrueba(){

  const grabando = PRUEBA && PRUEBA.abierta;
  const fila = (q, v, u) => `<div class="medida"><span class="q">${q}</span>
    <span class="v">${v}</span><span class="u">${u || ''}</span></div>`;

  return `<div class="fade">
  <div class="hdr"><div class="row"><button class="arrow" onclick="go('me')">‹</button>
    <div><div class="lbl">Antes de construir más</div>
      <h1 style="font-size:22px">Modo prueba</h1></div></div></div>
  <div class="pad">

    ${!PRUEBA ? `
    <div class="card">
      <div class="dim" style="font-size:14px;line-height:1.65">
        Hay tres cosas que sólo se saben jugando: si el GPS aguanta las cuatro horas,
        si la batería llega al hoyo 18, y si las distancias coinciden con las estacas
        de la cancha.<br><br>
        Prendelo antes de salir del hoyo 1 y dejá la app abierta. Guarda una medición
        cada veinte segundos y al final te deja un archivo con todo.
      </div>
      <button class="btn" style="margin-top:14px" onclick="arrancarPrueba()">Empezar la prueba</button>
      <div class="dim2" style="font-size:11px;text-align:center;margin-top:8px">
        No toca tu tarjeta ni tus estadísticas. Se guarda aparte.</div>
    </div>` : ''}

    ${PRUEBA ? `
    <div class="card" style="border-color:${grabando ? 'var(--red)' : 'var(--acc2)'}">
      <div class="between">
        <div><div class="lbl" style="${grabando ? 'color:var(--red)' : ''}">
          ${grabando ? '● Grabando' : 'Prueba terminada'}</div>
          <div class="big" style="font-size:30px">${r ? r.horas.toFixed(1) : '0.0'}<span
            style="font-size:15px;font-weight:600" class="dim"> h</span></div>
          <div class="dim2" style="font-size:12px">${r ? r.muestras : 0} mediciones</div></div>
        <button class="btn ${grabando ? '' : 'ghost'}" style="width:auto;padding:13px 18px;min-height:44px"
          onclick="${grabando ? 'pararPrueba()' : 'arrancarPrueba()'}">
          ${grabando ? 'Terminar' : 'Empezar de nuevo'}</button>
      </div>
    </div>` : ''}

    ${r ? `
    <div class="card">
      <h3>El GPS</h3>
      ${fila('Tiempo con señal', r.conSenal, '%')}
      ${r.precision ? fila('Precisión típica', '±' + r.precision.mediana, 'm') : ''}
      ${r.precision ? fila('La mejor y la peor', '±' + r.precision.mejor + ' / ±' + r.precision.peor, 'm') : ''}
      ${r.precision ? fila('Mediciones finas (±8 m o menos)', r.precision.buenas, '%') : ''}
      ${fila('Veces que perdió la señal', r.cortes, '')}
      <div class="dim2" style="font-size:11.5px;margin-top:10px;line-height:1.55">
        Con ±8 metros o menos, el número al centro del green es confiable.
        Por encima de ±20 conviene esperar unos segundos parado.</div>
    </div>

    <div class="card">
      <h3>¿Aguanta el teléfono?</h3>
      ${fila('Hueco más largo entre mediciones', r.huecoMayor, 's')}
      ${fila('Veces que la app se reinició sola', r.reinicios, '')}
      ${r.bateria ? fila('Batería', r.bateria.desde + '% → ' + r.bateria.hasta + '%', '') : ''}
      ${r.bateria && r.bateria.porHora != null ? fila('Gasto por hora', r.bateria.porHora, '%') : ''}
      <div class="dim2" style="font-size:11.5px;margin-top:10px;line-height:1.55">
        ${r.huecoMayor > 90
          ? 'Ese hueco largo quiere decir que el teléfono durmió la app con la pantalla apagada. Es esperable, pero conviene saber cuánto.'
          : 'Sin huecos largos: la app siguió midiendo todo el tiempo.'}

/* ============================================================
   LA RONDA COMPARTIDA
   ============================================================
   Acá está la función que justifica el proyecto entero: que lo que
   carga tu marcador y lo que cargás vos se crucen EN EL HOYO, y no
   en la mesa dos horas después.

   Cómo funciona, en corto
   Uno abre la ronda y le sale un código de seis letras. Los otros lo
   escriben y quedan adentro. Cada teléfono manda lo suyo y, cada seis
   segundos, pregunta qué cargaron los demás.

   Por qué no hay conflictos
   Cada anotación lleva quién la hizo. Si vos anotás mi tarjeta y yo
   también, son DOS filas distintas, no una peleada. Dos teléfonos nunca
   escriben encima del otro. Es la regla del papel —cada uno es dueño de
   la tarjeta que anota— y resuelve sola la parte más fea de sincronizar.

   Por qué preguntamos en vez de escuchar
   Un websocket abierto cuatro horas en una cancha con señal a parches se
   corta todo el tiempo y hay que reconectarlo. Preguntar cada seis
   segundos es más tonto y mucho más resistente: si no hay señal, no pasa
   nada, y cuando vuelve se pone al día solo.
   ============================================================ */

/* ⚠️ ACÁ VA LA DIRECCIÓN DEL SERVIDOR. Es un solo dato.
   Mientras esté vacía la app funciona exactamente como hasta ahora, todo en
   el teléfono y sin compartir nada. Con la dirección puesta aparece sola la
   opción de jugar con el grupo.

   Son DOS direcciones, las dos tal como las muestra la consola del proyecto:
   la de los datos y la de autenticación. Y son dos, no una, porque **la Data
   API pide un token SIEMPRE**, también para lo anónimo: sin header
   `Authorization` contesta 401 y nada más. Lo que Neon llama "anónimo" no es
   entrar sin credencial, es un token de una hora que cualquiera pide sin
   registrarse en `<auth>/token/anonymous` y que adentro dice
   `"role":"anonymous"`, el rol que sólo puede llamar a las seis funciones de
   la ronda. Si alguna vez leés en la documentación de Neon que el rol anónimo
   atiende "las peticiones sin header Authorization", está mal: lo probamos
   contra el servidor real y no es así.

   Lo que NO hay acá es una clave secreta. Con Supabase hacía falta además una
   clave pública; con esto, no. Las dos direcciones son públicas a propósito.

   Que esta dirección sea pública es parte del diseño, igual que el código de
   seis letras: lo que protege la tarjeta es la llave propia de cada teléfono y
   que las tablas estén cerradas. Está todo en `esquema.sql`. */
/* Proyecto `trisquelia` (`mute-darkness-79549796`), rama `production`, región
   AWS US East 1 · Virginia. Se mudó desde São Paulo el 29/9/2026: allá la base
   andaba perfecto, pero las Functions y el Object Storage de Neon todavía no
   existen en esa región, y son las dos piezas que faltan para el alta de
   socios (mandar el mail del código) y para la tarjeta firmada. Se mudó cuando
   la base estaba vacía a propósito: con los 123 socios cargados, esto habría
   sido una migración de datos personales en vez de un botón. */
const NUBE = {
  url : 'https://ep-calm-salad-b8bd5cxb.apirest.c-14.us-east-1.aws.neon.tech/neondb/rest/v1',
  /* La dirección de autenticación, que sale del JWKS que muestra la consola.
     Se puede pegar entera —con `/.well-known/jwks.json` al final— o cortada. */
  auth: 'https://ep-calm-salad-b8bd5cxb.neonauth.c-14.us-east-1.aws.neon.tech/neondb/auth'
};
const hayNube = () => !!(NUBE.url && NUBE.auth);
/* La URL de Neon ya termina en /rest/v1. Aceptamos las dos formas —con esa
   cola y sin ella— porque es lo que más fácil se pega mal al copiar, y un
   error ahí no se ve hasta que alguien intenta abrir una ronda en la cancha. */
function nubeBase(){
  let u = String(NUBE.url || '').trim().replace(/\/+$/, '');
  if(!/\/rest\/v1$/.test(u)) u += '/rest/v1';
  return u;
}
/* Lo mismo con la de autenticación: en la consola lo que se ve es el JWKS, así
   que aceptamos que lo peguen entero y le sacamos la cola. */
function authBase(){
  return String(NUBE.auth || '').trim()
    .replace(/\/+$/, '')
    .replace(/\/\.well-known\/jwks\.json$/, '');
}

const RONDA_KEY = 'trisquelia_ronda';
const DISPO_KEY = 'trisquelia_dispositivo';
const LATIDO    = 6000;          // cada cuánto preguntamos

let RONDA = null;                // {codigo, yo, jugadores, anot, desde, ...}
let _latido = null;
let _ultimoRechazo = null;      // para no repetir el mismo aviso en cada latido
let NUBE_ESTADO = { conectado:false, ultimo:null, error:null, mandando:0 };

/* Un identificador del teléfono, estable. No es una cuenta ni identifica
   a nadie: sirve para saber cuál de las anotaciones son tuyas. */
function dispositivo(){
  let d = null;
  try{ d = localStorage.getItem(DISPO_KEY); }catch(e){}
  if(!d){
    d = 'd' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
    try{ localStorage.setItem(DISPO_KEY, d); }catch(e){}
  }
  return d;
}
const miId = () => RONDA ? RONDA.yo : null;
/* Si ya estábamos en esta ronda (recarga, o volvimos a entrar), reusamos la
   llave que teníamos: el servidor no le da el puesto a nadie más. */
const llaveDe = codigo => (RONDA && RONDA.codigo === codigo && RONDA.llave) || null;

/* Seis letras, sin las que se confunden al dictarlas: nada de I, O, 0, 1. */
const LETRAS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codigoNuevo(){
  let c = '';
  const az = new Uint32Array(6);
  (crypto && crypto.getRandomValues) ? crypto.getRandomValues(az)
    : az.forEach((_,i)=>az[i] = Math.floor(Math.random()*1e9));
  for(let i=0;i<6;i++) c += LETRAS[az[i] % LETRAS.length];
  return c;
}

/* ---------- hablar con el servidor ---------- */
/* ---------- el token anónimo ----------
   La Data API pide SIEMPRE un `Authorization`, incluso para lo público. Lo que
   Neon llama "anónimo" no es entrar sin credencial: es entrar con un token de
   una hora que cualquiera puede pedir, sin cuenta ni registro, y que adentro
   dice `"role":"anonymous"` — el mismo rol al que `esquema.sql` le dio permiso
   para llamar exactamente seis funciones y nada más.

   Costó descubrirlo porque la documentación se contradice: una página dice que
   el rol anónimo atiende "las peticiones sin header Authorization", y la de
   control de acceso aclara que "anonymous access still uses a JWT". Manda la
   segunda. Queda escrito acá para que nadie lo vuelva a averiguar a ciegas.

   No se guarda en el teléfono a propósito: dura poco, no identifica a nadie, y
   volver a pedirlo cuesta una sola llamada. */
let TOKEN = null, TOKEN_VENCE = 0;
async function tokenAnonimo(forzar){
  const ahora = Date.now() / 1000;
  /* Dos minutos de colchón: una vuelta dura cuatro horas y el token una, así
     que se renueva sola varias veces. Que no se venza justo entre que se pide
     y que se usa. */
  if(!forzar && TOKEN && TOKEN_VENCE - ahora > 120) return TOKEN;
  const r = await fetch(`${authBase()}/token/anonymous`, { headers:{'Accept':'application/json'} });
  if(!r.ok) throw new Error('token ' + r.status);
  const d = await r.json();
  if(!d || !d.token) throw new Error('token sin formato');
  TOKEN = d.token;
  TOKEN_VENCE = d.expires_at || (ahora + 3000);
  return TOKEN;
}
async function rpc(fn, args, reintento){
  if(!hayNube()) throw new Error('sin servidor');
  const r = await fetch(`${nubeBase()}/rpc/${fn}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Accept':'application/json',
              'Authorization':'Bearer ' + await tokenAnonimo() },
    body: JSON.stringify(args)
  });
  /* Un 401 es el token vencido antes de tiempo, o rotado del otro lado. Se pide
     otro y se reintenta UNA vez: si vuelve a fallar es otra cosa, y no vale
     quedarse en un bucle mientras el socio espera parado en el tee. */
  if(r.status === 401 && !reintento){
    await tokenAnonimo(true);
    return rpc(fn, args, true);
  }
  if(!r.ok) throw new Error('servidor ' + r.status);
  return r.json();
}

/* ============================================================
   LO QUE DICE EL CLUB — traerlo y publicarlo
   ============================================================
   Esto NO late cada seis segundos como la ronda. Un aviso del club no
   cambia dos veces por minuto, y 123 teléfonos preguntando todo el día
   es gastarle los datos a la gente para nada. Se pide al abrir la app,
   al volver a ella, y después de publicar algo. Con eso alcanza.

   `p_desde` pide sólo lo que cambió, igual que `ronda_estado`. La
   primera vez va en null y trae todo. */
const CLUB_KEY = 'trisquelia_club';

function guardarClub(){
  try{ localStorage.setItem(CLUB_KEY, JSON.stringify(CLUB_VIVO)); }catch(e){}
}
function cargarClub(){
  try{
    const d = JSON.parse(localStorage.getItem(CLUB_KEY) || 'null');
    if(d && typeof d === 'object'){
      CLUB_VIVO.cancha = d.cancha || null;
      CLUB_VIVO.avisos = Array.isArray(d.avisos) ? d.avisos : [];
      CLUB_VIVO.desde  = d.desde || null;
    }
  }catch(e){}
}

/* Devuelve si cambió algo que se ve, para que `traerClubYDibujar()` decida
   si vale la pena redibujar. Mientras pregunta, `CLUB_PIDIENDO` está prendido
   y la tarjeta dice "Preguntando al club…" en vez de afirmar algo que todavía
   no sabe. Si al terminar seguimos sin ninguna respuesta del servidor, también
   cuenta como cambio: ese "Preguntando…" tiene que pasar a "Hace falta señal". */
async function traerClub(forzar){
  if(!hayNube()) return false;
  const vista = () => JSON.stringify([CLUB_VIVO.cancha, CLUB_VIVO.avisos, !!CLUB_VIVO.desde]);
  const antes = vista();
  CLUB_PIDIENDO = true;
  try{ await pedirClub(forzar); }
  finally{ CLUB_PIDIENDO = false; }
  return vista() !== antes || !CLUB_VIVO.desde;
}
async function pedirClub(forzar){
  try{
    const res = await rpc('club_estado',
      { p_club: CLUB.id, p_desde: forzar ? null : CLUB_VIVO.desde, p_socio: esSocio() });
    if(!res || res.error) return;

    if(res.cancha !== undefined) CLUB_VIVO.cancha = res.cancha;

    /* Los avisos llegan como "lo que cambió". Se mezcla con lo que ya
       había: los que vienen marcados con `borrado_en` se sacan, y los
       demás pisan al que tenga el mismo id. Si se dejara de mandar el
       borrado en vez de mandarlo marcado, el aviso quedaría en pantalla
       para siempre — es la misma lección que está en `esquema.sql`. */
    const nuevos = Array.isArray(res.avisos) ? res.avisos : [];
    if(forzar || !CLUB_VIVO.desde){
      CLUB_VIVO.avisos = nuevos.filter(a => !a.borrado_en);
    } else {
      const por = {};
      CLUB_VIVO.avisos.forEach(a => { por[a.id] = a; });
      nuevos.forEach(a => { a.borrado_en ? delete por[a.id] : por[a.id] = a; });
      CLUB_VIVO.avisos = Object.values(por)
        .sort((x,y) => String(y.creado).localeCompare(String(x.creado)));
    }
    CLUB_VIVO.desde = res.ahora || CLUB_VIVO.desde;
    NUBE_ESTADO.conectado = true;
    guardarClub();
  }catch(e){
    NUBE_ESTADO.conectado = false;
  }
}

/* ---------- lo que llega de afuera se dibuja apenas llega ----------
   Hasta la v22 el estado del club se pedía al abrir la app, pero la pantalla
   ya estaba dibujada para cuando llegaba la respuesta, y nadie la volvía a
   dibujar: el dato quedaba en memoria y la pantalla seguía diciendo "Sin
   datos · El club todavía no publicó el estado" hasta que el socio tocara
   algo. La app afirmaba que el club no había dicho nada cuando ya sabía lo
   que había dicho. Se midió el 23/10/2026, preparando la presentación, con
   un servidor que tarda 600 ms: a los 14 segundos seguía sin aparecer, con
   el GPS permitido, negado o sin contestar. Se veía bien en el teléfono de
   Mauro sólo porque ya tenía el dato guardado de una vez anterior.

   Tres condiciones para redibujar, y las tres importan:
   · que haya cambiado algo — si no, es redibujar por redibujar;
   · que nadie esté escribiendo — `render()` destruye el campo y borra lo
     tecleado, y en el panel la nota de la cancha ES un campo;
   · que la pantalla de ahora muestre ese dato. En la de jugar no se toca:
     un redibujo reinicia la animación y pierde el scroll, y el estado de la
     cancha se ve en una hoja que se dibuja fresca al abrirla.
   Lo usa también el clima. Si agregás algo que llegue solo de afuera, va
   por acá, no con un `render()` suelto. */
function redibujarSiSePuede(pantallas){
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  /* Durante el alta `S.tab` vale 'home', pero lo que se dibuja es `vOnboard()`,
     que no muestra ni la cancha ni el clima. La primera versión de esto miraba
     sólo `S.tab` y redibujaba la bienvenida cuando llegaban los datos: la
     primera pantalla que ve alguien nuevo parpadeaba sola al segundo de abrir.
     Lo encontró la simulación de la demo para la comisión, el 26/10/2026. */
  if(!S.onboarded) return false;
  if(pantallas && pantallas.indexOf(S.tab) < 0) return false;
  render();
  return true;
}
const PANTALLAS_CON_CLUB = ['home', 'dash'];
async function traerClubYDibujar(forzar){
  if(await traerClub(forzar)) redibujarSiSePuede(PANTALLAS_CON_CLUB);
}

/* ---------- la llave de la comisión ----------
   Se pega una sola vez. El servidor contesta qué puesto es, quién lo
   ocupa y qué permisos tiene, y eso queda guardado en ESTE teléfono.
   La llave no se manda a ningún otro lado ni viaja en la copia de
   seguridad: es la credencial de una persona, no un dato de la app. */
async function entrarComision(){
  const inp = $('#llaveIn');
  const ll = (inp ? inp.value : '').trim();
  if(ll.length < 32){ toast('Esa llave está incompleta'); return; }
  if(!hayNube()){ toast('Hace falta señal para entrar la primera vez'); return; }
  try{
    const r = await rpc('comision_entrar', { p_llave: ll });
    if(!r || r.error){ toast(r && r.error ? r.error : 'No se pudo entrar'); return; }
    COMISION = { llave: ll, puesto: r.puesto, persona: r.persona,
                 rol: r.rol, permisos: Array.isArray(r.permisos) ? r.permisos : [] };
    guardarComision();
    toast(`Listo · ${quienNombre()}`);
    S.mode = 'club'; S.tab = 'dash'; render();
  }catch(e){
    toast('Sin conexión · probá de nuevo');
  }
}
function salirComision(){
  COMISION = null; guardarComision();
  S.mode = 'player'; S.tab = 'me'; render();
  toast('Saliste del panel · la llave se borró de este teléfono');
}

/* ---------- guardar y recuperar ---------- */
function guardarRonda(){
  try{ RONDA ? localStorage.setItem(RONDA_KEY, JSON.stringify(RONDA))
             : localStorage.removeItem(RONDA_KEY); }catch(e){}
}
function cargarRonda(){
  try{ RONDA = rondaSana(JSON.parse(localStorage.getItem(RONDA_KEY) || 'null')); }
  catch(e){ RONDA = null; }
  if(RONDA) arrancarLatido();
}
/* La ronda guardada también puede venir de una copia armada a mano: el código
   se dibujaba tal cual en el arranque y en la hoja del grupo. Lo que no tiene
   forma de ronda no entra; los nombres se escapan igual donde se dibujan. */
function rondaSana(r){
  if(!r || typeof r !== 'object' || !/^[A-Za-z0-9]{4,12}$/.test(String(r.codigo))) return null;
  const t = (v, n) => typeof v === 'string' ? v.slice(0, n) : null;
  return { codigo: r.codigo, yo: t(r.yo, 64), llave: t(r.llave, 200),
    jugadores: (Array.isArray(r.jugadores) ? r.jugadores : []).filter(j => j && typeof j === 'object' && typeof j.id === 'string')
      .map(j => Object.assign({}, j, { nombre: t(j.nombre, 40) || '—', iniciales: t(j.iniciales, 3) || '?' })),
    anot: Object.fromEntries(Object.entries(r.anot && typeof r.anot === 'object' ? r.anot : {})
      .filter(([, a]) => a && typeof a === 'object' && (a.golpes == null || enteroEn(a.golpes, 1, 20))
                         && (a.putts == null || enteroEn(a.putts, 0, 15)) && enteroEn(a.hoyo, 1, 18))),
    cola: (Array.isArray(r.cola) ? r.cola : []).filter(opSana),
    desde: t(r.desde, 40), marcoA: t(r.marcoA, 64) };
}

/* ---------- abrir y sumarse ----------
   Sin nombre no se entra a una ronda compartida. No es un capricho: acá lo que
   viaja al servidor lo ven los otros tres del grupo, y una tarjeta que dice "—"
   o el nombre de otro no sirve para firmar nada. El index sí puede faltar —se
   juega igual y la tarjeta sale sin neto— pero el nombre, no. */
function listoParaRonda(){
  if(hayNombre()) return true;
  toast('Primero poné tu nombre');
  S.editNombre = true; go('me');
  return false;
}
async function crearRonda(){
  if(!hayNube()){ toast('Todavía no hay servidor configurado'); return; }
  if(!listoParaRonda()) return;
  const codigo = codigoNuevo();
  await entrar('ronda_abrir', {
    p_codigo:codigo, p_club:CLUB.id, p_cancha:CLUB.cancha.nombre,
    p_vuelta:S.vuelta, p_torneo:!!S.torneo,
    p_jugador: dispositivo()+'-'+codigo, p_nombre:S.user.name,
    p_iniciales:S.user.ini, p_index:S.user.hcp,
    p_hcp:hcpJuego(), p_salida:S.tee, p_llave:llaveDe(codigo)
  }, codigo);
}
async function unirseRonda(){
  if(!hayNube()){ toast('Todavía no hay servidor configurado'); return; }
  if(!listoParaRonda()) return;
  const codigo = String(S.codigoIn||'').toUpperCase().replace(/[^A-Z2-9]/g,'');
  if(codigo.length !== 6){ toast('El código son seis letras'); return; }
  await entrar('ronda_unirse', {
    p_codigo:codigo, p_jugador: dispositivo()+'-'+codigo, p_nombre:S.user.name,
    p_iniciales:S.user.ini, p_index:S.user.hcp,
    p_hcp:hcpJuego(), p_salida:S.tee, p_llave:llaveDe(codigo)
  }, codigo);
}
async function entrar(fn, args, codigo){
  S.uniendo = true; render();
  try{
    const res = await rpc(fn, args);
    if(res && res.error){ toast(res.error); S.uniendo = false; render(); return; }
    /* La llave que devuelve el servidor es de ESTE teléfono y no sale de acá:
       es lo que prueba que somos quien decimos. El código de seis letras es
       una dirección, no una credencial — se dicta en voz alta en el tee. */
    RONDA = { codigo, yo: dispositivo()+'-'+codigo,
              llave: (res && res.llave) || llaveDe(codigo),
              jugadores:[], anot:{}, cola:[], desde:null, marcoA:null };
    absorber(res);
    guardarRonda(); arrancarLatido();
    S.uniendo = false; S.codigoIn = '';
    render();
    toast(`Estás en la ronda ${codigo}`);
  }catch(e){
    S.uniendo = false; NUBE_ESTADO.error = e.message; render();
    toast('No se pudo conectar. Probá de nuevo');
  }
}
function salirRonda(){
  /* Si quedan anotaciones sin mandar, salir las deja sin mandar. Decirlo:
     "tu tarjeta no se toca" es cierto para la de este teléfono, no para la
     copia del grupo. */
  const n = (RONDA && RONDA.cola) ? RONDA.cola.length : 0;
  const pregunta = n
    ? `Hay ${n === 1 ? 'una anotación' : n + ' anotaciones'} que todavía no llegaron al grupo, y si salís no van a llegar. Tu tarjeta no se toca. ¿Salir igual?`
    : '¿Salir de la ronda del grupo? Tu tarjeta no se toca.';
  if(!confirm(pregunta)) return;
  dejarRondaCompartida();
  render();
}
function dejarRondaCompartida(){
  RONDA = null; guardarRonda();
  clearInterval(_latido); _latido = null;
  NUBE_ESTADO = { conectado:false, ultimo:null, error:null, mandando:0 };
}

/* ============================================================
   EL CICLO DE UNA VUELTA
   ============================================================
   Hasta la v24 una vuelta no terminaba nunca. `S.playing` se ponía en true al
   salir al 1 y no volvía a false en ningún lado, y la tarjeta (`R`), lo que
   anotó el marcador (`MARCA`), la tarjeta que llevo (`OTRO`) y las cuatro
   firmas no se vaciaban jamás. Comprobado el 26/10/2026:
   · después de la primera vuelta, Inicio decía "Ronda en curso" para siempre;
   · una vuelta nueva arrancaba con los golpes de la anterior;
   · la segunda vuelta de torneo arrancaba "Certificada" y "Firmada";
   · la ronda compartida seguía consultando al servidor cada 6 segundos para
     siempre, y la vuelta nueva pisaba en el servidor, hoyo por hoyo, las
     anotaciones de la anterior;
   · `momentoDeActualizar()` quedaba en false para siempre: una versión nueva
     sólo entraba cerrando la app del todo.
   Lo encontró la simulación de la demo para la comisión.

   Ahora una vuelta tiene principio y fin:
   · EMPIEZA en `empezarRonda()`, que vacía todo lo de la anterior. Antes, si
     hay una vuelta sin terminar, la pantalla de arranque pregunta si se sigue
     con esa o se termina. Una vuelta no se pisa nunca en silencio.
   · TERMINA en `terminarVuelta()`: la guarda en "Mis rondas"
     (`trisquelia_vueltas`), suelta la ronda compartida en ESTE teléfono y pone
     `S.playing` en false. La tarjeta (`R`) NO se vacía al terminar —el resumen
     la está mostrando—: se vacía al empezar la próxima.
   · La ronda compartida se suelta SIN cerrarla en el servidor: los demás del
     grupo capaz siguen jugando, y `ronda_cerrar` les rechazaría lo que anoten.
     El servidor la limpia sola a los 30 días.
   · Lo que quedó sin mandar al grupo —terminar en el 18 sin señal es lo normal
     en la cancha— no se tira: pasa a `COLA_VIEJA`, que se sigue mandando sola
     cuando vuelve la señal. Cada anotación lleva adentro su código de ronda y
     su llave, así que no necesita la ronda abierta, y no se mezcla con la
     vuelta siguiente.
   · `trisquelia_vueltas` y `trisquelia_cola_vieja` van en `COPIA_CLAVES`: una
     tarjeta es la prueba de una vuelta, y lo pendiente es parte de ella. */
const VUELTAS_KEY    = 'trisquelia_vueltas';
const COLA_VIEJA_KEY = 'trisquelia_cola_vieja';
const VUELTAS_MAX    = 60;          // más de un año de sábados
let VUELTAS = [];
let COLA_VIEJA = [];
let _mandandoVieja = false;

/* "En el medio de una vuelta": empezada y con algo anotado. Una vuelta
   empezada sin ningún golpe no tiene nada que perder. */
const enCurso = () => !!S.playing && played().length > 0;

/* ---------- leer y escribir las listas ----------
   Se lee del teléfono JUSTO ANTES de escribir, no de la memoria: si la app
   instalada y una pestaña del navegador están abiertas a la vez, comparten el
   almacenamiento, y escribir la lista que cada una cargó al arrancar borraba
   lo que había guardado la otra. Y escribir devuelve si pudo: sin lugar en el
   teléfono no se puede decir "quedó guardada". */
function leerLista(k){
  try{ const v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function escribirLista(k, arr){
  try{ arr.length ? localStorage.setItem(k, JSON.stringify(arr)) : localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}

/* ---------- lo que entra, entra sano ----------
   "Mis rondas" y lo pendiente pueden llegar de una copia de seguridad, y una
   copia es un archivo que alguien puede armar a mano. Entra entero y bien
   formado, o no entra: una fecha que exista (el primer borrador de este arreglo aceptaba "2026-13-45" y
   Perfil dejaba de dibujarse), números enteros y en rango, y de lo pendiente
   sólo las dos operaciones que esta app encola, contra una ronda y con una
   llave con forma de ronda y de llave. Una cola armada mandaba cualquier
   cosa a cualquier ruta del servidor desde el teléfono del socio. */
const fechaReal = f => { if(!/^\d{4}-\d{2}-\d{2}$/.test(String(f))) return false;
  const d = new Date(f + 'T12:00:00'); return !isNaN(d) && d.toISOString().slice(0,10) === f; };
const enteroEn = (v, a, b) => Number.isInteger(v) && v >= a && v <= b;
const vueltaSana = v => !!v && typeof v === 'object' && fechaReal(v.fecha)
  && enteroEn(v.hoyos, 1, 18) && enteroEn(v.golpes, v.hoyos, v.hoyos * 20)
  && enteroEn(v.alPar, -3 * v.hoyos, 20 * v.hoyos)
  /* Si trae la tarjeta, los totales tienen que ser los de la tarjeta: una copia
     armada decía 18 golpes en 18 hoyos (revisión adversaria de la v26). */
  && (v.R == null || (typeof v.R === 'object' && hoyosDe(v).length === v.hoyos && golpesDe(v) === v.golpes));
const opSana = o => !!o && typeof o === 'object' && (o.fn === 'anotar' || o.fn === 'marcar_a')
  && !!o.args && typeof o.args === 'object'
  && /^[A-Za-z0-9]{4,12}$/.test(String(o.args.p_codigo))
  && typeof o.args.p_llave === 'string' && o.args.p_llave.length <= 200
  && (o.fn !== 'anotar' || (enteroEn(o.args.p_hoyo, 1, 18)
        && (o.args.p_golpes == null || enteroEn(o.args.p_golpes, 1, 20))));

function cargarVueltas(){
  VUELTAS = leerLista(VUELTAS_KEY).filter(vueltaSana);
  COLA_VIEJA = leerLista(COLA_VIEJA_KEY).filter(opSana);
}

const nuevoIdVuelta = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* Copia la vuelta a "Mis rondas". Cada vuelta tiene su `S.vueltaId`, y archivar
   de nuevo la misma vuelta la ACTUALIZA en vez de sumar otra: la revisión
   adversaria encontró la misma vuelta dos veces en Mis rondas. Devuelve si
   quedó guardada en el teléfono. */
function archivarVuelta(){
  if(!played().length) return true;
  if(!S.vueltaId) S.vueltaId = nuevoIdVuelta();
  const copia = o => JSON.parse(JSON.stringify(o));
  const v = {
    id:      S.vueltaId,
    fecha:   fechaReal(S.fecha) ? S.fecha : hoyISO(),
    club:    CLUB.corto, salida: tee().n, vuelta: S.vuelta, torneo: !!S.torneo,
    estado:  !S.torneo ? 'práctica'
           : S.presento === false ? 'no presentada'
           : S.entregada ? 'entregada' : 'sin entregar',
    golpes:  total(), alPar: toPar(), hoyos: played().length,
    R: copia(R), otro: copia(OTRO), marca: copia(MARCA),
    terminada: new Date().toISOString() };
  const lista = leerLista(VUELTAS_KEY).filter(vueltaSana).filter(x => x.id !== v.id);
  lista.push(v);
  const recortada = lista.slice(-VUELTAS_MAX);
  if(!escribirLista(VUELTAS_KEY, recortada)) return false;
  VUELTAS = recortada;
  return true;
}

/* TODO O NADA. Si la vuelta no se puede guardar —el teléfono sin lugar—, no se
   termina: queda abierta, y se dice. El primer borrador decía "quedó guardada en Mis
   rondas" aunque no se hubiera guardado, y la vuelta siguiente la borraba.
   Mismo criterio con lo pendiente del grupo: si no se puede guardar aparte, la
   ronda compartida no se suelta. Devuelve si terminó. */
function terminarVuelta(){
  const sinLugar = () => { toast('No hay lugar en este teléfono para guardar la vuelta · sigue abierta. Bajá una copia de seguridad y liberá lugar.'); return false; };
  if(!archivarVuelta()) return sinLugar();
  if(RONDA){
    const pendientes = (RONDA.cola || []).filter(opSana);
    if(pendientes.length){
      const juntas = leerLista(COLA_VIEJA_KEY).filter(opSana).concat(pendientes);
      if(!escribirLista(COLA_VIEJA_KEY, juntas)) return sinLugar();
      COLA_VIEJA = juntas;
    }
    dejarRondaCompartida();
    vaciarColaVieja();
  }
  S.playing = false;
  return true;
}

/* Desde la pantalla de arranque, cuando quedó una vuelta sin terminar. */
function terminarYSeguir(){
  if(!terminarVuelta()){ render(); return; }
  render();
  toast('Esa vuelta quedó guardada en Mis rondas · ya podés empezar otra');
}

/* Lo pendiente de vueltas ya terminadas. Mismo criterio que `vaciarCola()`: de
   a una y en orden; un 200 con `{error}` no es un éxito, pero tampoco se
   arregla reintentando —la ronda se cerró, o la llave no es la nuestra—, así
   que se saca y se dice. Y un rechazo DEFINITIVO del servidor (400, 403, 404…)
   tampoco: el primer borrador lo trataba como "sin señal", lo reintentaba para siempre y
   trababa todo lo que venía detrás. Sin señal, o con el servidor caído (5xx),
   se corta y se reintenta después. */
const RECHAZO_DEFINITIVO = /^servidor (400|403|404|405|409|410|413|422)$/;
/* Si piden mandar mientras ya se está mandando, no se descarta el pedido: se
   anota y se hace otra pasada al terminar. Sin esto, la señal que vuelve en el
   medio de un intento fallido se perdía —el "online" llegaba con el intento
   anterior todavía en vuelo— y lo pendiente esperaba hasta la próxima vez que
   se abriera la app. Lo encontró `vueltatest`, que fallaba 1 de cada 4 veces. */
let _otraVezVieja = false;
async function vaciarColaVieja(){
  if(!hayNube()) return;
  if(_mandandoVieja){ _otraVezVieja = true; return; }
  _otraVezVieja = false;
  COLA_VIEJA = leerLista(COLA_VIEJA_KEY).filter(opSana);
  if(!COLA_VIEJA.length) return;
  _mandandoVieja = true;
  try{
    while(COLA_VIEJA.length){
      const op = COLA_VIEJA[0];
      let res = null, definitivo = false;
      try{ res = await rpc(op.fn, op.args); }
      catch(e){ if(RECHAZO_DEFINITIVO.test(e.message)) definitivo = true; else throw e; }
      /* Se saca por IDENTIDAD, releyendo: otra instancia abierta pudo haber
         sumado algo mientras se mandaba, o haber sacado ésta. */
      const enviada = JSON.stringify(op);
      COLA_VIEJA = leerLista(COLA_VIEJA_KEY).filter(opSana);
      const i = COLA_VIEJA.findIndex(x => JSON.stringify(x) === enviada);
      if(i >= 0) COLA_VIEJA.splice(i, 1);
      escribirLista(COLA_VIEJA_KEY, COLA_VIEJA);
      if(definitivo || (res && res.error))
        toast('Una anotación de la vuelta anterior no llegó al grupo' + (res && res.error ? ' · ' + res.error : ''));
    }
  }catch(e){ /* sin señal o servidor caído: queda para la próxima */ }
  finally{
    _mandandoVieja = false;
    /* Una sola pasada más, y sólo si alguien la pidió mientras tanto: no es
       un reintento en bucle. */
    if(_otraVezVieja){ _otraVezVieja = false; vaciarColaVieja(); }
  }
}

/* ---------- guardar lo que llega ---------- */
function absorber(res){
  if(!res || !RONDA) return;
  if(Array.isArray(res.jugadores)) RONDA.jugadores = res.jugadores;
  (res.anotaciones || []).forEach(a => {
    /* Lo mío no se pisa: de mis anotaciones el dueño soy yo, y lo que
       tengo en el teléfono es más nuevo que lo que pueda volver. */
    if(a.por === RONDA.yo) return;
    /* Borrado lógico: el servidor manda la anotación borrada con su
       `borrado_en` para que la saquemos. Si sólo dejara de mandarla,
       este teléfono la seguiría mostrando para siempre. */
    if(a.borrado_en){ delete RONDA.anot[a.de + '|' + a.por + '|' + a.hoyo]; return; }
    RONDA.anot[a.de + '|' + a.por + '|' + a.hoyo] = a;
  });
  if(res.ahora) RONDA.desde = res.ahora;
  const mio = (RONDA.jugadores || []).find(j => j.id === RONDA.yo);
  if(mio) RONDA.marcoA = mio.marca_a || null;
  NUBE_ESTADO.conectado = true;
  NUBE_ESTADO.ultimo = Date.now();
  NUBE_ESTADO.error = null;
}

/* ---------- la cola: nada se pierde sin señal ---------- */
function encolar(fn, args, clave){
  if(!RONDA) return;
  RONDA.cola = RONDA.cola || [];
  /* Si ya había algo para el mismo hoyo y el mismo jugador, lo pisamos:
     no tiene sentido mandar tres correcciones seguidas del mismo número. */
  if(clave) RONDA.cola = RONDA.cola.filter(o => o.clave !== clave);
  RONDA.cola.push({ fn, args, clave, t:Date.now() });
  guardarRonda();
  vaciarCola();
}
async function vaciarCola(){
  /* `r` es LA ronda de esta pasada. Desde la v25 una vuelta termina y suelta su
     ronda, y un pedido puede volver cuando `RONDA` ya es otra: la revisión
     adversaria encontró que el `shift()` de abajo le sacaba a la ronda NUEVA
     una anotación que nunca se había mandado, y la pastilla decía "al día".
     Después de cada espera, si la ronda cambió, se corta sin tocar nada: lo
     que quedaba de la vieja ya pasó a `COLA_VIEJA`. */
  const r = RONDA;
  if(!r || !hayNube() || NUBE_ESTADO.mandando) return;
  if(!r.cola || !r.cola.length) return;
  const estado = NUBE_ESTADO;
  estado.mandando = 1;
  try{
    /* De a uno y en orden. Cada anotación pisa la anterior del mismo
       hoyo, así que reintentar nunca duplica nada. */
    while(r.cola.length){
      const op = r.cola[0];
      const res = await rpc(op.fn, op.args);
      if(RONDA !== r) return;
      /* Un 200 con `{error:...}` NO es un éxito. Antes se descartaba igual y
         la app decía "al día": el jugador creía que había anotado y en el
         servidor no había nada. Un rechazo no se arregla reintentando —la
         ronda se cerró, o la llave no es la nuestra— así que lo sacamos de
         la cola y lo DECIMOS, una vez por motivo. */
      r.cola.shift();
      guardarRonda();
      if(res && res.error){
        estado.error = res.error;
        if(_ultimoRechazo !== res.error){ _ultimoRechazo = res.error; toast('No se pudo guardar en el grupo · ' + res.error); }
        continue;
      }
      _ultimoRechazo = null;
    }
    estado.conectado = true; estado.error = null;
  }catch(e){
    /* Si la ronda cambió, este error es de la vieja: no ensucia el estado de
       la nueva (antes quedaba "Cannot read properties of null" en el
       diagnóstico que el socio copia para pedir ayuda). */
    if(RONDA === r){ estado.conectado = false; estado.error = e.message; }
  }finally{
    estado.mandando = 0;
  }
}

/* ---------- preguntar qué hicieron los demás ---------- */
async function latir(){
  const r = RONDA;
  if(!r || !hayNube()) return;
  if(document.hidden) return;            // con la pantalla apagada no gastamos datos
  await vaciarCola();
  if(RONDA !== r) return;
  try{
    const res = await rpc('ronda_estado', { p_codigo:r.codigo, p_desde:r.desde });
    /* Si mientras se esperaba la vuelta terminó o cambió de ronda, esta
       respuesta es de otra: absorberla le metía a la ronda nueva jugadores,
       anotaciones y un `desde` de la vieja (revisión adversaria de la v25). */
    if(RONDA !== r) return;
    /* La ronda se borró del servidor. Se lo decimos y salimos: mostrar la
       tarjeta del grupo vacía, sin explicar por qué, sería inventar. Lo que
       este teléfono anotó no se toca — vive en su propia tarjeta. */
    if(res && res.borrada){
      const cod = RONDA.codigo;
      RONDA = null; guardarRonda();
      clearInterval(_latido); _latido = null;
      NUBE_ESTADO = { conectado:false, ultimo:null, error:null, mandando:0 };
      render(); toast(`La ronda ${cod} ya no está · tu tarjeta se conserva`);
      return;
    }
    const antes = JSON.stringify(RONDA.anot).length + (RONDA.jugadores||[]).length;
    absorber(res);
    guardarRonda();
    const despues = JSON.stringify(RONDA.anot).length + (RONDA.jugadores||[]).length;
    if(antes !== despues && !S.cerrando) render();   // sólo redibujamos si cambió algo
  }catch(e){
    NUBE_ESTADO.conectado = false; NUBE_ESTADO.error = e.message;
  }
}
function arrancarLatido(){
  clearInterval(_latido);
  if(!RONDA || !hayNube()) return;
  _latido = setInterval(latir, LATIDO);
  latir();
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) latir(); });
window.addEventListener('online', () => { vaciarCola(); latir(); });

/* ---------- anotar ---------- */
/* Se llama al cerrar el hoyo. Manda mi tarjeta y, si soy marcador de
   alguien, también la de él. Son dos filas distintas: nadie pisa a nadie. */
function anotarEnLaNube(h){
  if(!RONDA) return;
  const yo = RONDA.yo;
  if(R.scores[h] !== undefined){
    encolar('anotar', { p_codigo:RONDA.codigo, p_llave:RONDA.llave, p_por:yo, p_de:yo, p_hoyo:h,
      p_golpes:R.scores[h], p_putts:R.putts[h] ?? null,
      p_bunker:R.bunker[h] ?? null, p_penal:R.penal[h] ?? null,
      p_salida_fw:R.fw[h] ?? null }, `${yo}|${yo}|${h}`);
  }
  const aQuien = RONDA.marcoA;
  if(aQuien && OTRO[h] != null){
    encolar('anotar', { p_codigo:RONDA.codigo, p_llave:RONDA.llave, p_por:yo, p_de:aQuien, p_hoyo:h,
      p_golpes:OTRO[h], p_putts:null, p_bunker:null, p_penal:null,
      p_salida_fw:null }, `${aQuien}|${yo}|${h}`);
  }
}
function elegirAQuienMarco(id){
  if(!RONDA) return;
  RONDA.marcoA = id; guardarRonda();
  encolar('marcar_a', { p_codigo:RONDA.codigo, p_llave:RONDA.llave,
                        p_jugador:RONDA.yo, p_a:id }, 'marca');
  render();
  const j = (RONDA.jugadores||[]).find(x => x.id === id);
  toast(j ? `Llevás la tarjeta de ${j.nombre}` : 'Listo');
}

/* ---------- EL CRUCE ----------
   Lo que anotó mi marcador sobre mí, contra lo que anoté yo. */
const miMarcador = () => (RONDA && RONDA.jugadores || []).find(j => j.marca_a === RONDA.yo) || null;

function loQueDiceMiMarcador(h){
  if(!RONDA) return null;
  const m = miMarcador();
  if(!m) return null;
  const a = RONDA.anot[`${RONDA.yo}|${m.id}|${h}`];
  return a && a.golpes != null ? { golpes:a.golpes, quien:m.nombre } : null;
}
/* ¿Hay diferencia en este hoyo? */
function cruceHoyo(h){
  const suyo = loQueDiceMiMarcador(h);
  if(!suyo) return null;
  const mio = R.scores[h];
  if(mio === undefined) return { esperando:true, ...suyo };
  return { coincide: mio === suyo.golpes, mio, ...suyo };
}
/* Todas las diferencias de la vuelta, para la firma. */
function crucesAbiertos(){
  const out = [];
  for(let h = 1; h <= S.vuelta; h++){
    const c = cruceHoyo(h);
    if(c && !c.esperando && !c.coincide) out.push({ hoyo:h, ...c });
  }
  return out;
}

/* El score de cada jugador del grupo, para la tarjeta en vivo.
   Vale lo que anotó él de sí mismo; si todavía no cargó, lo que
   anotó su marcador, aclarando de dónde salió. */
function scoresDe(id){
  const out = {};
  if(!RONDA) return out;
  for(let h = 1; h <= S.vuelta; h++){
    if(id === RONDA.yo){
      if(R.scores[h] !== undefined) out[h] = { golpes:R.scores[h], propio:true };
      continue;
    }
    const propio = RONDA.anot[`${id}|${id}|${h}`];
    if(propio && propio.golpes != null){ out[h] = { golpes:propio.golpes, propio:true }; continue; }
    const otro = Object.keys(RONDA.anot)
      .filter(k => k.startsWith(id + '|') && k.endsWith('|' + h))
      .map(k => RONDA.anot[k]).find(a => a.golpes != null);
    if(otro) out[h] = { golpes:otro.golpes, propio:false };
  }
  return out;
}

/* ---------- lo que se ve ---------- */
function pillNube(){
  if(!RONDA) return '';
  const c = NUBE_ESTADO.conectado;
  const pend = (RONDA.cola || []).length;
  return `<span class="enlinea"><span class="luz ${c ? 'si' : 'no'}"></span>${
    c ? (pend ? `mandando ${pend}` : 'al día')
      : (pend ? `${pend} sin mandar` : 'sin señal')}</span>`;
}

/* La tarjeta que aparece al arrancar la ronda. */
function tarjetaGrupo(){
  if(!hayNube()) return `
    <div class="card">
      <div class="row" style="align-items:flex-start"><div class="ico">${ico('👥')}</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:14px">Jugar con el grupo</div>
        <div class="dim" style="font-size:12px">Para que la tarjeta se vea entre los teléfonos hace falta
        conectar el servidor. Está todo listo: faltan dos datos en el código.</div></div></div>
    </div>`;

  if(!RONDA) return `
    <div class="card">
      <div class="between" style="margin-bottom:11px">
        <div><div class="lbl">Jugar con el grupo</div>

  if(c.coincide) return `<div class="cruce ok" style="margin-bottom:12px">
    <div style="font-size:12.5px;font-weight:700" class="ok">✓ Coincide con ${esc(c.quien)}</div>
