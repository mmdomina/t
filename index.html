/* ---------- RESUMEN DE RONDA ---------- */
function vSummary(){
  const p=played(), t=total(), tp=toPar();
  const b=p.filter(h=>R.scores[h]<par(h)).length;
  const pars=p.filter(h=>R.scores[h]===par(h)).length;
  const bog=p.filter(h=>R.scores[h]>par(h)).length;
  const putts=p.reduce((a,h)=>a+(R.putts[h]||0),0);
  const fw=p.filter(h=>R.fw[h]==='fw'&&par(h)>3).length;
  return `<div class="fade">
  <div class="pad" style="padding-top:20px">
    <div class="card" style="background:linear-gradient(135deg,var(--tint),var(--card));border-color:var(--acc2);text-align:center;padding:24px">
      <div style="font-size:40px">⛳</div>
      <div class="lbl" style="margin-top:6px">${!S.torneo?'Ronda de práctica'
        :(S.presento===false?'No presentada · queda para vos'
        :(S.entregada?'Tarjeta entregada al club':'Tarjeta de torneo'))} · ${CLUB.corto}</div>
      <div style="font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.05">${t}</div>
      <div class="pill" style="font-size:14px;padding:6px 16px">${fmtPar(tp)} al par · ${p.length} hoyos</div>
      <div class="sep"></div>
      <div class="between"><div><div class="lbl">Handicap</div>
        <div style="font-weight:800;font-size:18px">${verIndex(S.user.hcp)} · cancha ${verHcp(hcpCancha(S.user.hcp))}</div></div>
        <div style="text-align:right"><div class="lbl">Stableford</div>
        <div style="font-weight:800;font-size:18px">31 pts</div></div></div>
    </div>

    <div class="grid4">
      ${[['Birdies',b,'acc'],['Pares',pars,''],['Bogeys+',bog,''],['Putts',putts,'']].map(([l,v,c])=>
        `<div class="card" style="margin:0 0 10px;text-align:center;padding:12px 6px">
          <div class="big ${c}" style="font-size:24px">${v}</div>
          <div class="lbl" style="font-size:9px">${l}</div></div>`).join('')}
    </div>

    <div class="card"><h3>Lo mejor y lo peor</h3>
      <div class="item"><div class="ico">🔥</div><div><div style="font-weight:700">Hoyo 6 — birdie</div>
        <div class="dim" style="font-size:12px">Par 3 de 187 yds. Green en regulación y un putt.</div></div></div>
      <div class="item"><div class="ico">🩹</div><div><div style="font-weight:700">Hoyo 2 — doble bogey</div>
        <div class="dim" style="font-size:12px">Segundo golpe al bunker. Es tu patrón: 2 golpes perdidos por ronda ahí.</div></div></div>
      <div class="item"><div class="ico">📈</div><div><div style="font-weight:700">${fw} fairways de ${p.filter(h=>par(h)>3).length}</div>
        <div class="dim" style="font-size:12px">Por encima de tu media de la temporada.</div></div></div>
    </div>

    ${(()=>{const all=[].concat(...Object.values(R.shots));
      if(!all.length)return '';
      const by={};all.forEach(s=>{(by[s.c]=by[s.c]||[]).push(s.d)});
      return `<div class="card"><h3>Lo que cargaste esta ronda</h3>
        ${Object.entries(by).map(([c,ds])=>
          `<div class="between" style="padding:8px 0;border-bottom:1px solid var(--hair)">
            <span style="font-weight:700">${c} <span class="dim2" style="font-weight:500;font-size:12px">×${ds.length}</span></span>
            <span class="mono dim" style="font-size:13px">${ds.join(' · ')} yds</span></div>`).join('')}
        <div class="dim" style="font-size:12px;margin-top:10px">
          Estos ${all.length} golpes ya se sumaron a las medias de tu bolsa.</div>
        <button class="btn ghost sm" style="margin-top:10px" onclick="go('bag')">Ver mi bolsa</button>
      </div>`})()}

    <div class="card"><h3>El caddie dice</h3>
      <p style="font-size:13px">Jugaste ${fmtPar(tp)} con ${putts} putts. Si convertías dos de los tres
      up&amp;down que fallaste, cerrabas en ${t-2}. Tu práctica de esta semana: bunker y approach de 120 yds.</p>
      <button class="btn ghost sm" onclick="go('stats')">Ver plan de práctica</button>
    </div>

    <div style="margin-bottom:24px">
      <button class="btn" onclick="toast('📤 Tarjeta compartida con tu grupo y el club')">Compartir tarjeta</button>
      <div style="height:8px"></div>
      <button class="btn ghost sm" onclick="go('home')">Volver al inicio</button>
    </div>
  </div></div>`;
}

/* ---------- ONBOARDING ---------- */
/* ---------- ALTA DE CUENTA ----------
   Pasos: 0 bienvenida · 1 socio o no · 2 buscarte en el padrón ·
   3 email y clave · 4 handicap · 5 bolsa · 6 listo */
const PASOS = 4;
function paso(n,t){ return `<div class="hdr" style="padding-top:20px">
  <div><div class="lbl">Paso ${n} de ${PASOS}</div><h1>${t}</h1></div></div>`; }

function vOnboard(){
  const S_ = S;

  if(S.onb===0) return `<div class="fade" style="height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 26px;text-align:center">
    <div style="display:flex;justify-content:center">${crestWord()}</div>
    <div class="lbl" style="margin:20px 0 14px">${CLUB.lema}</div>
    <p style="font-size:15px;margin-bottom:26px">La app del club. Tu tarjeta, tus distancias,
    los torneos y los resultados de ${CLUB.corto}.</p>
    <div style="text-align:left;margin-bottom:26px">
      ${[['📍','Cuánto te queda al green, hoyo por hoyo'],
         ['📏','Las distancias de cada hoyo, desde las cuatro salidas'],
         ['📊','Cargás tu index y sabés con cuánto jugás'],
         ['🏆','Torneos, inscripciones y resultados']].map(([i,t])=>
        `<div class="row" style="margin-bottom:12px"><div class="ico">${i}</div>
          <div style="font-size:14px;font-weight:600">${t}</div></div>`).join('')}
    </div>
    <button class="btn" onclick="S.onb=1;render()">Crear mi cuenta</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="skipOnb()">Ya tengo cuenta · entrar</button>
  </div>`;

  /* ---- 1. socio o no ---- */
  if(S.onb===1) return `<div class="fade">${paso(1,'¿Cómo entrás?')}
    <div class="pad">
    <div class="card" style="display:flex;gap:14px;align-items:center">
      ${crest(52)}
      <div style="min-width:0"><div style="font-weight:800">${CLUB.nombre}</div>
        <div class="dim" style="font-size:12px">${CLUB.ciudad}</div>
        <div class="dim2" style="font-size:11px">${CLUB.cancha.hoyosFisicos} hoyos · par ${CLUB.cancha.par} en 18</div></div>
    </div>
    ${[['socio','Soy socio de Trisquelia','⛳',
        'Todo: tu cuenta, la cuota, el ranking del club y los avisos internos.'],
       ['invitado','No soy socio','🎟️',
        'Jugás igual con GPS, tarjeta y estadísticas. Ves los torneos y los resultados.']]
      .map(([k,t,ic,d])=>
      `<div class="card" style="cursor:pointer;${S.tipo===k?'border-color:var(--acc)':''}"
        onclick="S.tipo='${k}';render()">
        <div class="row" style="align-items:flex-start"><div class="ico">${ic}</div>
        <div style="min-width:0"><div style="font-weight:700">${t}</div>
        <div class="dim" style="font-size:12px">${d}</div></div></div></div>`).join('')}
    <button class="btn" onclick="seguirDesdeTipo()">Continuar</button>
    </div></div>`;

  /* ---- 2. buscarte en el padrón y verificar que sos vos ---- */
  if(S.onb===2){
    const est = S.padronEstado, p = S.hallado;
    const aviso = (ic,tit,txt) => `<div style="background:#3a3117;border:1px solid #5c4a1f;border-radius:12px;padding:13px">
      <div class="row" style="align-items:flex-start"><div class="ico" style="background:#5c4a1f">${ic}</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:14px" class="gold">${tit}</div>
        <div class="dim" style="font-size:12px">${txt}</div></div></div></div>`;

    return `<div class="fade">${paso(1,'Verificamos que sos vos')}
    <div class="pad">
    <p>Buscamos tu DNI en el padrón y te mandamos un código <b>al contacto que el club ya tiene</b>.
    Así nadie puede anotarse con el DNI de otro.</p>

    <div class="card">
      <div class="lbl">Tu DNI</div>
      <input value="${S.dni||''}" placeholder="30123456" inputmode="numeric" oninput="S.dni=this.value"
        ${est&&est!=='nopadron'?'disabled':''}
        style="width:100%;margin-top:7px;padding:15px;border-radius:12px;background:var(--nav);
        border:1px solid ${(est==='usado'||est==='nopadron'||est==='sincontacto')?'var(--gold)':'var(--line)'};
        color:var(--txt);font-family:inherit;font-size:18px;font-weight:700;letter-spacing:.05em;
        text-align:center;${est&&est!=='nopadron'?'opacity:.6':''}">
      ${!est?`<div class="dim2" style="font-size:11px;margin-top:8px">Sin puntos ni espacios.</div>
        <button class="btn sm" style="margin-top:12px" onclick="buscarPadron()">Buscarme</button>`:''}

      ${est==='codigo'?`
      <div class="sep"></div>
      <div class="row" style="margin-bottom:12px"><div class="ico">📩</div>
        <div style="min-width:0"><div style="font-weight:700;font-size:13px">Te mandamos un código</div>
        <div class="dim" style="font-size:12px">A ${p.mail?tapar(p.mail):taparTel(p.tel)}, el contacto
        que ${CLUB.corto} tiene registrado.</div></div></div>
      <input value="${S.codigo||''}" placeholder="• • • • • •" inputmode="numeric" oninput="S.codigo=this.value"
        style="width:100%;padding:15px;border-radius:12px;background:var(--nav);border:1px solid var(--line);
        color:var(--txt);font-family:inherit;font-size:22px;font-weight:800;letter-spacing:.35em;text-align:center">
      <button class="btn sm" style="margin-top:12px" onclick="verificarCodigo()">Verificar</button>
      <div class="grid2" style="margin-top:8px">
        <button class="btn ghost sm" onclick="toast('Código reenviado')">Reenviar</button>
        <button class="btn ghost sm" onclick="reiniciarBusqueda()">Cambiar el DNI</button>
      </div>
      <div class="dim2" style="font-size:11px;margin-top:10px">
        ¿No te llega? Puede que el club tenga otro mail tuyo.
        <a href="#" onclick="S.padronEstado='sincontacto';render();return false"
           style="color:var(--acc);display:inline-block;padding:12px 2px;font-size:13px;font-weight:700">Pedir habilitación</a></div>`:''}

      ${est==='verificado'? (p.deMentira ? `
      <div class="sep"></div>
      <div class="card" style="background:#3a3117;border-color:#5c4a1f;margin:0">
        <div style="font-weight:700;font-size:13px" class="gold">Modo prueba</div>
        <div class="dim" style="font-size:12px;margin-top:3px;line-height:1.5">
          Todavía no está conectado el padrón del club, así que no podemos confirmar
          quién sos. Escribí tu nombre y seguimos: es sólo para que veas el tuyo
          mientras probás.</div>
      </div>
      <input value="${S.nombrePrueba||''}" placeholder="Nombre y apellido"
        oninput="S.nombrePrueba=this.value"
        style="width:100%;margin-top:11px;padding:14px;border-radius:12px;background:var(--nav);
        border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px">
      <button class="btn sm" style="margin-top:11px" onclick="usarNombrePrueba()">Continuar</button>`
      : `
      <div class="sep"></div>
      <div class="row" style="background:var(--tint);border-radius:12px;padding:13px">
        <div class="avatar">${p.n.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
        <div style="min-width:0"><div style="font-weight:800">${p.n}</div>
        <div class="dim" style="font-size:12px">Socio #${p.socio} · alta ${p.alta}</div>
        <div class="acc" style="font-size:11px;font-weight:700">✓ Identidad verificada</div></div>
      </div>
      <button class="btn sm" style="margin-top:12px" onclick="S.onb=3;render()">Continuar</button>`):''}

      ${est==='usado'?`
      <div class="sep"></div>
      ${aviso('🔒','Ese DNI ya tiene cuenta',`Está registrado con <b>${p.cuenta}</b>. Cada socio tiene una sola cuenta.`)}
      <button class="btn sm" style="margin-top:11px" onclick="skipOnb()">Entrar con esa cuenta</button>
      <div class="grid2" style="margin-top:8px">
        <button class="btn ghost sm" onclick="toast('Te mandamos un link a ${p.cuenta}')">Olvidé la clave</button>
        <button class="btn ghost sm" onclick="toast('Aviso enviado al club · lo revisan y te contactan')">No fui yo</button>
      </div>`:''}

      ${est==='sincontacto'?`
      <div class="sep"></div>
      ${aviso('📇','El club no tiene tu contacto',`Figurás en el padrón pero sin mail ni teléfono cargado,
        así que no podemos mandarte el código. Te habilita alguien del club.`)}
      <button class="btn sm" style="margin-top:11px" onclick="toast('Pedido enviado · el club te habilita y te avisa')">
        Pedir habilitación</button>
      <button class="btn ghost sm" style="margin-top:8px" onclick="reiniciarBusqueda()">Volver</button>`:''}

      ${est==='nopadron'?`
      <div class="sep"></div>
      ${aviso('🤔','No figurás en el padrón','Puede ser que seas socio nuevo o que el club todavía no te haya cargado.')}
      <div class="grid2" style="margin-top:11px">
        <button class="btn ghost sm" onclick="reiniciarBusqueda()">Corregir</button>
        <button class="btn sm" onclick="toast('Pedido enviado · el club te habilita y te avisa')">Pedir habilitación</button>
      </div>`:''}
    </div>

    ${!est?`<div class="card"><div class="row"><div class="ico">🎟️</div>
      <div style="min-width:0"><div style="font-weight:700;font-size:13px">¿Todavía no sos socio?</div>
      <div class="dim" style="font-size:12px">Podés usar la app igual, con menos funciones.</div></div></div>
      <button class="btn ghost sm" style="margin-top:11px" onclick="S.tipo='invitado';S.onb=3;render()">
        Entrar como invitado</button>
    </div>
    <div class="dim2" style="font-size:11px;text-align:center;margin-bottom:20px">
      El DNI dice quién sos. El código dice que sos vos.</div>`:''}
    </div></div>`;
  }

  /* ---- 3. email y clave ---- */
  if(S.onb===3) return `<div class="fade">${paso(2,'Tu usuario')}
    <div class="pad">
    <p>El usuario es tu email. Con eso recuperás la clave si te la olvidás.</p>
    ${(S.hallado && S.hallado.mail) ? `
    <div class="card" style="border-color:var(--acc);padding:13px">
      <div class="row" style="align-items:flex-start"><div class="ico">✉️</div>
      <div style="min-width:0">
        <div style="font-weight:700;font-size:13px">Usá el mismo mail que tiene el club</div>
        <div class="dim" style="font-size:12px;margin-top:2px">Es el que figura en el padrón y ya lo
        dejamos cargado abajo. Si usás otro, después no vas a poder recuperar la clave por ese camino
        y vas a tener que pedirle a la comisión que te lo cambie.</div>
      </div></div>
    </div>` : ''}
    <div class="card">
      <div class="lbl">Email</div>
      <input value="${S.email||''}" placeholder="nombre@correo.com" inputmode="email" oninput="S.email=this.value"

        border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px">
      <div class="lbl">Clave</div>
      <input type="password" value="" placeholder="Al menos 8 caracteres" oninput="evalClave(this.value)"
        style="width:100%;margin:6px 0 6px;padding:14px;border-radius:12px;background:var(--nav);
        border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px">
      <div class="bar" style="height:5px"><i id="claveBar" style="width:${Math.min(100,(S.clave||0)*8)}%;
        background:${S.claveOk?'var(--acc)':'var(--gold)'}"></i></div>
      <div class="dim2" id="claveMsg" style="font-size:11px;margin-top:7px">${S.claveMsg||'Elegí una clave.'}</div>
      <div class="dim2" style="font-size:11px;margin-top:5px">
        Sin reglas de mayúsculas ni símbolos. Lo que la hace fuerte es que sea larga:
        <b style="color:var(--dim)">mipaloesundriver</b> es mejor que <b style="color:var(--dim)">Tr1sq!</b></div>
      <div class="sep"></div>
      <div class="row"><div class="ico">📱</div><div style="min-width:0">
        <div style="font-weight:600;font-size:13px">¿Preferís sin clave?</div>
        <div class="dim2" style="font-size:11px">Te mandamos un código al email cada vez que entrás.
        No hay clave que recordar ni que te puedan robar.</div></div></div>
      <button class="btn ghost sm" style="margin-top:10px" onclick="S.email=S.email||'socio@trisquelia.com';S.clave=8;S.claveOk=true;S.claveMsg='';S.onb=4;render();toast('Entrás con código al email')">
        Entrar con código, sin clave</button>
    </div>
    <button class="btn" onclick="crearCuenta()">Crear la cuenta</button>
    <div class="dim2" style="font-size:11px;text-align:center;margin-top:10px">
      Tu clave se guarda cifrada. El club no la ve ni la puede recuperar, solo restablecerla.</div>
    </div></div>`;

  /* ---- 4. handicap ---- */
  if(S.onb===4) return `<div class="fade">${paso(3,'Tu handicap')}
    <div class="pad">

    <div class="card">
      <div class="row" style="background:var(--tint);border-radius:12px;padding:11px 13px;margin-bottom:14px">
        <div class="ico" style="background:var(--card)">🏅</div>

          <div class="dim2" style="font-size:11px">La matrícula es para que el profesional pueda cargar tu tarjeta en la federación sin buscarla. El index lo actualizás vos los jueves.</div></div>
      </div>
      <div class="lbl">Desde qué salidas jugás</div>
      <div class="grid2" style="margin-top:7px;margin-bottom:16px">
        <button class="chip ${S.user.cat==='cab'?'on':''}" style="padding:14px 6px;font-size:14px"
          onclick="setCat('cab')">Caballeros</button>
        <button class="chip ${S.user.cat==='dam'?'on':''}" style="padding:14px 6px;font-size:14px"
          onclick="setCat('dam')">Damas</button>
      </div>
      <div class="lbl">Número de matrícula</div>
      <input value="${S.mat||''}" placeholder="Ej. 123456" inputmode="numeric" oninput="S.mat=this.value"
        style="width:100%;margin-top:7px;padding:14px;border-radius:12px;background:var(--nav);
        border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.06em">
      <div class="lbl" style="margin-top:14px">Tu handicap index</div>
      <input value="${S.hcpIn||''}" placeholder="Ej. 7.4 · los &quot;más&quot; van así: +2.3" inputmode="decimal" oninput="S.hcpIn=this.value"
        style="width:100%;margin-top:7px;padding:14px;border-radius:12px;background:var(--nav);
        border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:16px;font-weight:700">

        <div class="sep"></div>
        <div class="between">
          <div><div class="lbl">Tu index</div>
            <div style="font-weight:800;font-size:19px">${verIndex(S.user.hcp)}</div></div>
          <div style="text-align:right"><div class="lbl">Handicap de cancha</div>
            <div class="big acc" style="font-size:30px">${verHcp(hcpCancha(S.user.hcp, tHcp))}</div></div>
        </div>
        ${sal.aviso?`<div class="dim2" style="font-size:11px;margin-top:9px;line-height:1.5">${sal.aviso}</div>`:''}
      </div>`;})()}`:''}
      <button class="btn ${S.fedOk?'ghost':''} sm" style="margin-top:12px" onclick="traer()">
        ${S.fedOk?'Corregir':'Guardar mi handicap'}</button>
    </div>
    <button class="btn" onclick="if(S.fedOk){S.onb=5;render()}else{toast('Cargá tu matrícula y tu index')}">Continuar</button>
    <div class="card" style="margin-top:12px"><div class="row"><div class="ico">📇</div>
      <div style="min-width:0"><div style="font-weight:700;font-size:13px">¿No tenés matrícula?</div>
      <div class="dim" style="font-size:12px">Para jugar hace falta handicap vigente. Si sos socio
      colaborador y no jugás, igual podés seguir los torneos y las novedades del club.</div></div></div>
      <button class="btn ghost sm" style="margin-top:11px" onclick="S.soloSeguir=true;S.onb=6;render();toast('Vas a seguir al club sin jugar')">
        Solo quiero seguir al club</button>
    </div>
    </div></div>`;

  /* ---- 5. la bolsa ---- */
  if(S.onb===5) return `<div class="fade">${paso(4,'Armá tu bolsa')}
    <div class="pad">
    <p>Marcá los palos que llevás. Cada vez que pegues vas cargando con qué palo y cuánto
    pegaste, y la app arma <b>tus</b> distancias reales.</p>
    <div class="card" style="padding:12px">
      ${bagPorGrupo().map(([g,lista])=>`
        <div class="lbl" style="margin:10px 0 2px">${g}</div>
        ${lista.map(({b,i})=>`<div class="item" style="padding:9px 0">
        <button class="chip ${b.on?'on':''}" style="width:44px;padding:9px 0;flex:0 0 auto"
          onclick="togBag(${i})">${b.on?'✓':''}</button>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${etiq(b)} · ${b.name}</div>
          <div class="dim" style="font-size:12px">${b.putter?'Putter':'Media estimada '+b.base+' yds — se corrige con tus golpes'}</div>
        </div></div>`).join('')}`).join('')}
    </div>
    <div class="dim2" style="font-size:11px;margin-bottom:12px">
      Están todos los palos que existen: marcá los tuyos.
      Las reglas permiten <b>14 como máximo</b> — llevás ${BAG.filter(b=>b.on).length}.</div>
    <button class="btn" onclick="S.onb=6;render()">Continuar</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="S.onb=6;render()">Lo hago después</button>
    </div></div>`;

  /* ---- 6. listo ---- */
  return `<div class="fade" style="height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 26px;text-align:center">
    <div style="font-size:64px">🎉</div>
    <h1 style="font-size:28px;margin:14px 0 8px">Listo${esSocio()?', Mauro':''}</h1>
    <p style="font-size:15px;margin-bottom:24px">${CLUB.corto} cargado con sus ${CLUB.cancha.hoyosFisicos} hoyos,
    las dos vueltas, las reglas locales y los torneos.</p>
    <div class="card" style="text-align:left">
      ${[['✅','Cancha descargada','los 9 hoyos, funciona sin señal'],
         ...(esSocio()?[['✅','Socio verificado','figurás en el padrón del club']]:[]),
         ['✅','Cuenta creada', S.email||'con tu email'],
         ['✅','Bolsa cargada',BAG.filter(b=>b.on).length+' palos listos para medir']].map(([i,t,d])=>
        `<div class="item"><div class="ico">${i}</div><div><div style="font-weight:700;font-size:14px">${t}</div>
          <div class="dim" style="font-size:12px">${d}</div></div></div>`).join('')}
    </div>
    <button class="btn" onclick="skipOnb()">Entrar a la app</button>
  </div>`;
}

/* Sin ubicación no se sale a jugar. Las distancias medidas a pie en esta
   cancha son el producto, y una app que las da flojas sin avisar es peor que

   alguien se le apaga el GPS en el hoyo 12 en un torneo no puede quedarse sin
   dónde anotar. Por eso hay una puerta explícita, chica y abajo, para anotar

  const listo = gpsVivo();

/* Claves: nos importa el largo, no las mayúsculas ni los símbolos.
   Las reglas de composición hacen que la gente ponga Trisquelia1! y se la olvide.
   Lo único que bloqueamos son las claves obvias. Nunca guardamos el texto de la
   clave: sólo el largo y si pasa o no. */
const CLAVES_OBVIAS = ['12345678','123456789','contraseña','password','trisquelia',
  'golf','qwertyui','11111111','abcd1234','clavegolf'];
/* IMPORTANTE: acá no se puede llamar a render(). Redibujar la pantalla en cada
   tecla destruye el campo y borra lo que la persona venía escribiendo.
   Sólo tocamos la barrita y el mensaje. */
function evalClave(v){
  const t = String(v||''), bajo = t.toLowerCase();
  S.clave = t.length;
  if(t.length === 0){ S.claveOk=false; S.claveMsg='Elegí una clave.'; }
  else if(t.length < 8){ const f = 8-t.length;
    S.claveOk=false; S.claveMsg = f===1 ? 'Le falta un carácter.' : `Le faltan ${f} caracteres.`; }
  else {
    const nombre = (S.hallado && S.hallado.n || '').toLowerCase().split(' ').filter(x=>x.length>3);
    const propio = [ (S.dni||'') ].concat(nombre).filter(Boolean);
    if(CLAVES_OBVIAS.indexOf(bajo) >= 0){
      S.claveOk=false; S.claveMsg='Esa clave es de las primeras que prueba cualquiera. Poné otra.';
    } else if(propio.some(x => x && bajo.includes(x.toLowerCase()))){
      S.claveOk=false; S.claveMsg='No uses tu DNI ni tu nombre en la clave.';
    } else {
      S.claveOk=true;
      S.claveMsg = t.length>=14 ? 'Muy buena clave.' : 'Buena clave. Si la hacés más larga, mejor.';
    }
  }
  const bar = document.getElementById('claveBar');
  const msg = document.getElementById('claveMsg');
  if(bar){ bar.style.width = Math.min(100, S.clave*8)+'%';
           bar.style.background = S.claveOk ? 'var(--acc)' : 'var(--gold)'; }
  if(msg){ msg.textContent = S.claveMsg; }
}
/* Igual que en la clave: nada de render() mientras se escribe. */
function pintarVentaja(){
  const v = ventaja(S.vA??10, S.vB??18);
  const a = document.getElementById('ventNum'), b = document.getElementById('ventHasta');
  if(a) a.textContent = v;
  if(b) b.textContent = v;
}
function crearCuenta(){
  if(!S.email||!S.email.includes('@')){toast('Poné un email válido');return;}
  if((S.clave||0)<8){toast('La clave necesita al menos 8 caracteres');return;}
  if(S.claveOk===false && (S.clave||0)>=8){toast(S.claveMsg);return;}
  // el DNI queda tomado: nadie más puede registrarse con él
  if(S.hallado) S.hallado.cuenta = S.email;

}
/* En modo prueba la persona escribe su nombre, así ve el suyo y no el de otro. */

/* Cambiar el index desde adentro de la app. Es lo que hay que hacer cada jueves,
   así que tiene que estar a mano y no escondido en el registro. */
function guardarIndex(){

function limpiarCambio(){ CLUB.torneo.cambio=null; render(); }
/* De qué salida le toca jugar a cada uno.
   Damas: rojas siempre, sin mirar el index.
   Caballeros: hasta 10.3 de index van de negras; de 10.4 en adelante, blancas/azules.
   El corte en 10.3 no es caprichoso: es el último index que juega con 10 de cancha.

   Ojo con las negras: no tienen rating ni slope, así que no existe un handicap
   "de negras". El club ya lo resuelve así — el que sale de negras anota en el
   casillero de blancas a la ida y de azules a la vuelta. La app hace lo mismo:
   te manda a negras pero te da el handicap de la tabla de blancas/azules. */
const CORTE_NEGRAS = 10.3;
function salidaPorIndex(idx, cat){
  if(cat === 'dam') return {tee:'damas', hcpCon:'damas',
    por:'En damas se juega siempre de rojas.'};
  // sin categoría no suponemos nada: la regla arranca distinto para cada una
  if(cat !== 'cab' || idx == null) return null;
  if(idx <= CORTE_NEGRAS) return {tee:'negras', hcpCon:'mixta',
    por:`Con index hasta ${CORTE_NEGRAS} te corresponden las negras.`,
    aviso:'Las negras todavía no están homologadas, así que tu handicap sale de la '
        + 'tabla de blancas/azules. Es lo mismo que hacés hoy en la tarjeta de papel.'};
  return {tee:'mixta', hcpCon:'mixta',
    por:`Con index de ${(CORTE_NEGRAS+0.1).toFixed(1)} en adelante, blancas y azules.`};
}
const teePorId = id => CLUB.tees.find(t=>t.id===id);

/* El index del Sistema Mundial va de +5.0 (los que dan ventaja) a 54.0.
   Los "más" se escriben con el signo adelante y por dentro son negativos:
   un +2.3 resta golpes en vez de sumarlos. */
const INDEX_MIN = -5.0, INDEX_MAX = 54.0;
function leerIndex(txt){
  const t = String(txt||'').trim().replace(',', '.');
  if(!t) return null;
  const mas = t.startsWith('+');
  const n = parseFloat(mas ? t.slice(1) : t);
  if(isNaN(n)) return null;
  const v = mas ? -Math.abs(n) : n;
  if(v < INDEX_MIN || v > INDEX_MAX) return null;
  return Math.round(v*10)/10;
}
/* Cómo se escribe un index para mostrarlo: los "más" llevan el signo adelante. */
const verIndex = v => v==null ? '—' : (v<0 ? '+'+Math.abs(v).toFixed(1) : v.toFixed(1));
/* Igual para el handicap de cancha: los negativos se escriben con más. */
const verHcp = v => v==null ? '—' : (v<0 ? '+'+Math.abs(v) : String(v));

function traer(){

  if(S.fedOk){ S.fedOk=false; render(); return; }          // el botón "Corregir"
  if(!S.user.cat){ toast('Elegí desde qué salidas jugás'); return; }
  const idx = leerIndex(S.hcpIn);
  if(idx===null){ toast('Poné tu index. Va de +5.0 a 54.0'); return; }
  S.user.hcp = idx; S.indexDias = 0; S.fedOk = true;
  const sal = salidaPorIndex(idx, S.user.cat);
  S.tee = sal.tee;
  toast(`Salís de ${teePorId(sal.tee).n.toLowerCase()} con ${verHcp(hcpCancha(idx, teePorId(sal.hcpCon)))} de cancha`);
  render();
}
function setCat(c){ S.user.cat = c; if(S.fedOk) S.fedOk=false; render(); }

/* ============================================================
   INSTALARLA Y QUE ANDE SIN SEÑAL
   En la cancha hay tramos sin datos y una vuelta dura cuatro horas.
   El service worker guarda la app entera en el teléfono, así abre
   igual de rápido con o sin conexión.
   ============================================================ */

const INSTALADA = () =>
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
  || navigator.standalone === true;

/* iPhone no ofrece botón de instalar: hay que explicar los dos toques. */
const ES_IOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let PROMPT_INSTALAR = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();               // el navegador no muestra el suyo
  PROMPT_INSTALAR = e;              // lo guardamos para nuestro botón
  if(S.onboarded) render();
});
window.addEventListener('appinstalled', () => {
  PROMPT_INSTALAR = null;
  toast('Listo, ya la tenés en el teléfono');
  if(S.onboarded) render();
});

async function instalar(){
  if(!PROMPT_INSTALAR) return;
  PROMPT_INSTALAR.prompt();
  await PROMPT_INSTALAR.userChoice;
  PROMPT_INSTALAR = null;
  render();
}
function ocultarInstalar(){ S.instalarVisto = true; render(); }

function bannerInstalar(){
  if(INSTALADA() || S.instalarVisto || EN_OTRA_APP) return '';
  if(PROMPT_INSTALAR) return `<div class="instalar">
    ${crest(38)}
    <div class="txt"><b>Agregala al teléfono</b>
      <span>Abre sin navegador y funciona sin señal en la cancha.</span></div>
    <button onclick="instalar()">Agregar</button>
    <button class="x" onclick="ocultarInstalar()" aria-label="Cerrar">&times;</button>
  </div>`;
  if(ES_IOS()) return `<div class="instalar" style="align-items:flex-start">
    ${crest(38)}
    <div class="txt"><b>Agregala al teléfono</b>
      <span>Tocá <b style="display:inline;color:var(--txt)">Compartir</b> abajo y elegí
      <b style="display:inline;color:var(--txt)">Agregar a inicio</b>. Así abre sin navegador,
      anda sin señal y el iPhone deja de borrarte los datos.</span></div>
    <button class="x" onclick="ocultarInstalar()" aria-label="Cerrar">&times;</button>
  </div>`;
  return '';
}

/* Que el teléfono no borre la vuelta a medio cargar.
   En iPhone este permiso se concede justamente cuando la app está
   agregada a la pantalla de inicio. Por eso instalarla no es un
   detalle de comodidad: es lo que protege la tarjeta. */
async function cuidarLosDatos(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    if(await navigator.storage.persisted()) return;
    await navigator.storage.persist();
  }catch(e){ /* si no se puede, la app anda igual */ }
}

/* ---------- actualizaciones ----------
   Nunca en el medio de una vuelta: si el jugador está jugando, la
   versión nueva espera y entra cuando termina. */
let VERSION_ESPERANDO = null;

function hayVersionNueva(sw){
  VERSION_ESPERANDO = sw;
  if(momentoDeActualizar()) aplicarVersion();
  else toast('Hay una versión nueva · entra al terminar la vuelta');
}
const momentoDeActualizar = () => !S.playing && played().length === 0;
function aplicarVersion(){
  if(!VERSION_ESPERANDO) return;
  const sw = VERSION_ESPERANDO; VERSION_ESPERANDO = null;
  sw.postMessage({tipo:'ACTIVAR'});
}

if('serviceWorker' in navigator){
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(recargando) return;          // una sola recarga, no un bucle
    recargando = true; location.reload();
  });
  window.addEventListener('load', async () => {
    cuidarLosDatos();
    try{
      const reg = await navigator.serviceWorker.register('./sw.js', {scope:'./'});
      if(reg.waiting) hayVersionNueva(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', () => {
          // la primera vez no es una actualización, es la instalación
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller)
            hayVersionNueva(nuevo);
        });
      });
    }catch(e){
      /* sin service worker la app funciona igual, pero necesita señal */
    }
  });
}

/* ============================================================
   MODO PRUEBA — para la primera vuelta en cancha
   ============================================================
   Hay dos preguntas que no se pueden contestar desde una computadora:
   si el GPS aguanta cuatro horas y si la batería llega al hoyo 18.
   Y una tercera que sólo se contesta parado en la cancha: si las
   distancias que muestra la app coinciden con las estacas.

   Esto se prende a mano antes de salir, guarda una muestra cada veinte
   segundos, y al terminar deja un archivo y un resumen. La idea es que
   vuelvas con números, no con la sensación de que "andaba bien".

   Se guarda aparte de la ronda, en su propia llave, así borrar una cosa
   nunca se lleva la otra puesta.
   ============================================================ */
const PRUEBA_KEY  = 'trisquelia_prueba';
const PRUEBA_CADA = 20000;              // una muestra cada 20 segundos

let PRUEBA = null;
let _pruebaTimer = null;

function cargarPrueba(){
  try{ PRUEBA = JSON.parse(localStorage.getItem(PRUEBA_KEY) || 'null'); }
  catch(e){ PRUEBA = null; }
  if(PRUEBA && PRUEBA.abierta){
    /* Si llegamos acá con la prueba abierta es que la pestaña se recargó
       sola: el teléfono la mató y volvió. Eso también es un dato. */
    PRUEBA.reinicios = (PRUEBA.reinicios || 0) + 1;
    guardarPrueba();
    latirPrueba();
  }
}
function guardarPrueba(){
  try{ localStorage.setItem(PRUEBA_KEY, JSON.stringify(PRUEBA)); }catch(e){}
}

function arrancarPrueba(){
  PRUEBA = { abierta:true, desde:Date.now(), muestras:[], estacas:[], notas:[],
             reinicios:0, telefono:navigator.userAgent };
  guardarPrueba(); latirPrueba(); render();
  toast('Grabando. Dejá la app abierta mientras jugás');
}
function pararPrueba(){
  if(!PRUEBA) return;
  PRUEBA.abierta = false; PRUEBA.hasta = Date.now();
  clearInterval(_pruebaTimer); _pruebaTimer = null;
  guardarPrueba(); render();
  toast('Prueba terminada. Bajate el archivo');
}
function tirarPrueba(){
  if(!confirm('¿Borrar la prueba guardada? No se puede deshacer.')) return;
  PRUEBA = null;
  clearInterval(_pruebaTimer); _pruebaTimer = null;
  try{ localStorage.removeItem(PRUEBA_KEY); }catch(e){}
  render();
}
function latirPrueba(){
  clearInterval(_pruebaTimer);
  _pruebaTimer = setInterval(muestraPrueba, PRUEBA_CADA);
  muestraPrueba();
}

/* Una muestra: dónde estás, con cuánta precisión, y cómo viene la batería.
   Si no hay posición lo anotamos igual — un hueco es información. */
async function muestraPrueba(){
  if(!PRUEBA || !PRUEBA.abierta) return;
  const m = { t: Date.now(), hoyo: S.hole, hay: gpsVivo() };
  if(gpsVivo()){
    m.acc = Math.round(POS.acc);
    m.lat = +POS.lat.toFixed(6);
    m.lon = +POS.lon.toFixed(6);
  } else {
    m.err = POS_ERR || 'sin posición';
  }
  try{
    if(navigator.getBattery){
      const b = await navigator.getBattery();
      m.bat = Math.round(b.level * 100);
      m.enchufado = b.charging;
    }
  }catch(e){ /* iPhone no da batería: se anota sin ese dato */ }
  PRUEBA.muestras.push(m);
  guardarPrueba();
}

/* Parado en una estaca: guardamos qué dice la app contra lo que dice el palo.
   Es la única forma de saber si la medición de la cancha quedó bien. */
function marcarEstaca(yds){
  if(!PRUEBA || !PRUEBA.abierta){ toast('Primero prendé el modo prueba'); return; }
  const g = gps(S.hole);
  PRUEBA.estacas.push({ t:Date.now(), hoyo:S.hole, estaca:yds,
    centro:g.mid ?? null, frente:g.front ?? null, fondo:g.back ?? null,
    acc: gpsVivo() ? Math.round(POS.acc) : null, gpsReal: !!g.real });
  guardarPrueba(); render();
  const d = g.mid != null ? g.mid - yds : null;
  toast(d == null ? 'Anotado, pero sin distancia'
    : `Estaca ${yds} · la app dice ${g.mid} (${d >= 0 ? '+' : ''}${d})`);
}

/* Lo que te moleste, anotado en el momento y no dos horas después. */
function anotarPrueba(){
  if(!PRUEBA){ toast('Primero prendé el modo prueba'); return; }
  const t = prompt('¿Qué te molestó? Cortito.');
  if(!t) return;
  PRUEBA.notas.push({ t:Date.now(), hoyo:S.hole, txt:String(t).slice(0,300) });
  guardarPrueba(); render(); toast('Anotado');
}

/* ---------- las cuentas ---------- */
function resumenPrueba(){
  if(!PRUEBA || !PRUEBA.muestras.length) return null;
  /* Ordenadas por hora antes de contar nada. Normalmente ya vienen en orden,
     pero una medición se guarda después de preguntar por la batería, y esa
     respuesta puede llegar tarde y meterse fuera de lugar. Si eso pasa, la
     duración y el hueco más largo salen cualquier cosa. */
  const ms = PRUEBA.muestras.slice().sort((a, b) => a.t - b.t);
  /* La duración sale de la primera y la última medición, no del reloj: si el
     teléfono mató la app y nunca se tocó "Terminar", desde/hasta mienten. */
  const horas = (ms[ms.length-1].t - ms[0].t) / 3600000;

  const con  = ms.filter(m => m.hay);
  const accs = con.map(m => m.acc).filter(x => x != null).sort((a,b) => a-b);

  /* Cortes: cuántas veces PASÓ de tener señal a no tenerla. No es lo mismo
     que contar muestras sin señal, que exagera un corte largo. */
  let cortes = 0;
  for(let i = 1; i < ms.length; i++) if(ms[i-1].hay && !ms[i].hay) cortes++;

  /* El hueco más grande entre dos muestras dice si el teléfono durmió la app
     con la pantalla apagada. Es el dato que decide si esto sirve en el bolsillo. */
  let hueco = 0;
  for(let i = 1; i < ms.length; i++) hueco = Math.max(hueco, ms[i].t - ms[i-1].t);

  const bats = ms.filter(m => m.bat != null);
  let bateria = null;
  if(bats.length > 1){
    const caida = bats[0].bat - bats[bats.length-1].bat;
    bateria = { desde: bats[0].bat, hasta: bats[bats.length-1].bat, caida,
                porHora: horas > 0.08 ? Math.round(caida / horas) : null };
  }

  const difs = PRUEBA.estacas.filter(e => e.centro != null).map(e => e.centro - e.estaca);

  return {
    horas: +horas.toFixed(2),
    muestras: ms.length,
    conSenal: Math.round(con.length / ms.length * 100),
    precision: accs.length
      ? { mediana: accs[Math.floor(accs.length/2)], mejor: accs[0], peor: accs[accs.length-1],
          buenas: Math.round(accs.filter(a => a <= 8).length / accs.length * 100) }
      : null,
    cortes,
    huecoMayor: Math.round(hueco / 1000),
    reinicios: PRUEBA.reinicios || 0,
    bateria,
    estacas: difs.length
      ? { marcadas: PRUEBA.estacas.length,
          errorMedio: Math.round(difs.reduce((a,b) => a + Math.abs(b), 0) / difs.length),
          sesgo: Math.round(difs.reduce((a,b) => a+b, 0) / difs.length) }
      : { marcadas: PRUEBA.estacas.length, errorMedio: null, sesgo: null },
    notas: PRUEBA.notas.length
  };
}

/* ---------- SACAR LOS DATOS DEL TELÉFONO ----------
   Acá hubo un error de diseño que costó una vuelta entera: el único
   camino era "bajar el archivo", con el truco del <a download>. Eso
   anda en una computadora, pero en un teléfono —y sobre todo con la
   app instalada en pantalla completa— la descarga se traba sin avisar
   y el archivo no aparece en ningún lado.
   Ahora hay cuatro caminos, del más cómodo al más rústico, y el último
   funciona siempre. */

function datosPrueba(){
  return { club: CLUB.id, cancha: CLUB.cancha.nombre, salida: S.tee,
           resumen: resumenPrueba(), ...PRUEBA };
}

/* 1. COMPARTIR — el bueno en el teléfono. Abre la hoja del sistema y
      lo mandás por WhatsApp, mail o Drive, como cualquier foto. */
async function compartirPrueba(){
  if(!PRUEBA) return;
  const texto = JSON.stringify(datosPrueba(), null, 1);
  try{
    const archivo = new File([texto], 'trisquelia-prueba.json', {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){
      await navigator.share({files:[archivo], title:'Prueba en cancha · Trisquelia'});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;      // lo canceló, no es un error
  }
  toast('Este teléfono no deja compartir archivos. Probá bajarlo');
  bajarPrueba();
}

/* 2. BAJAR — sirve en la computadora y en el navegador normal. */
function bajarPrueba(){
  if(!PRUEBA) return;
  const b = new Blob([JSON.stringify(datosPrueba(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'trisquelia-prueba.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* 3. COPIAR EL RESUMEN — corto, entra en un mensaje. */
function resumenTexto(){
  const r = resumenPrueba();
  if(!r) return 'Sin datos todavía.';
  const l = [];
  l.push(`Prueba en cancha · ${CLUB.corto} · ${r.horas} h · ${r.muestras} mediciones`);
  l.push(`GPS: ${r.conSenal}% del tiempo con señal · ${r.cortes} cortes`);
  if(r.precision) l.push(`Precisión: típica ±${r.precision.mediana} m · mejor ±${r.precision.mejor} · peor ±${r.precision.peor} · finas ${r.precision.buenas}%`);
  l.push(`Hueco más largo entre mediciones: ${r.huecoMayor} s · reinicios: ${r.reinicios}`);
  if(r.bateria) l.push(`Batería: ${r.bateria.desde}% → ${r.bateria.hasta}%${r.bateria.porHora!=null?` (${r.bateria.porHora}%/h)`:''}`);
  else l.push('Batería: el teléfono no la deja leer');
  if(r.estacas.marcadas) l.push(`Estacas: ${r.estacas.marcadas} marcadas · diferencia media ${r.estacas.errorMedio} yds · sesgo ${r.estacas.sesgo>=0?'+':''}${r.estacas.sesgo}`);
  else l.push('Estacas: ninguna marcada');
  (PRUEBA.estacas||[]).forEach(e => l.push(`  hoyo ${e.hoyo}: estaca ${e.estaca}, la app dijo ${e.centro ?? '—'} (±${e.acc ?? '—'} m)`));
  (PRUEBA.notas||[]).forEach(n => l.push(`  nota hoyo ${n.hoyo}: ${n.txt}`));
  return l.join('\n');
}
async function copiarResumen(){
  const t = resumenTexto();
  try{
    await navigator.clipboard.writeText(t);
    toast('Resumen copiado. Pegalo donde quieras');
  }catch(e){

/* ============================================================
   LA RONDA COMPARTIDA
   ============================================================
   Acá está la función que justifica el proyecto entero: que lo que
   carga tu marcador y lo que cargás vos se crucen EN EL HOYO, y no
   en la mesa dos horas después.

   Cómo funciona, en corto
   Uno abre la ronda y le sale un código de seis letras. Los otros lo
   escriben y quedan adentro. Cada teléfono manda lo suyo y, cada seis
   segundos, pregunta qué cargaron los demás.

   Por qué no hay conflictos
   Cada anotación lleva quién la hizo. Si vos anotás mi tarjeta y yo
   también, son DOS filas distintas, no una peleada. Dos teléfonos nunca
   escriben encima del otro. Es la regla del papel —cada uno es dueño de
   la tarjeta que anota— y resuelve sola la parte más fea de sincronizar.

   Por qué preguntamos en vez de escuchar
   Un websocket abierto cuatro horas en una cancha con señal a parches se
   corta todo el tiempo y hay que reconectarlo. Preguntar cada seis
   segundos es más tonto y mucho más resistente: si no hay señal, no pasa
   nada, y cuando vuelve se pone al día solo.
   ============================================================ */

/* ⚠️ ACÁ VAN LOS DOS DATOS DE TU SERVIDOR.
   Mientras estén vacíos la app funciona exactamente como hasta ahora,
   todo en el teléfono y sin compartir nada. Cuando los pegues, aparece
   sola la opción de jugar con el grupo.
   Se sacan de Supabase → tu proyecto → Settings → API:
     url   = "Project URL"
     llave = "anon public"  (es pública, va en el código sin problema) */
const NUBE = {
  url  : '',
  llave: ''
};
const hayNube = () => !!(NUBE.url && NUBE.llave);

const RONDA_KEY = 'trisquelia_ronda';
const DISPO_KEY = 'trisquelia_dispositivo';
const LATIDO    = 6000;          // cada cuánto preguntamos

let RONDA = null;                // {codigo, yo, jugadores, anot, desde, ...}
let _latido = null;
let _ultimoRechazo = null;      // para no repetir el mismo aviso en cada latido
let NUBE_ESTADO = { conectado:false, ultimo:null, error:null, mandando:0 };

/* Un identificador del teléfono, estable. No es una cuenta ni identifica
   a nadie: sirve para saber cuál de las anotaciones son tuyas. */
function dispositivo(){
  let d = null;
  try{ d = localStorage.getItem(DISPO_KEY); }catch(e){}
  if(!d){
    d = 'd' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
    try{ localStorage.setItem(DISPO_KEY, d); }catch(e){}
  }
  return d;
}
const miId = () => RONDA ? RONDA.yo : null;
/* Si ya estábamos en esta ronda (recarga, o volvimos a entrar), reusamos la
   llave que teníamos: el servidor no le da el puesto a nadie más. */
const llaveDe = codigo => (RONDA && RONDA.codigo === codigo && RONDA.llave) || null;

/* Seis letras, sin las que se confunden al dictarlas: nada de I, O, 0, 1. */
const LETRAS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codigoNuevo(){
  let c = '';
  const az = new Uint32Array(6);
  (crypto && crypto.getRandomValues) ? crypto.getRandomValues(az)
    : az.forEach((_,i)=>az[i] = Math.floor(Math.random()*1e9));
  for(let i=0;i<6;i++) c += LETRAS[az[i] % LETRAS.length];
  return c;
}

/* ---------- hablar con el servidor ---------- */
async function rpc(fn, args){
  if(!hayNube()) throw new Error('sin servidor');
  const r = await fetch(`${NUBE.url}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json',
              'apikey':NUBE.llave, 'Authorization':'Bearer '+NUBE.llave },
    body: JSON.stringify(args)
  });
  if(!r.ok) throw new Error('servidor ' + r.status);
  return r.json();
}

/* ---------- guardar y recuperar ---------- */
function guardarRonda(){
  try{ RONDA ? localStorage.setItem(RONDA_KEY, JSON.stringify(RONDA))
             : localStorage.removeItem(RONDA_KEY); }catch(e){}
}
function cargarRonda(){
  try{ RONDA = JSON.parse(localStorage.getItem(RONDA_KEY) || 'null'); }
  catch(e){ RONDA = null; }
  if(RONDA) arrancarLatido();
}

/* ---------- abrir y sumarse ---------- */
async function crearRonda(){
  if(!hayNube()){ toast('Todavía no hay servidor configurado'); return; }
  const codigo = codigoNuevo();
  await entrar('ronda_abrir', {
    p_codigo:codigo, p_club:CLUB.id, p_cancha:CLUB.cancha.nombre,
    p_vuelta:S.vuelta, p_torneo:!!S.torneo,
    p_jugador: dispositivo()+'-'+codigo, p_nombre:S.user.name,
    p_iniciales:S.user.ini, p_index:S.user.hcp,
    p_hcp:hcpCancha(S.user.hcp), p_salida:S.tee, p_llave:llaveDe(codigo)
  }, codigo);
}
async function unirseRonda(){
  if(!hayNube()){ toast('Todavía no hay servidor configurado'); return; }
  const codigo = String(S.codigoIn||'').toUpperCase().replace(/[^A-Z2-9]/g,'');
  if(codigo.length !== 6){ toast('El código son seis letras'); return; }
  await entrar('ronda_unirse', {
    p_codigo:codigo, p_jugador: dispositivo()+'-'+codigo, p_nombre:S.user.name,
    p_iniciales:S.user.ini, p_index:S.user.hcp,
    p_hcp:hcpCancha(S.user.hcp), p_salida:S.tee, p_llave:llaveDe(codigo)
  }, codigo);
}
async function entrar(fn, args, codigo){
  S.uniendo = true; render();
  try{
    const res = await rpc(fn, args);
    if(res && res.error){ toast(res.error); S.uniendo = false; render(); return; }
    /* La llave que devuelve el servidor es de ESTE teléfono y no sale de acá:
       es lo que prueba que somos quien decimos. El código de seis letras es
       una dirección, no una credencial — se dicta en voz alta en el tee. */
    RONDA = { codigo, yo: dispositivo()+'-'+codigo,
              llave: (res && res.llave) || llaveDe(codigo),
              jugadores:[], anot:{}, cola:[], desde:null, marcoA:null };
    absorber(res);
    guardarRonda(); arrancarLatido();
    S.uniendo = false; S.codigoIn = '';
    render();
    toast(`Estás en la ronda ${codigo}`);
  }catch(e){
    S.uniendo = false; NUBE_ESTADO.error = e.message; render();
    toast('No se pudo conectar. Probá de nuevo');
  }
}
function salirRonda(){
  if(!confirm('¿Salir de la ronda del grupo? Tu tarjeta no se toca.')) return;
  RONDA = null; guardarRonda();
  clearInterval(_latido); _latido = null;
  NUBE_ESTADO = { conectado:false, ultimo:null, error:null, mandando:0 };
  render();
}

/* ---------- guardar lo que llega ---------- */
function absorber(res){
  if(!res || !RONDA) return;
  if(Array.isArray(res.jugadores)) RONDA.jugadores = res.jugadores;
  (res.anotaciones || []).forEach(a => {
    /* Lo mío no se pisa: de mis anotaciones el dueño soy yo, y lo que
       tengo en el teléfono es más nuevo que lo que pueda volver. */
    if(a.por === RONDA.yo) return;
    /* Borrado lógico: el servidor manda la anotación borrada con su
       `borrado_en` para que la saquemos. Si sólo dejara de mandarla,
       este teléfono la seguiría mostrando para siempre. */
    if(a.borrado_en){ delete RONDA.anot[a.de + '|' + a.por + '|' + a.hoyo]; return; }
    RONDA.anot[a.de + '|' + a.por + '|' + a.hoyo] = a;
  });
  if(res.ahora) RONDA.desde = res.ahora;
  const mio = (RONDA.jugadores || []).find(j => j.id === RONDA.yo);
  if(mio) RONDA.marcoA = mio.marca_a || null;
  NUBE_ESTADO.conectado = true;
  NUBE_ESTADO.ultimo = Date.now();
  NUBE_ESTADO.error = null;
}

/* ---------- la cola: nada se pierde sin señal ---------- */
function encolar(fn, args, clave){
  if(!RONDA) return;
  RONDA.cola = RONDA.cola || [];
  /* Si ya había algo para el mismo hoyo y el mismo jugador, lo pisamos:
     no tiene sentido mandar tres correcciones seguidas del mismo número. */
  if(clave) RONDA.cola = RONDA.cola.filter(o => o.clave !== clave);
  RONDA.cola.push({ fn, args, clave, t:Date.now() });
  guardarRonda();
  vaciarCola();
}
async function vaciarCola(){
  if(!RONDA || !hayNube() || NUBE_ESTADO.mandando) return;
  if(!RONDA.cola || !RONDA.cola.length) return;
  NUBE_ESTADO.mandando = 1;
  try{
    /* De a uno y en orden. Cada anotación pisa la anterior del mismo
       hoyo, así que reintentar nunca duplica nada. */
    while(RONDA.cola.length){
      const op = RONDA.cola[0];
      const res = await rpc(op.fn, op.args);
      /* Un 200 con `{error:...}` NO es un éxito. Antes se descartaba igual y
         la app decía "al día": el jugador creía que había anotado y en el
         servidor no había nada. Un rechazo no se arregla reintentando —la
         ronda se cerró, o la llave no es la nuestra— así que lo sacamos de
         la cola y lo DECIMOS, una vez por motivo. */
      RONDA.cola.shift();
      guardarRonda();
      if(res && res.error){
        NUBE_ESTADO.error = res.error;
        if(_ultimoRechazo !== res.error){ _ultimoRechazo = res.error; toast('No se pudo guardar en el grupo · ' + res.error); }
        continue;
      }
      _ultimoRechazo = null;
    }
    NUBE_ESTADO.conectado = true; NUBE_ESTADO.error = null;
  }catch(e){
    NUBE_ESTADO.conectado = false; NUBE_ESTADO.error = e.message;
  }finally{
    NUBE_ESTADO.mandando = 0;
  }
}

/* ---------- preguntar qué hicieron los demás ---------- */
async function latir(){
  if(!RONDA || !hayNube()) return;
  if(document.hidden) return;            // con la pantalla apagada no gastamos datos
  await vaciarCola();
  try{
    const res = await rpc('ronda_estado', { p_codigo:RONDA.codigo, p_desde:RONDA.desde });
    /* La ronda se borró del servidor. Se lo decimos y salimos: mostrar la
       tarjeta del grupo vacía, sin explicar por qué, sería inventar. Lo que
       este teléfono anotó no se toca — vive en su propia tarjeta. */
    if(res && res.borrada){
      const cod = RONDA.codigo;
      RONDA = null; guardarRonda();
      clearInterval(_latido); _latido = null;
      NUBE_ESTADO = { conectado:false, ultimo:null, error:null, mandando:0 };
      render(); toast(`La ronda ${cod} ya no está · tu tarjeta se conserva`);
      return;
    }
    const antes = JSON.stringify(RONDA.anot).length + (RONDA.jugadores||[]).length;
    absorber(res);
    guardarRonda();
    const despues = JSON.stringify(RONDA.anot).length + (RONDA.jugadores||[]).length;
    if(antes !== despues && !S.cerrando) render();   // sólo redibujamos si cambió algo
  }catch(e){
    NUBE_ESTADO.conectado = false; NUBE_ESTADO.error = e.message;
  }
}
function arrancarLatido(){
  clearInterval(_latido);
  if(!RONDA || !hayNube()) return;
  _latido = setInterval(latir, LATIDO);
  latir();
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) latir(); });
window.addEventListener('online', () => { vaciarCola(); latir(); });

/* ---------- anotar ---------- */
/* Se llama al cerrar el hoyo. Manda mi tarjeta y, si soy marcador de
   alguien, también la de él. Son dos filas distintas: nadie pisa a nadie. */
function anotarEnLaNube(h){
  if(!RONDA) return;
  const yo = RONDA.yo;
  if(R.scores[h] !== undefined){
    encolar('anotar', { p_codigo:RONDA.codigo, p_llave:RONDA.llave, p_por:yo, p_de:yo, p_hoyo:h,
      p_golpes:R.scores[h], p_putts:R.putts[h] ?? null,
      p_bunker:R.bunker[h] ?? null, p_penal:R.penal[h] ?? null,
      p_salida_fw:R.fw[h] ?? null }, `${yo}|${yo}|${h}`);
  }
  const aQuien = RONDA.marcoA;
  if(aQuien && OTRO[h] != null){
    encolar('anotar', { p_codigo:RONDA.codigo, p_llave:RONDA.llave, p_por:yo, p_de:aQuien, p_hoyo:h,
      p_golpes:OTRO[h], p_putts:null, p_bunker:null, p_penal:null,
      p_salida_fw:null }, `${aQuien}|${yo}|${h}`);
  }
}
function elegirAQuienMarco(id){
  if(!RONDA) return;
  RONDA.marcoA = id; guardarRonda();
  encolar('marcar_a', { p_codigo:RONDA.codigo, p_llave:RONDA.llave,
                        p_jugador:RONDA.yo, p_a:id }, 'marca');
  render();

}

/* ---------- EL CRUCE ----------
   Lo que anotó mi marcador sobre mí, contra lo que anoté yo. */
const miMarcador = () => (RONDA && RONDA.jugadores || []).find(j => j.marca_a === RONDA.yo) || null;

function loQueDiceMiMarcador(h){
  if(!RONDA) return null;
  const m = miMarcador();
  if(!m) return null;
  const a = RONDA.anot[`${RONDA.yo}|${m.id}|${h}`];
  return a && a.golpes != null ? { golpes:a.golpes, quien:m.nombre } : null;
}
/* ¿Hay diferencia en este hoyo? */
function cruceHoyo(h){
  const suyo = loQueDiceMiMarcador(h);
  if(!suyo) return null;
  const mio = R.scores[h];
  if(mio === undefined) return { esperando:true, ...suyo };
  return { coincide: mio === suyo.golpes, mio, ...suyo };
}
/* Todas las diferencias de la vuelta, para la firma. */
function crucesAbiertos(){
  const out = [];
  for(let h = 1; h <= S.vuelta; h++){
    const c = cruceHoyo(h);
    if(c && !c.esperando && !c.coincide) out.push({ hoyo:h, ...c });
  }
  return out;
}

/* El score de cada jugador del grupo, para la tarjeta en vivo.
   Vale lo que anotó él de sí mismo; si todavía no cargó, lo que
   anotó su marcador, aclarando de dónde salió. */
function scoresDe(id){
  const out = {};
  if(!RONDA) return out;
  for(let h = 1; h <= S.vuelta; h++){
    if(id === RONDA.yo){
      if(R.scores[h] !== undefined) out[h] = { golpes:R.scores[h], propio:true };
      continue;
    }
    const propio = RONDA.anot[`${id}|${id}|${h}`];
    if(propio && propio.golpes != null){ out[h] = { golpes:propio.golpes, propio:true }; continue; }
    const otro = Object.keys(RONDA.anot)
      .filter(k => k.startsWith(id + '|') && k.endsWith('|' + h))
      .map(k => RONDA.anot[k]).find(a => a.golpes != null);
    if(otro) out[h] = { golpes:otro.golpes, propio:false };
  }
  return out;
}

             notif:vNotif,summary:vSummary,bag:vBag,handicap:vHandicap,firma:vFirma,arranque:vArranque,tarjeta:vTarjeta,prueba:vPrueba,
             dash:vDash,tees:vTees,socios:vSocios,torneo:vTorneo,permisos:vPermisos,cargaaag:vCargaAAG,
             copia:vCopia};
/* ============================================================
   GUARDADO
   Todo vive en la memoria del navegador, y una vuelta dura cuatro horas.
   Si el teléfono bloquea la pantalla, Android puede recargar la pestaña y
   llevarse la ronda entera. Por eso guardamos en el propio teléfono después
   de cada cambio, y al abrir la app recuperamos donde estabas.
   No sale nada del teléfono: esto no es el servidor, es la libreta de bolsillo.
   ============================================================ */
/* El navegador que va adentro de WhatsApp o Instagram no da acceso al GPS y
   no deja instalar la app en la pantalla del teléfono. Si alguien llega por ahí
   —y va a pasar, porque el link se comparte por WhatsApp— se lo decimos en vez
   de dejarlo peleando con una app a medias. */
const EN_OTRA_APP = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|MicroMessenger|; wv\)/i
                    .test(navigator.userAgent || '');

const LS_KEY = 'trisquelia_v1';
const GUARDAR = ['user','tee','cat','mat','hcpIn','fedOk','onboarded','tipo','dni','nsocio',
                 'email','indexDias','hole','vuelta','playing','torneo','marco','meMarca',
                 'certifico','firmoLaOtra','entregada','presento','booked','soloSeguir',
                 'instalarVisto'];
function guardarTodo(){
  try{
    const d = {v:1, ts:Date.now(), R:{scores:R.scores,putts:R.putts,fw:R.fw,gir:R.gir,shots:R.shots,bunker:R.bunker,penal:R.penal},
               bag:BAG.map(b=>({c:b.c,on:b.on,shots:b.shots})), cancha:CANCHA_ESTADO};
    GUARDAR.forEach(k=> d[k]=S[k]);
    localStorage.setItem(LS_KEY, JSON.stringify(d));
    SIN_LUGAR = false;
  }catch(e){
    /* Sin espacio, o modo incógnito. Esto se tragaba en silencio: la app seguía
       andando y la vuelta entera se perdía sin que nadie se enterara hasta que
       el teléfono se recargaba. Como `guardarTodo` corre en cada `render()`,
       avisamos UNA vez y no más, para no tapar la pantalla de mensajes. */
    if(!SIN_LUGAR){
      SIN_LUGAR = true;
      toast('No se puede guardar en este teléfono · bajá una copia');
    }
  }
}
function cargarTodo(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if(!d || d.v !== 1) return false;
    GUARDAR.forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
    if(d.R) Object.keys(R).forEach(k=>{ if(d.R[k]) R[k]=d.R[k]; });
    if(d.bag) d.bag.forEach(x=>{ const b=BAG.find(z=>z.c===x.c);
      if(b){ b.on=x.on; if(Array.isArray(x.shots)) b.shots=x.shots; } });
    if(d.cancha) Object.assign(CANCHA_ESTADO, d.cancha);
    return true;
  }catch(e){ return false; }
}
/* ============================================================
   COPIA DE SEGURIDAD
   Todo lo del socio vive en la memoria de un solo teléfono. Si lo cambia,
   lo pierde o el navegador limpia el sitio, se va la bolsa con todos los
   golpes cargados, las estadísticas y la vuelta en curso. Esto lo saca a
   un archivo y lo vuelve a meter en otro teléfono.

   Sigue los mismos cuatro caminos que el modo prueba, del más cómodo al
   más rústico, porque en un celular `<a download>` se traba sin avisar:
   compartir · bajar · copiar al portapapeles · verlo y copiarlo a mano.
   ============================================================ */
const COPIA_MARCA  = 'trisquelia-copia';
const COPIA_V      = 1;
const DESHACER_KEY = 'trisquelia_antes_de_importar';
let   SIN_LUGAR    = false;      // ya avisamos que no se puede guardar

/* Las tres claves que son del socio. `trisquelia_dispositivo` queda AFUERA a
   propósito: es la identidad de ESTE teléfono dentro de una ronda compartida,
   y `absorber()` la usa para saber cuáles anotaciones son propias y no
   pisarlas. Si dos teléfonos tuvieran el mismo identificador, los dos se
   declararían dueños de la misma tarjeta. El teléfono que importa se queda
   siempre con el suyo. */
const COPIA_CLAVES = [LS_KEY, PRUEBA_KEY, RONDA_KEY];

function datosCopia(){
  const datos = {};
  COPIA_CLAVES.forEach(k => {
    try{
      const v = localStorage.getItem(k);
      if(v !== null) datos[k] = JSON.parse(v);
    }catch(e){}      /* una clave rota no se lleva puesta la copia entera */
  });
  return { que:COPIA_MARCA, v:COPIA_V, fecha:new Date().toISOString(),
           club:CLUB.id, telefono:navigator.userAgent, datos };
}

/* Qué hay adentro de una copia, para poder mostrarlo ANTES de pisar nada. */
function resumenCopia(c){
  const d  = (c && c.datos) || {};
  const pr = d[LS_KEY] || {}, pb = d[PRUEBA_KEY], ro = d[RONDA_KEY];
  const scores = (pr.R && pr.R.scores) || {};
  return {
    cuenta : pr.user && pr.user.name ? pr.user.name : null,
    hoyos  : Object.keys(scores).length,
    golpes : Array.isArray(pr.bag) ? pr.bag.reduce((a,b)=>a+((b.shots||[]).length),0) : 0,
    palos  : Array.isArray(pr.bag) ? pr.bag.filter(b=>b.on).length : 0,
    ronda  : ro && ro.codigo ? ro.codigo : null,
    prueba : pb && Array.isArray(pb.muestras) ? pb.muestras.length : 0,
    fecha  : c && c.fecha ? c.fecha : null
  };
}
const copiaEnTexto = () => JSON.stringify(datosCopia(), null, 1);

/* ---------- sacarla del teléfono ---------- */
async function compartirCopia(){
  const texto = copiaEnTexto();
  try{
    const archivo = new File([texto], nombreCopia(), {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){
      await navigator.share({files:[archivo], title:'Copia de seguridad · Trisquelia'});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;      /* lo canceló, no es un error */
  }
  toast('Este teléfono no deja compartir archivos. Probá bajarla');
  bajarCopia();
}
/* Con fecha, al revés de la del modo prueba: de estas puede haber muchas y
   conviene distinguirlas de un vistazo en la carpeta de descargas. */
function nombreCopia(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return `trisquelia-copia-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`;
}
function bajarCopia(){
  const b = new Blob([copiaEnTexto()], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = nombreCopia();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copiarCopia(){
  try{
    await navigator.clipboard.writeText(copiaEnTexto());
    toast('Copia al portapapeles. Pegala donde la guardes');
  }catch(e){
    S.verCopia = true; render();
    toast('Copiala a mano del cuadro de abajo');
  }
}
function verCopiaTexto(){
  S.verCopia = !S.verCopia; render();
  if(S.verCopia){ const t = $('#salidaCopia'); if(t){ t.focus(); t.select(); } }
}

/* ---------- meterla en el teléfono ---------- */
function elegirArchivoCopia(){ const i = $('#archivoCopia'); if(i) i.click(); }
function leerArchivoCopia(input){
  const f = input && input.files && input.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onerror = () => toast('No se pudo leer el archivo');
  fr.onload  = () => aplicarCopia(String(fr.result || ''));
  fr.readAsText(f);
}

/* Importar PISA lo que hay. Antes de pisar nada guardamos el estado actual,
   así se puede volver: es la misma idea que el borrado lógico del servidor. */
function aplicarCopia(texto){
  let c = null;
  try{ c = JSON.parse(texto); }
  catch(e){ toast('Ese archivo no se entiende'); return false; }

  if(!c || c.que !== COPIA_MARCA){ toast('Ese archivo no es una copia de Trisquelia'); return false; }
  if(!(typeof c.v === 'number' && c.v <= COPIA_V)){
    toast('Esa copia es de una versión más nueva de la app'); return false; }
  if(!c.datos || typeof c.datos !== 'object'){ toast('La copia no trae datos'); return false; }
  if(!Object.keys(c.datos).some(k => COPIA_CLAVES.indexOf(k) >= 0)){
    toast('La copia no trae nada que se pueda restaurar'); return false; }

  const r = resumenCopia(c);
  const de = r.fecha ? new Date(r.fecha).toLocaleDateString('es-AR') : 'fecha desconocida';
  if(!confirm(`Traer la copia del ${de}\n\n`
    + `${r.cuenta || 'sin nombre'} · ${r.palos} palos · ${r.golpes} golpes cargados\n`
    + `${r.hoyos} hoyo${r.hoyos===1?'':'s'} anotados`
    + (r.ronda ? ` · ronda ${r.ronda}` : '')
    + `\n\nEsto reemplaza lo que hay en ESTE teléfono. Vas a poder deshacerlo.`)) return false;

  /* Si no entra el respaldo, no importamos: quedarse sin poder volver atrás es
     peor que no importar. */
  try{ localStorage.setItem(DESHACER_KEY, copiaEnTexto()); }
  catch(e){
    toast('No hay lugar para guardar lo actual · no se importó nada');
    return false;
  }
  try{
    COPIA_CLAVES.forEach(k => {
      if(c.datos[k] === undefined) localStorage.removeItem(k);
      else localStorage.setItem(k, JSON.stringify(c.datos[k]));
    });
  }catch(e){
    toast('No hay lugar para la copia · se deshizo el cambio');
    deshacerCopia(true);
    return false;
  }
  location.reload();
  return true;
}
const hayDeshacer = () => { try{ return !!localStorage.getItem(DESHACER_KEY); }catch(e){ return false; } };
function deshacerCopia(callado){
  let a = null;
  try{ a = JSON.parse(localStorage.getItem(DESHACER_KEY) || 'null'); }catch(e){}
  if(!a || !a.datos){ if(!callado) toast('No hay nada para deshacer'); return false; }
  if(!callado && !confirm('Volver a como estaba este teléfono antes de importar. ¿Seguro?')) return false;
  try{
    COPIA_CLAVES.forEach(k => {
      if(a.datos[k] === undefined) localStorage.removeItem(k);
      else localStorage.setItem(k, JSON.stringify(a.datos[k]));
    });
    localStorage.removeItem(DESHACER_KEY);
  }catch(e){}
  location.reload();
  return true;
}

/* Para volver a empezar de cero durante las pruebas. */
function borrarTodoLocal(){
  if(!confirm('Esto borra tu cuenta y la ronda de este teléfono. ¿Seguro?')) return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  location.reload();
}

function render(){
  guardarTodo();
  if(VERSION_ESPERANDO && momentoDeActualizar()) aplicarVersion();
  /* Arrancamos limpiando: las pantallas que ocupan todo el marco —el aviso de
     WhatsApp y el alta de cuenta— no llevan ni barra de hoyo ni hoja. */
  ['#barra','#hoja'].forEach(sel=>{ const e=$(sel); if(e){ e.className=''; e.innerHTML=''; } });
  if(EN_OTRA_APP && !S.avisoVisto){
    $('#screen').innerHTML = `<div class="fade" style="height:100%;display:flex;
      flex-direction:column;justify-content:center;padding:0 26px;text-align:center">
      <div style="display:flex;justify-content:center">${crest(64)}</div>
      <div style="font-size:20px;font-weight:800;margin:20px 0 10px">Abrila en el navegador</div>
      <p style="font-size:15px;line-height:1.6">Llegaste desde WhatsApp, y ese navegador
      no deja usar el GPS ni guardar la app en tu teléfono.</p>
      <div class="card" style="text-align:left">
        <div style="font-weight:700;font-size:14px;margin-bottom:8px">Son dos toques</div>
        <div class="dim" style="font-size:13px;line-height:1.7">
          <b style="color:var(--txt)">1.</b> Tocá los tres puntitos <b style="color:var(--txt)">⋮</b>
          arriba a la derecha<br>
          <b style="color:var(--txt)">2.</b> Elegí <b style="color:var(--txt)">"Abrir en Chrome"</b>
        </div>
      </div>
      <button class="btn ghost sm" onclick="S.avisoVisto=true;render()">
        Seguir igual, sin GPS</button>
    </div>`;
    $('#nav').style.display='none';
    return;
  }
  if(!S.onboarded){
    $('#screen').innerHTML = vOnboard();
    $('#nav').style.display='none';
    return;
  }
  $('#nav').style.display='flex';
  if(S.mode==='club' && !puedeVer(S.tab)) S.tab='dash';
  $('#screen').innerHTML = (VIEWS[S.tab]||vHome)();
  renderNav();
  pintarBarra();
  pintarHoja();
  pintarGrabando();
}
cargarTodo();

    const ir = new URLSearchParams(location.search).get('ir');
    if(ir && VIEWS[ir]) S.tab = ir;
  }catch(e){}
})();
arrancarGPS();
cargarPrueba();
cargarRonda();
applyTheme();
document.getElementById('appname').textContent = CLUB.app;
render();
</script>
