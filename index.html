/* La tarjeta del grupo, con lo que cada uno fue cargando de verdad. */
function grupoEnVivo(){
  const js = RONDA.jugadores || [];
  const filas = js.map(j => {
    const sc = scoresDe(j.id);
    const hoyos = Object.keys(sc).map(Number).sort((a,b)=>a-b);
    const golpes = hoyos.reduce((a,h)=>a+sc[h].golpes, 0);
    const parr  = hoyos.reduce((a,h)=>a+par(h), 0);
    /* Igual que en la tarjeta del grupo: sin handicap no hay stableford. */
    const stb   = j.hcp_cancha==null ? null
      : hoyos.reduce((a,h)=>a+stableford(sc[h].golpes, par(h),
                    COURSE.holes[h-1].hcp, j.hcp_cancha), 0);
    const ajeno = hoyos.filter(h=>!sc[h].propio).length;
    return { j, hoyos, golpes, parr, stb, ajeno };
  });
  return `
    <table><thead><tr><th style="text-align:left">Jugador</th><th>Hoyos</th>
      <th>Golpes</th><th>Al par</th><th>Stbl</th></tr></thead><tbody>

      <td class="name"><span class="avatar" style="width:22px;height:22px;font-size:9px;

        j.id===RONDA.yo?' <span class="dim2">· vos</span>':''}</td>
      <td class="dim">${hoyos.length}</td>
      <td style="font-weight:800">${golpes||'–'}</td>
      <td class="${golpes-parr<=0?'acc':''}">${hoyos.length?fmtPar(golpes-parr):'–'}</td>
      <td class="gold" style="font-weight:800">${hoyos.length&&stb!=null?stb:'–'}</td></tr>
      ${ajeno?`<tr><td colspan="5" class="dim2" style="font-size:10.5px;padding-top:0">
        ${ajeno} hoyo${ajeno===1?'':'s'} tomado${ajeno===1?'':'s'} de lo que anotó su marcador,
        porque él todavía no cargó</td></tr>`:''}`).join('')}
    </tbody></table>
    <div class="between" style="margin-top:12px">
      <div class="lbl">Ronda ${esc(RONDA.codigo)}</div>${pillNube()}</div>
    ${(() => { const d = crucesAbiertos();
      if(!d.length) return `<div class="dim2" style="font-size:11.5px;margin-top:8px">
        Ninguna diferencia con tu marcador hasta acá.</div>`;
      return `<div class="cruce" style="margin-top:10px">
        <div style="font-size:12.5px;font-weight:800" class="gold">
          ${d.length} hoyo${d.length===1?'':'s'} sin coincidir</div>
        <div class="dim" style="font-size:11.5px;margin-top:3px">
          ${d.map(x=>`Hoyo ${x.hoyo}: vos ${esc(x.mio)}, ${esc(x.quien)} ${esc(x.golpes)}`).join(' · ')}</div>
      </div>`; })()}`;
}

             notif:vNotif,summary:vSummary,bag:vBag,handicap:vHandicap,firma:vFirma,arranque:vArranque,tarjeta:vTarjeta,prueba:vPrueba,
             dash:vDash,tees:vTees,socios:vSocios,torneo:vTorneo,permisos:vPermisos,cargaaag:vCargaAAG,
             copia:vCopia};
/* ============================================================
   GUARDADO
   Todo vive en la memoria del navegador, y una vuelta dura cuatro horas.
   Si el teléfono bloquea la pantalla, Android puede recargar la pestaña y
   llevarse la ronda entera. Por eso guardamos en el propio teléfono después
   de cada cambio, y al abrir la app recuperamos donde estabas.
   No sale nada del teléfono: esto no es el servidor, es la libreta de bolsillo.
   ============================================================ */
/* El navegador que va adentro de WhatsApp o Instagram no da acceso al GPS y
   no deja instalar la app en la pantalla del teléfono. Si alguien llega por ahí
   —y va a pasar, porque el link se comparte por WhatsApp— se lo decimos en vez
   de dejarlo peleando con una app a medias. */
const EN_OTRA_APP = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|MicroMessenger|; wv\)/i
                    .test(navigator.userAgent || '');

const LS_KEY = 'trisquelia_v1';
const GUARDAR = ['user','tee','cat','mat','hcpIn','fedOk','onboarded','tipo','dni','nsocio',
                 'email','indexFecha','hole','vuelta','playing','torneo','marco','meMarca',
                 'certifico','firmoLaOtra','entregada','presento','booked','soloSeguir',
                 'instalarVisto','avisosVistos',
                 /* El identificador de la vuelta: es lo que hace que archivarla
                    dos veces la actualice en vez de duplicarla. Tiene que
                    sobrevivir a una recarga, o la segunda vez sería otra. */
                 'vueltaId',
                 /* `fecha` es el día que se salió al 1. Si no viaja acá, la
                    primera vez que Android recarga la pestaña en el medio de la
                    vuelta se pierde, y la tarjeta vuelve a sacar la fecha del
                    reloj: la del sábado dice "lunes" cuando se la mira el lunes.
                    Se agregó a `S` en la v22 y se olvidó acá; lo encontró la
                    revisión de esa misma versión. */
                 'fecha'];
function guardarTodo(){
  try{
    /* `marca` y `otro` se guardan desde la v25. Antes no, y una recarga de
       Android en el medio de un torneo dejaba la tarjeta del otro en blanco
       mientras las firmas —que sí se guardaban— seguían puestas. */
    const d = {v:1, ts:Date.now(), R:{scores:R.scores,putts:R.putts,fw:R.fw,gir:R.gir,shots:R.shots,bunker:R.bunker,penal:R.penal},
               marca:MARCA, otro:OTRO,
               bag:BAG.map(b=>({c:b.c,on:b.on,shots:b.shots}))};
    GUARDAR.forEach(k=> d[k]=S[k]);
    localStorage.setItem(LS_KEY, JSON.stringify(d));
    SIN_LUGAR = false;
  }catch(e){
    /* Sin espacio, o modo incógnito. Esto se tragaba en silencio: la app seguía
       andando y la vuelta entera se perdía sin que nadie se enterara hasta que
       el teléfono se recargaba. Como `guardarTodo` corre en cada `render()`,
       avisamos UNA vez y no más, para no tapar la pantalla de mensajes. */
    if(!SIN_LUGAR){
      SIN_LUGAR = true;
      toast('No se puede guardar en este teléfono · bajá una copia');
    }
  }
}
/* LO DE `GUARDAR` TAMBIÉN ENTRA SANO. Es lo mismo que puede traer una copia de
   seguridad armada a mano, y se copiaba tal cual: la revisión adversaria de la
   v26 metió HTML que corría al abrir Inicio, Club, Perfil, Mi handicap y el
   arranque —por `hole`, `nsocio`, `mat`, `user.club`—, y un `user.hcp` de texto
   dejaba la app en blanco, porque `verIndex()` hace `toFixed`. Cada campo vuelve
   con su tipo y su rango, o con el valor de siempre. */
function sanearS(){
  const txt = (v, n, rx) => typeof v === 'string' && (!rx || rx.test(v)) ? v.slice(0, n) : '';
  const ent = (v, a, b, def) => Number.isInteger(v) && v >= a && v <= b ? v : def;
  const sn  = v => v === true;
  const num = v => { const x = typeof v === 'string' && v.trim() !== '' ? Number(v) : v;
    return typeof x === 'number' && isFinite(x) && x >= -10 && x <= 54 ? Math.round(x*10)/10 : null; };
  const u = S.user && typeof S.user === 'object' ? S.user : {};
  const nombre = typeof u.name === 'string' && u.name.trim().length >= 3 ? u.name.trim().slice(0, 60) : null;
  S.user = { name: nombre, ini: nombre ? iniciales(nombre) : null, hcp: num(u.hcp),
             socio: txt(u.socio, 12, /^[\w#—\-. ]*$/) || null, club: txt(u.club, 60) || CLUB.nombre,
             cat: u.cat === 'cab' || u.cat === 'dam' ? u.cat : null };
  S.tee = CLUB.tees.some(t => t.id === S.tee) ? S.tee : 'mixta';
  S.cat = typeof S.cat === 'string' ? S.cat.slice(0, 10) : S.cat;
  S.vuelta = S.vuelta === 9 ? 9 : 18;
  S.hole = ent(S.hole, 1, S.vuelta, 1);
  S.marco = ent(S.marco, 1, 3, 1); S.meMarca = ent(S.meMarca, 1, 3, 2);
  S.mat = txt(S.mat, 12, /^\d*$/); S.dni = txt(S.dni, 9, /^\d*$/);
  S.nsocio = txt(S.nsocio, 12, /^[\w#\-. ]*$/); S.email = txt(S.email, 120, /^[^<>"'\s]*$/);
  S.hcpIn = S.hcpIn == null ? null : txt(String(S.hcpIn), 6, /^[+\d.,]*$/);
  S.tipo = S.tipo === 'socio' || S.tipo === 'invitado' ? S.tipo : null;
  ['fedOk','onboarded','playing','torneo','certifico','firmoLaOtra','entregada','soloSeguir','instalarVisto']
    .forEach(k => { S[k] = sn(S[k]); });
  S.presento = S.presento === true || S.presento === false ? S.presento : null;
  S.fecha = fechaReal(S.fecha) ? S.fecha : null;
  S.indexFecha = fechaReal(S.indexFecha) && S.indexFecha <= hoyISO() ? S.indexFecha : null;
  S.avisosVistos = typeof S.avisosVistos === 'string' && !isNaN(new Date(S.avisosVistos)) ? S.avisosVistos : null;
  S.vueltaId = typeof S.vueltaId === 'string' && /^[a-z0-9]{4,24}$/.test(S.vueltaId) ? S.vueltaId : null;
  S.booked = {};
}
/* Un mapa hoyo → valor, reconstruido de cero: sólo claves "1" a "18" propias y
   valores que pasan el control. Como el objeto es nuevo y las claves son
   números, ni "__proto__" ni nada raro puede viajar adentro. */
function mapaHoyos(src, vale){
  const o = {};
  if(src && typeof src === 'object')
    Object.keys(src).forEach(k => { if(/^\d{1,2}$/.test(k) && +k >= 1 && +k <= 18 && vale(src[k])) o[k] = src[k]; });
  return o;
}
const mapaEnteros = (src, a, b) => mapaHoyos(src, v => Number.isInteger(v) && v >= a && v <= b);
/* Un golpe guardado vuelve con su palo; si la distancia o la posición no
   sirven, vuelve sin ellas, pero no se lo borra: el golpe se pegó. La v26
   tiraba el golpe entero si la distancia pasaba de 450, y el hoyo quedaba con
   un golpe menos registrado (revisión adversaria de la v26). */
const golpeLimpio = s => !s || typeof s !== 'object' || !BAG.some(b => b.c === s.c) ? null : {
  c: s.c,
  lat: typeof s.lat === 'number' && isFinite(s.lat) ? s.lat : null,
  lon: typeof s.lon === 'number' && isFinite(s.lon) ? s.lon : null,
  d: typeof s.d === 'number' && isFinite(s.d) && s.d >= 0 && s.d <= TIRO_MAX ? s.d : null };
const golpeSano = s => !!s && typeof s === 'object' && BAG.some(b => b.c === s.c)
  && (s.d == null || (typeof s.d === 'number' && isFinite(s.d) && s.d >= 0 && s.d <= 450))
  && (s.lat == null || (typeof s.lat === 'number' && isFinite(s.lat)))
  && (s.lon == null || (typeof s.lon === 'number' && isFinite(s.lon)));

function cargarTodo(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if(!d || d.v !== 1) return false;
    GUARDAR.forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
    sanearS();
    /* Lo que vuelve del teléfono —o de una copia importada a mano— entra limpio:
       números enteros y en rango, en hoyos que existen, palos que existen. Se
       copiaba tal cual, y una copia armada con HTML en un score (desde siempre)
       o en la tarjeta del otro (desde la v25, que empezó a guardarla) se
       ejecutaba al abrir la firma —sin CSP, con acceso a la llave del panel—.
       Con una clave "__proto__", `Object.assign` le cambiaba el prototipo a
       MARCA y la firma decía que el marcador coincidía en todos los hoyos.
       Los rangos son los mismos que exige el servidor en `anotaciones`. */
    if(d.R && typeof d.R === 'object'){
      R.scores = mapaEnteros(d.R.scores, 1, 20);
      R.putts  = mapaEnteros(d.R.putts, 0, 15);
      R.bunker = mapaEnteros(d.R.bunker, 0, 9);
      R.penal  = mapaEnteros(d.R.penal, 0, 9);
      R.fw     = mapaHoyos(d.R.fw,  v => FW.some(([k]) => k === v));
      R.gir    = mapaHoyos(d.R.gir, v => typeof v === 'boolean');
      R.shots  = mapaHoyos(d.R.shots, v => Array.isArray(v));
      Object.keys(R.shots).forEach(h => { R.shots[h] = R.shots[h].map(golpeLimpio).filter(Boolean); });
    }
    Object.assign(MARCA, mapaEnteros(d.marca, 1, 20));
    Object.assign(OTRO,  mapaEnteros(d.otro,  1, 20));
    /* Lo guardado de la bolsa entra limpio —distancias de golpe posibles— y SIN
       los golpes inventados de antes de la v26: si lo guardado empieza con la
       lista de mentira de ese palo, se la saca; lo que el socio midió de verdad
       quedó después y se queda. */
    if(Array.isArray(d.bag)) d.bag.forEach(x=>{
      const i = BAG.findIndex(z=>z && x && z.c===x.c); if(i < 0) return;
      BAG[i].on = !!x.on;
      BAG[i].shots = golpesGuardados(x);
    });
    return true;
  }catch(e){ return false; }
}
/* ============================================================
   COPIA DE SEGURIDAD
   Todo lo del socio vive en la memoria de un solo teléfono. Si lo cambia,
   lo pierde o el navegador limpia el sitio, se va la bolsa con todos los
   golpes cargados, las estadísticas y la vuelta en curso. Esto lo saca a
   un archivo y lo vuelve a meter en otro teléfono.

   Sigue los mismos cuatro caminos que el modo prueba, del más cómodo al
   más rústico, porque en un celular `<a download>` se traba sin avisar:
   compartir · bajar · copiar al portapapeles · verlo y copiarlo a mano.
   ============================================================ */
const COPIA_MARCA  = 'trisquelia-copia';
const COPIA_V      = 1;
const DESHACER_KEY = 'trisquelia_antes_de_importar';
let   SIN_LUGAR    = false;      // ya avisamos que no se puede guardar

/* Las tres claves que son del socio. `trisquelia_dispositivo` queda AFUERA a
   propósito: es la identidad de ESTE teléfono dentro de una ronda compartida,
   y `absorber()` la usa para saber cuáles anotaciones son propias y no
   pisarlas. Si dos teléfonos tuvieran el mismo identificador, los dos se
   declararían dueños de la misma tarjeta. El teléfono que importa se queda
   siempre con el suyo. */
const COPIA_CLAVES = [LS_KEY, PRUEBA_KEY, RONDA_KEY, VUELTAS_KEY, COLA_VIEJA_KEY];

function datosCopia(){
  const datos = {};
  COPIA_CLAVES.forEach(k => {
    try{
      const v = localStorage.getItem(k);
      if(v !== null) datos[k] = JSON.parse(v);
    }catch(e){}      /* una clave rota no se lleva puesta la copia entera */
  });
  return { que:COPIA_MARCA, v:COPIA_V, fecha:new Date().toISOString(),
           club:CLUB.id, telefono:navigator.userAgent, datos };
}

/* Qué hay adentro de una copia, para poder mostrarlo ANTES de pisar nada. */
function resumenCopia(c){
  const d  = (c && c.datos) || {};
  const pr = d[LS_KEY] || {}, pb = d[PRUEBA_KEY], ro = d[RONDA_KEY];
  const scores = (pr.R && pr.R.scores) || {};
  return {
    cuenta : pr.user && pr.user.name ? pr.user.name : null,
    hoyos  : Object.keys(scores).length,
    golpes : Array.isArray(pr.bag) ? pr.bag.reduce((a,b)=>a+golpesGuardados(b).length,0) : 0,
    palos  : Array.isArray(pr.bag) ? pr.bag.filter(b=>b.on).length : 0,
    ronda  : ro && ro.codigo ? ro.codigo : null,
    prueba : pb && Array.isArray(pb.muestras) ? pb.muestras.length : 0,
    fecha  : c && c.fecha ? c.fecha : null
  };
}
const copiaEnTexto = () => JSON.stringify(datosCopia(), null, 1);

/* ---------- sacarla del teléfono ---------- */
async function compartirCopia(){
  const texto = copiaEnTexto();
  try{
    const archivo = new File([texto], nombreCopia(), {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){
      await navigator.share({files:[archivo], title:'Copia de seguridad · Trisquelia'});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;      /* lo canceló, no es un error */
  }
  toast('Este teléfono no deja compartir archivos. Probá bajarla');
  bajarCopia();
}
/* Con fecha, al revés de la del modo prueba: de estas puede haber muchas y
   conviene distinguirlas de un vistazo en la carpeta de descargas. */
function nombreCopia(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return `trisquelia-copia-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`;
}
function bajarCopia(){
  const b = new Blob([copiaEnTexto()], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = nombreCopia();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copiarCopia(){
  try{
    await navigator.clipboard.writeText(copiaEnTexto());
    toast('Copia al portapapeles. Pegala donde la guardes');
  }catch(e){
    S.verCopia = true; render();
    toast('Copiala a mano del cuadro de abajo');
  }
}
function verCopiaTexto(){
  S.verCopia = !S.verCopia; render();
  if(S.verCopia){ const t = $('#salidaCopia'); if(t){ t.focus(); t.select(); } }
}

/* ---------- meterla en el teléfono ---------- */
function elegirArchivoCopia(){ const i = $('#archivoCopia'); if(i) i.click(); }
function leerArchivoCopia(input){
  const f = input && input.files && input.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onerror = () => toast('No se pudo leer el archivo');
  fr.onload  = () => aplicarCopia(String(fr.result || ''));
  fr.readAsText(f);
}

/* Importar PISA lo que hay. Antes de pisar nada guardamos el estado actual,
   así se puede volver: es la misma idea que el borrado lógico del servidor. */
function aplicarCopia(texto){
  let c = null;
  try{ c = JSON.parse(texto); }
  catch(e){ toast('Ese archivo no se entiende'); return false; }

  if(!c || c.que !== COPIA_MARCA){ toast('Ese archivo no es una copia de Trisquelia'); return false; }
  if(!(typeof c.v === 'number' && c.v <= COPIA_V)){
    toast('Esa copia es de una versión más nueva de la app'); return false; }
  if(!c.datos || typeof c.datos !== 'object'){ toast('La copia no trae datos'); return false; }
  if(!Object.keys(c.datos).some(k => COPIA_CLAVES.indexOf(k) >= 0)){
    toast('La copia no trae nada que se pueda restaurar'); return false; }

  const r = resumenCopia(c);
  const de = r.fecha ? new Date(r.fecha).toLocaleDateString('es-AR') : 'fecha desconocida';
  if(!confirm(`Traer la copia del ${de}\n\n`
    + `${r.cuenta || 'sin nombre'} · ${r.palos} palos · ${r.golpes} golpes medidos\n`
    + `${r.hoyos} hoyo${r.hoyos===1?'':'s'} anotados`
    + (r.ronda ? ` · ronda ${r.ronda}` : '')
    + `\n\nEsto reemplaza lo que hay en ESTE teléfono. Vas a poder deshacerlo.`)) return false;

  /* Una vuelta a medio jugar se archiva antes de importar: la copia reemplaza
     la tarjeta de este teléfono, y esa vuelta no estaba en ningún otro lado. */
  if(enCurso() && !archivarVuelta()){
    toast('No hay lugar para guardar la vuelta en curso · no se importó nada');
    return false;
  }
  /* Si no entra el respaldo, no importamos: quedarse sin poder volver atrás es
     peor que no importar. */
  try{ localStorage.setItem(DESHACER_KEY, copiaEnTexto()); }
  catch(e){
    toast('No hay lugar para guardar lo actual · no se importó nada');
    return false;
  }
  try{
    COPIA_CLAVES.forEach(k => {
      /* Mis rondas y lo pendiente del grupo se SUMAN, no se reemplazan. Una
         copia hecha con una versión anterior no los trae, y "reemplazar" quería
         decir borrarlos sin avisar: la revisión adversaria de la v25 se quedó
         sin Mis rondas importando una copia vieja, y si importaba dos veces el
         deshacer tampoco las traía de vuelta. Sumando, importar nunca se lleva
         una vuelta. Se repiten por identificador. */
      if(k === VUELTAS_KEY || k === COLA_VIEJA_KEY){
        const sana = k === VUELTAS_KEY ? vueltaSana : opSana;
        const traidas = (Array.isArray(c.datos[k]) ? c.datos[k] : []).filter(sana);
        const id = x => k === VUELTAS_KEY ? (x.id || x.fecha + '|' + x.golpes + '|' + x.terminada) : JSON.stringify(x);
        const juntas = leerLista(k).filter(sana);
        const ya = new Set(juntas.map(id));
        traidas.forEach(x => { if(!ya.has(id(x))){ ya.add(id(x)); juntas.push(x); } });
        if(!escribirLista(k, k === VUELTAS_KEY ? juntas.slice(-VUELTAS_MAX) : juntas)) throw new Error('sin lugar');
        return;
      }
      if(c.datos[k] === undefined) localStorage.removeItem(k);
      else localStorage.setItem(k, JSON.stringify(c.datos[k]));
    });
  }catch(e){
    toast('No hay lugar para la copia · se deshizo el cambio');
    deshacerCopia(true);
    return false;
  }
  location.reload();
  return true;
}
const hayDeshacer = () => { try{ return !!localStorage.getItem(DESHACER_KEY); }catch(e){ return false; } };
function deshacerCopia(callado){
  let a = null;
  try{ a = JSON.parse(localStorage.getItem(DESHACER_KEY) || 'null'); }catch(e){}
  if(!a || !a.datos){ if(!callado) toast('No hay nada para deshacer'); return false; }
  if(!callado && !confirm('Volver a como estaba este teléfono antes de importar. ¿Seguro?')) return false;
  try{
    COPIA_CLAVES.forEach(k => {
      if(a.datos[k] === undefined) localStorage.removeItem(k);
      else localStorage.setItem(k, JSON.stringify(a.datos[k]));
    });
    localStorage.removeItem(DESHACER_KEY);
  }catch(e){}
  location.reload();
  return true;
}

/* Para volver a empezar de cero durante las pruebas. */
/* "Todo" quería decir sólo la cuenta y la tarjeta: la cuenta nueva veía como
   propias las vueltas de la anterior, la ronda del grupo seguía abierta y lo
   pendiente se seguía mandando (revisión adversaria de la v25). Ahora borra lo
   que es de la persona y de sus vueltas. NO toca el modo prueba —se guarda
   aparte a propósito, para que borrar una cosa nunca se lleve la otra—, ni el
   identificador del teléfono, ni lo que es del club. */
function borrarTodoLocal(){
  if(!confirm('Esto borra tu cuenta, la vuelta en curso y Mis rondas de este teléfono. ¿Seguro?')) return;
  try{ [LS_KEY, RONDA_KEY, VUELTAS_KEY, COLA_VIEJA_KEY].forEach(k => localStorage.removeItem(k)); }catch(e){}
  location.reload();
}

function render(){
  _gpsVisto = firmaGps();          // lo que el guardián del GPS ya ve dibujado
  guardarTodo();
  if(VERSION_ESPERANDO && momentoDeActualizar()) aplicarVersion();
  /* Arrancamos limpiando: las pantallas que ocupan todo el marco —el aviso de
     WhatsApp y el alta de cuenta— no llevan ni barra de hoyo ni hoja. */
  ['#barra','#hoja'].forEach(sel=>{ const e=$(sel); if(e){ e.className=''; e.innerHTML=''; } });
  if(EN_OTRA_APP && !S.avisoVisto){
    $('#screen').innerHTML = `<div class="fade" style="height:100%;display:flex;
      flex-direction:column;justify-content:center;padding:0 26px;text-align:center">
      <div style="display:flex;justify-content:center">${crest(64)}</div>
      <div style="font-size:20px;font-weight:800;margin:20px 0 10px">Abrila en el navegador</div>
      <p style="font-size:15px;line-height:1.6">Llegaste desde WhatsApp, y ese navegador
      no deja usar el GPS ni guardar la app en tu teléfono.</p>
      <div class="card" style="text-align:left">
        <div style="font-weight:700;font-size:14px;margin-bottom:8px">Son dos toques</div>
        <div class="dim" style="font-size:13px;line-height:1.7">
          <b style="color:var(--txt)">1.</b> Tocá los tres puntitos <b style="color:var(--txt)">⋮</b>
          arriba a la derecha<br>
          <b style="color:var(--txt)">2.</b> Elegí <b style="color:var(--txt)">"Abrir en Chrome"</b>
        </div>
      </div>
      <button class="btn ghost sm" onclick="S.avisoVisto=true;render()">
        Seguir igual, sin GPS</button>
    </div>`;
    $('#nav').style.display='none';
    return;
  }
  if(!S.onboarded){
    $('#screen').innerHTML = vOnboard();
    $('#nav').style.display='none';
    return;
  }
  $('#nav').style.display='flex';
  /* EL PORTÓN DEL PANEL, y va acá porque acá pasa TODO lo que se dibuja, sin
     importar cómo se llegó: por el nav, por la URL, o por una pantalla vieja
     que quedó guardada en el teléfono. El control que había antes sólo corría
     cuando `S.mode` ya era 'club', y por eso se lo podía saltear entrando
     derecho con `?ir=`. */
  if(!puedePantalla(S.tab)){ S.mode='player'; S.tab='home'; }
  /* JUGAR Y FIRMAR SON DE UNA VUELTA EMPEZADA, y se chequea acá por la misma
     razón que el portón del panel: acá pasa todo, venga del menú, de la URL o
     de un botón. La revisión adversaria de la v25 encontró que el "Jugar" del
     menú de abajo se salteaba el ciclo de la vuelta: después de terminar,
     mostraba la vuelta terminada como si siguiera, anotar ahí la reabría y la
     siguiente se escribía encima —en torneo, con la firma ya "Certificada"—.
     Sin vuelta en curso, "Jugar" lleva a empezar una, y la firma al resumen. */
  if(S.tab === 'play'  && !S.playing) S.tab = 'arranque';
  if(S.tab === 'firma' && !S.playing) S.tab = played().length ? 'summary' : 'home';
  if(S.mode==='club' && !puedeEntrarAlPanel()) S.mode='player';
  $('#screen').innerHTML = (VIEWS[S.tab]||vHome)();
  renderNav();
  pintarBarra();
  pintarHoja();
  pintarGrabando();
}
cargarTodo();
/* Una vuelta que quedó abierta en una versión anterior a la v25 —donde ninguna
   terminaba— se reconoce porque no tiene identificador. Sus firmas pueden ser
   de otra vuelta (la segunda de torneo arrancaba "Certificada"), así que se
   borran; los golpes no se tocan. Pasa una sola vez: después ya lo tiene. */
if(S.playing && !S.vueltaId){
  S.vueltaId = nuevoIdVuelta();
  S.certifico = false; S.firmoLaOtra = false; S.entregada = false; S.presento = null;
}
/* Anotarse a una salida es un dibujo desde la v26, pero hasta la v25 marcaba la
   salida y la guardaba: lo que quedó en el teléfono no es una salida de verdad,
   y la pantalla decía "Estás anotado". */
S.booked = {};
/* Lo que el club dijo y quién sos para él. Primero lo que quedó guardado
   —así la app abre con algo aunque no haya señal— y recién después se le
   pregunta al servidor, que es lo que puede tardar. */
cargarClub();
cargarComision();
cargarClima();
cargarVueltas();
/* Accesos directos del ícono: si mantenés apretada la app en la pantalla
   del teléfono aparece "Empezar una ronda", y eso abre directo ahí.

   Acá entra lo que venga escrito en la dirección, así que es una puerta al
   mismo nivel que el nav y pregunta lo mismo: `puedePantalla()`. Antes
   aceptaba cualquier pantalla de `VIEWS`, incluidas las del club. */
(function(){
  try{
    const ir = new URLSearchParams(location.search).get('ir');
    if(!ir || !VIEWS[ir] || !puedePantalla(ir)) return;
    S.tab = ir;
    if(esPantallaClub(ir)) S.mode = 'club';
  }catch(e){}
})();
arrancarGPS();
cargarPrueba();
cargarRonda();
traerClubYDibujar();
traerClimaYDibujar();
vaciarColaVieja();
/* Al volver a la app, y al recuperar la señal, se pregunta de nuevo. Un
   aviso del club no cambia dos veces por minuto: no hace falta latir. El
   clima tiene su propio freno de 15 minutos adentro de `traerClima()`. Y lo
   que quedó sin mandar de una vuelta terminada sale en cuanto hay señal. */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ traerClubYDibujar(); traerClimaYDibujar(); vaciarColaVieja(); } });
window.addEventListener('online', () => { traerClubYDibujar(); traerClimaYDibujar(); vaciarColaVieja(); });
applyTheme();
document.getElementById('appname').textContent = CLUB.app;
render();
</script>
