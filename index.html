<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f6f2">
<meta name="description" content="La app del Trisquelia Golf Club: tu tarjeta, tus distancias, los torneos y los resultados.">
<title>Trisquelia Golf Club</title>

<!-- ===== INSTALACIÓN EN EL TELÉFONO =====
     Con esto la app se agrega a la pantalla de inicio y abre sin el
     navegador. En iPhone además es lo que hace que el sistema NO borre
     los datos guardados: WebKit da el permiso de almacenamiento
     permanente justamente a las apps agregadas a la pantalla de inicio. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trisquelia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  /* ── PALETA CLARA (v15) ──────────────────────────────────────────
     La app era azul oscura en todas las pantallas y se sentía cargada:
     todo con fondo oscuro, todo con borde, nada que respire. Se juega
     al aire libre y con sol de frente, donde el blanco se lee mejor.
     `--ink` es el color del TEXTO SOBRE el acento, no un fondo. */
  --bg:#f4f6f2; --bg2:#eaeee7; --card:#ffffff; --card2:#ffffffcc;
  --line:#dde4dc; --txt:#10231a; --dim:#4a5d51; --dim2:#667a6f;
  --acc:#1e6b47; --acc2:#17563a; --gold:#a97a06; --red:#c0392b; --blue:#1f5fa9;
  --ink:#ffffff; --tint:#e5efe8; --nav:#ffffff; --hair:#eaefe8; --rojo:#c8202e;
  /* los cuatro avisos, cada uno con su fondo, su borde y su ícono */
  --avisoBg:#fdf6e3; --avisoLn:#e6d49b; --avisoIco:#f1e3b4;
  --malBg:#fdeceb; --malLn:#f0bbb4;
  --ojoBg:#fdf1e7; --ojoLn:#eec9a4; --ojoIco:#f8dfc6;
  --okBg:#e7f4ec; --okLn:#a2d5b8;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#e6eae2;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:0}

/* ---------- phone frame ---------- */
/* La app es para el telefono: el marco llena la pantalla, la mida lo que mida.
   `100dvh` y no `100vh`: en el navegador del celular `100vh` es el alto CON la
   barra de direcciones escondida, asi que la barra de abajo quedaba tapada.
   `100vh` queda primero como respaldo para navegadores viejos. */
#frame{width:100%;height:100vh;height:100dvh;background:var(--bg);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(16,35,26,.16)}
/* El marco con bordes redondeados es solo para mirarla en una computadora, asi
   que pide pantalla ancha Y ALTA. Antes pedia solo ancho, y un telefono
   apaisado mide mas de 520px: le clavaba 844px de alto en una ventana de 390 y
   la barra de navegacion quedaba entera fuera de pantalla. */
@media(min-width:520px) and (min-height:900px){
  #frame{max-width:412px;height:844px;border-radius:38px;border:1px solid var(--line)}}

#status{height:30px;display:flex;align-items:center;justify-content:center;
  padding:0 22px;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--dim);flex:0 0 auto}
#screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 0 12px;scroll-behavior:smooth}
#screen::-webkit-scrollbar{width:0}

/* ---------- nav ---------- */
#nav{flex:0 0 auto;display:flex;background:var(--nav);border-top:1px solid var(--line);
  padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
#nav button{flex:1;min-width:0;background:none;border:0;color:var(--dim2);font-size:9.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;
  font-family:inherit;letter-spacing:.02em;transition:color .15s}
#nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--acc)}

/* ---------- generic ---------- */
.pad{padding:0 18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:17px;font-weight:700;margin:22px 0 10px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em}
p{margin:0 0 8px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.acc{color:var(--acc)}.gold{color:var(--gold)}.red{color:var(--red)}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.lbl{font-size:11px;color:var(--dim2);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;
  background:var(--tint);color:var(--acc)}
.pill.gold{background:var(--avisoBg);color:var(--gold);border:1px solid var(--avisoLn)}
.pill.blue{background:#e6eff9;color:var(--blue)}
.pill.red{background:var(--malBg);color:var(--red)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:700;background:var(--acc2);color:var(--ink);
  transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:11px;
  min-height:44px;display:flex;align-items:center;justify-content:center}
.sep{height:1px;background:var(--line);margin:14px 0}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:14px;flex:0 0 auto}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.hdr{padding:8px 18px 4px;display:flex;align-items:flex-start;justify-content:space-between}

/* ---------- play / hole ---------- */
.holehdr{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
  background:var(--nav);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.arrow{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);font-size:18px;cursor:pointer;font-family:inherit}
.arrow:disabled{opacity:.3}
.dist{text-align:center}
.dist .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.dist .n.mid{font-size:44px;color:var(--acc)}
/* 44px de mínimo en los dos ejes. Apple pide 44, Android 48, y esta app se
   usa caminando, con guante y con sol de frente. El `min-height` gana sobre el
   padding que cada sitio pone en su `style=`, así que alcanza con escribirlo
   acá y no hay que tocar los ochenta y pico de lugares donde se usa. */
.chip{padding:9px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;
  min-height:44px;min-width:44px}
.chip.on{background:var(--tint);border-color:var(--acc2);color:var(--acc)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums}
th{color:var(--dim2);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
tr+tr td{border-top:1px solid var(--hair)}
td.name{text-align:left;font-weight:600;font-size:13px}
.sq{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
  border-radius:6px;font-weight:800}
.eagle{background:#e9c46a;color:#2a2005;border-radius:50%}
.birdie{background:#1e6b4714;color:var(--acc);border-radius:50%;border:1px solid var(--acc)}
.bogey{background:#fbe9e7;color:#a83f32}
.dbogey{background:#f7d5d0;color:var(--red)}

/* ---------- misc ---------- */
.slot{padding:11px 8px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  text-align:center;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--txt);
  min-height:44px;display:flex;align-items:center;justify-content:center}
.slot.full{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.slot.mine{background:var(--acc2);color:var(--ink);border-color:var(--acc2)}
.bar{height:7px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:var(--txt);color:#ffffff;
  padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:50;opacity:0;
  transition:opacity .25s,bottom .25s;pointer-events:none;white-space:nowrap;max-width:90%}
.toast.on{opacity:1;bottom:110px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);align-items:center}
.item:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:11px;background:var(--tint);display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;font-size:17px;color:var(--acc)}
/* el ícono dibujado adentro de la baldosa. Toma el color del texto que lo
   rodea, así el mismo dibujo sirve en la baldosa verde y en la de un aviso. */
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.tabs{display:flex;gap:6px;padding:0 18px 4px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;font-family:inherit;
  min-height:44px}
.tab.on{background:var(--txt);color:var(--ink);border-color:var(--txt)}
.modeban{background:linear-gradient(135deg,var(--avisoBg),#f7edd4);border:1px solid var(--avisoLn)}
/* ---------- cerrar el hoyo ----------
   El socio no anota en el green: anota parado en el tee siguiente, para no
   frenar la cancha. O sea que esta pantalla tiene un presupuesto de veinte
   segundos, una mano y un guante puesto. Por eso los bloques van sin la
   tarjeta que los envolvía —16px de padding arriba y abajo por bloque, siete
   bloques— y el botón de guardar queda pegado abajo, siempre alcanzable. */
.bloque{margin:0 0 12px}
.bloque > .lbl{margin-bottom:6px}
.guardar{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom, transparent, var(--bg) 22%)}
/* En un teléfono viejo y corto (un SE de 568px) no hay forma de que entre
   todo sin bajar de 44px, que no se negocia. Se aprietan los aires, y lo que
   queda de scroll no toca el botón de guardar: por eso está pegado abajo. */
@media (max-height:660px){
  .bloque{margin:0 0 8px}
  .guardar{padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
}

/* ---------- LA RONDA COMPARTIDA ---------- */
.codigo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:34px;font-weight:800;
  letter-spacing:.22em;text-align:center;color:var(--txt);padding:6px 0 2px}
.codigo-in{width:100%;padding:15px;border-radius:12px;background:var(--nav);
  border:1px solid var(--line);color:var(--txt);font-family:ui-monospace,monospace;
  font-size:24px;font-weight:800;letter-spacing:.22em;text-align:center;text-transform:uppercase}
.enlinea{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim2)}
.luz{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dim2)}
.luz.si{background:var(--ok, #3ddc84);box-shadow:0 0 8px #3ddc8470}
.luz.no{background:var(--gold)}
.cruce{background:var(--avisoBg);border:1px solid var(--avisoLn);border-radius:13px;padding:12px 14px}
.cruce.ok{background:var(--okBg);border-color:var(--okLn)}

/* ---------- MODO PRUEBA ----------
   Un punto rojo arriba mientras está grabando, para que nunca te olvides
   de que está prendido. */
.grabando{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.06em;
  margin-left:9px;animation:latir 2.2s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.grabando{animation:none}}
.medida{display:flex;align-items:baseline;gap:7px;padding:9px 0;
  border-bottom:1px solid var(--hair)}
.medida:last-child{border-bottom:0}
.medida .q{flex:1;min-width:0;font-size:13.5px;color:var(--dim)}
.medida .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;
  flex:0 0 auto;letter-spacing:-.01em}
.medida .u{font-size:11px;color:var(--dim2);flex:0 0 auto}

/* ---------- PANTALLA DE JUGAR ----------
   Referente: Hole19, mirado de verdad en un teléfono el 25/9/2026.

   Lo que se aprendió: el plano NO es una ilustración adentro de una tarjeta.
   ES EL FONDO DE LA PANTALLA, de borde a borde, y todo lo demás flota encima:
   la distancia colgada del borde de arriba, los botones en una columna al
   costado, el palo abajo. Esa es la mitad del efecto. La otra mitad es que no
   haya nada más compitiendo: lo que no se usa con la bola adelante —salida,
   tarjetas, estacas, registrar el palo— sale del camino y se abre en una hoja.

   Hasta la v15 el plano vivía apretado en 214 píxeles entre cinco tarjetas
   apiladas, y para llegar a "terminar el hoyo" había que bajar toda la
   pantalla. Ahora el plano se queda con todo lo que sobra y el botón que se
   toca en cada hoyo está siempre abajo, al alcance del pulgar. */

.jugar{height:100%;display:flex;flex-direction:column}

/* el plano se queda con todo el alto que sobra.
   El dibujo es angosto y alto (un hoyo visto desde arriba) y el contenedor es
   más ancho, así que el fondo del contenedor va del mismo verde que el rough:
   el dibujo se centra y los costados siguen siendo cancha, sin barras. */
.mapa{position:relative;background:#7e9f60;overflow:hidden}
.jugar .mapa{flex:1 1 auto;min-height:190px}
.jugar .mapa svg{width:100%;height:100%;display:block}
.mapa .over{position:absolute;display:flex;gap:6px;z-index:2}
.mapa .over.tl{top:10px;left:12px;flex-direction:column;align-items:flex-start;gap:5px}
.mapa .over.tr{top:0;right:0}

/* la chapita de arriba a la izquierda: qué hoyo estás jugando */
.chapa{background:var(--card);border-radius:12px;padding:6px 11px;font-size:12.5px;
  font-weight:600;color:var(--txt);box-shadow:0 2px 9px rgba(16,35,26,.18);white-space:nowrap}
.chapa b{font-weight:800}
.chapa.suave{font-size:11.5px;color:var(--dim);font-weight:700}

/* LA distancia, colgada del borde de arriba */
.dists{flex-direction:column;align-items:flex-end;gap:0;background:var(--card);
  border-radius:0 0 0 20px;padding:9px 15px 10px 19px;box-shadow:0 2px 14px rgba(16,35,26,.2)}
.dists .k{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--acc)}
.dists .v{font-weight:800;letter-spacing:-.035em;line-height:.95;font-size:56px;
  font-variant-numeric:tabular-nums;color:var(--txt)}
.dists .fb{display:flex;gap:13px;font-size:11.5px;font-weight:600;color:var(--dim);margin-top:3px}
.dists .fb b{font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums}

/* la columna de botones, como el riel de Hole19 */
/* anclado ABAJO y no al medio: arriba se le montaba encima al número, que es
   lo único que el jugador mira de verdad. */
.riel{position:absolute;right:12px;bottom:44px;z-index:2;
  display:flex;flex-direction:column;gap:7px}
.riel button{width:52px;min-height:52px;border-radius:15px;border:0;background:var(--card);
  box-shadow:0 2px 10px rgba(16,35,26,.2);color:var(--txt);font-family:inherit;font-size:9px;
  font-weight:800;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;padding:5px 2px}
.riel button svg{width:19px;height:19px;stroke:var(--acc);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

/* el palo sugerido, flotando abajo a la izquierda */
.palo{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--tint);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;cursor:pointer;font-family:inherit;color:var(--txt)}
.palo .cual{font-size:19px;font-weight:800;letter-spacing:-.01em;flex:0 0 auto}
.palo .det{flex:1;min-width:0;font-size:12px;line-height:1.35;color:var(--dim)}
.palo .fl{color:var(--dim2);font-size:17px;flex:0 0 auto}
.palo.flota{position:absolute;left:12px;bottom:26px;z-index:2;width:auto;max-width:58%;
  background:var(--card);border-color:transparent;padding:10px 13px;
  box-shadow:0 2px 12px rgba(16,35,26,.2)}
.palo.flota .cual{font-size:17px}
.palo.flota .det{font-size:11.5px}

/* de dónde sale el número: el renglón que nunca miente. Va pegado al número y
   no al pie del plano, que ya tiene su propia aclaración sobre el dibujo. */
.over.tr{flex-direction:column;align-items:flex-end}
.over.tr .u{max-width:190px;text-align:right;padding:6px 15px 0 0;font-size:10.5px;
  font-weight:700;line-height:1.35;color:#1d3016}

/* la barra de abajo: el score del hoyo y el botón que se toca en cada hoyo */
.barraJugar{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--card);
  border-top:1px solid var(--line);padding:9px 14px 10px}
.barraJugar .sc{flex:0 0 auto;text-align:center;min-width:58px}
.barraJugar .sc .k{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2)}
.barraJugar .sc .v{font-size:32px;font-weight:800;line-height:1.05;letter-spacing:-.03em}
.barraJugar .btn{margin:0;flex:1 1 auto}
/* el aviso del GPS, pegado abajo del plano: es lo que separa una distancia
   medida de una estimada, y no puede quedar escondido */
.avisoGps{flex:0 0 auto;font-size:12px;line-height:1.45;padding:9px 14px;
  background:var(--avisoBg);border-top:1px solid var(--avisoLn)}
.avisoGps.calmo{background:var(--tint);border-top-color:var(--line);color:var(--dim)}

/* barra fija del hoyo, entre la pantalla y el menú */
#barra{flex:0 0 auto;display:none;align-items:stretch;background:var(--nav);
  border-top:1px solid var(--line)}
#barra.on{display:flex}
#barra .fl{width:54px;flex:0 0 auto;background:transparent;border:0;color:var(--txt);
  font-size:24px;font-family:inherit;cursor:pointer}
#barra .fl:disabled{opacity:.25}
#barra .mid{flex:1;min-width:0;background:transparent;border:0;color:var(--txt);
  font-family:inherit;cursor:pointer;padding:9px 4px;text-align:center}
#barra .mid .h{font-size:15px;font-weight:800;letter-spacing:-.01em}
#barra .mid .s{font-size:10.5px;color:var(--dim2);margin-top:1px}

/* las hojas que se abren desde la pantalla de jugar */
#hoja{position:absolute;inset:0;z-index:60;display:none}
#hoja.on{display:block}
#hoja .fondo{position:absolute;inset:0;background:#10231a80;backdrop-filter:blur(2px)}
#hoja .panel{position:absolute;left:0;right:0;bottom:0;max-height:86%;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  animation:subir .22s cubic-bezier(.2,.8,.3,1)}
@keyframes subir{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#hoja .panel{animation:none}}
#hoja .cab{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;flex:0 0 auto}
#hoja .cab h3{margin:0;flex:1;font-size:17px}
#hoja .cab button{background:transparent;border:0;color:var(--dim);font-size:22px;
  font-family:inherit;cursor:pointer;padding:0 4px;min-width:44px;min-height:44px}
#hoja .cuerpo{overflow-y:auto;padding:0 18px calc(20px + env(safe-area-inset-bottom))}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

const enDias     = n => diasAtras(-n);        // para lo que todavía no pasó

const hoyTxt     = () => { const d = new Date();
  return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const fechaCorta = d => d.getDate() + ' ' + MESES[d.getMonth()].slice(0,3);
const fechaLarga = d => d.getDate() + ' de ' + MESES[d.getMonth()];
const fechaBarra = d => String(d.getDate()).padStart(2,'0') + '/' +
                        String(d.getMonth()+1).padStart(2,'0');
/* El torneo de ejemplo es "el del sábado": el que viene, contado desde hoy.
   Decía "Mañana" escrito a mano, en cualquier día de la semana. */
const elSabado = () => { const d = new Date(), n = (6 - d.getDay() + 7) % 7;
  if(n === 0) return 'Hoy'; if(n === 1) return 'Mañana';
  d.setDate(d.getDate() + n); return 'Sábado ' + fechaLarga(d); };
/* La inscripción del torneo de ejemplo cierra el día antes. Decía "cierra el
   01/11", un día DESPUÉS del sábado 31 (revisión adversaria de la v26). */
const cierreSabado = () => { const d = new Date(), n = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + n - 1); return d; };
/* El día de HOY en el teléfono, como "2026-10-26". No con `toISOString()`, que
   da el día en Greenwich: acá son tres horas menos, y una vuelta empezada a las
   21 quedaba con fecha de mañana. */
const hoyISO = () => { const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
/* La de la tarjeta lleva el año, porque una tarjeta se guarda y se mira
   meses después. Sale de `S.fecha`, que se fija al salir al hoyo 1; si no
   hay ronda empezada —se está mirando la tarjeta de ejemplo— va la de hoy. */
const fechaTarjeta = () => {
  const d = S.fecha ? new Date(S.fecha + 'T12:00:00') : new Date();
  return fechaBarra(d) + '/' + d.getFullYear();
};

const ALTA_DE_PRUEBA = true;

  <div style="font-weight:700;font-size:13px" class="gold">Así se va a ver el alta</div>

function buscarEnPadron(d){
  const n = String(d).replace(/\D/g,'');
  const real = PADRON.find(x=>x.dni===n);
  if(real) return real;
  if(n.length < 7) return null;
  return {dni:n, n:null, socio:'—', alta:'—', cuenta:null,
          mail:'prueba@trisquelia.com', tel:null, deMentira:true};
}
function tapar(m){
  if(!m) return '';
  const [u,d] = m.split('@');
  return u.slice(0,2) + '•'.repeat(Math.max(3,u.length-2)) + '@' + d;
}
function taparTel(t){ return t ? '•••• ••• '+t.slice(-3) : ''; }

/* ============================================================
   QUIÉN SOS
   ============================================================
   El nombre es el único dato de identidad que la app tiene y que los demás
   ven: sale en la tarjeta del grupo, en las firmas y en la ronda compartida.
   Por eso vive en un solo lugar y se escribe por una sola puerta,
   `ponerNombre`. Nada de nombres escritos a mano en las pantallas: si mañana
   el nombre sale de un login, se cambia acá y se arregla en toda la app. */
const iniciales = n => String(n||'').trim().split(/\s+/).filter(Boolean)
  .map(x => Array.from(x)[0]).join('').slice(0,2).toUpperCase();
const hayNombre = () => !!(S.user.name && String(S.user.name).trim());
/* El nombre de pila, para saludar. "Mauro Domina" → "Mauro". */
const primerNombre = () => hayNombre() ? String(S.user.name).trim().split(/\s+/)[0] : '';
/* Nombre y apellido abreviado, como en la tarjeta de papel: "Mauro D." */
function nombreCorto(){
  if(!hayNombre()) return 'Vos';
  const p = String(S.user.name).trim().split(/\s+/);
  return p.length>1 ? p[0]+' '+Array.from(p[1])[0]+'.' : p[0];
}
/* En las pantallas de ejemplo hay una fila que sos vos. Antes decía "Mauro
   Domina" a mano, así que cualquiera se veía con el nombre de otro. */
const yoNombre = () => hayNombre() ? S.user.name : 'Vos';
const yoIni    = () => S.user.ini || '··';
/* Cómo se muestra una fila de una tabla de ejemplo: la tuya, con tu nombre. */
const nomDe = j => j && j.yo ? yoNombre() : (j ? j.n : '');
/* El handicap de cancha con el que estás jugando ESTA vuelta: la salida de hoy
   y los hoyos de hoy (nueve tiene su propia tabla). Devuelve null si todavía no
   hay index cargado, y null no es cero: cero significa "juega scratch" y daba
   un neto y un stableford inventados para alguien que no cargó nada. */
const hcpJuego = () => hcpCancha(S.user.hcp, tee(), S.vuelta);
/* La ÚNICA puerta de escritura del nombre. Devuelve si lo pudo guardar. */
function ponerNombre(n){
  const t = String(n||'').trim().replace(/\s+/g,' ');
  if(t.length < 3) return false;
  S.user.name = t;
  S.user.ini  = iniciales(t);
  return true;
}

   DOS: eran cuatro nombres de personas reales en un repositorio público.
   Era el último lugar donde quedaba uno, y estaba anotado como pendiente
   desde la v14.

   Ahora: cada PUESTO de la comisión tiene una llave que da el servidor.
   La persona la pega una vez (`entrarComision()`), el servidor contesta
   quién es y qué puede hacer, y el teléfono se lo guarda. La lista de
   permisos viene de allá, no de acá: si viviera en los dos lados algún
   día dejarían de coincidir y mandaría el equivocado.

   Y la llave es del PUESTO, no de la persona. Cuando el profesional de la
   cancha cambia, el club corre un renglón y la llave sigue sirviendo. Por
   eso acá nunca hay un nombre escrito a mano. */
const LLAVE_CLUB = 'trisquelia_comision';
let COMISION = null;        // {llave, puesto, persona, rol, permisos:[]}

function cargarComision(){
  try{ COMISION = JSON.parse(localStorage.getItem(LLAVE_CLUB) || 'null'); }catch(e){ COMISION = null; }
  /* Una credencial a medias no sirve y confunde: o está entera o no está. */
  if(COMISION && !(COMISION.llave && Array.isArray(COMISION.permisos))) COMISION = null;
}
function guardarComision(){
  try{ COMISION ? localStorage.setItem(LLAVE_CLUB, JSON.stringify(COMISION))
                : localStorage.removeItem(LLAVE_CLUB); }catch(e){}
}

const esComision = () => !!COMISION;
const quien = () => COMISION;
/* Con qué nombre se lo ve en el panel: la persona si el club la cargó, y
   si el puesto está vacante, el puesto. Nunca vacío. */
const quienNombre = () => !COMISION ? null : (COMISION.persona || COMISION.puesto);

/* Qué es público y qué es solo para socios.
   Los resultados van abiertos: ya son públicos en la federación y son
   la mejor carta de presentación del club. Lo de plata, no. */
const SOLO_SOCIOS = ['cuota','padron','avisosInternos','ranking','precioSocio'];
const esSocio = () => S.tipo==='socio';
/* La lista de permisos la mandó el servidor al entrar. `ROLES` sigue
   existiendo más arriba, pero sólo para poner el nombre lindo del rol en
   pantalla: para dejar pasar o no, manda esto. */
const puede = k => !!COMISION && COMISION.permisos.indexOf(k) >= 0;

/* ---------- LA ÚNICA PUERTA AL PANEL ----------
   Todo lo que pueda terminar dibujando una pantalla del club pregunta por
   acá: el botón de Perfil, el nav, el acceso directo de la URL y el render.
   Una sola puerta y no cuatro es justamente lo que evita que se abra una
   mientras las otras siguen cerradas, que es lo que pasó en la v19. */
const PANTALLAS_CLUB = ['dash','tees','socios','torneo','permisos','cargaaag'];
const esPantallaClub = t => PANTALLAS_CLUB.indexOf(t) >= 0;
/* Tener llave no alcanza: el rol `sin` existe y no abre nada. */
const puedeEntrarAlPanel = () => !!COMISION && COMISION.permisos.length > 0;
const puedePantalla = t => !esPantallaClub(t) || (puedeEntrarAlPanel() && puedeVer(t));

let CLUB = CLUBS_DB.trisquelia;             // ← el club de esta instalación
let COURSE = CLUB.cancha;

   el mundo por los grados — "el 56", "el 60" — no "el sand" ni "el lob". */

const bagPorGrupo = () => GRUPOS.map(g => [g, BAG.map((b,i)=>({b,i})).filter(x=>x.b.g===g)])
                                .filter(([,l]) => l.length);
/* LA BOLSA ARRANCA VACÍA. Hasta la v25 se le inventaban a cada palo `n` golpes
   "como si el jugador ya los hubiera cargado": 368 en total, y la pantalla decía
   "Golpes que cargaste: 368 · Todas estas distancias son tuyas, medidas por vos",
   y el caddie "Dr · 238 yds · tuyo · 34 golpes" en un teléfono recién instalado.
   Encima `guardarTodo()` los grababa, así que quedaron en el teléfono de todos
   los que abrieron la app (relevamiento del 26/10/2026). Ahora cada palo arranca
   en su `base` —que el caddie muestra como "estimado"— y sólo suma lo que se
   mide en la cancha. `n` queda en la tabla para una sola cosa:
   `golpesDeMentira()` vuelve a armar la lista inventada, idéntica, para que
   `cargarTodo()` la reconozca y la saque de lo guardado. */
BAG.forEach(b => { b.shots = []; });
/* Lo guardado de un palo, limpio: distancias posibles y sin la lista de mentira
   de antes de la v26 al principio. Lo usan la carga y el resumen de una copia,
   que contaba los 368 como "golpes medidos" (revisión adversaria de la v26). */
function golpesGuardados(x){
  const i = BAG.findIndex(z => x && z.c === x.c);
  if(i < 0 || !Array.isArray(x.shots)) return [];
  let l = x.shots.filter(v => typeof v === 'number' && isFinite(v) && v > 0 && v <= TIRO_MAX);
  const falsos = golpesDeMentira(BAG[i], i);
  /* Contra lo guardado SIN filtrar: si se filtrara antes, un número imposible
     en el medio de la lista vieja la haría irreconocible. */
  const crudo = x.shots;
  if(falsos.length && crudo.length >= falsos.length && falsos.every((v,k) => crudo[k] === v))
    l = crudo.slice(falsos.length).filter(v => typeof v === 'number' && isFinite(v) && v > 0 && v <= TIRO_MAX);
  return l;
}
function golpesDeMentira(b, i){
  const l = [];
  if(b.putter) return l;
  for(let k=0;k<b.n;k++){
    const w=((k*37+i*13)%21)-10;               // −10 .. +10
    const flyer=((k*7+i)%11===0)? 6 : 0;
    l.push(Math.round(b.base + w*(b.base/200) + flyer));
  }
  return l;
}
const avg  = b => b.shots.length ? Math.round(b.shots.reduce((a,c)=>a+c,0)/b.shots.length) : 0;

/* La media que usa el caddie.
   Arranca en la distancia general del palo y cada golpe que el jugador carga la
   corre un poco hacia lo suyo. Sin escalones: a los 8 golpes pesa mitad y mitad,
   a los 25 el número ya es prácticamente el de él.
   Esto evita el problema de recomendar con dos golpes cargados, que puede estar
   cualquier cosa, y también el de ignorar 30 golpes propios por no llegar a un
   número redondo. */
const PESO_BASE = 8;
const media = b => {
  if(!b) return 0;
  const n = b.shots.length, suma = b.shots.reduce((a,c)=>a+c,0);
  return Math.round((b.base*PESO_BASE + suma) / (PESO_BASE + n));
};
/* En qué etapa está ese palo, para poder decirlo sin mentir. */
function confianza(b){
  const n = b ? b.shots.length : 0;
  if(n === 0)  return {nivel:'estimado',  txt:'estimado',                 clase:'dim2'};
  if(n < 5)    return {nivel:'arrancando',txt:`arrancando · ${n} golpe${n>1?'s':''}`, clase:'dim2'};
  if(n < 20)   return {nivel:'afinando',  txt:`afinándose · ${n} golpes`, clase:'dim'};
  return              {nivel:'tuyo',      txt:`tuyo · ${n} golpes`,       clase:'acc'};
}
const best = b => b.shots.length ? Math.max(...b.shots) : 0;
const disp = b => { if(b.shots.length<2) return 0; const m=avg(b);
  return Math.round(Math.sqrt(b.shots.reduce((a,c)=>a+(c-m)**2,0)/b.shots.length)); };

/* Acá vivía `deltas()`, que repartía a ojo las yardas extra de una salida
   sin medir. Ya no hace falta: las tres salidas tienen yardas propias, las
   negras medidas con GPS el 5/8/2026. Si vuelve a hacer falta, está en el
   historial de git. */
/* ---------- MEDIDA Y HOMOLOGACIÓN NO SON LO MISMO ----------
   MEDIDA: sabemos cuántas yardas tiene.
   HOMOLOGADA: tiene rating y slope oficiales de la federación, y entonces da
   handicap de cancha propio.
   Desde la recategorización de septiembre de 2026 las tres salidas de Trisquelia
   están homologadas, negras incluidas — antes las negras no lo estaban y su handicap
   salía de la tabla de blancas/azules, que es lo que el club hacía en el papel.
   Las funciones se quedan igual: son las que evitan que la app invente un número si
   alguna vez aparece una salida sin medir (otro club, un tee nuevo). */
const homologada = t => !!(t && t.r && t.s);
/* De qué salida sale el handicap de cancha de esta salida. */
const teeDelHcp  = t => homologada(t) ? t
  : (CLUB.tees.find(x => homologada(x)) || t);
/* Cómo se escribe el rating y el slope, sin mentir ni dejar huecos. En 9 hoyos se
   escribe el del nueve que se juega, que no es la mitad del de 18. */
const ratingTxt  = (t, hoyos) => {
  const m = ratingDe(t, hoyos);
  if(m) return `${m.r}/${m.s}`;
  return homologada(t) ? 'sin rating de 9 hoyos'
    : `sin homologar · handicap de ${teeDelHcp(t).n.toLowerCase()}`;
};
const sinMedida = t => !t.y && !t.f;
function yardaDe(t,h){
  if(t.y) return t.y[h-1];
  if(t.f) return Math.round(COURSE.holes[h-1].y * t.f);
  return null;
}
function yards(h){ return yardaDe(tee(), h); }
/* Para dibujar el hoyo hace falta un largo sí o sí: si la salida no está medida,
   usamos la de blancas/azules sólo para la forma del dibujo, nunca para mostrar. */
const largoDibujo = h => yards(h) ?? yardaDe(CLUB.tees.find(t=>t.id==='mixta'), h);
/* ¿este hoyo se juega del mismo tee que su par de la otra vuelta? */
function repiteTee(h){
  const t=tee(); if(!t.mismoTee) return false;
  return t.mismoTee[CLUB.fisico[h-1]-1];
}
const parTotal = () => COURSE.holes.reduce((a,h)=>a+h.par,0);
/* El rating y el slope con los que se calcula, según el recorrido.
   En 9 hoyos son los DE ESE NUEVE: la federación mide cada nueve por separado y no
   es la mitad del de 18 (negras: 36.6 la ida, 35.9 la vuelta, y el slope también
   cambia). Si una salida no los trae, devolvemos null y la app dice que falta. */
function ratingDe(t, hoyos){
  if(!homologada(t)) return null;
  if((hoyos || 18) !== 9) return {r:t.r, s:t.s};
  return t.nueve && t.nueve.ida ? {r:t.nueve.ida.r, s:t.nueve.ida.s} : null;
}
const par9 = () => COURSE.holes.slice(0,9).reduce((a,h)=>a+h.par,0);
/* Handicap de cancha = Index × (Slope/113) + (Rating − Par). Es la fórmula del WHS.
   Verificada contra el "Hándicap de Juego" que publica la AAG para Trisquelia: da lo
   mismo en las tres salidas, y también el redondeo al 100 %, al 85 % y a 3/8.

   EN 9 HOYOS NO ALCANZA CON DIVIDIR POR DOS. La regla 6.1b pide dos cosas que la app
   no hacía: usar el rating y el slope de ese nueve, y redondear la mitad del index a
   la décima ANTES de calcular. Los 9 hoyos de la app son la ida (hoyos 1 al 9).

   Sin index no hay handicap de cancha: devolvemos null y la pantalla muestra "—".
   Antes un index vacío entraba como 0 y salía un número con cara de real. */
function hcpCancha(index, t, hoyos){
  /* Si la salida no está homologada, el handicap sale de la que sí lo está.
     Es lo que el club ya hace en la tarjeta de papel. */
  t = teeDelHcp(t || tee()); hoyos = hoyos || 18;
  if(index == null) return null;
  const m = ratingDe(t, hoyos);
  if(!m) return null;                      // sin rating no inventamos
  const idx  = hoyos===9 ? Math.round(index*5)/10 : index;   // la mitad, a la décima
  const par_ = hoyos===9 ? par9() : parTotal();
  return Math.round(idx*(m.s/113) + (m.r - par_));
}
/* hace cuántos días se actualizó el index */
const ydsDe = t => t.y ? t.y.reduce((a,b)=>a+b,0)
  : t.f ? COURSE.holes.reduce((a,h)=>a+Math.round(h.y*t.f),0)
  : null;
/* CUÁNDO SE ACTUALIZÓ EL INDEX. Hasta la v25 era `S.indexDias: 9`, escrito a
   mano: sin index la app decía "lo actualizaste hace 9 días", y con index
   "actualizado hace 0 días" para siempre, porque nada lo hacía crecer
   (relevamiento del 26/10/2026). Ahora se guarda el DÍA en que se cargó
   (`S.indexFecha`) y se cuenta con el reloj. Vence el jueves, que es cuando la
   federación lo recalcula: si se cargó antes del último jueves, puede haber
   cambiado. Sin fecha —un teléfono de antes de la v26— no se sabe, y se dice. */
const ultimoJueves = () => { const d = new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 3) % 7)); return d; };
const diasIndex = () => { if(!fechaReal(S.indexFecha)) return null;
  const hoy = new Date(); hoy.setHours(12,0,0,0);
  return Math.max(0, Math.round((hoy - new Date(S.indexFecha + 'T12:00:00')) / 864e5)); };
const indexViejo = () => S.user.hcp != null
  && (!fechaReal(S.indexFecha) || new Date(S.indexFecha + 'T12:00:00') < ultimoJueves());
const haceCuanto = () => { const d = diasIndex();
  return d == null ? 'La app no sabe cuándo lo actualizaste'
       : d === 0 ? 'Lo actualizaste hoy' : 'Lo actualizaste hace ' + d + ' día' + (d === 1 ? '' : 's'); };

/* Todo lo que venga del servidor pasa por acá antes de entrar a un innerHTML.
   Los nombres de los jugadores los escribe cualquiera que tenga el código de
   seis letras de la ronda, y ese código se dicta en voz alta y se manda por
   WhatsApp: sin esto, un tercero se sumaba con el nombre
   `<img src=x onerror=...>` y ejecutaba código en el teléfono de TODOS los
   del grupo, con acceso a la tarjeta y a todo lo guardado. Comprobado, no
   teórico. Escapa también comillas porque parte de esto va adentro de un
   atributo `onclick`. */
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1900);}

function played(){return Object.keys(R.scores).map(Number).sort((a,b)=>a-b);}
function total(){return played().reduce((a,h)=>a+R.scores[h],0);}
function toPar(){return played().reduce((a,h)=>a+R.scores[h]-par(h),0);}
function fmtPar(v){return v===0?'E':(v>0?'+'+v:''+v);}
function scoreClass(s,p){const d=s-p;
  if(d<=-2)return'eagle';if(d===-1)return'birdie';if(d===0)return'';
  if(d===1)return'bogey';return'dbogey';}
function stableford(s,p,hcp,phcp){ // puntos stableford netos
  const extra = Math.floor(phcp/18) + (hcp <= (phcp%18) ? 1 : 0);
  const net = s - extra; const d = net - p;
  return Math.max(0, 2 - d);
}
function clubFor(d){
  const l = inBag();
  /* Sin distancia no hay palo que recomendar. Antes, con `d` en null, la resta
     daba el valor absoluto de la media de cada palo y ganaba el más corto: la
     app recomendaba el putter desde el tee. */
  if(d == null || !l.length) return null;
  let bb=l[0],diff=1e9;
  l.forEach(c=>{const x=Math.abs(media(c)-d);if(x<diff){diff=x;bb=c;}});
  return bb;
}
/* ---------- DISTANCIAS ----------
   Todavía no hay GPS: nadie midió las coordenadas de los greens. Así que
   en vez de inventar dónde estás parado, la app usa lo único que sabe de
   verdad: el largo del hoyo según la tarjeta, menos lo que ya pegaste.
   Cuando esté el trazado, va a salir de tu posición real. */
/* Ya tenemos las coordenadas de los 9 greens y de todas las salidas, medidas
   en cancha. Desde acá la app mide de verdad: distancia en línea recta desde
   donde está parado el jugador hasta el frente, el centro y el fondo del green. */
const GPS_REAL = true;

/* Tope de la barra para cargar un golpe. Un drive con rodada y viento a favor
   pasa los 300 tranquilamente, así que 300 quedaba corto. */
const TIRO_MIN = 3, TIRO_MAX = 380;

/* ============================================================
   EL CLIMA EN LA CANCHA
   ============================================================
   De Open-Meteo (open-meteo.com): sin clave, sin registro y sin tarjeta.
   Lo que dicen sus términos, verificado el 23/10/2026:
   · Es gratis para uso NO comercial, y ponen como ejemplo las "apps privadas
     o sin fines de lucro, sin suscripciones ni publicidad". La app de
     Trisquelia entra ahí.
   · Menos de 10.000 consultas por día, 5.000 por hora y 600 por minuto,
     contadas por IP. Cada teléfono pregunta por su cuenta y como mucho una
     vez cada 15 minutos: un club entero queda lejísimos.
   · ⚠ EL DÍA QUE LA APP SE LE VENDA A OTRO CLUB deja de ser no comercial
     —ponen como comerciales a las "apps con suscripciones" y a los
     "productos comerciales"—. Ese día hay que contratar un plan, y en la
     página no publican precios: hay que preguntarles.
   · Los datos son CC BY 4.0 y la licencia pide un link a open-meteo.com al
     lado de donde se muestran. Está en la tarjeta: no lo saques.

   Las reglas de siempre, aplicadas al clima:
   · Si nunca llegó nada, se dice. No se inventa una temperatura.
   · Un dato viejo no es el clima de ahora: se muestra con su hora, y pasadas
     tres horas no se muestra más. Es la misma idea que `gpsVivo()`: un
     "22° sin viento" de esta mañana puede ser una tormenta ahora.
   · Se pide al abrir y al volver a la app, como el estado del club, y no más
     de una vez cada 15 minutos: Open-Meteo renueva el dato cada 15, y
     preguntar más seguido gasta batería para recibir lo mismo.
   · Se redibuja por `redibujarSiSePuede()`, nunca con un `render()` suelto:
     llega solo, y puede llegar mientras alguien escribe.

   EL VIENTO. El ángulo dice de dónde VIENE, que es la convención
   meteorológica de siempre (0° = viene del norte). La documentación de
   Open-Meteo no lo dice con esas palabras; lo dicen las fuentes de
   meteorología y los modelos que Open-Meteo reparte. Por eso la tarjeta dice
   "del NE" y no "NE" a secas, que se podría leer al revés. ANTES de usar el
   viento hoyo por hoyo ("en contra", "a favor"), confirmarlo en la cancha un
   día ventoso: si la bandera apunta al sur, la app tiene que decir "del N".
   Está en la lista de la prueba de 18 hoyos. Y con viento calmo no se dice
   dirección: el modelo devuelve algún ángulo igual, y "del N" sería inventado.

   `trisquelia_clima` NO va en `COPIA_CLAVES`: el clima de ayer no es algo
   que haya que rescatar de un teléfono a otro. */
const CLIMA_KEY   = 'trisquelia_clima';
const CLIMA_VENCE = 3 * 3600e3;         // pasado esto, el dato no se muestra
const CLIMA_CADA  = 15 * 60e3;          // y no se pregunta más seguido que esto
let CLIMA = null;                       // {temp, cod, kmh, grados, rafaga, hora}
let CLIMA_PIDIENDO = false;

/* El centro de la cancha, promediando los greens medidos. Así otro club no
   tiene que cargar una coordenada aparte: si tiene la cancha medida, tiene
   clima; si no, no hay de dónde preguntar, y la tarjeta lo dice. */
function centroCancha(){
  const g = CLUB.geo && CLUB.geo.greens;
  if(!g) return null;
  const cs = Object.values(g).map(x => x && x.c).filter(c => Array.isArray(c) && c.length === 2);
  if(!cs.length) return null;
  return [cs.reduce((a,c) => a + c[0], 0) / cs.length,
          cs.reduce((a,c) => a + c[1], 0) / cs.length];
}

/* Los códigos WMO de Open-Meteo, en lo que diría un socio. */
function cieloTxt(c){
  if(c === 0) return 'Despejado';
  if(c === 1) return 'Casi despejado';
  if(c === 2) return 'Parcialmente nublado';
  if(c === 3) return 'Nublado';
  if(c === 45 || c === 48) return 'Niebla';
  if(c >= 51 && c <= 57) return 'Llovizna';
  if(c === 65 || c === 67 || c === 82) return 'Lluvia fuerte';
  if((c >= 61 && c <= 66) || (c >= 80 && c <= 81)) return 'Lluvia';
  if((c >= 71 && c <= 77) || c === 85 || c === 86) return 'Nieve';
  if(c === 96 || c === 99) return 'Tormenta con granizo';
  if(c === 95 || c === 97) return 'Tormenta';
  return '';
}
const RUMBOS = ['N','NE','E','SE','S','SO','O','NO'];
const rumbo  = g => RUMBOS[Math.round((((g % 360) + 360) % 360) / 45) % 8];
const climaVivo = () => !!(CLIMA && CLIMA.hora && (Date.now() - CLIMA.hora) < CLIMA_VENCE);

function vientoTxt(c){
  if(!(c.kmh >= 0)) return '';
  if(c.kmh < 3) return 'Sin viento';
  let t = 'Viento del ' + rumbo(c.grados) + ' ' + Math.round(c.kmh) + ' km/h';
  /* Las ráfagas sólo si dicen algo: con 18 de viento y 21 de ráfaga es ruido,
     con 18 y 40 es el dato que cambia el palo. */
  if(c.rafaga >= c.kmh + 10) t += ', ráfagas de ' + Math.round(c.rafaga);
  return t;
}

/* Lo que muestra la tarjeta, en un solo lugar. `traerClima()` lo compara
   antes y después para saber si hace falta redibujar. */
function climaTarjeta(){
  if(!centroCancha()) return { grande:'Sin datos', linea:'La cancha no tiene coordenadas cargadas' };
  if(climaVivo()) return {
    grande: Math.round(CLIMA.temp) + '°',
    cielo:  cieloTxt(CLIMA.cod),
    linea:  vientoTxt(CLIMA),
    pie:    hace(new Date(CLIMA.hora).toISOString()),
    vivo:   true };
  if(CLIMA_PIDIENDO) return { grande:'Sin datos', linea:'Preguntando…' };
  if(CLIMA && CLIMA.hora) return { grande:'Sin datos recientes', linea:'Hace falta señal para actualizarlo' };
  return { grande:'Sin datos', linea:'Hace falta señal para saberlo' };
}

/* EL CLIMA EN LA PANTALLA DE JUGAR. Lo pidió Mau después de jugar el
   27/10/2026: el clima estaba sólo en Inicio, y durante la vuelta —que es
   cuando el viento cambia el palo— no se veía. Va en un renglón arriba del
   plano, y sólo con un dato vivo: sin eso no se muestra nada, porque un "22°"
   de hace cinco horas en la pantalla de jugar es peor que no decir nada.
   Tocándolo se abre la hoja con el detalle y el link a Open-Meteo que pide la
   licencia. El "a favor / en contra" de cada hoyo espera a que se confirme en
   la cancha para qué lado sopla (ver EL VIENTO, más arriba). */
function climaCorto(){
  if(!climaVivo()) return '';
  const c = CLIMA;
  const v = !(c.kmh >= 0) ? '' : c.kmh < 3 ? 'sin viento'
    : 'del ' + rumbo(c.grados) + ' ' + Math.round(c.kmh) + ' km/h'
      + (c.rafaga >= c.kmh + 10 ? ' · ráf. ' + Math.round(c.rafaga) : '');
  return Math.round(c.temp) + '°' + (v ? ' · ' + v : '');
}
/* Escribe el renglón sin redibujar la pantalla de jugar, que no se toca. */
function pintarClima(){
  const e = document.getElementById('climaPill');
  if(!e) return;
  const t = climaCorto();
  if(e.textContent !== t) e.textContent = t;
  e.style.display = t ? '' : 'none';
}
/* El detalle, igual en Inicio y en la hoja de jugar. */
function climaDetalle(){
  const k = climaTarjeta();
  return k.vivo
    ? `<div style="font-size:20px;font-weight:800;margin-top:4px">${esc(k.grande)}</div>
       ${k.cielo ? `<div class="dim" style="font-size:12px">${esc(k.cielo)}</div>` : ''}
       ${k.linea ? `<div class="dim" style="font-size:12px">${esc(k.linea)}</div>` : ''}
       <div class="dim2" style="font-size:11px;margin-top:2px">${esc(k.pie)} ·
         <a href="https://open-meteo.com/" target="_blank" rel="noopener"
            style="color:inherit;white-space:nowrap">Open-Meteo.com</a></div>`
    : `<div style="font-size:15px;font-weight:700;margin-top:4px" class="dim">${esc(k.grande)}</div>
       <div class="dim2" style="font-size:11px">${esc(k.linea)}</div>`;
}

function cargarClima(){
  try{ CLIMA = JSON.parse(localStorage.getItem(CLIMA_KEY) || 'null'); }catch(e){ CLIMA = null; }
  /* Entero o nada, como la credencial de la comisión. */
  if(CLIMA && !(typeof CLIMA.temp === 'number' && typeof CLIMA.hora === 'number')) CLIMA = null;
}

/* Devuelve si cambió lo que muestra la tarjeta. */
async function traerClima(){
  const cc = centroCancha();
  if(!cc || CLIMA_PIDIENDO) return false;
  if(CLIMA && CLIMA.hora && Date.now() - CLIMA.hora < CLIMA_CADA) return false;
  /* PRIMERO se prende el "preguntando" y DESPUÉS se toma la foto de cómo se
     ve la tarjeta. Al revés, si no había dato y falla la conexión, el antes y
     el después dicen los dos "Hace falta señal" y no se redibuja nada… pero en
     pantalla quedó "Preguntando…", que se dibujó en el medio. Para siempre. */
  CLIMA_PIDIENDO = true;
  const antes = JSON.stringify(climaTarjeta());
  const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  const corte = ctl ? setTimeout(() => ctl.abort(), 10000) : null;
  try{
    const u = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + cc[0].toFixed(4) + '&longitude=' + cc[1].toFixed(4)
      + '&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
      + '&wind_speed_unit=kmh';
    const r = await fetch(u, ctl ? { signal: ctl.signal } : {});
    if(!r.ok) throw new Error('clima ' + r.status);
    const d = await r.json();
    /* Un 200 con {error:...} no es un éxito, y uno sin `current` tampoco: se
       trata igual que no haber podido preguntar. Y todo se fuerza a número:
       lo que llega de afuera no entra a la pantalla como texto. */
    const c = d && !d.error && d.current;
    const n = v => (typeof v === 'number' && isFinite(v)) ? v : null;
    if(!c || n(c.temperature_2m) === null) throw new Error('clima sin formato');
    CLIMA = { temp: n(c.temperature_2m), cod: n(c.weather_code),
              kmh: n(c.wind_speed_10m), grados: n(c.wind_direction_10m) || 0,
              rafaga: n(c.wind_gusts_10m), hora: Date.now() };
    try{ localStorage.setItem(CLIMA_KEY, JSON.stringify(CLIMA)); }catch(e){}
  }catch(e){
    /* Sin señal, o el servicio caído: queda lo que había. Si ya es viejo,
       `climaVivo()` lo esconde solo. */
  }finally{
    if(corte) clearTimeout(corte);
    CLIMA_PIDIENDO = false;
  }
  return JSON.stringify(climaTarjeta()) !== antes;
}
async function traerClimaYDibujar(){
  if(await traerClima()){ redibujarSiSePuede(['home']); pintarClima(); }
}

/* Estado de la cancha. Lo carga quien tenga el permiso 'cancha' — hoy Chelo.
   Es un dato que siempre es cierto porque lo pone una persona, no se deduce
   de cuánta gente usa la app. */
/* ============================================================
   LO QUE EL CLUB LE DICE A LOS SOCIOS — y lo dice el servidor
   ============================================================
   Hasta la v20 el estado de la cancha vivía en el teléfono de cada uno:
   si Chelo la cerraba en su aparato, el resto del club no se enteraba.
   Un sábado de lluvia, 123 socios veían 123 respuestas distintas y
   ninguna era la del club. Y las novedades eran una lista escrita en el
   código, igual para siempre.

   Ahora las dos salen de `club_estado()`. Lo que llega se guarda en el
   teléfono, así que sin señal se sigue viendo lo último que se supo —
   la app es offline primero y eso no se negocia.

   Y si NUNCA llegó nada, el estado es `null` y la pantalla lo dice. Antes
   el valor por omisión era "abierta", que es exactamente la clase de
   número inventado que esta app no muestra: alguien podía manejar hasta
   la cancha un domingo de tormenta porque el teléfono le dijo que estaba
   abierta sin haberle preguntado a nadie. */
const CLUB_VIVO = { cancha:null, avisos:[], desde:null };

const canchaAbierta = () => CLUB_VIVO.cancha ? !!CLUB_VIVO.cancha.abierta : null;
const canchaTxt     = () => CLUB_VIVO.cancha ? (CLUB_VIVO.cancha.abierta ? 'Abierta' : 'Cerrada')
                                             : 'Sin datos';
const canchaClase   = () => CLUB_VIVO.cancha ? (CLUB_VIVO.cancha.abierta ? 'acc' : 'gold') : 'dim';
/* La nota, y debajo quién la publicó y cuándo. Un socio que lee "cerrada"
   un sábado a la mañana tiene derecho a saber quién lo dijo. */
/* Sin estado hay TRES situaciones distintas, y hasta la v22 las tres decían
   "El club todavía no publicó el estado". Eso sólo es cierto en una: cuando
   el servidor contestó y no había nada (`CLUB_VIVO.desde` es la hora de la
   última respuesta, así que si está, se preguntó). Mientras se pregunta, o
   si no se pudo preguntar, afirmarlo es inventar — y la diferencia importa:
   "no publicó" quiere decir "andá tranquilo", "no pude preguntar" no. */
let CLUB_PIDIENDO = false;
const canchaNota = () => {
  const c = CLUB_VIVO.cancha;
  if(!c){
    if(CLUB_VIVO.desde) return 'El club todavía no publicó el estado';
    if(!hayNube())      return 'Esta app no está conectada al club';
    return CLUB_PIDIENDO ? 'Preguntando al club…' : 'Hace falta señal para saberlo';
  }
  return c.nota || 'Sin novedades';
};
const canchaFirma = () => {
  const c = CLUB_VIVO.cancha;
  if(!c || !c.por) return '';
  return c.por + (c.desde ? ' · ' + hace(c.desde) : '');
};
/* "hace 20 minutos" dice más que una fecha: lo que importa de un estado
   de cancha es si es de hoy o de la semana pasada. */
function hace(iso){
  const t = Date.parse(iso); if(!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 2)    return 'recién';
  if(m < 60)   return 'hace ' + m + ' min';
  const h = Math.round(m/60);
  if(h < 24)   return 'hace ' + h + (h===1?' hora':' horas');
  const d = Math.round(h/24);
  return d === 1 ? 'ayer' : 'hace ' + d + ' días';
}
const PROF_GREEN = 12;          // sólo se usa si no hay GPS ni coordenadas

/* ---------- dónde está el jugador ---------- */
let POS = null;                 // {lat, lon, acc} o null si todavía no enganchó
let POS_T = 0;                  // cuándo llegó esa posición
let POS_ERR = null;

/* Una posición de hace un minuto no es dónde estás parado. Antes, cuando el
   GPS fallaba, `POS` se quedaba con la última lectura y la app seguía
   diciendo "GPS ±4 m" y midiendo contra una coordenada congelada: el error
   nunca se veía. Dar una distancia falsa con cara de real es lo peor que
   puede hacer esta app. Después de 30 segundos sin lectura nueva, no hay
   posición. */
const POS_VENCE = 30000;
const gpsVivo = () => !!POS && (Date.now() - POS_T) < POS_VENCE;

function arrancarGPS(){
  if(!navigator.geolocation){ POS_ERR='Este teléfono no tiene GPS.'; refrescarGPS(); return; }
  navigator.geolocation.watchPosition(
    p => { POS = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
           POS_T = Date.now(); POS_ERR = null; refrescarGPS(); },
    e => { /* Permiso negado: no hay posición, y la vieja tampoco vale. */
           if(e.code===1){ POS = null; POS_T = 0; }
           POS_ERR = e.code===1 ? 'No diste permiso de ubicación.'
                   : e.code===2 ? 'Sin señal. Salí a cielo abierto.'
                   : 'El GPS tardó demasiado.';
           refrescarGPS(); },
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
  /* Si el navegador no llama a NINGUNO de los dos callbacks —pasa cuando el
     permiso quedó en "preguntar" y nadie contestó— la app diría "Buscando
     señal" para siempre. A los 12 segundos lo decimos. `medir.html` ya tenía
     esta red; acá faltaba. */
  setTimeout(() => {
    if(!POS && !POS_ERR){
      POS_ERR = 'No se pudo tomar la ubicación. Fijate que esté prendida.';
      refrescarGPS();
    }
  }, 12000);
}

/* EL GUARDIÁN DEL GPS. `gpsVivo()` vence a los 30 segundos, pero nadie se
   enteraba: si el teléfono deja de mandar posiciones SIN avisar un error —pasa
   al bloquear la pantalla, o con el GPS apagado de golpe en algunos Android—,
   ningún callback corre y la pantalla seguía diciendo "GPS ±5 m" con la
   distancia de hace un rato. La revisión del 26/10/2026 lo midió: a los 36
   segundos seguía así, con `gpsVivo()` en false. Cada cinco segundos se mira si
   cambió la forma del estado (`firmaGps()`), y si cambió se dibuja de nuevo.
   Casi siempre no hace nada. `render()` anota lo último que dibujó. */
let _gpsVisto = null;
setInterval(() => {
  /* De paso, el renglón del clima: un dato que vence a las tres horas se va
     solo, sin esperar a que algo redibuje. */
  if(S.tab === 'play') pintarClima();
  if(firmaGps() === _gpsVisto || !S.onboarded) return;
  if(S.tab === 'play'){
    /* El cierre del hoyo no muestra nada del GPS: rearmarlo con la animación
       de entrada en el medio de anotar era molestia pura. Con una hoja abierta
       se tocan sólo los números; la pantalla entera, cuando se cierre. */
    if(S.cerrando) return;
    const a = document.activeElement;
    if(S.hoja || (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))){ pintarDistancias(); return; }
    render(); return;
  }
  /* En el arranque, `refrescarGPS()` no dibuja si alguien está escribiendo el
     código de la ronda: entonces no se da por visto, y se vuelve a probar en
     cinco segundos. Lo marca `render()` cuando dibuja de verdad. */
  if(S.tab === 'arranque') refrescarGPS();
}, 5000);

function refrescarGPS(){
  if(!S.onboarded) return;
  if(S.tab === 'play') return pintarDistancias();
  if(S.tab !== 'arranque') return;      /* en el resto de la app no cambia nada */
  /* Nunca redibujar mientras alguien escribe: en esta pantalla se tipea el
     código de la ronda del grupo y `render()` se lo borraría. */
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  /* El GPS manda una posición por segundo, y con `enableHighAccuracy` a veces
     más. Redibujar la pantalla entera en cada una la hacía PARPADEAR sin
     parar —la animación de entrada se reinicia en cada render— y encima
     perdía el scroll y el toque a medio camino. Y para nada: de toda la
     pantalla, lo único que cambia es el renglón de la precisión.
     Así que ese renglón se escribe a mano, y la pantalla se redibuja sólo
     cuando cambia algo que cambia la FORMA: que el GPS pase a estar listo (o
     deje de estarlo), o que aparezca otro error. Se nota mirando el 3644 de
     una captura: el número puede bailar, la pantalla no. */
  const linea = document.getElementById('estadoGps');
  if(linea && firmaGps() === _gpsFirma){ linea.innerHTML = textoEstadoGps(); return; }
  render();
}
/* ---------- ¿en qué tee estás parado? ----------
   Las 65 coordenadas medidas a pie dan algo que ninguna app global puede
   tener en esta cancha: saber en qué hoyo está el socio. Y sirve para el
   momento exacto en que quiere anotar, porque no anota en el green — camina
   al tee siguiente y anota ahí, para no frenar la cancha.

   Los números de la cancha, medidos sobre esas coordenadas:
     · entre tees de hoyos DISTINTOS, el par más cercano está a 80 m;
     · el aprieto real es el green anterior: el tee del 2 está a 25 m del
       fondo del green 1.

   Por eso el radio de 30 m es holgado para no confundir un hoyo con otro
   (haría falta bajar de 40), y la confusión con el green se resuelve sin
   radio: se pide estar MÁS CERCA del tee que de cualquier green. El que está
   puteando en el 1 está más cerca del green; el que caminó al tee del 2 está
   más cerca del tee. La misma regla separa los dos casos.

   Nunca cambia de hoyo sola. Garmin lo hace y hay gente que subió tarjetas
   incompletas sin enterarse: acá se sugiere y decide el socio. */
const TEE_CERCA = 30;               // metros

function hoyoDelTee(){
  const g = CLUB.geo;
  if(!gpsVivo() || !g || !g.tees) return null;
  const p = [POS.lat, POS.lon];

  let cerca = null;                 // el tee más cercano, sea de la marca que sea
  for(const fis of Object.keys(g.tees))
    for(const c of Object.values(g.tees[fis])){
      const d = metros(p, c);
      if(!cerca || d < cerca.d) cerca = { fis:+fis, d };
    }
  if(!cerca || cerca.d > TEE_CERCA) return null;

  let green = Infinity;             // el green más cercano, el que sea
  for(const k of Object.keys(g.greens)){
    const gr = g.greens[k];
    for(const c of [gr.f, gr.c, gr.b]) green = Math.min(green, metros(p, c));
  }
  if(green <= cerca.d) return null; // estás en el green, no en el tee

  /* Un hoyo físico es dos hoyos de la tarjeta (ida y vuelta). Elegimos el que
     tenga sentido según dónde venía el socio. */
  const cand = CLUB.fisico.map((f,i) => f === cerca.fis ? i+1 : null).filter(Boolean)
                          .filter(h => h <= S.vuelta);
  if(!cand.length) return null;
  const meta = S.hole + 1;
  return cand.reduce((a,b) => Math.abs(b-meta) < Math.abs(a-meta) ? b : a);
}

/* Qué proponerle, o null si no hay nada que proponer. */
function sugerenciaTee(){
  if(!S.playing || S.cerrando || S.hoja) return null;
  const h = hoyoDelTee();
  if(h === null || h === S.hole) return null;
  if(S.teeVisto === h) return null;              // ya dijo que no
  return { hoyo:h, cerrar: R.scores[S.hole] === undefined };
}
function irAlTeeSugerido(){
  const s = sugerenciaTee();
  if(!s) return;

/* metros entre dos coordenadas */
function metros(a,b){
  const R_=6371000, f1=a[0]*Math.PI/180, f2=b[0]*Math.PI/180;
  const df=(b[0]-a[0])*Math.PI/180, dl=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return 2*R_*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
const aYardas = m => Math.round(m*1.09361);
const greenDe = h => CLUB.geo && CLUB.geo.greens[CLUB.fisico[h-1]];

/* Distancia al green.
   Con GPS enganchado: medida real desde donde estás.
   Sin GPS: se estima con el largo del hoyo menos lo que llevás pegado. */
/* El hoyo más largo de la cancha son 541 yardas. Cualquier medición que pase de
   700 no es un tiro: es alguien mirando la app desde el pueblo, o desde el
   sillón. La cuenta está bien y el GPS también; lo que no significa nada es el
   número. Y un número imposible mostrado en letras grandes, con la misma cara
   que una distancia de verdad, es exactamente lo que esta app no puede hacer.
   Cuando pasa, lo decimos con palabras. */
const LEJOS_YDS = 700;
function gps(h){
  const g = greenDe(h);
  if(GPS_REAL && gpsVivo() && g){
    const p=[POS.lat,POS.lon];
    const m = metros(p, g.c);
    if(aYardas(m) > LEJOS_YDS)
      return {front:null, mid:null, back:null, real:true, acc:Math.round(POS.acc),
              lejos:true, metros:Math.round(m), desdeTee:true, dados:0};
    return {front:aYardas(metros(p,g.f)), mid:aYardas(m),
            back:aYardas(metros(p,g.b)), real:true, acc:Math.round(POS.acc),
            desdeTee:!(R.shots[h]||[]).length, dados:0};
  }
  const largo = yards(h);
  const dados = (R.shots[h]||[]).reduce((a,x)=>{
    const b = BAG.find(z=>z.c===x.c);
    return a + ((b && b.putter) || x.d==null ? 0 : x.d);
  }, 0);
  if(largo==null) return {front:null, mid:null, back:null, sinMedir:true,
                          desdeTee:dados===0, dados};
  const centro = Math.max(0, largo - dados);
  /* Frente y fondo: con la profundidad MEDIDA del green, si la hay. Era ±12
     yardas fijas (±9 en un par 3) en todos los hoyos, con el largo de cada
     green medido a pie en `formaHoyo()` sin usar. Sigue siendo una estimación,
     y la pantalla lo dice. */
  const fh = formaHoyo(h);
  const prof = fh && fh.green && fh.green.largo > 4 ? Math.round(fh.green.largo/2)
             : par(h)===3 ? 9 : PROF_GREEN;
  return {front: Math.max(0,centro-prof), mid: centro, back: centro+prof,
          desdeTee: dados===0, dados, esperandoGPS: GPS_REAL && !gpsVivo()};
}
/* Refresca sólo los tres números, sin redibujar la pantalla entera:
   el GPS avisa una vez por segundo y no queremos que parpadee todo. */
/* El renglón de abajo de los tres números. Cambia de sentido según el caso, y
   es el que avisa cuando no hay que creerle a la pantalla. */
function textoUnidad(g){
  if(g.lejos) return `estás a ${(g.metros/1000).toFixed(1)} km de la cancha · `
    + `las distancias aparecen cuando llegues`;
  return `yardas ${g.real ? 'desde donde estás parado' : 'estimadas'}`;
}
function pintarDistancias(){
  const g = gps(S.hole);
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent = v ?? '—';};
  set('dFront',g.front); set('dMid',g.mid); set('dBack',g.back);
  set('dUnid', textoUnidad(g));
  const e=document.getElementById('gpsPill');
  if(e) e.textContent = g.real ? `GPS ±${g.acc} m` : (POS_ERR || 'Buscando señal…');
  const dg=document.getElementById('dGolpe');
  if(dg){ const v=desdeElGolpe(S.hole); dg.textContent = v ?? '—'; }
  pintarAvisoTee();
}
/* qué palo tiene sentido: en la salida de un par 4 o 5, el más largo que
   tengas; en el resto, el que más se acerque a lo que falta. */
function paloSugerido(h){
  const g = gps(h);
  if(g.sinMedir) return {club:null, salida:g.desdeTee, dist:null};
  if(g.desdeTee && par(h)>3){
    const largos = inBag().slice().sort((a,b)=>media(b)-media(a));
    if(!largos.length) return {club:null, salida:true, dist:g.mid};
    return {club:largos[0], salida:true, dist:g.mid};
  }
  return {club:clubFor(g.mid), salida:false, dist:g.mid};
}
